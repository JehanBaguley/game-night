            <button class="tbtn tbtn--icon tbtn--add" id="addbtn" title="Add a game" aria-label="Add a game"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
          </div>

          ${active.length ? `<div class="activebar">
            ${active.map(a => `<span class="abchip">${esc(a.label)}
              <button data-unfilter="${a.k}" data-uv="${esc(a.v ?? "")}" aria-label="Remove ${esc(a.label)}">✕</button></span>`).join("")}
            <button class="clearall" id="clearall">Clear all</button>
          </div>` : ""}

          ${filtered.length === pool.length ? "" : `<p class="resultline">${filtered.length} of ${pool.length} shown</p>`}

          ${filtered.length
            ? sections(filtered, d).map(sec => {
                // a labelled section folds away from its heading; the choice sticks per crew
                const shut = !!sec.label && folded().includes(sec.label);
                return `
                ${sec.label ? `<h3 class="grouphead"><button class="gh-btn" data-fold="${esc(sec.label)}" aria-expanded="${!shut}">
                  <svg class="gh-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>${esc(sec.label.replace(/^\u25B6\s*/, ""))}<span>${sec.items.length}</span></button></h3>` : ""}
                ${shut ? "" : view === "cards"
                  ? `<div class="grid">${sec.items.map(s => card(s,d)).join("")}</div>`
                  : listView(sec.items, d)}`; }).join("")
            : !pool.length && !active.length && !F.q
            ? F.benched
              ? `<div class="empty"><b>The bench is empty</b>Benched games land here.</div>`
              : `<div class="shelf0">
                  <span class="shelf0-e" aria-hidden="true">${esc(g.emoji || DEFAULT_EMOJI)}</span>
                  <h3>The shelf's empty</h3>
                  <p>Chuck in the games you're keen on. Search Steam by name or paste a store link, and each one is up for a vote straight away.</p>
                  <div class="shelf0-acts">
                    <button class="btn" id="addfirst">Add a game</button>
                    <button class="btn btn--ghost" id="sharefirst">Send to the chat</button>
                  </div>
                  <ol class="shelf0-steps">
                    <li><b>Add</b> anything you'd play together</li>
                    <li><b>Pick</b> up to three each</li>
                    <li><b>Call it</b> once enough of you have picked</li>
                  </ol>
                </div>`
            : `<div class="empty"><b>Nothing survived that</b>
                 ${F.crew ? "Nothing here seats "+F.crew+" of you." : F.q ? "Nothing on the shelf called that." : "That is a lot of filters."}
                 <br><button class="clearall" id="clearall2">Clear the lot</button>
               </div>`}

        </main>

        <aside class="rail">
          ${seshPanel(d)}
          ${ownsPanel(d)}
          ${salePanel(d)}
          ${recordPanel(d)}
          <section class="panel">
            <h3>Who's in</h3>
            <div class="crew">${d.members.length ? d.members.map(mm => {
              const voted = mm.member_id === myMemberId || (S.ballots||[]).some(b => b.member_id===mm.member_id && (b.picks||[]).length);
              return `<span class="who${voted?"":" novote"}" title="${voted?"voted":"not voted yet"}${mm.device_count>1?" · "+mm.device_count+" devices":""}">
                ${isLive(mm.last_seen) ? `<span class="livedot" title="here now"></span>` : ""}
                <span class="dot" style="background:hsl(${hueOf(mm.name)} 58% 30%)">${esc(mm.label[0].toUpperCase())}</span>${esc(mm.label)}
              </span>`;
            }).join("") : `<span class="empty">Just you so far.</span>`}</div>
            <button class="btn btn--ghost btn--sm railshare" id="railshare">Send to the chat</button>
          </section>
        </aside>
      </div>
    </div>

    ${pool.length && !g.locked_appid ? `<div class="votebar">
      <div class="st">
        <div class="a">${g.locked_appid ? "Round's called" : d.myPicks.length === 3 ? "Your three are in" : d.myPicks.length ? "Your picks" : "Pick up to three"}</div>
        <div class="pips" aria-hidden="true">${[0,1,2].map(i => `<i class="${i < d.myPicks.length ? "f":""}"></i>`).join("")}</div>
        <div class="b num">${g.locked_appid ? "picks reopen next round" : d.myPicks.length === 3 ? "tap a pick to swap it" : (3 - d.myPicks.length) + " left"}</div>
      </div>
      ${call.ready && !g.locked_appid && !g.paused_at ? `<button class="btn btn--sm btn--ready" id="closebtn2">Call it</button>` : ""}
      <button class="btn btn--ghost btn--sm" id="sharemob">Share</button>
    </div>` : ""}

    ${sheet ? renderSheet(d) : ""}`;

  wireGroup(d, filtered);
  wireSesh(d);
  settleImages();
  restoreFocus();
  if(tookover){
    const t = document.querySelector(".leadname.tookover");
    if(t) scrambleTo(t, t.textContent);
  }
  lastCounts = {...d.counts};
  if(tookover){ const t = tookover; setTimeout(() => { if(tookover === t) tookover = null; }, 1400); }
}

/* An image the browser already has does not need a fade. Without this, every
   re-render restarts the transition from transparent and the shelf blinks. */
function settleImages(){
  app.querySelectorAll(".art img").forEach(img => {
    if(img.complete && img.naturalWidth){
      img.style.transition = "none";
      img.classList.add("in");
      requestAnimationFrame(() => { img.style.transition = ""; });
    }
  });
}

function filterPanel(d, pool, counts){
  const n = (fn) => pool.filter(fn).length;
  counts = counts || {};

  /* A chip with nothing behind it is noise. Zero-count options are dropped
     rather than sat there greyed out, with one exception: an option you have
     already selected has to stay visible or you cannot turn it back off. */
  const grp = (label, key, map, getter) => {
    const chips = Object.keys(map).map(k => {
      const val = isNaN(+k) ? k : +k;
      const on = FT()[key].has(val);
      const count = n(s => getter(s, d) === val);
      if(!count && !on) return "";
      return `<button class="chip" data-f="${key}" data-v="${k}" aria-pressed="${on}">
                ${esc(map[k])}<span class="n num">${count}</span></button>`;
    }).join("");
    if(!chips.trim()) return "";
    return `<div class="fgroup"><span class="eyebrow">${label}</span>
              <div class="fset">${chips}</div></div>`;
  };

  const crew = FT().crew;
  // The crew filter is the only one that maps to the actual decision on the
  // night, so it gets a surface of its own rather than a fifth identical
  // grey label, and it says in words what it is doing to the shelf.
  const lead = `
    <div class="fgroup fgroup--lead">
      <span class="eyebrow">How many of us tonight</span>
      <div class="stepper">
        <button class="sbtn" data-crew="-" aria-label="Fewer players">\u2212</button>
        <span class="val${crew ? " num" : ""}">${crew ?? "Any"}</span>
        <button class="sbtn" data-crew="+" aria-label="More players">+</button>
        ${crew ? `<button class="clearall" data-crew="off">Any</button>`
               : `<span class="off">${d.lookedCount} in the group</span>`}
      </div>
      <p class="fhint">${crew
        ? `Hiding anything that cannot seat ${crew}.`
        : `Every game, whatever its player cap.`}</p>
    </div>`;

  const played = `
    <div class="fgroup"><span class="eyebrow">Have we played it</span>
      <div class="fset fset--seg">
        ${[["","Either"],["fresh","Never"],["again","We have"]].map(([v,l]) =>
          `<button class="chip" data-played="${v}" aria-pressed="${(FT().played||"") === v}">${l}</button>`).join("")}
      </div>
    </div>`;

  // "Shortcuts" was a junk drawer. These are the two or three that narrow the
  // shelf to a specific pile, and they say so.
  const only = `
    <div class="fgroup"><span class="eyebrow">Only show</span>
      <div class="fset">
        <button class="chip" data-toggle="mine" aria-pressed="${FT().mine}" ${d.myPicks.length?"":"disabled"}>My picks<span class="n num">${d.myPicks.length}</span></button>
        <button class="chip" data-toggle="wellrated" aria-pressed="${FT().wellrated}">85%+ on Steam<span class="n num">${n(s => ((d.gamesById[s.appid]||{}).review_pct ?? 0) >= 85)}</span></button>
        ${n(s => (d.gamesById[s.appid]||{}).demo_appid) || FT().demo ? `<button class="chip" data-toggle="demo" aria-pressed="${FT().demo}">Has a demo<span class="n num">${n(s => (d.gamesById[s.appid]||{}).demo_appid)}</span></button>` : ""}
        ${counts.benched ? `<button class="chip" data-toggle="benched" aria-pressed="${FT().benched}">The bench<span class="n num">${counts.benched}</span></button>` : ""}
      </div>
    </div>`;

  return `<div class="fpanel">
    ${lead}
    ${grp("Energy", "energy", ENERGY, (s,dd) => energyOf(s, dd))}
    ${grp("How long", "shape", SHAPE, (s,dd) => (dd.gamesById[s.appid]||{}).shape)}
    ${grp("What we'll be doing", "doing", DOING, (s,dd) => doingOf(s, dd))}
    ${grp("Setup", "setup", SETUP, s => s.setup)}
    ${grp("Release", "release", RELEASE, (s,dd) => releaseOf(dd.gamesById[s.appid]))}
    ${played}
    ${only}
  </div>`;
}

function listView(list, d){
  // headers set the arrangement, so the table and the toolbar never disagree
  const th = (key, label, align, extra) => `<th class="${align?"r ":""}${extra||""}"><button data-arrange="${key}">${label}${
    arrange===key ? `<span class="dir">\u25BE</span>` : ""}</button></th>`;
  return `<div class="tablewrap"><table>
    <thead><tr>
      ${th("az","Game")}<th class="opt2">Energy</th><th class="opt2">Crew</th>
      <th class="opt">Added by</th>${th("review","Reviews",1,"opt")}${th("votes","Votes",1)}<th class="r"></th>
    </tr></thead>
    <tbody>${list.map(s => {
      const g = d.gamesById[s.appid]||{}, n = d.counts[s.appid]||0, on = d.myPicks.includes(s.appid);
      return `<tr class="${on?"on":""}">
        <td class="g"><div class="nm">
          <span class="swatch" style="--tile:hsl(${hueOf(g.name||s.appid)} 40% 47%)"></span>
          <span>${esc(g.name||s.appid)}</span></div>
          <div class="sub"><span class="narrow">${
            energyOf(s,d) ? esc(ENERGY[energyOf(s,d)])+" · " : ""}${s.crew_max ? "≤ "+s.crew_max+" · " : ""}</span>${
            esc(SHAPE[g.shape]||"")}${doingOf(s,d)?" · "+esc(DOING[doingOf(s,d)]):""}</div></td>
        <td class="opt2">${energyOf(s,d)?`<span class="pill pill--e${energyOf(s,d)}">${esc(ENERGY[energyOf(s,d)])}</span>`:`<span class="pill">—</span>`}</td>
        <td class="opt2"><button class="pill pill--set" data-facets="${s.appid}" title="${esc(s.crew_note||"")}">${
          s.crew_max ? "≤ "+s.crew_max : "Set"}${s.crew_mod ? " <span class=\"modhint\">+mod</span>" : ""}</button></td>
        <td class="opt">${esc(s.added_name || "\u2014")}</td>
        <td class="r opt num">${g.review_pct!=null?g.review_pct+"%":"—"}</td>
        <td class="r num">${n}</td>
        <td class="r">${d.nowPlaying ? `<span class="rowpick" style="background:transparent;color:var(--muted)">${d.nowPlaying.appid === s.appid ? "on now" : ""}</span>` : `<button class="rowpick" data-pick="${s.appid}" aria-pressed="${on}">${on?"Picked":d.myPicks.length>=3?"Replace":"Pick"}</button>`}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

/** One strip that says where the round is. It used to be a round panel, a
 *  cover-art hero and a bottom bar all saying the same thing; now the leader
 *  is named once, here, and the beam on its card does the rest. */
function renderStatus(d, g, call){
  const solo = d.lookedCount <= 1;
  const menu = `<button class="iconbtn" id="morebtn" aria-label="More" aria-haspopup="dialog"><svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>`;

  if(g.locked_appid){
    const game = d.gamesById[g.locked_appid] || {};
    return `<section class="status status--playing" aria-live="polite">
      <div class="st-main">
        <span class="st-k">▶ Playing</span>
        <span class="st-lead"><b class="leadname">${esc(game.name||"")}</b></span>
        <span class="st-sub">round ${g.round_no} · ${(() => { const n = (S.sessions||[]).filter(x => x.appid === g.locked_appid).length;
          return n ? n + (n === 1 ? " session" : " sessions") + " so far" : "started " + esc(ago((d.nowPlaying||{}).started_at)); })()}</span>
      </div>
      <div class="st-acts">
        <button class="btn btn--ghost btn--sm" id="closebtn">Finished it</button>
        ${menu}
      </div>
      ${seshLine(seshFor(d, inPlay(d)[0]))}
    </section>`;
  }
  if(g.paused_at){
    return `<section class="status status--paused">
      <div class="st-main">
        <span class="st-k">⏸ On a break</span>
        <span class="st-sub">since ${esc(shortDate(g.paused_at))} · picks still count when you pick it back up</span>
      </div>
      <div class="st-acts">
        <button class="btn btn--sm" id="resumebtn">Pick it back up</button>
        ${menu}
      </div>
    </section>`;
  }
  const top = d.ranked.length ? d.ranked[0] : null;
  const game = top ? d.gamesById[top.appid] : null;
  const tied = top ? d.ranked.filter(r => r.n === top.n) : [];
  const lead = !game ? `<span class="st-lead st-lead--none">No votes yet</span>`
    : tied.length > 1 ? `<span class="st-lead">Dead heat: <b class="leadname">${esc(game.name)}</b> and ${tied.length-1} more on ${top.n}</span>`
    : `<span class="st-lead"><b class="leadname${tookover === top.appid ? " tookover" : ""}">${esc(game.name)}</b> leads with ${top.n}</span>`;
  const sub = solo ? "just you so far"
    : `${d.votedCount} of ${d.lookedCount} in${call.ready ? " · enough to call it" : call.short ? " · "+call.short+" more to call it" : ""}`;
  const pct = Math.min(100, Math.round((d.votedCount / Math.max(1, Math.min(g.quorum, d.lookedCount))) * 100));
  return `<section class="status${call.ready ? " status--ready" : ""}" aria-live="polite">
    <div class="st-main">
      <span class="st-k">Round ${g.round_no}</span>
      ${lead}
      <span class="st-sub">${sub}</span>
    </div>
    <div class="st-acts">
      ${tied.length > 1 ? `<button class="btn btn--ghost btn--sm" id="spinbtn" title="Dead heat: let a wheel pick" aria-label="Spin for it">🎡<span class="spinlbl"> Spin for it</span></button>` : ""}
      ${d.ranked.length && !solo ? `<button class="btn btn--sm${call.ready ? "" : " btn--ghost"}${call.ready ? " btn--ready" : ""}" id="closebtn">Call it</button>` : ""}
      ${menu}
    </div>
    ${solo ? "" : `<div class="st-track" aria-hidden="true"><i style="width:${pct}%"></i></div>`}
  </section>`;
}

function card(s, d){
  const state = stateOf(s, d);
  const game = d.gamesById[s.appid] || {name:"Loading…", appid:s.appid};
  const n = d.counts[s.appid]||0, on = d.myPicks.includes(s.appid);
  const eff = energyOf(s, d);
  const cf = crewFit(s, F.crew);
  const takes = d.takesBy[s.appid]||[];
  const tagline = BLURBS[s.appid] || game.short_desc || "";
  const plays = d.playsBy[s.appid] || [];
  const lastPlay = plays[0];
  const isNow = d.nowPlaying && d.nowPlaying.appid === s.appid;
  const called = !!S.group.locked_appid;
  // one card is winning; the beam says which without spending a badge on it
  const isLead = !called && state === "open"
              && d.ranked.length && d.ranked[0].appid === s.appid && n > 0;
  // Everything a glance needs and nothing else: name, one line, three facts.
  // Reviews, setup, Steam, who added it and the long blurb live in details.
  return `<article class="card card--${state}${on?" on":""}${pulse===s.appid?" pulse":""}${isLead?" card--lead":""}">
    <span class="ring" aria-hidden="true"></span>
    <div class="art" style="--tile:hsl(${hueOf(game.name)} 24% 36%);--ang:${20+(s.appid%120)}deg">
      <div class="gen" aria-hidden="true"><span>${esc(monogram(game.name))}</span></div>
      ${game.header ? `<img src="${esc(game.header)}" alt="" loading="lazy" onload="this.classList.add('in')">` : ""}
      <div class="badges">
        ${isNow ? `<span class="bdg bdg--now">▶ playing now</span>`
          : (S.side||[]).some(x => x.appid === s.appid) ? `<span class="bdg bdg--side">on the side</span>`
          : cf === "mods" ? `<span class="bdg bdg--mods">needs a mod</span>`
          : cf === "unknown" && F.crew ? `<span class="bdg">cap unknown</span>`
          : releaseOf(game) === "soon" ? `<span class="bdg bdg--soon">not out yet</span>`
          : releaseOf(game) === "early" ? `<span class="bdg">early access</span>`
          : ""}
        <span class="sp"></span>
        ${saleOf(d, s.appid) && state !== "benched" ? `<span class="bdg bdg--sale" title="On sale on Steam: ${esc(saleOf(d, s.appid).final_fmt || "")}">−${saleOf(d, s.appid).discount}%</span>` : ""}
        ${state === "benched" ? `<span class="bdg bdg--backlog">benched</span>`
          : plays.length && !isNow ? `<span class="bdg bdg--played" title="Last played ${esc(ago(lastPlay.started_at))}">${
              plays.length > 1 ? "played ×"+plays.length : "played"}</span>` : ""}
      </div>
    </div>
    <div class="body">
      <h3>${esc(game.name)}</h3>
      ${tagline ? `<p class="desc clamp">${esc(tagline)}</p>` : ""}
      <div class="meta">
        ${eff ? `<span class="e e${eff}${energyIsGuess(s,d)?" guess":""}" title="Energy: ${esc(ENERGY[eff])}${energyIsGuess(s,d)?", guessed from Steam tags":""}"><i class="lvl" aria-hidden="true">${
          "●".repeat(eff)}${"○".repeat(3-eff)}</i>${esc(ENERGY[eff])}</span>` : ""}
        <button class="cap" data-facets="${s.appid}" title="${esc(s.crew_note||"Tap to set the player cap")}">${
          s.crew_max ? "Up to "+s.crew_max : "Cap?"}${s.crew_mod ? `<span class="modhint"> · ${s.crew_mod} modded</span>` : ""}</button>
        ${game.shape ? `<span>${esc(SHAPE[game.shape]||game.shape)}</span>` : ""}
        ${(() => { const o = ownLine(d, s.appid); return o ? `<span class="own${o.all ? " own--all" : ""}"${o.who ? ` title="Still to buy: ${esc(o.who)}"` : ""}>${o.all ? "✓ " : ""}${esc(o.text)}</span>` : ""; })()}
        ${lastPlay && !isNow && lastPlay.verdict ? `<span class="v v-${lastPlay.verdict}">${VERDICT_ICON[lastPlay.verdict]} ${esc(VERDICT[lastPlay.verdict])}</span>` : ""}
      </div>
      ${takes.length ? `<p class="take"><b>${esc(takes[0].by)}</b>${esc(takes[0].body)}${takes.length > 1 ? ` <span class="takemore">+${takes.length-1}</span>` : ""}</p>` : ""}
      <div class="foot">
        ${state === "benched"
          ? `<button class="pick" data-unbench="${s.appid}">Put it back</button>`
          : state === "playing"
          ? `<span class="pick pick--static">On right now</span>`
          : called
          ? `<span class="pick pick--static pick--quiet"><span class="n num">${n}</span> ${n===1?"vote":"votes"}</span>`
          : `<button class="pick" data-pick="${s.appid}" aria-pressed="${on}">${
              on ? "Picked" : d.myPicks.length >= 3 ? "Replace a pick" : "Pick this"
            }<span class="n num${lastCounts[s.appid] != null && lastCounts[s.appid] !== n ? " bump" : ""}">${n}</span></button>`}
        <button class="mini" data-facets="${s.appid}" aria-label="Details for ${esc(game.name)}">
          <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
      </div>
    </div></article>`;
}

// backlogCard removed: card() handles every state, so there is one component
/* ---------- sheets ---------- */
function renderSheet(d){
  const shell = inner => `<div class="sheetwrap" data-scrim><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;

  if(sheet.kind === "name"){
    if(sheet.step === "match"){
      // the "is that the same as this account" moment
      const many = sheet.candidates.length > 1;
      return shell(`
        <h3>Have we met?</h3>
        <p>There ${many?"are already people":"is already someone"} in this group with a name like
           <b>${esc(sheet.typed)}</b>. If one of them is you, tap it and your picks carry over to this device.</p>
        ${sheet.candidates.map(c => {
          const voted = (S.ballots||[]).find(b => b.member_id===c.member_id && (b.picks||[]).length);
          const bits = [];
          if(voted) bits.push(voted.picks.length + (voted.picks.length===1?" pick":" picks"));
          else bits.push("no picks yet");
          bits.push("last here " + ago(c.last_seen));
          if(c.device_count>1) bits.push(c.device_count+" devices");
          return `<button class="cand" data-claim="${esc(c.member_id)}">
            <span class="dot" style="background:hsl(${hueOf(c.name)} 58% 30%)">${esc(monogram(c.name))}</span>
            <span class="txt"><b>${esc(c.name)}</b><span>${esc(bits.join(" · "))}</span></span>
            <span style="color:var(--muted)">→</span></button>`;
        }).join("")}
        <div class="row">
          <button class="btn btn--ghost" id="notme">Nah, I'm new</button>
        </div>`);
    }
    const returning = !!myName;
    return shell(`
      <h3>${returning ? "Back again" : "Who's this?"}</h3>
      <p>${returning
        ? "We know you on this device. Only change it if you are, in fact, someone else."
        : "Just a name for the list. No signup, nothing to remember."}</p>
      <input class="input" id="nameinput" placeholder="Your name" maxlength="24" value="${esc(sheet.typed||"")}">
      <div class="row"><button class="btn" id="namego">${returning ? "Continue as "+esc(myName) : "That's me"}</button></div>`);
  }

  if(sheet.kind === "take"){
    const game = d.gamesById[sheet.appid] || {};
    const mine = (d.takesBy[sheet.appid]||[]).find(t => t.mine);
    return shell(`
      <h3>${sheet.fromAdd ? "In it goes. Sell it to us?" : "Your take on "+esc(game.name||"this")}</h3>
      <p>${sheet.fromAdd
        ? "One line on why "+esc(sheet.gameName||"it")+" is worth a night. Shows on the card. Skip if you cannot be bothered."
        : "One line, shows on the card. Be honest."}</p>
      <input class="input" id="takeinput" maxlength="140" placeholder="e.g. peaks at 4, grindy after that" value="${esc(mine?mine.body:"")}">
      <div class="row">
        <button class="btn btn--ghost" id="takeclear">${sheet.fromAdd ? "Skip" : "Clear"}</button>
        <button class="btn" id="takego">Save</button>
      </div>`);
  }

  if(sheet.kind === "facets"){
    const s = (S.shelf||[]).find(x => x.appid === sheet.appid) || {};
    const game = d.gamesById[sheet.appid] || {};
    const takes = d.takesBy[sheet.appid] || [];
    const mine = takes.find(t => t.mine);
    const desc = game.long_desc || game.short_desc || "";
    return `<div class="sheetwrap" data-scrim><div class="sheet sheet--tall" role="dialog" aria-modal="true">
      <div class="sheethead">
        <h3>${esc(game.name||"Game")}</h3>
        <button class="iconbtn" data-dismiss aria-label="Close">✕</button>
      </div>
      <div class="sheetbody">
        <div class="dl">
          ${releaseOf(game) !== "out" ? `<span class="pill pill--rel">${esc(RELEASE[releaseOf(game)])}${releaseOf(game) === "soon" && game.released ? " · " + esc(game.released) : ""}</span>` : ""}
          ${saleOf(d, sheet.appid) ? `<span class="pill pill--sale">−${saleOf(d, sheet.appid).discount}% · ${esc(saleOf(d, sheet.appid).final_fmt || "")}</span>` : d.prices[sheet.appid] && d.prices[sheet.appid].is_free ? `<span class="pill pill--sale">Free</span>` : ""}
          ${game.review_pct != null ? `<span class="pill pill--rev" title="${esc(game.review_desc||"")}">${game.review_pct}% on Steam · ${(game.review_count||0).toLocaleString()} reviews</span>` : ""}
          <a class="pill pill--link" href="https://store.steampowered.com/app/${sheet.appid}/" target="_blank" rel="noopener">Steam ↗</a>
          ${game.demo_appid ? `<a class="pill pill--link" href="https://store.steampowered.com/app/${game.demo_appid}/" target="_blank" rel="noopener">Try the demo ↗</a>` : ""}
        </div>
        ${s.added_name ? `<p class="addedby">Added by ${esc(s.added_name)}</p>` : ""}
        <div class="ownbar">
          <button class="chip" data-ownone="${sheet.appid}" aria-pressed="${iOwn(d, sheet.appid)}">${iOwn(d, sheet.appid) ? "✓ I own it" : "I own it"}</button>
          <span class="pnote">${(() => { const o = [...ownersOf(d, sheet.appid)].map(id => (d.members.find(m => m.member_id === id) || {}).label).filter(Boolean);
            return o.length ? "Owned by " + esc(listNames(o)) : "Nobody's said they own it yet"; })()}</span>
        </div>
        ${desc ? `<div class="dlong">${desc.split(/\n+/).map(pp => pp.trim()).filter(Boolean).map(pp => `<p>${esc(pp)}</p>`).join("")}</div>` : ""}

        <span class="eyebrow">What people reckon</span>
        ${takes.length ? `<div class="takes">${takes.map(t=>`<p class="take"><b>${esc(t.by)}</b>${esc(t.body)}</p>`).join("")}</div>` : ""}
        <input class="input" id="takeinput" maxlength="140" placeholder="Your one-liner, e.g. grindy after 4" value="${esc(mine?mine.body:"")}">

        <span class="eyebrow">How many can play</span>
        ${s.crew_note ? `<p class="notebox">${esc(s.crew_note)}</p>` : ""}
        <div class="row">
          <label class="fld"><span>Out of the box</span><input class="input" id="fcrew" type="number" min="1" max="500" placeholder="?" value="${s.crew_max ?? ""}"></label>
          <label class="fld"><span>With mods or a server</span><input class="input" id="fmod" type="number" min="1" max="9999" placeholder="?" value="${s.crew_mod ?? ""}"></label>
        </div>
        <span class="eyebrow">Energy</span>
        <div class="eopts">${[1,2,3].map(v => `<button class="eopt" data-fe="${v}" aria-pressed="${(sheet.e ?? energyOf(s,d))===v}"><b>${esc(ENERGY[v])}</b></button>`).join("")}</div>
        <span class="eyebrow">Setup</span>
        <div class="eopts">${Object.keys(SETUP).map(k => `<button class="eopt" data-fs="${k}" aria-pressed="${(sheet.s ?? s.setup)===k}"><b style="font-size:12px">${esc(SETUP[k])}</b></button>`).join("")}</div>
        <span class="eyebrow">What we'll be doing ${doingOf(s,d) && !s.doing ? "· guessed from Steam" : ""}</span>
        <div class="fset">${Object.keys(DOING).map(k => `<button class="chip" data-fv="${k}" aria-pressed="${(sheet.v ?? doingOf(s,d))===k}">${esc(DOING[k])}</button>`).join("")}</div>

        <span class="eyebrow">Have we played it</span>
        ${(d.playsBy[sheet.appid]||[]).length ? `
          <div class="playlog">${(d.playsBy[sheet.appid]||[]).map(pl => `
            <div class="playrow">
              <span>${pl.round_no ? "Round "+pl.round_no : "Before this"}</span>
              <span>${pl.round_no ? esc(ago(pl.started_at)) : "at some point"}</span>
              <span>${pl.verdict ? VERDICT_ICON[pl.verdict]+" "+esc(VERDICT[pl.verdict]) : pl.finished_at ? "no verdict" : "on now"}</span>
              ${pl.finished_at ? `<button class="rowx" data-forget="${pl.round_no}" aria-label="Remove this play">✕</button>` : "<span></span>"}
            </div>`).join("")}</div>` : `<p class="notebox">Nothing logged. Played it before all this? Say so.</p>`}
        <div class="fset">
          ${Object.keys(VERDICT).map(k => `<button class="chip" data-past="${k}">${
            VERDICT_ICON[k]} ${esc(VERDICT[k])}</button>`).join("")}
          <button class="chip" data-past="">Played, no verdict</button>
        </div>
        ${(() => { const ses = (S.sessions||[]).filter(x => x.appid === sheet.appid);
          return ses.length ? `<p class="notebox">${ses.length} ${ses.length === 1 ? "session" : "sessions"}: ${ses.map(x => esc(dayDate(x.day).toLocaleDateString("en-AU",{day:"numeric",month:"short"}))).join(", ")}</p>` : ""; })()}
        ${S.group.locked_appid && stateOf(s, d) === "open" && !(S.side||[]).some(x => x.appid === sheet.appid) ? `
          <span class="eyebrow">On the side</span>
          <p class="fhint">Fewer of you, alongside ${esc((d.gamesById[S.group.locked_appid]||{}).name || "the main game")}. It gets its own strip and picks its own nights.</p>
          <button class="btn btn--ghost" id="sidego">Play it on the side</button>` : ""}
        ${stateOf(s, d) === "open" ? `<button class="danger" id="retirego">Bench it</button>` : ""}
      </div>
      <div class="sheetfoot"><button class="btn" id="facetgo">Save</button></div>
    </div></div>`;
  }

  if(sheet.kind === "add"){
    return shell(`
      <h3>Add a game</h3>
      <p>Search Steam by name, or paste a store link.</p>
      <div class="addfield">
        <input class="input" id="addq" aria-label="Search Steam by name, or paste a store link"
               placeholder="e.g. Valheim, or a Steam link" value="${esc(addQ)}"
               enterkeyhint="search" autocomplete="off" ${busy?"disabled":""}>
        <button class="addgo" id="addgo" aria-label="Look it up" ${busy||addBusy?"disabled":""}>
          ${addBusy
            ? `<span class="spin"></span>`
            : `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`}
        </button>
      </div>
      ${addResults.length ? `<div class="results">${addResults.map(r => {
        const have = (S.shelf||[]).find(x => x.appid === r.appid);
        const st = have ? stateOf(have, d) : null;
        return `
        <div class="res${have ? " res--have" : ""}">
          ${r.header ? `<img src="${esc(r.header)}" alt="" loading="lazy">`
            : `<span style="width:62px;height:29px;border-radius:4px;flex:none;background:hsl(${hueOf(r.name)} 24% 36%)"></span>`}
          <span class="nm">${esc(r.name)}${have ? `<span class="sub">${
            st === "benched" ? "On the bench" : st === "playing" ? "On right now" : "Already on the shelf"}${
            have.added_name ? " \u00B7 added by "+esc(have.added_name) : ""}${
            st === "open" && (d.counts[r.appid]||0) ? " \u00B7 "+d.counts[r.appid]+(d.counts[r.appid]===1?" vote":" votes") : ""}</span>` : ""}</span>
          <span class="resbtns">
            ${!have ? `<button class="btn btn--sm" data-add="${r.appid}">Add it</button>`
              : st === "benched" ? `<button class="btn btn--sm" data-unbench="${r.appid}">Put it back</button>`
              : `<button class="btn btn--ghost btn--sm" data-showcard="${r.appid}">Show it</button>`}
          </span>
        </div>`; }).join("")}</div>` : ""}
      ${addMsg ? `<p class="msg msg--${addMsg.kind==="ok"?"ok":"bad"}">${esc(addMsg.text)}</p>` : ""}`);
  }

  if(sheet.kind === "sesh"){
    const ip = inPlay(d).find(z => z.appid === sheet.appid);
    if(!ip){ return shell(`<h3>That one's wrapped up</h3><div class="row"><button class="btn btn--ghost" data-dismiss>Close</button></div>`); }
    const x = seshFor(d, ip), game = d.gamesById[ip.appid] || {};
    return shell(`<h3>${ip.side ? "Side game" : "Next sesh"}: ${esc(game.name || "")}</h3>
      <p>${x.lock ? "Locked in. Change it if plans move." : `Tap every night you could play. ${x.total <= 1 ? (x.total ? "Just one of you in so far." : "Nobody's in on it yet.") : x.need >= x.total ? "Needs all " + x.total + " of you." : "Needs " + x.need + " of " + x.total + "."}`}</p>
      <div id="seshbody">${seshBody(d, x)}</div>
      ${ip.side ? "" : `<button class="linkbtn" id="seshrulesjump">Night rules: ${esc(needWords(S.group.sesh_need, (S.members||[]).length).val)} free, starts ${esc(S.group.sesh_time || "8pm")} · change</button>`}
      <div class="row"><button class="btn btn--ghost" data-dismiss>Done</button></div>`);
  }

  if(sheet.kind === "seshrules"){
    const total = (S.members||[]).length, w = needWords(sheet.need, total);
    return shell(`<h3>Night rules</h3>
      <p>How the crew picks a night. Changes it for everyone.</p>
      <div class="rules">
        <div class="rulesrow">A night works when this many are free</div>
        <div class="rulesrow"><span class="stepper"><button class="sbtn" data-need="-" aria-label="Fewer">\u2212</button><span class="val num" id="needval">${esc(w.val)}</span><button class="sbtn" data-need="+" aria-label="More">+</button></span></div>
        <p class="fhint" id="needhint">${esc(w.hint)}</p>
        <label class="rulesrow">Usual start <input class="input" id="seshtime" maxlength="12" value="${esc(sheet.time)}" placeholder="8pm" autocomplete="off"></label>
      </div>
      <p class="hint hint--bad" id="rulesmsg" hidden></p>
      <div class="row"><button class="btn btn--ghost" data-${sheet.back ? "rulesback" : "dismiss"}>${sheet.back ? "Back" : "Cancel"}</button><button class="btn" id="rulessave">Save</button></div>`);
  }

  if(sheet.kind === "sidewrap"){
    const game = d.gamesById[sheet.appid] || {};
    return shell(`<h3>Wrap up ${esc(game.name || "")}?</h3>
      <p>It goes into play history like any other game. Nothing's deleted, and it can go on the side again later.</p>
      <div class="fset">${Object.keys(VERDICT).map(k => `<button class="chip" data-sv="${k}" aria-pressed="${sheet.verdict === k}">${VERDICT_ICON[k]} ${esc(VERDICT[k])}</button>`).join("")}</div>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Not yet</button><button class="btn" id="sidewrapgo">Wrap it up</button></div>`);
  }

  if(sheet.kind === "crew"){
    return shell(`<h3>Edit crew</h3>
      <p>Changes it for everyone in the crew. The emoji shows on the browser tab too.</p>
      <div class="crewedit">
        <span class="ebtn ebtn--lg" id="crewpreview" aria-hidden="true">${esc(sheet.emoji)}</span>
        <input class="input" id="crewname" maxlength="40" aria-label="Crew name" value="${esc(sheet.name)}" autocomplete="off">
      </div>
      ${emojiPicker(sheet.emoji)}

      <p class="hint hint--bad" id="crewmsg" hidden></p>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Cancel</button><button class="btn" id="crewsave">Save</button></div>`);
  }

  if(sheet.kind === "emoji"){
    return shell(`<h3>Pick an emoji</h3>
      <p>It's the crew's icon, on the tab and in your list.</p>
      ${emojiPicker(newCrew.emoji)}`);
  }

  if(sheet.kind === "owns") return shell(ownsSheet(d));
  if(sheet.kind === "spin") return shell(spinSheet(d));

  if(sheet.kind === "discord"){
    const on = !!S.group.discord;
    return shell(`<h3>Discord scoreboard</h3>
      ${on ? `<p>It's on. One message in your channel keeps itself up to date: the top picks, who's still to vote, and the next night once you're playing. Big moments post a fresh one.</p>
        <p class="hint" id="dcmsg" aria-live="polite"></p>
        <div class="row"><button class="btn btn--ghost" id="dcoff">Turn it off</button><button class="btn" id="dcpost">Post a fresh one</button></div>
        ${sheet.back ? `<button class="linkbtn" data-shareback>← Back to send to the chat</button>` : ""}`
      : `<p>One message in your channel that updates itself as people vote and pick nights. Anyone taps the title to jump in.</p>
        <ol class="steps">
          <li>In Discord, hover the channel and tap the <b>cog</b></li>
          <li><b>Integrations</b> → <b>Webhooks</b> → <b>New Webhook</b></li>
          <li><b>Copy Webhook URL</b> and paste it here</li>
        </ol>
        <input class="input" id="dchook" placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false" aria-label="Discord webhook link">
        <p class="hint" id="dcmsg" aria-live="polite">Only this crew's scoreboard uses it. Nobody else sees the link.</p>
        <div class="row"><button class="btn btn--ghost" ${sheet.back ? "data-shareback" : "data-dismiss"}>${sheet.back ? "Back" : "Cancel"}</button><button class="btn" id="dcgo" disabled>Connect</button></div>`}`);
  }

  if(sheet.kind === "menu"){
    return shell(`
      <h3>${esc(S.group.emoji || DEFAULT_EMOJI)} ${esc(S.group.name)}</h3>
      <span class="eyebrow">Who's in</span>
      <div class="crew">${d.members.length ? d.members.map(mm => {
        const voted = (S.ballots||[]).some(b => b.member_id===mm.member_id && (b.picks||[]).length);
        return `<span class="who${voted?"":" novote"}" title="${voted?"voted":"not voted yet"}">
          ${isLive(mm.last_seen) ? `<span class="livedot" title="here now"></span>` : ""}
          <span class="dot" style="background:hsl(${hueOf(mm.name)} 45% 42%)">${esc(mm.label[0].toUpperCase())}</span>${esc(mm.label)}</span>`;
      }).join("") : `<span class="empty">Just you so far.</span>`}</div>
      <div class="menu">
        <button class="menuitem" id="sharemenu"><b>Send to the chat</b><span>${S.group.discord ? "Discord scoreboard's on · or copy an update" : "Link, update, reminder, or a live Discord scoreboard"}</span></button>
      </div>
      <span class="eyebrow">Crew settings</span>
      <div class="menu">
        <button class="menuitem" id="editcrew"><b>Edit crew</b><span>Name and emoji</span></button>
        <button class="menuitem" id="seshrulesbtn"><b>Night rules</b><span>How many make a night, and the usual start</span></button>
      </div>
      ${S.group.paused_at && !S.group.locked_appid ? "" : `<span class="eyebrow">This round</span>`}
      <div class="menu">
        ${S.group.locked_appid
          ? `<button class="menuitem" id="reopenbtn"><b>Changed our minds</b><span>Reopen the vote</span></button>`
          : S.group.paused_at ? ""
          : `<button class="menuitem" id="breakbtn"><b>Taking a break</b><span>Pause the round, picks stay</span></button>`}
      </div>`);
  }

  if(sheet.kind === "shuffle"){
    const game = d.gamesById[sheet.appid] || {};
    const s = (S.shelf||[]).find(x => x.appid === sheet.appid) || {};
    return shell(`
      <h3><span class="die" id="die">🎲</span> <span class="reel" id="reel">${esc(game.name || "That one")}</span></h3>
      <p>One of the ${sheet.pool} that survived your filters.
         ${s.setup ? esc(SETUP[s.setup])+"." : ""} ${s.crew_max ? "Up to "+s.crew_max+" players." : ""}</p>
      <div class="row">
        <button class="btn btn--ghost" id="reroll">Roll again</button>
        <button class="btn" id="shufflepick">Pick it</button>
      </div>`);
  }

  if(sheet.kind === "close"){
    if(S.group.locked_appid){
      const g2 = d.gamesById[S.group.locked_appid] || {};
      return shell(`<h3>How was ${esc(g2.name || "it")}?</h3>
        <p>For future reference. Skip it if you cannot be bothered.</p>
        <div class="eopts">
          ${Object.keys(VERDICT).map(k => `<button class="eopt" data-verdict="${k}" aria-pressed="${sheet.verdict===k}">
            <b>${VERDICT_ICON[k]}</b><span>${esc(VERDICT[k])}</span></button>`).join("")}
        </div>
        <span class="eyebrow">Where does ${esc(g2.name || "it")} go?</span>
        <div class="eopts eopts--2">
          <button class="eopt" data-bench="0" aria-pressed="${!sheet.bench}">
            <b>Leave it up</b><span>Still up for a vote, carrying its verdict</span></button>
          <button class="eopt" data-bench="1" aria-pressed="${!!sheet.bench}">
            <b>Bench it</b><span>Off the shelf until someone puts it back</span></button>
        </div>
        <p style="font-size:12.5px;color:var(--muted)">Everyone's picks reset either way. Nothing gets deleted.</p>
        <div class="row">
          <button class="btn btn--ghost" data-dismiss>Not yet</button>
          <button class="btn btn--ghost" id="newroundbreak">Take a break</button>
          <button class="btn" id="newroundgo">Next round</button>
        </div>`);
    }
    const top = d.ranked[0], game = d.gamesById[sheet.appid || top.appid] || {};
    return shell(`<h3>Lock in ${esc(game.name||"the leader")}?</h3>
      <p>${d.votedCount} of ${d.lookedCount} have voted. Pins it up top so nobody can claim they missed it.</p>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Not yet</button>
      <button class="btn" id="closego">Lock it in</button></div>`);
  }

  if(sheet.kind === "resume"){
    const n = sheet.crew ?? d.lookedCount;
    const fits = (S.shelf||[]).filter(x => stateOf(x,d) !== "benched" && crewFit(x, n) !== "no").length;
    return shell(`<h3>Back on</h3>
      <p>How many of us this time? It sets your crew filter so nothing that can't seat you all gets in the way.</p>
      <div class="stepper">
        <button class="sbtn" data-rcrew="-" aria-label="Fewer">\u2212</button>
        <span class="val num">${n}</span>
        <button class="sbtn" data-rcrew="+" aria-label="More">+</button>
        <span class="off">${fits} of ${(S.shelf||[]).length} fit</span>
      </div>
      <div class="row">
        <button class="btn btn--ghost" id="resumeskip">Skip</button>
        <button class="btn" id="resumego">Back on</button>
      </div>`);
  }

  if(sheet.kind === "share"){
    // one place for everything that goes to a chat: the live Discord scoreboard up top,
    // then a one-off message for anywhere else (WhatsApp, Messenger, iMessage, Slack…)
    const mode = sheet.mode || "state";
    const canSesh = inPlay(d).length > 0;
    const body = shareBody(d, mode);
    const canNative = !!navigator.share;
    return shell(`<h3>Send to the chat</h3>
      <button class="menuitem dcrow" id="discordrow"><b>${S.group.discord ? "✓ Discord scoreboard is on" : "Live Discord scoreboard"}</b>
        <span>${S.group.discord ? "One message in your channel that keeps itself up to date · manage" : "One message in your channel that updates itself · set up"}</span></button>
      <span class="eyebrow">Or send a one-off</span>
      <div class="fset fset--seg">
        <button class="chip" data-sharemode="link" aria-pressed="${mode === "link"}">Link</button>
        <button class="chip" data-sharemode="state" aria-pressed="${mode === "state"}">Update</button>
        <button class="chip" data-sharemode="nudge" aria-pressed="${mode === "nudge"}">Reminder</button>
        ${canSesh ? `<button class="chip" data-sharemode="sesh" aria-pressed="${mode === "sesh"}">When's next</button>` : ""}
      </div>
      <p class="fhint">${mode === "link" ? "Just the link. Anyone with it can join the crew." : mode === "sesh" ? "Where the next night is at, and who still owes theirs." : mode === "nudge" ? "Names whoever hasn't voted yet." : "The leaderboard, plus the link."}</p>
      <pre class="sharepre">${esc(body)}</pre>
      <div class="row">${canNative ? `<button class="btn btn--ghost" id="nativeshare">Share…</button>` : ""}<button class="btn" id="copyshare">Copy it</button></div>`);
  }

  if(sheet.kind === "filters"){
    const draft = fDraft || F;
    const shelfAll = S.shelf || [];
    const counts = {
      benched: shelfAll.filter(x => stateOf(x,d) === "benched").length,
    };
    // counts are over the whole shelf, same as what the sheet will apply to
    const pool = (S.shelf || []).filter(x => (stateOf(x,d) === "benched") === draft.benched);
    const n = pool.filter(x => passes(x, d, draft)).length;
    const on = activeFilters(draft).length;
    return `<div class="sheetwrap" data-scrim><div class="sheet sheet--tall" role="dialog" aria-modal="true">
      <div class="sheethead">
        <h3>Filters</h3>
        ${on ? `<button class="clearall" id="fclear">Clear ${on}</button>` : ""}
        <button class="iconbtn" data-dismiss aria-label="Close">\u2715</button>
      </div>
      <div class="sheetbody">${filterPanel(d, pool, counts)}</div>
      <div class="sheetfoot">
        ${n
          ? `<button class="btn" id="fapply">Show ${n} game${n===1?"":"s"}</button>`
          : `<button class="btn" id="fclearall">Nothing matches. Start again</button>`}
      </div>
    </div></div>`;
  }

  if(sheet.kind === "arrange"){
    const set = (keys) => `<div class="fset">${keys.map(k =>
      `<button class="chip" data-arrange="${k}" aria-pressed="${arrange===k}">${esc(ARRANGE[k].label)}</button>`).join("")}</div>`;
    const flat = Object.keys(ARRANGE).filter(k => ARRANGE[k].group === "none");
    const grouped = Object.keys(ARRANGE).filter(k => ARRANGE[k].group !== "none");
    return shell(`<h3>Arrange</h3>
      <div class="fgroup"><div class="lab"><span class="eyebrow">One list</span></div>${set(flat)}</div>
      <div class="fgroup"><div class="lab"><span class="eyebrow">In sections</span></div>${set(grouped)}</div>`);
  }

  if(sheet.kind === "me"){
    const me = d.meMember || {};
    return shell(`<h3>That's you</h3>
      <p>Rename yourself here and your votes come with you.</p>
      <label class="rulesrow" for="renameinput">Your name</label>
      <input class="input" id="renameinput" maxlength="24" value="${esc(me.name||"")}">

/* ============================================================================
   WIRING
   ========================================================================== */
/* A dialog you cannot reach with a keyboard is a dialog half the people using
   it cannot close. Move focus in, keep Tab inside it, put focus back where it
   came from on the way out. */
let focusReturn = null;
function closeSheet(){
  sheet = null; pending = null; fDraft = null;
  render();
  if(focusReturn && document.contains(focusReturn)) focusReturn.focus();
  focusReturn = null;
}
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function trapFocus(scrim){
  const box = scrim.querySelector(".sheet");
  if(!box) return;
  // name the dialog after its own heading, so a screen reader announces what opened
  const h = box.querySelector("h3");
  if(h && !box.getAttribute("aria-labelledby")){
    h.id = h.id || "sheet-title";
    box.setAttribute("aria-labelledby", h.id);
  }
  const items = () => [...box.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
  const first = items()[0];
  // a text field wants the caret; anything else just wants the ring
  if(first && !box.contains(document.activeElement)) first.focus();
  box.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    const list = items();
    if(!list.length) return;
    const a = list[0], z = list[list.length-1];
    if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
  });
}

  const spb = document.getElementById("spinbtn"); if(spb) spb.onclick = () => { sheet = { kind:"spin" }; render(); };
  if(sheet && sheet.kind === "spin") wireSpin(d);
  // owning: optimistic, one request per tap

    const a = +(b.dataset.own || b.dataset.ownone), own = b.getAttribute("aria-pressed") !== "true";

  });
  refreshPrices();
  if(sheet && sheet.kind === "discord") wireDiscord();

  // --- name entry, step one

  // --- name entry, step two

    try{ await rpc(fn, { p_code: code, p_device: deviceId, ...args }); }
    catch(err){ if(btn) btn.disabled = false; console.warn(fn, err && err.message); }
    finally{ refresh(); }
  };
  app.querySelectorAll("[data-sesh]").forEach(b => b.onclick = () => { sheet = { kind:"sesh", appid: +b.dataset.sesh }; render(); });
  app.querySelectorAll("[data-resolve]").forEach(b => b.onclick = () =>
    act("resolve_sesh", { p_appid: +b.dataset.resolve, p_played: b.dataset.played === "1" }, b));
  app.querySelectorAll("[data-sidejoin]").forEach(b => b.onclick = () =>
    act("side_join", { p_appid: +b.dataset.sidejoin, p_on: b.dataset.on === "1" }, b));
  app.querySelectorAll("[data-sidemenu]").forEach(b => b.onclick = () => { sheet = { kind:"sidewrap", appid: +b.dataset.sidemenu, verdict: null }; render(); });
  const rs = document.getElementById("railshare"); if(rs) rs.onclick = () => { sheet = { kind:"share" }; render(); };
  const sg = document.getElementById("sidego");
  if(sg) sg.onclick = async () => { const a = sheet.appid; sheet = null; await act("start_side_game", { p_appid: a }, sg); };

  if(sheet && sheet.kind === "sidewrap"){
    app.querySelectorAll("[data-sv]").forEach(b => b.onclick = () => {
      sheet.verdict = sheet.verdict === b.dataset.sv ? null : b.dataset.sv;
      app.querySelectorAll("[data-sv]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.sv === sheet.verdict)));
    });
    const go = document.getElementById("sidewrapgo");
    if(go) go.onclick = async () => { const { appid, verdict } = sheet; sheet = null; await act("end_side_game", { p_appid: appid, p_verdict: verdict }, go); };
  }
  if(sheet && sheet.kind === "sesh") wireSeshBody(d);

  // next-sesh rules: from the menu, or from the day picker (then Back returns to it)
  const openRules = back => { sheet = { kind:"seshrules", need: S.group.sesh_need ?? null, time: S.group.sesh_time || "8pm", back }; render(); };
  const rb = document.getElementById("seshrulesbtn"); if(rb) rb.onclick = () => openRules(null);
  const rj = document.getElementById("seshrulesjump"); if(rj) rj.onclick = () => openRules(sheet.appid);

    const back = sheet.back;
    const bb = app.querySelector("[data-rulesback]"); if(bb) bb.onclick = () => { sheet = { kind:"sesh", appid: back }; render(); };
    // the stepper runs 1, 2 … all … up to 12. "All" (null) sits where the crew size would be
    // and keeps meaning everyone as people join; a number above the crew size is a fixed bar
    // for when the rest turn up, and counts as everyone until then
    app.querySelectorAll("[data-need]").forEach(b => b.onclick = () => {
      const total = Math.max(1, (S.members||[]).length), cur = sheet.need ?? total;
      let next = b.dataset.need === "-" ? Math.max(1, cur - 1) : Math.min(Math.max(12, total), cur + 1);
      sheet.need = next === total ? null : next;
      const w = needWords(sheet.need, total);
      document.getElementById("needval").textContent = w.val;
      document.getElementById("needhint").textContent = w.hint;
    });
    const st = document.getElementById("seshtime");
    if(st) st.addEventListener("input", () => { sheet.time = st.value; });
    const sv = document.getElementById("rulessave");
    if(sv) sv.onclick = async () => {
      if(needName(() => {})) return;
      const need = sheet.need ?? null, time = (sheet.time || "").trim() || "8pm";
      sv.disabled = true; sv.textContent = "Saving…";
      try{
        await rpc("set_sesh_rules", { p_code: code, p_device: deviceId, p_need: need, p_time: time });
        sheet = back ? { kind:"sesh", appid: back } : null;
        await refresh(); render();
      }catch(err){
        sv.disabled = false; sv.textContent = "Save";

      }
    };
  }
}

function wireDiscord(){
  const msg = document.getElementById("dcmsg");
  const say = (t, bad) => { if(msg){ msg.textContent = t; msg.classList.toggle("hint--bad", !!bad); } };
  const hookIn = document.getElementById("dchook"), go = document.getElementById("dcgo");
  const looksRight = v => /^https:\/\/(ptb\.|canary\.)?discord(app)?\.com\/api\/webhooks\/\d+\/[\w-]+$/.test(v.trim());
  if(hookIn) hookIn.addEventListener("input", () => { go.disabled = !looksRight(hookIn.value);
    if(hookIn.value.trim() && !looksRight(hookIn.value)) say("That doesn't look like a webhook link yet. It starts with https://discord.com/api/webhooks/", true);
    else say("Only this crew's scoreboard uses it. Nobody else sees the link."); });
  if(go) go.onclick = async () => {
    go.disabled = true; go.textContent = "Connecting…";
    try{
      await rpc("set_discord", { p_code: code, p_device: deviceId, p_hook: hookIn.value.trim() });
      await pingDiscord(true);
      await refresh(); render(); say("Posted. Have a look in the channel.");
    }catch(err){ go.disabled = false; go.textContent = "Connect"; say(err.message, true); }
  };
  const post = document.getElementById("dcpost");
  if(post) post.onclick = async () => {
    post.disabled = true;
    try{ await pingDiscord(true); say("Posted a fresh one."); }
    catch(err){ say(err.message, true); if(/gone/.test(err.message)){ await refresh(); render(); } }
    post.disabled = false;
  };
  const off = document.getElementById("dcoff");
  if(off) off.onclick = async () => {
    off.disabled = true;
    try{ await rpc("set_discord", { p_code: code, p_device: deviceId, p_hook: null }); await refresh(); render(); }
    catch(err){ off.disabled = false; say(err.message, true); }
  };
}

function wireSeshBody(d){

    S.sesh_none = (S.sesh_none || []).filter(n => !(n.appid === appid && n.member_id === myMemberId));

    catch(err){ btn.disabled = false; console.warn(fn, err && err.message); }

}

  const rsb = document.getElementById("resumebtn");
  if(rsb) rsb.onclick = () => { sheet = {kind:"resume", crew:d.lookedCount}; render(); };
  document.querySelectorAll("[data-rcrew]").forEach(b => b.onclick = () => {
    sheet.crew = Math.max(1, Math.min(64, (sheet.crew ?? d.lookedCount) + (b.dataset.rcrew === "+" ? 1 : -1)));
    render();
  });
  const rgo = document.getElementById("resumego");
  if(rgo) rgo.onclick = () => { F.crew = sheet.crew ?? d.lookedCount; setBreak(false); };
  const rsk = document.getElementById("resumeskip");
  if(rsk) rsk.onclick = () => setBreak(false);
  const sw = document.getElementById("switchbtn"); if(sw) sw.onclick = () => { sheet={kind:"switch"}; render(); };
  const mb = document.getElementById("mebtn");     if(mb) mb.onclick = () => { sheet={kind:"me"}; render(); };

  // sheet internals
  const ti = document.getElementById("takeinput");
  if(ti && sheet.kind === "take"){
    ti.focus();
    document.getElementById("takego").onclick   = () => { const a=sheet.appid,v=ti.value; sheet=null; saveTake(a,v); };
    document.getElementById("takeclear").onclick = () => { const a=sheet.appid; sheet=null; saveTake(a,""); };
  }
  document.querySelectorAll("[data-fe]").forEach(b => b.onclick = () => {
    sheet.e = +b.dataset.fe;
    document.querySelectorAll("[data-fe]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.fe === sheet.e)));
  });
  document.querySelectorAll("[data-fs]").forEach(b => b.onclick = () => {
    sheet.s = b.dataset.fs;
    document.querySelectorAll("[data-fs]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.fs === sheet.s)));
  });
  document.querySelectorAll("[data-past]").forEach(b => b.onclick = () => {
    logPastPlay(sheet.appid, b.dataset.past);
  });
  document.querySelectorAll("[data-forget]").forEach(b => b.onclick = () => {
    forgetPlay(sheet.appid, +b.dataset.forget);
  });
  document.querySelectorAll("[data-fv]").forEach(b => b.onclick = () => {
    sheet.v = b.dataset.fv;
    document.querySelectorAll("[data-fv]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.fv === sheet.v)));
  });
  const fg = document.getElementById("facetgo");
  if(fg) fg.onclick = () => {
    const raw = document.getElementById("fcrew").value.trim();
    const rawMod = document.getElementById("fmod").value.trim();
    const a = sheet.appid, e = sheet.e, s = sheet.s, v = sheet.v;
    // the take sits in the same sheet, so one Save covers it too
    const tk = document.getElementById("takeinput");
    const was = ((d.takesBy[a]||[]).find(t => t.mine) || {}).body || "";
    sheet = null;
    if(tk && tk.value.trim() !== was) saveTake(a, tk.value.trim());
    saveFacets(a, e, raw ? Number(raw) : null, s, rawMod ? Number(rawMod) : null, v);
  };
  const rg = document.getElementById("retirego");
  if(rg) rg.onclick = async () => {
    const a = sheet.appid; sheet = null; render();
    // not a delete: it drops off the ballot, out of everyone's picks, and needs
    // benched, not deleted: takes and play history all survive
    try{ await rpc("bench_game", {p_code:code, p_device:deviceId, p_appid:a}); }finally{ refresh(); }
  };
  const cg = document.getElementById("closego");    if(cg) cg.onclick = () => closeRound(sheet.appid || d.ranked[0].appid);
  const nr = document.getElementById("newroundgo"); if(nr) nr.onclick = () => startRound(sheet.verdict, sheet.bench, false);
  const nb = document.getElementById("newroundbreak"); if(nb) nb.onclick = () => startRound(sheet.verdict, sheet.bench, true);
  document.querySelectorAll("[data-sharemode]").forEach(b => b.onclick = () => {
    sheet.mode = b.dataset.sharemode; render();
  });
  const cshare = document.getElementById("copyshare");
  if(cshare) cshare.onclick = () => copy(shareBody(d, sheet.mode || "state"), cshare);
  // phones: the OS share sheet goes straight to WhatsApp, Messenger, iMessage and friends
  const ns = document.getElementById("nativeshare");
  if(ns) ns.onclick = async () => { const m = sheet.mode || "state", link = shareBody(d, "link");
    try{ await navigator.share(m === "link" ? { title: S.group.name, url: link } : { title: S.group.name, text: shareBody(d, m) }); }catch{} };
  const dr = document.getElementById("discordrow"); if(dr) dr.onclick = () => { sheet = { kind:"discord", back:"share" }; render(); };
  const ul2 = document.getElementById("unlinkothers");
  if(ul2) ul2.onclick = async () => {
    ul2.disabled = true; ul2.textContent = "Unlinking…";
    try{ await rpc("unlink_other_devices", { p_code: code, p_device: deviceId }); }
    catch(err){ ul2.disabled = false; ul2.textContent = "Unlink the others"; console.warn(err && err.message); return; }
    await refresh(); render();
  };
  const rn = document.getElementById("renamego");
  if(rn) rn.onclick = async () => {
    const v = document.getElementById("renameinput").value.trim();
    if(!v) return;
    sheet = null; myName = v; store.set("name", v);
    try{ await rpc("rename_me", {p_code:code, p_device:deviceId, p_person:v}); }finally{ refresh(); }
  };
  const tl = document.getElementById("tolanding");
  if(tl) tl.onclick = () => { sheet=null; S=null; myMemberId=null; location.hash=""; };
  document.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => { sheet=null; S=null; myMemberId=null; location.hash = "#/g/"+b.dataset.open; };
  });
}

/* A result that simply appears reads as "the computer picked". A reel that
   runs down and lands reads as a roll, which is the whole point of the button.
   It only ever changes text in a span, so nothing else on the page re-renders,
   and it is skipped outright for anyone who has asked for less motion. */
function spinReel(d, pool){
  const el = document.getElementById("reel");
  if(!el || !sheet || sheet.kind !== "shuffle" || sheet.spun) return;
  sheet.spun = true;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const names = (pool||[]).map(s => (d.gamesById[s.appid]||{}).name).filter(Boolean);
  if(names.length < 3) return;
  const landed = el.textContent;
  const die = document.getElementById("die");
  el.classList.add("spinning");
  if(die) die.classList.add("rolling");
  let wait = 55, elapsed = 0;
  const step = () => {
    if(!document.getElementById("reel")) return;      // sheet closed mid-roll
    el.textContent = names[Math.floor(Math.random()*names.length)];
    elapsed += wait;
    wait *= 1.28;                                      // ease out into the answer
    if(elapsed < 900) setTimeout(step, wait);
    else {
      el.textContent = landed;
      el.classList.remove("spinning");
      if(die) die.classList.remove("rolling");
    }
  };
  setTimeout(step, wait);
}

/* Feeds the pointer position into whichever card is under it, so the border
   glow can follow the cursor. One delegated listener on the app root rather
   than fifteen, throttled to a frame, and never attached on a touch device. */
(() => {
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  let queued = null, raf = 0;
  app.addEventListener("pointermove", e => {
    const card = e.target.closest && e.target.closest(".card");
    if(!card) return;
    queued = [card, e.clientX, e.clientY];
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const [c, x, y] = queued;
      const r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (((x - r.left) / r.width) * 100).toFixed(1) + "%");
      c.style.setProperty("--my", (((y - r.top) / r.height) * 100).toFixed(1) + "%");
    });
  }, { passive: true });
})();

/* ---------- keyboard ---------- */
// one listener instead of setting focusReturn in twenty separate handlers
document.addEventListener("mousedown", e => {
  const b = e.target.closest && e.target.closest("button");
  if(b) focusReturn = b;
}, true);
document.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.tagName === "BUTTON")
    focusReturn = document.activeElement;
}, true);

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && sheet){ closeSheet(); return; }
  if(e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    const q = document.getElementById("q");
    if(q){ e.preventDefault(); q.focus(); }
  }
});

/* ---------- theme ---------- */
// Light or dark, nothing else. Defaults to whatever the device is set to the
// first time, then remembers the choice.
let theme = store.get("theme", null) ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const isDark = () => theme === "dark";
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.style.colorScheme = theme;   // native scrollbars match the app, not the OS
  store.set("theme", theme);
}
applyTheme();

/* ---------- night sky ----------
   A starfield behind everything, with shooting stars. Quiet but present: a
   field of faint points with a slow twinkle, and a streak every
   couple of seconds. It is one canvas painted at 30fps, it stops when the tab is hidden,
   and under reduced motion it paints the stars once and never moves them. The
   colours come from the theme tokens: pale points on the night, and the same
   field inverted to ink-lavender specks on paper in light. */
(() => {
  const c = document.createElement("canvas");
  c.id = "sky"; c.setAttribute("aria-hidden", "true");
  document.body.prepend(c);
  const ctx = c.getContext("2d");
  if(!ctx) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  let W = 0, H = 0, stars = [], shots = [], nextShot = 0, raf = 0, last = 0, tick = 0;
  let starCol = "rgba(220,214,255,.9)", headCol = "#B8B4FF", tailCol = "#93C5FD", darkNow = true;

  // the theme can flip at any moment, so re-read the tokens now and then
  function palette(){
    const cs = getComputedStyle(document.documentElement);
    starCol = cs.getPropertyValue("--star").trim() || starCol;
    headCol = cs.getPropertyValue("--grad-a").trim() || headCol;
    tailCol = cs.getPropertyValue("--grad-b").trim() || tailCol;
    darkNow = document.documentElement.getAttribute("data-theme") !== "light";
  }
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Area alone starves a phone (a fifth of a desktop's pixels on a screen
    // you hold at arm's length), so there is a floor and the curve is flatter
    // than linear: ~70 on a phone, ~140 on a big monitor.
    const n = Math.min(300, Math.max(70, Math.round(Math.pow(W * H, 0.62) * 0.042)));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.5 + Math.random() * 1.0,            // radius in css px
      o: 0.3 + Math.random() * 0.55,           // base opacity
      t: Math.random() * Math.PI * 2,          // twinkle phase
      s: 0.25 + Math.random() * 0.45,          // twinkle speed
    }));
    palette();
    if(reduce.matches) paint(0, 0);            // one still frame, then nothing
  }
  function spawn(now){
    // start just off a side, heading down at a shallow angle, like the real
    // thing rather than a laser
    const fromLeft = Math.random() < 0.5;
    const ang = 0.45 + Math.random() * 0.35;          // radians from straight down
    const speed = 460 + Math.random() * 180;
    shots.push({
      x: fromLeft ? -20 : W + 20, y: Math.random() * H * 0.55,
      vx: (fromLeft ? 1 : -1) * Math.sin(ang) * speed, vy: Math.cos(ang) * speed * 0.55,
      len: 130 + Math.random() * 120, born: now, life: 1.7,
    });
    nextShot = now + 2000 + Math.random() * 3000;
  }
  function paint(now, dt){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = starCol;
    for(const st of stars){
      if(!reduce.matches) st.t += dt * st.s;
      ctx.globalAlpha = st.o * (0.6 + 0.4 * Math.sin(st.t));
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for(const sh of shots){
      const age = (now - sh.born) / 1000;
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      const fade = age < 0.25 ? age / 0.25 : Math.max(0, 1 - (age - 0.25) / (sh.life - 0.25));
      const sp = Math.hypot(sh.vx, sh.vy);
      const tx = sh.x - (sh.vx / sp) * sh.len, ty = sh.y - (sh.vy / sp) * sh.len;
      const g = ctx.createLinearGradient(tx, ty, sh.x, sh.y);
      g.addColorStop(0, "transparent"); g.addColorStop(0.7, tailCol); g.addColorStop(1, headCol);
      ctx.globalAlpha = (darkNow ? 0.85 : 0.7) * fade;
      ctx.strokeStyle = g; ctx.lineWidth = 1.8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(sh.x, sh.y); ctx.stroke();
      // a small bright head
      ctx.fillStyle = headCol;
      ctx.beginPath(); ctx.arc(sh.x, sh.y, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      sh.dead = age > sh.life || sh.x < -260 || sh.x > W + 260 || sh.y > H + 260;
    }
    if(shots.some(sh => sh.dead)) shots = shots.filter(sh => !sh.dead);
  }
  function frame(now){
    raf = requestAnimationFrame(frame);
    if(now - last < 33) return;                // 30fps is plenty for this
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if(++tick % 60 === 0) palette();
    if(shots.length < 2 && now > nextShot) spawn(now);
    paint(now, dt);
  }
  function start(){ if(reduce.matches || raf) return; last = performance.now(); nextShot = last + 900; raf = requestAnimationFrame(frame); }
  function stop(){ cancelAnimationFrame(raf); raf = 0; }
  addEventListener("resize", resize, { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  reduce.addEventListener("change", () => { reduce.matches ? (stop(), resize()) : start(); });
  resize();
  start();
})();

/* ============================================================================
   BOOT + POLLING
   Ten seconds while the tab is visible, immediate on focus. No realtime
   replication to enable, which is one less setup step to get wrong.
   ========================================================================== */
window.addEventListener("hashchange", () => { S=null; myMemberId=null; expanded.clear(); clearAll(); render(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("focus", () => refresh());
/* The toolbar stays put. It used to slide away on scroll-down, which read as
   the page jumping around; a shadow when it is pinned is enough. */
(() => {
  let ticking = false;
  const apply = () => {
    ticking = false;
    // header: glass as soon as anything has scrolled under it
    const top = document.querySelector(".top");
    if(top) top.classList.toggle("is-stuck", window.scrollY > 0);
    // toolbar: glass only once it has genuinely pinned under the header, so it
    // never shows a backing box while it is still sitting in the page flow
    const bar = document.querySelector(".shelfbar");
    if(bar){
      const pin = parseFloat(getComputedStyle(bar).top) || 54;
      bar.classList.toggle("is-stuck", window.scrollY > 0 && bar.getBoundingClientRect().top <= pin + 1);
    }
  };
  window.addEventListener("scroll", () => {
    if(!ticking){ ticking = true; requestAnimationFrame(apply); }
  }, {passive:true});
})();

setInterval(() => { if(!document.hidden && code) refresh(); }, 10000);
setInterval(() => { if(!document.hidden && code) rpc("touch_group",{p_code:code,p_device:deviceId}).catch(()=>{}); }, 60000);

render();
</script>
