    title="Switch to ${dark?"light":"dark"} mode"><span style="font-size:15px">${dark?"☀":"☾"}</span></button>`;
}

/* ============================================================================
   WIRING
   ========================================================================== */
/* A dialog you cannot reach with a keyboard is a dialog half the people using
   it cannot close. Move focus in, keep Tab inside it, put focus back where it
   came from on the way out. */
let focusReturn = null;
function closeSheet(){
  sheet = null; pending = null; fDraft = null;
  render();
  if(focusReturn && document.contains(focusReturn)) focusReturn.focus();
  focusReturn = null;
}
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function trapFocus(scrim){
  const box = scrim.querySelector(".sheet");
  if(!box) return;
  // name the dialog after its own heading, so a screen reader announces what opened
  const h = box.querySelector("h3");
  if(h && !box.getAttribute("aria-labelledby")){
    h.id = h.id || "sheet-title";
    box.setAttribute("aria-labelledby", h.id);
  }
  const items = () => [...box.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
  const first = items()[0];
  // a text field wants the caret; anything else just wants the ring
  if(first && !box.contains(document.activeElement)) first.focus();
  box.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    const list = items();
    if(!list.length) return;
    const a = list[0], z = list[list.length-1];
    if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
  });
}

function wireCommon(d){
  const tb = document.getElementById("themebtn");
  if(tb) tb.onclick = () => { theme = isDark() ? "light" : "dark"; applyTheme(); render(); };

  const sc = document.querySelector("[data-scrim]");
  if(sc){
    sc.onclick = e => { if(e.target===sc){ closeSheet(); } };
    const dis = document.querySelector("[data-dismiss]");
    if(dis) dis.onclick = () => { closeSheet(); };
    trapFocus(sc);
  }

  // --- name entry, step one
  const ni = document.getElementById("nameinput");
  if(ni){
    ni.focus();
    const go = async () => {
      const v = ni.value.trim(); if(!v) return;
      const then = sheet.then, groupName = sheet.groupName;
      const btn = document.getElementById("namego");
      btn.disabled = true;

      if(then === "create"){
        myName = v; store.set("name", v);
        btn.textContent = "Setting up…";
        try{ await createGroup(groupName, v); }
        catch(e){ btn.disabled=false; btn.textContent="That's me"; alert(e.message); }
        return;
      }

      // step two: does this name look like someone already here?
      const candidates = nameMatches(v, (S && S.members) || []);
      if(candidates.length){
        sheet = { kind:"name", step:"match", typed:v, candidates };
        render();
        return;
      }
      try{ await finishAsNew(v); }
      catch(e){ btn.disabled=false; btn.textContent="That's me"; alert(e.message); }
    };
    document.getElementById("namego").onclick = go;
    ni.onkeydown = e => { if(e.key==="Enter") go(); };
  }

  // --- name entry, step two
  document.querySelectorAll("[data-claim]").forEach(b => {
    b.onclick = async () => {
      const m = (S.members||[]).find(x => String(x.member_id) === b.dataset.claim);
      if(!m) return;
      b.disabled = true;
      try{ await finishAsClaim(m); }catch(e){ b.disabled=false; alert(e.message); }
    };
  });
  const notme = document.getElementById("notme");
  if(notme) notme.onclick = async () => {
    notme.disabled = true;
    try{ await finishAsNew(sheet.typed); }catch(e){ notme.disabled=false; alert(e.message); }
  };
}

function wireGroup(d, filtered){
  wireCommon(d);

  // toolbar
  const q = document.getElementById("q");
  if(q){
    q.oninput = e => {
      F.q = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const nq = document.getElementById("q");
      if(nq){ nq.focus(); nq.setSelectionRange(pos, pos); }
    };
  }
  const qc = document.getElementById("qclear");
  if(qc) qc.onclick = () => { F.q=""; render(); };
  document.getElementById("fbtn").onclick = () => {
    // stage a copy so nothing commits until Apply, and closing changes nothing
    fDraft = cloneF(F);
    sheet = { kind:"filters" };
    render();
  };
  const sb2 = document.getElementById("sortbtn");
  if(sb2) sb2.onclick = () => { sheet = {kind:"arrange"}; render(); };
  const fap = document.getElementById("fapply");
  if(fap) fap.onclick = () => {
    if(fDraft) F = fDraft;
    fDraft = null; saveF(); closeSheet();
  };
  const fca = document.getElementById("fclearall");
  if(fca) fca.onclick = () => { clearAll(FT()); render(); };
  const fcl = document.getElementById("fclear");
  if(fcl) fcl.onclick = () => { clearAll(FT()); render(); };

  document.querySelectorAll("[data-bench]").forEach(b => b.onclick = () => {
    sheet.bench = b.dataset.bench === "1"; render();
  });
  document.querySelectorAll("[data-played]").forEach(b => b.onclick = () => {
    const t = FT(); t.played = b.dataset.played || null; render();
  });
  document.querySelectorAll("[data-verdict]").forEach(b => b.onclick = () => {
    sheet.verdict = sheet.verdict === b.dataset.verdict ? null : b.dataset.verdict;
    // "never again" almost always means bench it, so pre-select that rather
    // than making people say the same thing twice
    if(sheet.verdict === "never_again") sheet.bench = true;
    if(sheet.verdict === "banger") sheet.bench = false;
    render();
  });
  const ro = document.getElementById("reopenbtn");
  if(ro) ro.onclick = () => { const open = () => reopenRound(); if(!needName(open)) open(); };
  document.querySelectorAll("[data-view]").forEach(b => {
    b.onclick = () => { view = b.dataset.view; store.set("view", view); render(); };
  });

  // filter panel
  document.querySelectorAll("[data-f]").forEach(b => {
    b.onclick = () => {
      const key = b.dataset.f, raw = b.dataset.v;
      const val = isNaN(+raw) ? raw : +raw;
      const t = FT();
      t[key].has(val) ? t[key].delete(val) : t[key].add(val);
      render();
    };
  });
  document.querySelectorAll("[data-toggle]").forEach(b => {
    b.onclick = () => { const t = FT(); t[b.dataset.toggle] = !t[b.dataset.toggle]; render(); };
  });
  document.querySelectorAll("[data-crew]").forEach(b => {
    b.onclick = () => {
      const op = b.dataset.crew, t = FT();
      if(op === "off") t.crew = null;
      else if(op === "+") t.crew = Math.min(64, (t.crew || Math.max(2, d.lookedCount)) + (t.crew ? 1 : 0));
      else t.crew = Math.max(1, (t.crew || Math.max(2, d.lookedCount)) - (t.crew ? 1 : 0));
      render();
    };
  });
  document.querySelectorAll("[data-unfilter]").forEach(b => {
    b.onclick = () => {
      const v = b.dataset.uv;
      clearFilter(b.dataset.unfilter, v === "" ? undefined : (isNaN(+v) ? v : +v));
      saveF(); render();
    };
  });
  ["clearall","clearall2"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.onclick = () => { clearAll(); saveF(); render(); };
  });
  document.querySelectorAll("[data-arrange]").forEach(b => b.onclick = () => {
    arrange = b.dataset.arrange; store.set("arrange", arrange);
    sheet = null; render();
  });

  // adding is a rare action, so it stays at the bottom, but you should never
  // have to scroll the whole shelf to find it
  const aj = document.getElementById("addjump");
  if(aj) aj.onclick = () => {
    const sec = document.getElementById("addsec");
    const box = document.getElementById("addq");
    if(sec) sec.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    if(box) setTimeout(() => box.focus({ preventScroll: true }), 380);
  };

  // shuffle
  const sh = document.getElementById("shufflebtn");
  if(sh) sh.onclick = () => {
    if(!filtered.length){ return; }
    const pick = filtered[Math.floor(Math.random()*filtered.length)];
    sheet = {kind:"shuffle", appid:pick.appid, pool:filtered.length};
    render();
  };
  const reroll = document.getElementById("reroll");
  if(reroll) reroll.onclick = () => {
    const pool = filtered.filter(s => s.appid !== sheet.appid);
    const src = pool.length ? pool : filtered;
    sheet = {kind:"shuffle", appid: src[Math.floor(Math.random()*src.length)].appid, pool:filtered.length};
    render();
  };
  const sp = document.getElementById("shufflepick");
  if(sp) sp.onclick = () => { const a = sheet.appid; sheet = null; togglePick(a); };

  // shelf
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => togglePick(+b.dataset.pick));
  document.querySelectorAll("[data-unbench]").forEach(b => b.onclick = () => unbench(+b.dataset.unbench));
  document.querySelectorAll("[data-more]").forEach(b => b.onclick = () => {
    const id = +b.dataset.more;
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    render();
  });
  document.querySelectorAll("[data-take]").forEach(b => {
    const open = () => { sheet = {kind:"take", appid:+b.dataset.take}; render(); };
    b.onclick = () => { if(!needName(open)) open(); };
  });
  document.querySelectorAll("[data-facets]").forEach(b => {
    const open = () => { sheet = {kind:"facets", appid:+b.dataset.facets, e:null, s:null}; render(); };
    b.onclick = () => { if(!needName(open)) open(); };
  });

  // add
  const addq = document.getElementById("addq");
  if(addq){
    addq.oninput = e => onAddInput(e.target.value);
    addq.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); submitAdd(); } };
  }
  const addgo = document.getElementById("addgo");
  if(addgo) addgo.onclick = submitAdd;
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => addGame(+b.dataset.add));

  // rail + bar
  const cs = document.getElementById("copysum");   if(cs) cs.onclick = () => copy(summaryText(d), cs);
  const cn = document.getElementById("copynudge"); if(cn) cn.onclick = () => copy(nudgeText(d), cn);
  const sm = document.getElementById("sharemob");  if(sm) sm.onclick = () => { sheet={kind:"share"}; render(); };
  const cb = document.getElementById("closebtn");  if(cb) cb.onclick = () => { const open=()=>{sheet={kind:"close"};render();}; if(!needName(open)) open(); };
  const bkb = document.getElementById("breakbtn");
  if(bkb) bkb.onclick = () => setBreak(true);
  const rsb = document.getElementById("resumebtn");
  if(rsb) rsb.onclick = () => { sheet = {kind:"resume", crew:d.lookedCount}; render(); };
  document.querySelectorAll("[data-rcrew]").forEach(b => b.onclick = () => {
    sheet.crew = Math.max(1, Math.min(64, (sheet.crew ?? d.lookedCount) + (b.dataset.rcrew === "+" ? 1 : -1)));
    render();
  });
  const rgo = document.getElementById("resumego");
  if(rgo) rgo.onclick = () => { F.crew = sheet.crew ?? d.lookedCount; setBreak(false); };
  const rsk = document.getElementById("resumeskip");
  if(rsk) rsk.onclick = () => setBreak(false);
  const sw = document.getElementById("switchbtn"); if(sw) sw.onclick = () => { sheet={kind:"switch"}; render(); };
  const mb = document.getElementById("mebtn");     if(mb) mb.onclick = () => { sheet={kind:"me"}; render(); };

  // sheet internals
  const ti = document.getElementById("takeinput");
  if(ti){
    ti.focus();
    document.getElementById("takego").onclick   = () => { const a=sheet.appid,v=ti.value; sheet=null; saveTake(a,v); };
    document.getElementById("takeclear").onclick = () => { const a=sheet.appid; sheet=null; saveTake(a,""); };
  }
  document.querySelectorAll("[data-fe]").forEach(b => b.onclick = () => {
    sheet.e = +b.dataset.fe;
    document.querySelectorAll("[data-fe]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.fe === sheet.e)));
  });
  document.querySelectorAll("[data-fs]").forEach(b => b.onclick = () => {
    sheet.s = b.dataset.fs;
    document.querySelectorAll("[data-fs]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.fs === sheet.s)));
  });
  document.querySelectorAll("[data-past]").forEach(b => b.onclick = () => {
    logPastPlay(sheet.appid, b.dataset.past);
  });
  document.querySelectorAll("[data-forget]").forEach(b => b.onclick = () => {
    forgetPlay(sheet.appid, +b.dataset.forget);
  });
  document.querySelectorAll("[data-fv]").forEach(b => b.onclick = () => {
    sheet.v = b.dataset.fv;
    document.querySelectorAll("[data-fv]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.fv === sheet.v)));
  });
  const fg = document.getElementById("facetgo");
  if(fg) fg.onclick = () => {
    const raw = document.getElementById("fcrew").value.trim();
    const rawMod = document.getElementById("fmod").value.trim();
    const a = sheet.appid, e = sheet.e, s = sheet.s, v = sheet.v;
    sheet = null;
    saveFacets(a, e, raw ? Number(raw) : null, s, rawMod ? Number(rawMod) : null, v);
  };
  const rg = document.getElementById("retirego");
  if(rg) rg.onclick = async () => {
    const a = sheet.appid; sheet = null; render();
    // not a delete: it drops off the ballot, out of everyone's picks, and needs
    // benched, not deleted: takes and play history all survive
    try{ await rpc("bench_game", {p_code:code, p_device:deviceId, p_appid:a}); }finally{ refresh(); }
  };
  const cg = document.getElementById("closego");    if(cg) cg.onclick = () => closeRound(d.ranked[0].appid);
  const nr = document.getElementById("newroundgo"); if(nr) nr.onclick = () => startRound(sheet.verdict, sheet.bench, false);
  const nb = document.getElementById("newroundbreak"); if(nb) nb.onclick = () => startRound(sheet.verdict, sheet.bench, true);
  document.querySelectorAll("[data-sharemode]").forEach(b => b.onclick = () => {
    sheet.mode = b.dataset.sharemode; render();
  });
  const cshare = document.getElementById("copyshare");
  if(cshare) cshare.onclick = () => copy(sheet.mode === "nudge" ? nudgeText(d) : summaryText(d), cshare);
  const rn = document.getElementById("renamego");
  if(rn) rn.onclick = async () => {
    const v = document.getElementById("renameinput").value.trim();
    if(!v) return;
    sheet = null; myName = v; store.set("name", v);
    try{ await rpc("rename_me", {p_code:code, p_device:deviceId, p_person:v}); }finally{ refresh(); }
  };
  const tl = document.getElementById("tolanding");
  if(tl) tl.onclick = () => { sheet=null; S=null; myMemberId=null; location.hash=""; };
  document.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => { sheet=null; S=null; myMemberId=null; location.hash = "#/g/"+b.dataset.open; };
  });
}

/* ---------- keyboard ---------- */
// one listener instead of setting focusReturn in twenty separate handlers
document.addEventListener("mousedown", e => {
  const b = e.target.closest && e.target.closest("button");
  if(b) focusReturn = b;
}, true);
document.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.tagName === "BUTTON")
    focusReturn = document.activeElement;
}, true);

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && sheet){ closeSheet(); return; }
  if(e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    const q = document.getElementById("q");
    if(q){ e.preventDefault(); q.focus(); }
  }
});

/* ---------- theme ---------- */
// Light or dark, nothing else. Defaults to whatever the device is set to the
// first time, then remembers the choice.
let theme = store.get("theme", null) ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const isDark = () => theme === "dark";
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  store.set("theme", theme);
}
applyTheme();

/* ============================================================================
   BOOT + POLLING
   Ten seconds while the tab is visible, immediate on focus. No realtime
   replication to enable, which is one less setup step to get wrong.
   ========================================================================== */
window.addEventListener("hashchange", () => { S=null; myMemberId=null; expanded.clear(); clearAll(); render(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("focus", () => refresh());
/* The toolbar stays put. It used to slide away on scroll-down, which read as
   the page jumping around; a shadow when it is pinned is enough. */
(() => {
  let ticking = false;
  const apply = () => {
    ticking = false;
    const bar = document.querySelector(".shelfbar");
    if(bar) bar.classList.toggle("is-stuck", window.scrollY > 90);
  };
  window.addEventListener("scroll", () => {
    if(!ticking){ ticking = true; requestAnimationFrame(apply); }
  }, {passive:true});
})();

setInterval(() => { if(!document.hidden && code) refresh(); }, 10000);
setInterval(() => { if(!document.hidden && code) rpc("touch_group",{p_code:code,p_device:deviceId}).catch(()=>{}); }, 60000);

render();
</script>
</body>
</html>
