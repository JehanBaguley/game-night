// parse once: [{icon,label,items:[{e,k}]}]
const EMOJI = EMOJI_SETS.map(([icon, label, raw]) => ({
  icon, label,
  items: raw.split("|").map(s => { const i = s.indexOf(" "); return { e: s.slice(0,i), k: (s.slice(i+1)+" "+label).toLowerCase() }; }),
}));
const DEFAULT_EMOJI = "🎮";
const EMOJI_RX = /\p{Extended_Pictographic}|\p{Regional_Indicator}/u;

/* ---------- emoji picker ----------
   Rendered once as HTML, then searched and scrolled purely in the DOM.
   Re-rendering the app on every keystroke is what used to wipe the Steam
   search box, so nothing here calls render() until an emoji is chosen. */
/** Shelf sections folded shut in this crew, by label. Per browser, like the filters. */
function folded(){ return code ? store.get("fold." + code, []) : []; }
function toggleFold(label){
  const f = folded(), i = f.indexOf(label);
  i < 0 ? f.push(label) : f.splice(i, 1);
  store.set("fold." + code, f);
}
function recentEmoji(){ return store.get("recentEmoji", []).slice(0, 16); }
function rememberEmoji(e){ store.set("recentEmoji", [e, ...recentEmoji().filter(x => x !== e)].slice(0, 16)); }

function emojiPicker(current){
  const recent = recentEmoji();
  const cell = (e, k) => `<button type="button" class="ep-cell" data-emoji="${esc(e)}" data-k="${esc(k)}"
      aria-label="${esc(k.split(" ")[0])}" aria-pressed="${e === current}">${e}</button>`;
  const sections = [
    ...(recent.length ? [{ icon:"🕘", label:"Recent", id:"recent", items: recent.map(e => ({ e, k:"" })) }] : []),
    ...EMOJI.map((c, i) => ({ ...c, id:"c"+i })),
  ];
  return `<div class="ep" id="ep">
    <div class="searchwrap ep-search">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="input" id="epq" placeholder="Search, or paste any emoji" autocomplete="off" aria-label="Search emoji">
    </div>
    <div class="ep-tabs" role="tablist">${sections.map((s, i) =>
      `<button type="button" class="ep-tab" role="tab" data-jump="${s.id}" aria-selected="${i===0}" title="${esc(s.label)}">${s.icon}</button>`).join("")}</div>
    <div class="ep-grid" id="epgrid">
      <div class="ep-custom" id="epcustom" hidden></div>
      ${sections.map(s => `<section class="ep-sec" data-sec="${s.id}"${s.id==="recent" ? ' data-recent' : ''}>
        <h4>${esc(s.label)}</h4>
        <div class="ep-cells">${s.items.map(it => cell(it.e, it.k)).join("")}</div>
      </section>`).join("")}
      <p class="ep-empty" id="epempty" hidden>Nothing for that. Paste any emoji in the box above, or open your keyboard's emoji picker (Ctrl+Cmd+Space on a Mac).</p>
    </div>
  </div>`;
}

function wireEmojiPicker(onPick){
  const root = document.getElementById("ep"); if(!root) return;
  const q = document.getElementById("epq"), grid = document.getElementById("epgrid");
  const custom = document.getElementById("epcustom"), empty = document.getElementById("epempty");
  const tabs = [...root.querySelectorAll(".ep-tab")];

  const pick = e => { rememberEmoji(e); onPick(e); };
  grid.addEventListener("click", ev => {
    const b = ev.target.closest("[data-emoji]"); if(!b) return;
    root.querySelectorAll('.ep-cell[aria-pressed="true"]').forEach(x => x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    pick(b.dataset.emoji);
  });

  // tabs jump to their section; scrolling marks the section you are in
  const select = id => tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.jump === id)));
  let jumping = 0;
  tabs.forEach(t => t.onclick = () => {
    const sec = grid.querySelector(`[data-sec="${t.dataset.jump}"]`);
    if(!sec) return;
    // the tapped tab lights straight away and holds while the smooth scroll passes other sections
    select(t.dataset.jump); clearTimeout(jumping);
    jumping = setTimeout(() => { jumping = 0; }, 700);
    grid.scrollTo({ top: sec.offsetTop, behavior: "smooth" });
  });
  const mark = () => {
    if(jumping) return;
    const secs = [...grid.querySelectorAll(".ep-sec")].filter(s => !s.hidden);
    // scrolled to the bottom: the last section is the one on screen, even though it can't reach the top
    if(grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 2 && secs.length) return select(secs[secs.length - 1].dataset.sec);
    let cur = tabs[0] && tabs[0].dataset.jump;
    secs.forEach(s => { if(s.offsetTop <= grid.scrollTop + 8) cur = s.dataset.sec; });
    select(cur);
  };
  grid.addEventListener("scroll", mark, { passive:true });

  // search: every word must start a keyword, so "blue h" finds the blue heart
  const filter = () => {
    const v = q.value.trim(), words = v.toLowerCase().split(/\s+/).filter(Boolean);
    const searching = words.length > 0;
    root.classList.toggle("ep--search", searching);
    let shown = 0; const seen = new Set();
    grid.querySelectorAll(".ep-cell").forEach(c => {
      const keys = c.dataset.k.split(" ");
      let ok = !searching || (c.dataset.k && words.every(w => keys.some(k => k.startsWith(w))));
      if(searching && ok){ if(seen.has(c.dataset.emoji)) ok = false; else seen.add(c.dataset.emoji); }
      c.hidden = !ok; if(ok) shown++;
    });
    grid.querySelectorAll(".ep-sec").forEach(s => {
      s.hidden = searching && (s.hasAttribute("data-recent") || !s.querySelector(".ep-cell:not([hidden])"));
    });
    // a pasted emoji outside the set is offered as-is
    const pasted = EMOJI_RX.test(v) && v.length <= 16 ? v : "";
    custom.hidden = !pasted;
    custom.innerHTML = pasted ? `<button type="button" class="ep-use" data-emoji="${esc(pasted)}"><span>${esc(pasted)}</span>Use this one</button>` : "";
    empty.hidden = !searching || shown > 0 || !!pasted;
  };
  q.addEventListener("input", filter);
  q.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    e.preventDefault();
    // first thing actually on screen: skips cells inside hidden sections
    const first = [...grid.querySelectorAll("[data-emoji]")].find(b => !b.closest("[hidden]"));
    if(first) first.click();
  });
}

/* the tab icon and title follow whichever crew you are looking at */
let iconShown = "";
function setTabIdentity(emoji, title){
  const e = emoji || DEFAULT_EMOJI;
  if(document.title !== title) document.title = title;
  if(e === iconShown) return;
  iconShown = e;
  let link = document.querySelector('link[rel="icon"]');
  if(!link){ link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
  link.href = "data:image/svg+xml," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${e}</text></svg>`);
}

/* a crew's tile in the lists: its emoji on a soft square */
function crewTile(g){ return `<span class="ctile" aria-hidden="true">${esc(g.emoji || DEFAULT_EMOJI)}</span>`; }

/* anything a mate might paste: a bare code, a code with spaces, or the whole link */
function parseCode(raw){
  const s = String(raw || "").trim();
  const m = s.match(/#\/g\/([A-Za-z0-9]+)/);
  return (m ? m[1] : s).replace(/[^A-Za-z0-9]/g, "").toUpperCase();
}

/* ============================================================================
   NEXT SESH
   Picking the game and picking the nights are separate decisions. Anything in
   play (the called game, or a side game) collects "I'm free" nights over the
   next ten days. A night that reaches the crew's number is pencilled in,
   anyone locks it, and once it has passed one question logs whether it
   happened. Days are local calendar dates, never UTC, so "Friday" means the
   crew's Friday.
   ========================================================================== */
const SESH_DAYS = 10;
const pad2 = n => String(n).padStart(2, "0");
/** yyyy-mm-dd in local time (toISOString would shift it to UTC) */
const isoDay = dt => dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate());
const todayIso = () => isoDay(new Date());
function seshWindow(){
  const t = new Date(); t.setHours(12, 0, 0, 0);          // midday: immune to DST edges
  return Array.from({ length: SESH_DAYS }, (_, i) => { const d = new Date(t); d.setDate(t.getDate() + i); return isoDay(d); });
}
function dayDate(iso){ const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12); }
const daysFromToday = iso => Math.round((dayDate(iso) - dayDate(todayIso())) / 864e5);
/** "Tonight", "Tomorrow", "Fri 26" */
function dayLabel(iso){
  const n = daysFromToday(iso);
  if(n === 0) return "Tonight";
  if(n === 1) return "Tomorrow";
  const d = dayDate(iso);
  return d.toLocaleDateString("en-AU", { weekday: "short" }) + " " + d.getDate();
}
/** "Friday 26 Sep" */
const dayLong = iso => dayDate(iso).toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "short" });
/** the chip's top line: "Tue", or "Today" for today */
const dayShort = iso => daysFromToday(iso) === 0 ? "Today" : dayDate(iso).toLocaleDateString("en-AU", { weekday: "short" });

const nameOf = (d, id) => (d.members.find(m => m.member_id === id) || {}).label || "Someone";
/** "Jehan", "Jehan and Kat", "Jehan, Kat and Tim" */
function listNames(names){
  if(names.length <= 1) return names.join("");
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}

/** Everything in play: the called game first, then side games. */
function inPlay(d){
  const out = [];
  if(S.group.locked_appid) out.push({ appid: S.group.locked_appid, side: false, players: d.members.map(m => m.member_id) });
  (S.side || []).forEach(sg => out.push({ appid: sg.appid, side: true, players: sg.players || [], started_at: sg.started_at }));
  return out;
}

/** The whole picture for one game's next night. */
function seshFor(d, ip){
  const appid = ip.appid, pset = new Set(ip.players), days = seshWindow(), today = todayIso();
  const free = (S.sesh_free || []).filter(f => f.appid === appid && pset.has(f.member_id));
  const byDay = {}; days.forEach(x => { byDay[x] = []; });
  free.forEach(f => { if(byDay[f.day]) byDay[f.day].push(f.member_id); });
  const none = new Set((S.sesh_none || []).filter(n => n.appid === appid && pset.has(n.member_id)).map(n => n.member_id));
  const answered = new Set([...free.filter(f => f.day >= today).map(f => f.member_id), ...none]);
  const total = ip.players.length;
  // the called game uses the crew's number; a side game needs everyone who's in on it
  const need = ip.side ? total : Math.max(1, Math.min(total, S.group.sesh_need || total));
  const lock = (S.sesh_lock || []).find(l => l.appid === appid) || null;
  const pencil = total ? days.find(x => byDay[x].length >= need) || null : null;
  const best = days.reduce((b, x) => byDay[x].length > (b ? byDay[b].length : 0) ? x : b, null);
  return {
    appid, side: ip.side, players: ip.players, total, need, days, byDay, none, answered, lock, pencil, best,
    mineDays: new Set(free.filter(f => f.member_id === myMemberId).map(f => f.day)),
    mineNone: none.has(myMemberId),
    past: !!(lock && lock.day < today),
    sessions: (S.sessions || []).filter(s => s.appid === appid),
    iAmIn: pset.has(myMemberId),
  };
}

/** One sentence for where a game's next night is at. */
function seshSummary(x){
  const t = S.group.sesh_time || "8pm";
  if(x.lock) return `<b>${esc(dayLong(x.lock.day))}, ${esc(t)}</b> · locked in`;
  if(x.pencil) return `<b>${esc(dayLabel(x.pencil))}</b> pencilled in · ${x.byDay[x.pencil].length} of ${x.total} free · tap to lock it`;
  if(!x.answered.size) return x.sessions.length ? "When's the next sesh? Tap your nights" : "When are we playing? Tap your nights";
  const b = x.best && x.byDay[x.best].length;
  const gap = b ? x.need - b : 0;
  return `${x.answered.size} of ${x.total} answered · ${b ? `<b>${esc(dayLabel(x.best))}</b> ${gap > 0 ? `is ${gap} short` : "works"}` : "no night works yet"}`;
}

/** The line under a game in play: tappable, or the did-you-play question once the night has passed. */
function seshLine(x){
  if(x.lock && x.past){
    return `<div class="sesh sesh--ask">
      <span class="sesh-i" aria-hidden="true">🎮</span>
      <span class="sesh-t">Did you play <b>${esc(dayLong(x.lock.day))}</b>?</span>
      <span class="sesh-acts">
        <button class="btn btn--sm" data-resolve="${x.appid}" data-played="1">We did</button>
        <button class="btn btn--ghost btn--sm" data-resolve="${x.appid}" data-played="0">Didn't happen</button>
      </span></div>`;
  }
  const cls = x.lock ? " sesh--locked" : x.pencil ? " sesh--pencil" : "";
  const you = x.iAmIn && !x.lock && !x.answered.has(myMemberId) ? `<span class="sesh-you">your nights?</span>` : "";
  return `<button class="sesh${cls}" data-sesh="${x.appid}">
    <span class="sesh-i" aria-hidden="true">${x.lock ? "✅" : "📅"}</span>
    <span class="sesh-t">${seshSummary(x)}</span>${you}
    <span class="sesh-go" aria-hidden="true">›</span></button>`;
}

/** Side games, as slim strips under the status card. */
function renderSides(d){
  const sides = inPlay(d).filter(ip => ip.side);
  if(!sides.length) return "";
  return `<div class="sides">${sides.map(ip => {
    const x = seshFor(d, ip), game = d.gamesById[ip.appid] || {};
    const who = ip.players.map(id => nameOf(d, id));
    return `<section class="side" aria-label="Side game: ${esc(game.name || "")}">
      <div class="side-top">
        <div class="side-id">
          <span class="st-k">On the side</span>
          <b class="side-name">${esc(game.name || "")}</b>
          <span class="side-who">${who.length ? esc(listNames(who)) : "nobody in yet"}</span>
        </div>
        <div class="side-acts">
        <button class="btn btn--sm${x.iAmIn ? " btn--ghost" : ""}" data-sidejoin="${ip.appid}" data-on="${x.iAmIn ? 0 : 1}">${x.iAmIn ? "I'm out" : "I'm in"}</button>
        <button class="iconbtn iconbtn--sm" data-sidemenu="${ip.appid}" aria-label="Wrap up ${esc(game.name || "")}"><svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
        </div>
      </div>
      ${x.iAmIn || x.lock ? seshLine(x) : ""}
    </section>`;
  }).join("")}</div>`;
}

/* ============================================================================
   RAIL EXTRAS: who owns it, on sale, our record, and the tie-breaker wheel
   ========================================================================== */

/** Who owns each shelf game, and what it costs on Steam right now. */
function ownersOf(d, appid){ return d.ownsBy[appid] || new Set(); }
function iOwn(d, appid){ return ownersOf(d, appid).has(myMemberId); }
/** "everyone" / "2 to buy" for a game, or "" when nobody has said anything about it yet. */
function ownLine(d, appid){
  const o = ownersOf(d, appid), total = d.members.length;
  if(!o.size || total < 2) return null;
  if(o.size >= total) return { all: true, text: "everyone owns it" };
  const need = d.members.filter(m => !o.has(m.member_id)).map(m => m.label);
  return { all: false, text: `${need.length} to buy`, who: listNames(need) };
}
function saleOf(d, appid){
  const p = d.prices[appid];
  return p && !p.is_free && p.discount > 0 ? p : null;
}

/** Ready to play: every game the whole crew owns, best supported first. */
function ownsPanel(d){
  if(!(S.shelf||[]).length) return "";
  const total = d.members.length;
  const open = (S.shelf||[]).filter(s => !s.benched);
  const mine = open.filter(s => iOwn(d, s.appid)).length;
  const ready = total > 1 ? open.filter(s => ownersOf(d, s.appid).size >= total)
    .sort((a, b) => (d.counts[b.appid]||0) - (d.counts[a.appid]||0)) : [];
  return `<section class="panel ownpanel"><h3>Ready to play</h3>
    ${ready.length
      ? `<ul class="plist">${ready.slice(0, 5).map(s => `<li><button class="plink" data-facets="${s.appid}">${esc((d.gamesById[s.appid]||{}).name || "")}</button>
          <span class="pmeta">${d.counts[s.appid] ? d.counts[s.appid] + (d.counts[s.appid] === 1 ? " vote" : " votes") : "everyone owns it"}</span></li>`).join("")}</ul>
        ${ready.length > 5 ? `<p class="pnote">and ${ready.length - 5} more everyone owns</p>` : ""}`
      : `<p class="pnote">${total < 2 ? "Once the crew's in, this lists what everyone already owns." : "Nothing the whole crew owns yet. Tick yours and it fills in."}</p>`}
    <button class="btn btn--ghost btn--sm" id="ownsopen">${mine ? `You own ${mine} of ${open.length} · update` : "Tick what you own"}</button>
  </section>`;
}

/** On sale: shelf games discounted on Steam right now, biggest cut first. */
function salePanel(d){
  const on = (S.shelf||[]).filter(s => !s.benched && saleOf(d, s.appid))
    .sort((a, b) => saleOf(d, b.appid).discount - saleOf(d, a.appid).discount);
  if(!on.length) return "";
  return `<section class="panel salepanel"><h3>On sale now</h3>
    <ul class="plist">${on.slice(0, 5).map(s => { const p = saleOf(d, s.appid), g = d.gamesById[s.appid] || {};
      return `<li><a class="plink" href="https://store.steampowered.com/app/${s.appid}/" target="_blank" rel="noopener">${esc(g.name || "")}</a>
        <span class="salechip">−${p.discount}%</span>
        <span class="pmeta"><b>${esc(p.final_fmt || "")}</b>${p.initial_fmt ? ` <s>${esc(p.initial_fmt)}</s>` : ""}${
          ownLine(d, s.appid) && !ownLine(d, s.appid).all ? ` · ${esc(ownLine(d, s.appid).text)}` : ""}</span></li>`; }).join("")}</ul>
    <p class="pnote">Steam prices in AUD, checked every few hours.</p>
  </section>`;
}

/** What's happened lately, pieced together from timestamps the crew already has. */
function feedOf(d){
  const nm = a => (d.gamesById[a] || {}).name || "a game";
  const who = id => { const m = d.members.find(x => x.member_id === id); return m ? m.label : "Someone"; };
  const ev = [];
  // a burst of adds by one person on one day reads as one line, not ten
  const adds = {};
  (S.shelf||[]).forEach(s => { if(!s.added_at) return; const k = (s.added_name || "Someone") + "|" + s.added_at.slice(0, 10);
    (adds[k] = adds[k] || []).push(s); });
  Object.entries(adds).forEach(([k, list]) => { const by = k.split("|")[0], last = list.map(s => s.added_at).sort().pop();
    ev.push({ at: last, text: list.length > 1 ? `${by} added ${list.length} games` : `${by} added ${nm(list[0].appid)}` }); });
  // votes the same way: "Helen, Soli and Jehan voted" per day
  const votes = {};
  (S.ballots||[]).forEach(b => { if(!(b.picks||[]).length || !b.updated_at) return; (votes[b.updated_at.slice(0, 10)] = votes[b.updated_at.slice(0, 10)] || []).push(b); });
  Object.values(votes).forEach(list => { list.sort((x, y) => x.updated_at < y.updated_at ? 1 : -1);
    ev.push({ at: list[0].updated_at, text: `${listNames(list.map(b => who(b.member_id)))} voted` }); });
  (S.plays||[]).forEach(p => {
    ev.push({ at: p.started_at, text: `Round ${p.round_no} called: ${nm(p.appid)}` });
    if(p.finished_at) ev.push({ at: p.finished_at, text: `Finished ${nm(p.appid)}${p.verdict ? ` · ${VERDICT_ICON[p.verdict]} ${VERDICT[p.verdict]}` : ""}` });
  });
  // sessions are a day, not a moment: count them as that evening
  (S.sessions||[]).forEach(se => ev.push({ at: se.day + "T20:00:00", text: `Played ${nm(se.appid)} ${dayLabel(se.day)}` }));
  const cutoff = Date.now() - 21 * 864e5;
  return ev.filter(e => e.at && new Date(e.at).getTime() > cutoff && new Date(e.at).getTime() <= Date.now() + 6e4)
    .sort((a, b) => a.at < b.at ? 1 : -1);
}
function recordPanel(d){
  const done = (S.plays||[]).filter(p => p.finished_at);
  const bangers = [...new Set(done.filter(p => p.verdict === "banger").map(p => p.appid))];
  const sessions = (S.sessions||[]).length;
  const feed = feedOf(d).slice(0, 5);
  if(!done.length && !sessions && !feed.length) return "";
  return `<section class="panel recpanel"><h3>Our record</h3>
    <div class="stats">
      <span><b class="num">${done.length}</b>finished</span>
      <span><b class="num">${sessions}</b>${sessions === 1 ? "session" : "sessions"}</span>
      <span><b class="num">${bangers.length}</b>${bangers.length === 1 ? "banger" : "bangers"}</span>
    </div>
    ${bangers.length ? `<p class="pnote"><b>${VERDICT_ICON.banger} Hall of fame:</b> ${esc(listNames(bangers.map(a => (d.gamesById[a]||{}).name || "?")))}</p>` : ""}
    ${feed.length ? `<ul class="feed">${feed.map(e => `<li><span>${esc(e.text)}</span><time>${esc(ago(e.at))}</time></li>`).join("")}</ul>` : ""}
  </section>`;
}

/** Everyone's price tag and ownership, one tap each. */
function ownsSheet(d){
  const open = (S.shelf||[]).filter(s => !s.benched)
    .sort((a, b) => ((d.gamesById[a.appid]||{}).name || "").localeCompare((d.gamesById[b.appid]||{}).name || ""));
  return `<h3>What do you own?</h3>
    <p>Tick every game you've already got. The rail works out what the whole crew can play tonight, and cards say how many still need to buy.</p>
    <div class="ownlist">${open.map(s => { const g = d.gamesById[s.appid] || {}, mine = iOwn(d, s.appid), p = d.prices[s.appid];
      return `<button class="ownrow" data-own="${s.appid}" aria-pressed="${mine}">
        ${g.header ? `<img src="${esc(g.header)}" alt="" loading="lazy">` : `<span class="ownimg"></span>`}
        <span class="nm">${esc(g.name || "")}</span>
        <span class="pr">${p ? p.is_free ? "Free" : `${saleOf(d, s.appid) ? `<span class="salechip">−${p.discount}%</span> ` : ""}${esc(p.final_fmt || "")}` : ""}</span>
        <span class="tick" aria-hidden="true">${mine ? "✓" : ""}</span></button>`; }).join("")}</div>
    <div class="row"><button class="btn" data-dismiss>Done</button></div>`;
}

/** The tie-breaker: a wheel of the tied games, spun locally. */
const WHEEL_COLS = ["--grad-a", "--e1", "--grad-b", "--e2", "--e3", "--accent-text"];
function spinSheet(d){
  const top = d.ranked.length ? d.ranked[0].n : 0;
  const ids = sheet.ids || d.ranked.filter(r => r.n === top).map(r => r.appid);
  sheet.ids = ids;
  const seg = 360 / ids.length;
  const stops = ids.map((_, i) => `var(${WHEEL_COLS[i % WHEEL_COLS.length]}) ${i * seg}deg ${(i + 1) * seg}deg`).join(",");
  const won = sheet.won != null ? d.gamesById[sheet.won] || {} : null;
  return `<h3>Spin for it</h3>
    <p>${ids.length} games on ${top} ${top === 1 ? "vote" : "votes"} each. Let the wheel pick.</p>
    <div class="wheelwrap">
      <span class="wheelptr" aria-hidden="true"></span>
      <div class="wheel" id="wheel" style="background:conic-gradient(${stops});transform:rotate(${sheet.rot || 0}deg)">
        ${ids.map((a, i) => { // each name sits on its slice's centre line, 30% in from the rim, reading outwards
          const ang = i * seg + seg / 2, rad = (ang - 90) * Math.PI / 180;
          const x = 50 + 30 * Math.cos(rad), y = 50 + 30 * Math.sin(rad);
          const turn = ang > 180 ? ang + 90 : ang - 90;          // keep text the right way up-ish
          return `<span class="wlabel" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;transform:translate(-50%,-50%) rotate(${turn.toFixed(0)}deg)">${esc(((d.gamesById[a]||{}).name || "?").slice(0, 18))}</span>`; }).join("")}
      </div>
    </div>
    <p class="spinres" id="spinres" aria-live="polite">${won ? `It's <b>${esc(won.name || "")}</b>.` : "&nbsp;"}</p>
    <div class="row">
      <button class="btn btn--ghost" id="spingo">${won ? "Spin again" : "Spin"}</button>
      ${won ? `<button class="btn" id="spinlock">Lock in ${esc(won.name || "")}</button>` : ""}
    </div>`;
}
function wireSpin(d){
  const go = document.getElementById("spingo"), wheel = document.getElementById("wheel");
  if(go && wheel) go.onclick = () => {
    const ids = sheet.ids, pick = Math.floor(Math.random() * ids.length), seg = 360 / ids.length;
    // land the chosen segment under the pointer at the top, somewhere inside it, after a few full turns
    const inside = seg * (0.2 + Math.random() * 0.6);
    const base = Math.ceil((sheet.rot || 0) / 360) * 360;
    const rot = base + 360 * 5 + (360 - (pick * seg + inside));
    go.disabled = true;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    wheel.style.transition = still ? "none" : "transform 3.2s cubic-bezier(.12,.7,.15,1)";
    wheel.style.transform = `rotate(${rot}deg)`;
    setTimeout(() => { sheet.rot = rot; sheet.won = ids[pick]; render(); }, still ? 50 : 3300);
  };
  const lk = document.getElementById("spinlock");
  if(lk) lk.onclick = () => { const a = sheet.won; sheet = { kind: "close", appid: a }; render(); };
}

/* ---------- prices: ask the edge function to refresh this shelf once per visit ---------- */
const PRICES_URL = CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/prices";
const pricesAsked = new Set();
async function refreshPrices(){
  if(!code || pricesAsked.has(code) || !(S && (S.shelf||[]).length)) return;
  pricesAsked.add(code);
  try{
    const res = await fetch(PRICES_URL, { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY, "apikey": CONFIG.SUPABASE_ANON_KEY },
      body: JSON.stringify({ code }) });
    const body = await res.json().catch(() => ({}));
    if(body.refreshed) await refresh();
  }catch(err){ console.warn("prices", err && err.message); }
}

/** Desktop rail: every game in play, ten little bars each. Hidden on a phone,
 *  where the status card already carries the same line. */
function seshPanel(d){
  const list = inPlay(d);
  if(!list.length) return "";
  return `<section class="panel seshpanel"><h3>Next sesh</h3>${list.map(ip => {
    const x = seshFor(d, ip), game = d.gamesById[ip.appid] || {};
    const bars = x.days.map(day => {
      const n = x.byDay[day].length;
      const cls = [x.lock && x.lock.day === day ? "lk" : x.total && n >= x.need ? "hit" : "", x.mineDays.has(day) ? "me" : ""].join(" ").trim();
      return `<i class="${cls}" style="--h:${Math.min(1, n / Math.max(1, x.need)).toFixed(2)}" title="${esc(dayLabel(day))}: ${n} of ${x.need}"></i>`;
    }).join("");
    return `<button class="seshmini" data-sesh="${ip.appid}">
      <span class="sm-top"><b>${esc(game.name || "")}</b>${ip.side ? `<span class="sm-tag">side</span>` : ""}</span>
      <span class="sm-days" aria-hidden="true">${bars}</span>
      <span class="sm-state">${x.lock && x.past ? `Did you play ${esc(dayLong(x.lock.day))}?` : seshSummary(x)}</span>
    </button>`;
  }).join("")}</section>`;
}

/** The day picker's body. Re-rendered on its own when you tap, so the sheet never jumps. */
function seshBody(d, x){
  const t = S.group.sesh_time || "8pm";
  const chips = x.days.map(day => {
    const n = x.byDay[day].length, mine = x.mineDays.has(day), locked = x.lock && x.lock.day === day;
    const names = x.byDay[day].map(id => nameOf(d, id));
    return `<button class="dchip${mine ? " on" : ""}${x.total && n >= x.need ? " hit" : ""}${locked ? " locked" : ""}" data-dday="${day}"
        aria-pressed="${mine}" aria-label="${esc(dayLong(day))}: ${n} free, needs ${x.need}${mine ? ", including you" : ""}"
        title="${esc(names.length ? listNames(names) : "Nobody yet")}"${x.iAmIn ? "" : " disabled"}>
      <span class="dw">${esc(dayShort(day))}</span>
      <span class="dn num">${dayDate(day).getDate()}</span>
      <span class="dbar" aria-hidden="true"><i style="width:${Math.min(100, Math.round(n / Math.max(1, x.need) * 100))}%"></i></span>
      <span class="dc num">${n ? n + " free" : "–"}</span>
    </button>`;
  }).join("");
  // names for the sheet: you first, as "You"
  const people = ids => { const l = [...ids].sort((a, b) => (b === myMemberId) - (a === myMemberId))
    .map(id => id === myMemberId ? "you" : nameOf(d, id)); const t = listNames(l); return t.charAt(0).toUpperCase() + t.slice(1); };
  // who's in on the night that matters most right now
  const focus = (x.lock && x.lock.day) || x.pencil || (x.best && x.byDay[x.best].length ? x.best : null);
  let who = "";
  if(focus){
    const inn = x.byDay[focus] || [];
    const waiting = x.players.filter(id => !inn.includes(id) && !x.none.has(id) && !x.answered.has(id));
    const out = x.players.filter(id => !inn.includes(id) && (x.none.has(id) || x.answered.has(id)));
    who = `<p class="seshwho"><b>${esc(dayLong(focus))}</b>: ${inn.length ? esc(people(inn)) : "nobody yet"}${
      out.length ? ` · can't: ${esc(people(out))}` : ""}${
      waiting.length ? ` · waiting on ${esc(people(waiting))}` : ""}</p>`;
  } else if(x.total){
    const waiting = x.players.filter(id => !x.answered.has(id));
    if(waiting.length) who = `<p class="seshwho">Waiting on ${esc(people(waiting))}</p>`;
  }
  const acts = x.lock
    ? `<div class="row"><button class="btn" id="icsgo">Add to calendar</button><button class="btn btn--ghost" id="unlockgo">Change night</button></div>`
    : x.pencil
    ? `<div class="row"><button class="btn" id="lockgo" data-lday="${x.pencil}">Lock in ${esc(dayLabel(x.pencil))}, ${esc(t)}</button></div>`
    : "";
  const none = x.iAmIn && !x.lock
    ? `<button class="linkbtn" id="nonego"${x.mineNone ? " disabled" : ""}>${x.mineNone ? "You've said none of these work" : "Can't do any of these"}</button>`
    : !x.iAmIn ? `<p class="fhint">You're not in on this one. Tap I'm in on its strip to pick nights.</p>` : "";
  return `<div class="dgrid">${chips}</div>${who}${acts}${none}`;
}

/* ---------- saving free nights: optimistic, debounced ----------
   Taps update the page straight away and save 600ms after the last one, so
   tapping four nights is one request. While a save is pending the background
   refresh stands down, so the server can't briefly undo a tap you just made. */
let freeTimer = null, seshDirty = false;
function queueFree(appid){
  seshDirty = true;
  clearTimeout(freeTimer);
  const id = freeTimer = setTimeout(async () => {
    const days = seshWindow().filter(day => (S.sesh_free || []).some(f => f.appid === appid && f.day === day && f.member_id === myMemberId));
    try{ await rpc("set_free", { p_code: code, p_device: deviceId, p_appid: appid, p_days: days }); }
    catch(err){ console.warn("set_free", err && err.message); }
    if(freeTimer === id){ freeTimer = null; seshDirty = false; refresh(); }
  }, 600);
}

/* ---------- calendar file ---------- */
/** "8pm", "7:30pm", "20:00", "8.30 pm" -> {h, m}; anything else is 8pm */
function parseTime(t){
  const m = String(t || "").trim().toLowerCase().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?$/);
  if(!m) return { h: 20, m: 0 };
  let h = +m[1]; const mm = +(m[2] || 0);
  if(m[3] === "pm" && h < 12) h += 12;
  if(m[3] === "am" && h === 12) h = 0;
  return h < 24 && mm < 60 ? { h, m: mm } : { h: 20, m: 0 };
}
const icsEsc = s => String(s).replace(/[\;,]/g, c => "\\" + c).replace(/\n/g, "\\n");
function downloadIcs(game, day){
  const t = parseTime(S.group.sesh_time);
  const start = dayDate(day); start.setHours(t.h, t.m, 0, 0);
  const end = new Date(start.getTime() + 3 * 36e5);                 // three hours, a normal night
  // floating local time: the calendar puts it at 8pm wherever the phone is
  const stamp = dt => isoDay(dt).replace(/-/g, "") + "T" + pad2(dt.getHours()) + pad2(dt.getMinutes()) + "00";
  const link = location.origin + location.pathname + "#/g/" + S.group.code;
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Game Night//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    "UID:" + S.group.code + "-" + game.appid + "-" + day + "@gamenight",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "DTSTART:" + stamp(start), "DTEND:" + stamp(end),
    "SUMMARY:" + icsEsc((S.group.emoji || DEFAULT_EMOJI) + " " + (game.name || "Game night") + " · " + S.group.name),
    "DESCRIPTION:" + icsEsc("Locked in on Game Night. " + link),
    "URL:" + link, "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = (game.name || "game-night").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + day + ".ics";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/** Copy-for-the-chat text: where every game in play is at, and who still owes nights. */
function seshShareText(d){
  const t = S.group.sesh_time || "8pm";
  const lines = [(S.group.emoji || DEFAULT_EMOJI) + " " + S.group.name + ": next sesh", ""];
  inPlay(d).forEach(ip => {
    const x = seshFor(d, ip), g = d.gamesById[ip.appid] || {};
    const name = (g.name || "") + (ip.side ? " (side game)" : "");
    if(x.lock){ lines.push(name + ": locked in for " + dayLong(x.lock.day) + ", " + t); return; }
    const focus = x.pencil || (x.best && x.byDay[x.best].length ? x.best : null);
    lines.push(name + ": " + (focus ? dayLong(focus) + ": " + x.byDay[focus].length + " free, need " + x.need + (x.pencil ? ", pencilled in" : "") : "no night picked yet"));
    const waiting = x.players.filter(id => !x.answered.has(id)).map(id => nameOf(d, id));
    if(waiting.length) lines.push("still need nights from " + listNames(waiting));
  });
  lines.push("", "tap your nights: " + location.origin + location.pathname + "#/g/" + S.group.code);
  return lines.join("\n");
}

/** The crew's "lock a night when" rule, in words. */
function needWords(need, total){
  if(need != null && need > total) return { val: String(need),
    hint: `Needs ${need} free once there are that many of you. You're ${total === 1 ? "just one" : "only " + total} so far, so for now it's everyone.` };
  if(need != null && need === total) return { val: need + " of " + total, hint: `Everyone for now, and it stays at ${need} as more join.` };
  if(need == null || need >= total) return { val: "all " + total, hint: "Everyone has to be free, and it stays everyone as people join. Right for a small crew that only plays together." };
  return { val: need + " of " + total, hint: need + " free is enough, so a night still works if " + (total - need) + " can't make it." };
}

/* ============================================================================
   RELEASE STATE
   Steam flags "coming soon" itself and lists Early Access as a genre, so the
   shelf can tell released, early access and not-out-yet apart. Older rows
   fetched before the flag existed fall back to reading the date text.
   ========================================================================== */
const RELEASE = { out: "Released", early: "Early access", soon: "Not out yet" };
function soonText(t){
  if(!t) return false;
  if(/coming soon|to be announced|\btba\b|\btbd\b/i.test(t)) return true;
  const p = Date.parse(t);
  if(!isNaN(p)) return p > Date.now();
  const y = (t.match(/\b(20\d\d)\b/) || [])[1];
  return !!y && +y >= new Date().getFullYear();
}
function releaseOf(game){
  if(!game) return "out";
  if(game.coming_soon || soonText(game.released)) return "soon";
  if([...(game.genres || []), ...(game.tags || [])].includes("Early Access")) return "early";
  return "out";
}

/* ============================================================================
   CREW COLOUR
   Each crew takes its accent from its emoji: 🦀 goes orange-red, 👾 purple,
   🌿 green. The emoji is drawn on a small off-screen canvas and the strongest
   colour in it wins. Only the hue and a clamped saturation carry across;
   lightness is set per theme so buttons and text stay legible. Emoji with no
   real colour (🎮, 💀) keep the default lavender.
   ========================================================================== */
const tintCache = {};
function emojiColour(e){
  if(e in tintCache) return tintCache[e];
  let out = null;
  try{
    const N = 48, c = document.createElement("canvas"); c.width = c.height = N;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.textAlign = "center"; x.textBaseline = "middle";
    x.font = `${N * 0.8}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    x.fillText(e, N / 2, N / 2 + 2);
    const px = x.getImageData(0, 0, N, N).data;
    // 24 hue buckets, each weighted by how saturated and mid-toned its pixels are,
    // so a black outline or a white highlight never decides the colour
    const bins = Array.from({ length: 24 }, () => ({ w: 0, cx: 0, cy: 0, s: 0 }));
    let opaque = 0, coloured = 0;
    for(let i = 0; i < px.length; i += 4){
      if(px[i + 3] < 160) continue;
      opaque++;
      const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dlt = mx - mn;
      if(dlt < 0.001) continue;
      const sat = dlt / (1 - Math.abs(2 * l - 1));
      if(sat < 0.25 || l < 0.12 || l > 0.9) continue;
      let h = mx === r ? ((g - b) / dlt) % 6 : mx === g ? (b - r) / dlt + 2 : (r - g) / dlt + 4;
      h = (h * 60 + 360) % 360;
      const w = sat * (1 - Math.abs(l - 0.5) * 1.3);
      const bin = bins[Math.floor(h / 15)];
      bin.w += w; bin.cx += Math.cos(h * Math.PI / 180) * w; bin.cy += Math.sin(h * Math.PI / 180) * w; bin.s += sat * w;
      coloured += w;
    }
    if(opaque && coloured / opaque > 0.12){
      // the winning bucket, helped by its neighbours so a gradient isn't split in two
      let best = 0, score = -1;
      bins.forEach((b, i) => { const sc = b.w + 0.5 * (bins[(i + 23) % 24].w + bins[(i + 1) % 24].w); if(sc > score){ score = sc; best = i; } });
      const pick = [bins[(best + 23) % 24], bins[best], bins[(best + 1) % 24]];
      const cx = pick.reduce((a, b) => a + b.cx, 0), cy = pick.reduce((a, b) => a + b.cy, 0);
      const w = pick.reduce((a, b) => a + b.w, 0), s = pick.reduce((a, b) => a + b.s, 0) / w;
      out = { h: (Math.atan2(cy, cx) * 180 / Math.PI + 360) % 360, s };
    }
  }catch(_){ out = null; }
  return tintCache[e] = out;
}

/** Relative luminance of an hsl colour (h deg, s and l in %), for contrast checks. */
function hslLum(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  return 0.2126 * lin(f(0)) + 0.7152 * lin(f(8)) + 0.0722 * lin(f(4));
}
/** The accent tokens for an emoji's colour in the current theme, or null for the default. */
function crewVars(emoji){
  const col = emoji ? emojiColour(emoji) : null;
  if(!col) return null;
  const dark = isDark();
  const h = Math.round(col.h), s = Math.round(Math.min(88, Math.max(48, col.s * 100)));
  const yellowish = h >= 38 && h <= 85;           // yellows go dark ink, white on yellow is unreadable
  // the gradient's second stop leans 24deg along the wheel, but never into yellow when the label is white
  let h2 = (h + 24) % 360;
  if(!yellowish && h2 >= 38 && h2 <= 85) h2 = (h + 336) % 360;
  // in light mode white labels sit on the fill, so walk each stop darker until white clears 4.5:1
  const whiteOk = (hh, l) => { while(l > 22 && 1.05 / (hslLum(hh, s, l) + 0.05) < 4.5) l -= 2; return l; };
  const v = dark
    ? { accent: `hsl(${h} ${s}% 70%)`, soft: `hsl(${h} 32% 20%)`, text: `hsl(${h} ${s}% 76%)`,
        ink: `hsl(${h} 45% 11%)`, a: `hsl(${h} ${s}% 70%)`, b: `hsl(${h2} ${s}% 74%)` }
    : yellowish
    ? { accent: `hsl(${h} ${s}% 42%)`, soft: `hsl(${h} 75% 94%)`, text: `hsl(${h} ${s}% 28%)`,
        ink: "#1d1a10", a: `hsl(${h} ${s}% 50%)`, b: `hsl(${h2} ${s}% 46%)` }
    : { accent: `hsl(${h} ${s}% ${whiteOk(h, 50)}%)`, soft: `hsl(${h} 75% 94%)`, text: `hsl(${h} ${s}% ${Math.min(38, whiteOk(h, 38))}%)`,
        ink: "#ffffff", a: `hsl(${h} ${s}% ${whiteOk(h, 48)}%)`, b: `hsl(${h2} ${s}% ${whiteOk(h2, 44)}%)` };
  return {
    "--accent": v.accent, "--accent-soft": v.soft, "--accent-text": v.text, "--accent-ink": v.ink,
    "--grad-a": v.a, "--grad-b": v.b,
    // --grad and --glow are built from these on :root, and a custom property resolves where
    // it's declared, so an element that wants the tint has to be handed the finished values too
    "--grad": `linear-gradient(135deg, ${v.a}, ${v.b})`,
    "--glow": `0 10px 30px -12px color-mix(in oklab, ${v.accent} 60%, transparent)`,
  };
}
const TINT_PROPS = ["--accent", "--accent-soft", "--accent-text", "--accent-ink", "--grad-a", "--grad-b", "--grad", "--glow"];
/** Put an emoji's colours on one element (or clear them); returns whether anything was set. */
function tintEl(el, emoji){
  const v = crewVars(emoji);
  TINT_PROPS.forEach(p => v ? el.style.setProperty(p, v[p]) : el.style.removeProperty(p));
  return !!v;
}

/* The saved colour wins, so every device shows the same shade. If there isn't

function applyCrewColour(emoji){

  if(key === tintKey) return;

/* ---------- name matching: Soli vs soli vs Soli L ---------- */
function normName(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // strip accents
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
/** Levenshtein, capped: we only care about distances of 1 or 2. */
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const m = a.length, n = b.length;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for (let i=1;i<=m;i++){
    const cur = [i];
    for (let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[n];
}
/** Everyone in the group who might already be this person. */
function nameMatches(input, members){
  const n = normName(input);
  if (!n) return [];
  const first = n.split(" ")[0];
  return members.map(m => {
    const mn = normName(m.name);
    const mfirst = mn.split(" ")[0];
    let score = 0;
    if (mn === n) score = 100;                                     // Soli / soli / SOLI
    else if (mn.startsWith(n + " ") || n.startsWith(mn + " ")) score = 88;  // Soli / Soli L
    else if (mfirst === first && first.length >= 3) score = 74;     // Soli L / Soli B
    else if (Math.max(mn.length, n.length) >= 4 && lev(mn, n) <= 2) score = 68; // Soli / Solli
    return { m, score };
  }).filter(x => x.score >= 60)
    .sort((a,b) => b.score - a.score)
    .slice(0,4)
    .map(x => x.m);
}

/* ============================================================================
   API
   ========================================================================== */
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message);

  if (DISCORD_WRITES.has(fn) && S && S.group && S.group.discord) queueDiscord(DISCORD_BIG.has(fn));
  return data;
}

/* ----------------------------------------------------------------------------
   GAME STATE
   Every game on the shelf is in exactly one of these. The state is derived,
   never stored twice, so there is one definition and nothing to keep in sync.

     open     on the shelf and up for a vote. Which is nearly everything:
              there is no backlog and no gate. Ten mates do not need a
              nomination process, they need to see the games.
     playing  won the round and is on right now. Locked until someone
              hits Finished it.
     benched  out of view. Someone parked it, or it got a never-again.
              Not deleted, and one tap brings it back.

   "played" is history, not a state. Same for "nobody owns it": that is a fact
   about the game shown on the card, never a reason to hide it.
---------------------------------------------------------------------------- */
const STATE = {
  open:    { label:"Up for a vote", cta:"Pick this" },
  playing: { label:"On right now",  cta:"On now"    },
  benched: { label:"Benched",       cta:"Unbench"   },
};
/* ----------------------------------------------------------------------------
   WHERE EACH FACET COMES FROM
     energy    us. Curated for the 74 known games, blank otherwise, any member
               can set it. Steam has no idea how much of a night a game costs.
     crew_max  us, same deal. Steam says "co-op", never how many.
     setup     us. Steam does not model who has to host.
     doing     Steam's user tags scored into mucking about / building / a
               story / scary / runs and rounds, with the publisher-declared
               categories as a tiebreak and genres as a fallback, so it is
               never blank. Still a guess, so the group can override it.
     shape     same tag scoring, into drop in / one sitting / campaign /
               long haul.
     everything else  straight from Steam.
---------------------------------------------------------------------------- */
const doingOf = (s, d) => s.doing || (d.gamesById[s.appid]||{}).doing || null;
/** Ours first, Steam's guess second, so nothing sits blank and disappears from
 *  the fits-tonight filter just because it is not in the curated list. */
const energyOf = (s, d) => s.energy ?? (d.gamesById[s.appid]||{}).energy_guess ?? null;
const energyIsGuess = (s, d) => s.energy == null && (d.gamesById[s.appid]||{}).energy_guess != null;

function stateOf(s, d){
  if(d.nowPlaying && d.nowPlaying.appid === s.appid) return "playing";
  return s.benched ? "benched" : "open";
}
const VERDICT_ICON = {banger:"\u2605", fine:"\u25CF", never_again:"\u2716"};
const SHAPE_ORDER = {dropin:0, sitting:1, campaign:2, longhaul:3};

function hueOf(str){ let h=0; for(let i=0;i<String(str).length;i++) h=(h*31+String(str).charCodeAt(i))%360; return h; }
function monogram(name){
  const w = String(name||"?").replace(/[^A-Za-z0-9 ]/g,"").split(" ").filter(Boolean);
  return (w.length>1 ? w[0][0]+w[1][0] : (w[0]||"??").slice(0,2)).toUpperCase();
}
function ago(iso){
  if(!iso) return "";
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90) return "just now";
  if(s<3600) return Math.round(s/60)+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
/** How far off calling it we are. There is no deadline: the cadence was always
 *  "whenever we finish a game", so a countdown was inventing one. */
function callable(d, g){
  // Quorum is a floor for a group big enough to have one. With fewer people in
  // the group than the quorum it is unreachable, and the strip used to sit on
  // "3 more to call it" with every single person already voted. Everybody
  // having had their say is always enough.
  const everyone = d.lookedCount > 0 && d.votedCount >= d.lookedCount;
  const short = Math.max(0, Math.min(g.quorum, d.lookedCount) - d.votedCount);
  return { ready: everyone || short === 0, short };
}
const isLive = iso => iso && (Date.now()-new Date(iso).getTime()) < 180000;
const shortDate = iso => new Date(iso).toLocaleDateString("en-AU", {day:"numeric", month:"short"});

/* ---------- derived ---------- */
function derive(){
  if(!S) return null;
  const gamesById = {};
  (S.games||[]).forEach(g => { gamesById[g.appid] = g; });

  const counts = {}, voters = new Set(), lastVoteAt = {};
  (S.ballots||[]).forEach(b => {
    (b.picks||[]).forEach(a => {
      counts[a] = (counts[a]||0)+1;
      if(!lastVoteAt[a] || b.updated_at > lastVoteAt[a]) lastVoteAt[a] = b.updated_at;
    });
    if((b.picks||[]).length) voters.add(b.member_id);
  });

  const takesBy = {};
  (S.takes||[]).forEach(t => {
    const who = (S.members||[]).find(m => m.member_id === t.member_id);
    (takesBy[t.appid] = takesBy[t.appid]||[]).push({
      by: who ? who.name : "Someone", body: t.body, mine: t.member_id === myMemberId
    });
  });

  // play history: one row per game per round, so a game we come back to later
  // stacks up rather than overwriting the first time we played it
  const playsBy = {};
  (S.plays||[]).forEach(pl => { (playsBy[pl.appid] = playsBy[pl.appid]||[]).push(pl); });
  Object.values(playsBy).forEach(list => list.sort((a,b) => a.started_at < b.started_at ? 1 : -1));
  const nowPlaying = (S.plays||[]).find(pl => !pl.finished_at) || null;

  const myBallot = (S.ballots||[]).find(b => b.member_id === myMemberId);
  const myPicks  = myBallot ? (myBallot.picks||[]) : [];
  const meMember = (S.members||[]).find(m => m.member_id === myMemberId) || null;

  // duplicate display names still get a suffix, for the cases the match sheet
  // did not catch (someone genuinely is a second Sam)
  const seen = {};
  const members = (S.members||[]).map(m => {
    seen[m.name] = (seen[m.name]||0)+1;
    return {...m, label: seen[m.name] > 1 ? m.name+" ("+seen[m.name]+")" : m.name};
  });

  const ranked = Object.keys(counts).map(a => ({appid:+a, n:counts[a]}))
    .sort((x,y) => y.n-x.n || x.appid-y.appid);

  const ownsBy = {}, prices = {};
  (S.owns||[]).forEach(o => { (ownsBy[o.appid] = ownsBy[o.appid] || new Set()).add(o.member_id); });
  (S.prices||[]).forEach(p => { prices[p.appid] = p; });

  return { gamesById, counts, takesBy, myPicks, meMember, playsBy, nowPlaying,
           members, ranked, lastVoteAt, ownsBy, prices,
           votedCount: voters.size, lookedCount: members.length,
           liveCount: members.filter(m => isLive(m.last_seen)).length };
}

   FILTERING + SORTING
   ========================================================================== */
function activeFilters(f = F){
  const out = [];
  if(f.q) out.push({k:"q", label:'"'+f.q+'"'});
  if(f.crew) out.push({k:"crew", label:"for "+f.crew+" players"});
  if(f.mine) out.push({k:"mine", label:"my picks"});
  if(f.played) out.push({k:"played", label: f.played === "fresh" ? "never played" : "played before"});
  if(f.benched) out.push({k:"benched", label:"the bench"});
  if(f.wellrated) out.push({k:"wellrated", label:"85%+ on Steam"});
  f.energy.forEach(v => out.push({k:"energy", v, label:ENERGY[v]}));
  f.shape .forEach(v => out.push({k:"shape",  v, label:SHAPE[v]}));
  f.doing .forEach(v => out.push({k:"doing",  v, label:DOING[v]}));
  f.setup .forEach(v => out.push({k:"setup",  v, label:SETUP[v]}));
  f.release.forEach(v => out.push({k:"release", v, label:RELEASE[v]}));
  if(f.demo) out.push({k:"demo", label:"has a demo"});
  return out;
}
function clearFilter(k, v, f = F){
  if(k==="q"){ f.q=""; }
  else if(k==="crew"){ f.crew=null; }
  else if(k==="mine"){ f.mine=false; }
  else if(k==="played"){ f.played=null; }
  else if(k==="benched"){ f.benched=false; }
  else if(k==="wellrated"){ f.wellrated=false; }
  else if(k==="demo"){ f.demo=false; }
  else f[k].delete(v);
}
function clearAll(f = F){
  f.q=""; f.crew=null; f.mine=false; f.played=null;
  f.benched=false; f.wellrated=false;
  f.energy.clear(); f.shape.clear(); f.doing.clear(); f.setup.clear();
  f.release.clear(); f.demo=false;
}

/** A game passes if it clears every active filter. Crew is the one that maps
 *  to the real decision: five people means a four-player game is out. */
/** How a game sits against tonight's headcount.
 *  "fits" clears it outright, "mods" only clears it if someone installs
 *  something, "no" cannot seat everyone, "unknown" has no published cap. */
function crewFit(s, want){
  if(!want) return "fits";
  if(s.crew_max == null) return "unknown";
  if(s.crew_max >= want) return "fits";
  if(s.crew_mod != null && s.crew_mod >= want) return "mods";
  return "no";
}

function matchesSearch(game, q){
  if(!q) return true;
  const hay = ((game.name||"")+" "+(game.short_desc||"")+" "+(game.tags||[]).join(" ")).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function passes(s, d, f = F){
  const game = d.gamesById[s.appid] || {};
  if(!matchesSearch(game, f.q)) return false;
  // a moddable game is kept and labelled rather than hidden, because "you can
  // play this if someone installs a mod" is useful and "it vanished" is not
  if(crewFit(s, f.crew) === "no") return false;
  if(f.mine && !d.myPicks.includes(s.appid)) return false;
  if(f.wellrated && !((game.review_pct ?? 0) >= 85)) return false;
  if(f.played){
    const played = (d.playsBy[s.appid]||[]).length > 0;
    if(f.played === "fresh" && played) return false;
    if(f.played === "again" && !played) return false;
  }
  if(f.energy.size && !f.energy.has(energyOf(s, d))) return false;
  if(f.setup.size && !f.setup.has(s.setup)) return false;
  if(f.shape.size && !f.shape.has(game.shape)) return false;
  if(f.doing.size && !f.doing.has(doingOf(s, d))) return false;
  if(f.release.size && !f.release.has(releaseOf(game))) return false;
  if(f.demo && !game.demo_appid) return false;
  return true;
}

function sortShelf(list, d){
  const sortBy = A().sort, asc = A().dir === "asc";
  const val = s => {
    const g = d.gamesById[s.appid] || {};
    switch(sortBy){
      case "votes":  return d.counts[s.appid] || 0;
      case "review": return g.review_pct ?? -1;
      case "added":  return new Date(s.added_at).getTime();
      case "length": return -(SHAPE_ORDER[g.shape] ?? 9);   // shortest first when desc
      case "crew":   return s.crew_max ?? 0;
      case "az":     return g.name || "";
      default:       return 0;
    }
  };
  return list.slice().sort((a,b) => {
    const va = val(a), vb = val(b);
    // strings and numbers need opposite-looking comparators for the same
    // direction, so they are handled separately rather than with one sign flip
    if(typeof va === "string"){
      return asc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    if(va !== vb) return asc ? va - vb : vb - va;
    // stable tiebreak on name, so equal values never jitter between renders
    const ga = d.gamesById[a.appid]||{}, gb = d.gamesById[b.appid]||{};
    return (ga.name||"").localeCompare(gb.name||"");
  });
}

/** Sections for a shelf that has outgrown one long scroll. */
function groupShelf(list, d){
  const groupBy = A().group;
  if(groupBy === "none") return [{ label:null, items:list }];
  const buckets = new Map();
  const keyOf = s => {
    const g = d.gamesById[s.appid] || {};
    if(groupBy === "votes"){
      if(stateOf(s, d) === "playing") return "\u25B6 On right now";
      if(stateOf(s, d) === "benched") return "Benched";
      return (d.counts[s.appid]||0) > 0 ? "In the running" : "Nobody's picked it yet";
    }
    if(groupBy === "energy"){ const e = energyOf(s, d); return e ? ENERGY[e] : "Not rated yet"; }
    if(groupBy === "shape")  return g.shape  ? SHAPE[g.shape]   : "Unsorted";
    if(groupBy === "setup")  return s.setup  ? SETUP[s.setup]   : "Unsorted";
    if(groupBy === "release") return RELEASE[releaseOf(d.gamesById[s.appid])];
    if(groupBy === "played") return (d.playsBy[s.appid]||[]).length ? "Played before" : "Never played";
    return "";
  };
  list.forEach(s => {
    const k = keyOf(s);
    if(!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(s);
  });
  // keep a sensible reading order rather than whatever the data happened to be in
  const order = {
    votes:  ["\u25B6 On right now","In the running","Nobody's picked it yet","Benched"],
    energy: ["Chill","Normal","Heavy","Not rated yet"],
    shape:  ["Drop in","One sitting","Campaign","Long haul","Unsorted"],
    setup:  ["Just launch","Someone hosts","Dedicated server","Unsorted"],
    release:["Released","Early access","Not out yet"],
    played: ["Never played","Played before"],
  }[A().group] || [];
  return [...buckets.entries()]
    .sort((a,b) => {
      const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    })
    .map(([label, items]) => ({ label, items }));
}
/** Drop the heading when the grouping produced exactly one bucket: a lone
 *  "Up for a vote" header over the entire shelf says nothing. */
function sections(list, d){
  const out = groupShelf(list, d);
  return out.length === 1 ? [{ label:null, items:out[0].items }] : out;
}

/** Never gate the shelf behind a name. Park the action, ask, then run it. */
function needName(action){
  if(myMemberId) return false;
  focusReturn = document.activeElement;
  pending = action;
  sheet = { kind:"name", step:"enter", typed: myName };
  render();
  return true;
}

async function refresh(){
  if(!code) return;
  if(seshDirty) return;          // a free-nights save is in flight; don't let the server undo a tap
  try{
    // whoami first: a returning visitor is recognised without being asked again
    if(myMemberId === null){
      myMemberId = await rpc("whoami", { p_code: code, p_device: deviceId });
    }
    const next = await rpc("get_state", { p_code: code });
    const before = S ? derive() : null;
    const unchanged = S !== null && JSON.stringify(next) === JSON.stringify(S);
    S = next;
    const after = derive();

    // The saved group list only learns a name at join time, so a group renamed
    // later would keep its old name in the switcher forever. Correct it here.
    const saved = myGroups.find(g => g.code === code);
    if(saved && next.group && (saved.name !== next.group.name || saved.emoji !== next.group.emoji)){
      saved.name = next.group.name; saved.emoji = next.group.emoji;
      store.set("groups", myGroups);
    }

    // Nothing came back different, so leave the DOM alone. This is what stops
    // the covers flashing every ten seconds, and it keeps your scroll position
    // and your place in a text field.
    if(unchanged && !sheet) return;

    if(before && after && after.ranked.length){
      const nl = after.ranked[0].appid;
      const ol = before.ranked.length ? before.ranked[0].appid : null;
      if(ol && nl !== ol){
        const g = after.gamesById[nl];
        flash = (g ? g.name : "Something") + " just took the lead";
        tookover = nl;
        setTimeout(() => { flash = ""; render(); }, 9000);
      }
    }
    render();
  }catch(err){
    if(/no group/i.test(err.message)){
      myGroups = myGroups.filter(g => g.code !== code);
      store.set("groups", myGroups);
      location.hash = "";
    }
  }
}

async function togglePick(appid){
  if(needName(() => togglePick(appid))) return;
  const d = derive();
  let picks = d.myPicks.slice();
  const at = picks.indexOf(appid);
  if(at > -1) picks.splice(at,1);
  else {
    if(picks.length >= 3){
      const dropped = d.gamesById[picks[0]];
      picks.shift();
      flash = (dropped ? dropped.name : "Your oldest pick") + " made way for it";
      setTimeout(() => { flash = ""; render(); }, 4500);
    }
    picks.push(appid); pulse = appid;
  }
  // optimistic: the tap registers instantly, the write reconciles behind it
  const mine = (S.ballots||[]).find(b => b.member_id === myMemberId);
  if(mine) mine.picks = picks;
  else (S.ballots = S.ballots||[]).push({member_id:myMemberId, picks, updated_at:new Date().toISOString()});
  render();
  setTimeout(()=>{ pulse = null; }, 600);
  try{ await rpc("set_picks", {p_code:code, p_device:deviceId, p_picks:picks}); }
  finally{ refresh(); }
}

async function unbench(appid){

/** An app id out of anything someone might paste: a bare number, or any
 *  store, community or help URL. */
function parseAppid(input){
  const t = String(input || "").trim();
  if(/^\d{2,8}$/.test(t)) return Number(t);
  // /app/1478500/Big_Walk/?curator_clanid=... - everything after the id is
  // optional, so match the id and read the slug separately if it is there
  const m = t.match(/\/app\/(\d+)/);
  return m ? Number(m[1]) : null;
}
/** "Big_Walk" out of a store URL, for the preview's benefit only. */
function parseSlug(input){
  const m = String(input || "").match(/\/app\/\d+\/([^/?#]+)/);
  return m ? decodeURIComponent(m[1]).replace(/_/g, " ") : null;
}

let searchTimer = null;
function onAddInput(value){
  clearTimeout(searchTimer);
  addQ = value;
  const q = value.trim();

  // A pasted link is unambiguous, so go straight for it rather than typing it
  // into a search box that cannot read URLs.
  if(parseAppid(q)){ addLookup(q); return; }

  if(q.length < 2){
    // only touch the DOM if there is something to take away, otherwise the
    // box would rebuild under your fingers on the very first keystroke
    if(addResults.length || addMsg){ addResults = []; addMsg = null; render(); }
    return;
  }
  if(addMsg){ addMsg = null; render(); }
  searchTimer = setTimeout(() => runSearch(q), 400);
}

async function runSearch(q){
  addBusy = true; render();
  try{
    const { results } = await callEnrich({action:"search", q});
    addResults = results || [];
    if(!addResults.length) addMsg = {kind:"bad", text:"Steam found nothing called that. Try fewer words, or paste the store link."};
  }catch(err){ addResults = []; addMsg = {kind:"bad", text:err.message}; }
  finally{ addBusy = false; render(); }
}

/** Fetch one exact game from a link or id and show it ready to add. */
async function addLookup(raw){
  const appid = parseAppid(raw);
  if(!appid) return;
  clearTimeout(searchTimer);
  addBusy = true; addMsg = null; addResults = []; render();
  try{
    const { game } = await callEnrich({action:"get", appid, slug: parseSlug(raw)});
    addResults = [{appid, name: game.name, header: game.header}];
  }catch(err){ addMsg = {kind:"bad", text:err.message}; }
  finally{ addBusy = false; render(); }
}

/** Whatever is in the box: a link goes straight to lookup, words to search. */
function submitAdd(){
  const el = document.getElementById("addq");
  if(!el) return;
  const v = el.value.trim();
  if(!v) return;
  if(parseAppid(v)) addLookup(v); else runSearch(v);
}

/* One second of confetti when a round is called. Removed from the DOM after,
   so nothing lingers, and skipped entirely under reduced motion. */
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  const hue = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  for(let i = 0; i < 26; i++){
    const bit = document.createElement("i");
    const a = (Math.random() * Math.PI) - Math.PI/2;      // upward-ish fan
    const dist = 140 + Math.random() * 260;
    bit.style.setProperty("--dx", Math.round(Math.sin(a) * dist) + "px");
    bit.style.setProperty("--dy", Math.round(Math.abs(Math.cos(a)) * -dist * .6 + 420) + "px");
    bit.style.setProperty("--spin", Math.round(Math.random() * 900 - 450) + "deg");
    bit.style.setProperty("--dur", (900 + Math.random() * 500) + "ms");
    bit.style.background = i % 3 === 0 ? hue : (i % 3 === 1 ? "#F2B772" : "#78D3B1");
    bit.style.left = (44 + Math.random() * 12) + "%";
    wrap.appendChild(bit);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1600);
}

/* The leader banner is the only place in the app where the answer changes, so
   it is the only place worth spending a transition on. Characters resolve left
   to right, which reads as the name landing rather than as a glitch. */
function scrambleTo(el, text){
  if(!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let frame = 0;
  const total = 22;
  const tick = () => {
    if(!document.contains(el)) return;
    const settled = Math.floor((frame / total) * text.length);
    el.textContent = text.slice(0, settled) + text.slice(settled).replace(/\S/g,
      () => CH[Math.floor(Math.random() * CH.length)]);
    if(frame++ < total) requestAnimationFrame(tick);
    else el.textContent = text;
  };
  tick();
}

function summaryText(d){
  const g = S.group;
  const lines = [(g.emoji || DEFAULT_EMOJI) + " " + g.name + ": what are we playing"];
  lines.push("");
  if(!d.ranked.length) lines.push("nothing yet, someone go first");

  });

                               : d.votedCount+" of "+d.lookedCount+" in");

function nudgeText(d){
  const voted = new Set((S.ballots||[]).filter(b=>(b.picks||[]).length).map(b=>b.member_id));
  const missing = d.members.filter(m => !voted.has(m.member_id)).map(m=>m.label);
  const link = location.origin+location.pathname+"#/g/"+S.group.code;
  if(!missing.length) return "that's everyone in 🎉 " + link;
  return missing.join(", ") + ": still waiting on your picks 👀\n" + link;
}

/* ============================================================================
   RENDER
   ========================================================================== */
/** Snapshot the focused text field so a full re-render can put the cursor
 *  back exactly where it was. Returns the restore function. */
function keepFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !/^(INPUT|TEXTAREA)$/.test(el.tagName)) return () => {};
  const { id, selectionStart: a, selectionEnd: z } = el;
  return () => {
    const n = document.getElementById(id);
    if(!n || n.disabled) return;
    n.focus({ preventScroll: true });
    try{ n.setSelectionRange(a, z); }catch(_){ /* not a text-selectable type */ }
  };
}

function render(){
  // Nothing behind a sheet should scroll. Without this the shelf drifts around
  // under your thumb while you are trying to use the sheet on top of it.
  document.body.classList.toggle("locked", !!sheet);
  if(!SDK_OK) return renderNoSDK();
  if(!CONFIGURED) return renderSetup();
  const m = location.hash.match(/^#\/g\/([A-Za-z0-9]+)/);
  if(!m){ code=""; setTabIdentity(DEFAULT_EMOJI, "Game Night"); applyCrewColour(null); return renderLanding(); }
  const wasCode = code;
  code = m[1].toUpperCase();
  if(code !== wasCode) loadF();
  if(!S || S.group.code !== code) return renderLoading();
  setTabIdentity(S.group.emoji, S.group.name);
  syncTint();
  applyCrewColour(sheet && sheet.kind === "crew" ? sheet.emoji : S.group.emoji);
  renderGroup();
}
