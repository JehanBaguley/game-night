/** Never gate the shelf behind a name. Park the action, ask, then run it. */
function needName(action){
  if(myMemberId) return false;
  focusReturn = document.activeElement;
  pending = action;
  sheet = { kind:"name", step:"enter", typed: myName };
  render();
  return true;
}

async function refresh(opts = {}){
  if(!code) return;
  if(seshDirty) return;          // a free-nights save is in flight; don't let the server undo a tap
  try{
    // whoami first: a returning visitor is recognised without being asked again
    if(myMemberId === null){
      myMemberId = await rpc("whoami", { p_code: code, p_device: deviceId });
    }
    const next = await rpc("get_state", { p_code: code });
    const before = S ? derive() : null;
    const unchanged = S !== null && JSON.stringify(next) === JSON.stringify(S);
    S = next;
    const after = derive();

    // The saved group list only learns a name at join time, so a group renamed
    // later would keep its old name in the switcher forever. Correct it here.
    const saved = myGroups.find(g => g.code === code);
    if(saved && next.group && (saved.name !== next.group.name || saved.emoji !== next.group.emoji)){
      saved.name = next.group.name; saved.emoji = next.group.emoji;
      store.set("groups", myGroups);
    }

    // Nothing came back different, so leave the DOM alone. This is what stops
    // the covers flashing every ten seconds, and it keeps your scroll position
    // and your place in a text field.
    if(unchanged && (!sheet || opts.quiet)) return;
    // Background polls never rebuild an open sheet: doing that mid-scroll is what
    // made sheets jump and stutter. The new state is kept and shows on your next
    // tap or when the sheet closes. The night picker is the exception, since
    // watching the others tick their nights is the point of it.
    if(opts.quiet && sheet && sheet.kind !== "sesh") return;

    if(before && after && after.ranked.length){
      const nl = after.ranked[0].appid;
      const ol = before.ranked.length ? before.ranked[0].appid : null;
      if(ol && nl !== ol){
        const g = after.gamesById[nl];
        flash = (g ? g.name : "Something") + " just took the lead";
        tookover = nl;
        setTimeout(() => { flash = ""; render(); }, 9000);
      }
    }
    render();
  }catch(err){
    if(/no group/i.test(err.message)){
      // the crew's gone or has a new code: drop the old one, and if this device
      // was in it, my_crews brings it back under the new code
      myGroups = myGroups.filter(g => g.code !== code);
      store.set("groups", myGroups);
      crewMoved = true; crewsSynced = false;
      location.hash = "";
    }
  }
}

async function togglePick(appid){
  if(needName(() => togglePick(appid))) return;
  const d = derive();
  let picks = d.myPicks.slice();
  const at = picks.indexOf(appid);
  if(at > -1) picks.splice(at,1);
  else {
    if(picks.length >= 3){
      const dropped = d.gamesById[picks[0]];
      picks.shift();
      flash = (dropped ? dropped.name : "Your oldest pick") + " made way for it";
      setTimeout(() => { flash = ""; render(); }, 4500);
    }
    picks.push(appid); pulse = appid;
  }
  // optimistic: the tap registers instantly, the write reconciles behind it
  const mine = (S.ballots||[]).find(b => b.member_id === myMemberId);
  if(mine) mine.picks = picks;
  else (S.ballots = S.ballots||[]).push({member_id:myMemberId, picks, updated_at:new Date().toISOString()});
  render();
  setTimeout(()=>{ pulse = null; }, 600);
  try{ await rpc("set_picks", {p_code:code, p_device:deviceId, p_picks:picks}); }
  finally{ refresh(); }
}

/* Flat paper, a fixed palette so it looks designed rather than random. */
const FW_PAPER = ["#6D5AE6","#E2585F","#F2A93B","#2FA4A0","#2B3A74","#E86FA8"];
/** Bursts of paper up where the fun toast sits. Good moments only, never a save. */
function fireworks(bursts){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const wrap = document.createElement("div");
  wrap.className = "fworks"; wrap.setAttribute("aria-hidden", "true");
  // nine bursts over about three and a half seconds, so the last paper is still
  // falling at five. Bursts walk across and down the screen rather than all
  // going off in the same band.
  const n = bursts || 9;
  for(let b = 0; b < n; b++){
    const ox = 10 + Math.random() * 80, oy = 8 + Math.random() * 44;
    const bits = 26 + Math.floor(Math.random() * 12);
    const delay = b * 0.38 + Math.random() * 0.12;
    for(let i = 0; i < bits; i++){
      const ang = (i / bits) * Math.PI * 2 + Math.random() * 0.22;   // evenly round the circle, slightly jittered
      const dist = 110 + Math.random() * 190;
      const e = document.createElement("i");
      e.style.left = ox + "%"; e.style.top = oy + "vh";
      e.style.setProperty("--tx", (Math.cos(ang) * dist).toFixed(0) + "px");
      e.style.setProperty("--ty", (Math.sin(ang) * dist).toFixed(0) + "px");
      // fall is the gravity leg: how far the paper drifts down after the burst.
      // Generous, so pieces leave the bottom of the screen rather than stopping.
      e.style.setProperty("--fall", (420 + Math.random() * 620).toFixed(0) + "px");
      e.style.setProperty("--spin", (Math.random() * 1600 - 800).toFixed(0) + "deg");
      e.style.setProperty("--tilt", (Math.random() * 90).toFixed(0) + "deg");
      e.style.setProperty("--dur", (2.6 + Math.random() * 1.6).toFixed(2) + "s");
      e.style.setProperty("--delay", (delay + Math.random() * 0.14).toFixed(2) + "s");
      e.style.background = FW_PAPER[Math.floor(Math.random() * FW_PAPER.length)];
      wrap.appendChild(e);
    }
  }
  document.body.appendChild(wrap);
  // last burst starts at n*0.38s and runs up to 4.2s, so clear well after that
  setTimeout(() => wrap.remove(), n * 380 + 4600);
}

/* Type one of these into the search and it answers back. Whole-word matches
   only, and they fire on a pause in typing, so searching "SteamWorld" never
   trips the "steam" one. keep:true leaves your text alone. */
const TYPED_EGGS = [
  { test: v => /^gg( wp)?$/i.test(v),   run: () => { toast("gg wp \u{1F91D}", "fun"); fireworks(); } },
  { test: v => /^steam$/i.test(v),      run: () => toast("we know") },
  { test: v => /^xyzzy$/i.test(v),      run: () => toast("Nothing happens.") },
  { test: v => /^(42|the answer)$/i.test(v), run: () => toast("The answer, but not to what we're playing.") },
  { test: v => /^(iddqd|idkfa|god ?mode)$/i.test(v), run: () => toast("God mode's off. You still have to pick.") },
  { test: v => /^(rosebud|motherlode)$/i.test(v), run: () => toast("No money here, just games.") },
  { test: v => /^(please|pls)$/i.test(v), run: () => toast("Manners noted.") },
  { test: v => /^(help|halp)$/i.test(v), run: () => toast("Pick three, the rest sorts itself out.") },
  // a mate's name is not a game, and the crew emoji sends the critter for a lap
  { test: v => !!nameInCrew(v),         run: v => toast(nameInCrew(v) + " isn't a game.") },
  { test: v => !!(S && S.group && S.group.emoji) && v === S.group.emoji, run: () => critter(S.group.emoji, true) },
];
/** The crew member whose name this is, if any. Their spelling, not yours. */
function nameInCrew(v){
  const n = normName(v);
  if(!n || n.length < 3) return "";
  const hit = ((S && S.members) || []).find(m => normName(m.name) === n);
  return hit ? hit.name : "";
}
let eggTimer = null;
/** Runs after a pause in typing, so a half-typed game title never triggers one. */
function tryTypedEgg(v){
  const hit = TYPED_EGGS.find(e => { try{ return e.test(v); }catch(_){ return false; } });
  if(!hit) return;
  const el = document.getElementById("q");
  if(el && el.value.trim() !== v) return;   // they carried on typing, leave them be
  hit.run(v);
  if(hit.keep) return;
  if(el) el.value = "";
  F.q = ""; render();
}

/** The crew's emoji strolls across the bottom of the page. Once per visit, and
    only when something worth marking happened: the whole crew has picked, or
    you tapped the emoji three times. */
let critterDone = false;
let emojiTaps = 0, emojiTapAt = 0;
function critter(emoji, force){
  if(!emoji || (critterDone && !force)) return;
  critterDone = true;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  setTimeout(() => {
    const el = document.createElement("span");
    el.className = "critter"; el.setAttribute("aria-hidden", "true"); el.textContent = emoji;
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }, force ? 0 : 2500);
}
/** A small line at the bottom of the screen. Used when something didn't save. */
let toastTimer = null;
function toast(text, kind){
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.setAttribute("role", "status"); el.setAttribute("aria-live", "polite"); document.body.appendChild(el); }
  el.className = "toast" + (kind === "bad" ? " toast--bad" : kind === "fun" ? " toast--fun" : "") + " in";
  el.textContent = text;
  clearTimeout(toastTimer);
  // the loud kind sits over the page, so it gets out of the way sooner
  toastTimer = setTimeout(() => el.classList.remove("in"), kind === "fun" ? 4200 : 5000);
}
/** Turns the server's wording into something a person can act on. */
function saveProblem(err, what){
  const m = (err && err.message) || "";
  if(/not on right now/i.test(m)) return "That game isn't on any more, so nights can't change. Refreshing…";
  if(/no group/i.test(m)) return "This crew's link has changed. Open the new one.";
  if(/not in this crew|assert_member|not a member/i.test(m)) return "This device isn't in the crew yet. Tap your name up the top to join.";
  return `Couldn't save ${what}. Check your connection and try again.`;
}

/* ---------- add ---------- */
/** An app id out of anything someone might paste: a bare number, or any
 *  store, community or help URL. */
function parseAppid(input){
  const t = String(input || "").trim();
  if(/^\d{2,8}$/.test(t)) return Number(t);
  // /app/1478500/Big_Walk/?curator_clanid=... - everything after the id is
  // optional, so match the id and read the slug separately if it is there
  const m = t.match(/\/app\/(\d+)/);
  return m ? Number(m[1]) : null;
}
/** "Big_Walk" out of a store URL, for the preview's benefit only. */
function parseSlug(input){
  const m = String(input || "").match(/\/app\/\d+\/([^/?#]+)/);
  return m ? decodeURIComponent(m[1]).replace(/_/g, " ") : null;
}

let searchTimer = null;
function onAddInput(value){
  clearTimeout(searchTimer);
  addQ = value;
  const q = value.trim();

  // A pasted link is unambiguous, so go straight for it rather than typing it
  // into a search box that cannot read URLs.
  if(parseAppid(q)){ addLookup(q); return; }

  if(q.length < 2){
    // only touch the DOM if there is something to take away, otherwise the
    // box would rebuild under your fingers on the very first keystroke
    if(addResults.length || addMsg){ addResults = []; addMsg = null; render(); }
    return;
  }
  if(addMsg){ addMsg = null; render(); }
  searchTimer = setTimeout(() => runSearch(q), 400);
}

async function runSearch(q){
  addBusy = true; render();
  try{
    const { results } = await callEnrich({action:"search", q});
    addResults = results || [];
    if(!addResults.length) addMsg = {kind:"bad", text:"Steam found nothing called that. Try fewer words, paste the store link, or add it yourself below if it isn't on Steam."};
  }catch(err){ addResults = []; addMsg = {kind:"bad", text:err.message}; }
  finally{ addBusy = false; render(); }
}

/* One second of confetti when a round is called. Removed from the DOM after,
   so nothing lingers, and skipped entirely under reduced motion. */
function burst(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  const hue = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  for(let i = 0; i < 26; i++){
    const bit = document.createElement("i");
    const a = (Math.random() * Math.PI) - Math.PI/2;      // upward-ish fan
    const dist = 140 + Math.random() * 260;
    bit.style.setProperty("--dx", Math.round(Math.sin(a) * dist) + "px");
    bit.style.setProperty("--dy", Math.round(Math.abs(Math.cos(a)) * -dist * .6 + 420) + "px");
    bit.style.setProperty("--spin", Math.round(Math.random() * 900 - 450) + "deg");
    bit.style.setProperty("--dur", (900 + Math.random() * 500) + "ms");
    bit.style.background = i % 3 === 0 ? hue : (i % 3 === 1 ? "#F2B772" : "#78D3B1");
    bit.style.left = (44 + Math.random() * 12) + "%";
    wrap.appendChild(bit);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1600);
}

/* The leader banner is the only place in the app where the answer changes, so
   it is the only place worth spending a transition on. Characters resolve left
   to right, which reads as the name landing rather than as a glitch. */
function scrambleTo(el, text){
  if(!el || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let frame = 0;
  const total = 22;
  const tick = () => {
    if(!document.contains(el)) return;
    const settled = Math.floor((frame / total) * text.length);
    el.textContent = text.slice(0, settled) + text.slice(settled).replace(/\S/g,
      () => CH[Math.floor(Math.random() * CH.length)]);
    if(frame++ < total) requestAnimationFrame(tick);
    else el.textContent = text;
  };
  tick();
}

/* ============================================================================
   SHARE TEXT
   ========================================================================== */
/* The ranking, grouped by vote count. Three games on two votes each are one
   tier, not first, second and third, so nothing downstream can hand out medals
   it hasn't earned. rank is competition ranking: 1, 1, 1, then 4. */
function voteTiers(ranked){
  const out = [];
  (ranked || []).forEach(r => {
    const last = out[out.length - 1];
    if(last && last.n === r.n) last.appids.push(r.appid);
    else out.push({ n: r.n, rank: out.reduce((a, t) => a + t.appids.length, 0) + 1, appids: [r.appid] });
  });
  return out;
}
/** "A, B and C", with a cutoff so a wide tie doesn't run off the line. */
function andList(names, cap){
  const max = cap || 3;
  if(names.length <= max){
    return names.length < 2 ? (names[0] || "") : names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
  }
  return names.slice(0, max).join(", ") + " and " + (names.length - max) + " more";
}

function summaryText(d){
  const g = S.group;
  const lines = [(g.emoji || DEFAULT_EMOJI) + " " + g.name + ": what are we playing"];
  lines.push("");
  if(!d.ranked.length) lines.push("nothing yet, someone go first");
  else {
    const nm = a => { const g2 = d.gamesById[a]; return g2 ? g2.name : a; };
    let shown = 0;
    for(const t of voteTiers(d.ranked)){
      if(shown >= 5) break;
      const votes = t.n + (t.n === 1 ? " vote" : " votes");
      // "=2." marks a tie the way a ladder does, rather than inventing an order
      lines.push(t.appids.length > 1
        ? "=" + t.rank + ". " + andList(t.appids.map(nm)) + " · " + votes + " each"
        : t.rank + ". " + nm(t.appids[0]) + " · " + votes);
      shown += t.appids.length;
    }
  }
  lines.push("");
  lines.push(S.group.paused_at ? "on a break, votes still welcome"
                               : d.votedCount+" of "+d.lookedCount+" in");
  lines.push(location.origin+location.pathname+"#/g/"+g.code);
  return lines.join("\n");
}
function nudgeText(d){
  const voted = new Set((S.ballots||[]).filter(b=>(b.picks||[]).length).map(b=>b.member_id));
  const missing = d.members.filter(m => !voted.has(m.member_id)).map(m=>m.label);
  const link = location.origin+location.pathname+"#/g/"+S.group.code;
  if(!missing.length) return "that's everyone in 🎉 " + link;
  return missing.join(", ") + ": still waiting on your picks 👀\n" + link;
}
/** The text for each share mode; "link" is the bare crew link. */

/* ============================================================================
   RENDER
   ========================================================================== */
/** Snapshot the focused text field so a full re-render can put the cursor
 *  back exactly where it was. Returns the restore function. */
function keepFocus(){
  const el = document.activeElement;
  if(!el || !el.id || !/^(INPUT|TEXTAREA)$/.test(el.tagName)) return () => {};
  const { id, selectionStart: a, selectionEnd: z } = el;
  return () => {
    const n = document.getElementById(id);
    if(!n || n.disabled) return;
    n.focus({ preventScroll: true });
    try{ n.setSelectionRange(a, z); }catch(_){ /* not a text-selectable type */ }
  };
}

/* Every tap re-renders the page, sheet included, which used to throw anything
   scrolled inside a sheet (a long checklist, the emoji grid, details) back to
   the top. So: note where each scrolled box inside the open sheet was, render,
   and put them back if the same sheet is still open. */
function render(){
  const kind = sheet && sheet.kind, saved = [];
  if(kind){
    const boxes = [...document.querySelectorAll(".sheetwrap, .sheetwrap *")];
    boxes.forEach(el => { if(el.scrollTop > 0) saved.push({ key: scrollKey(el), n: boxes.filter(b => scrollKey(b) === scrollKey(el)).indexOf(el), top: el.scrollTop }); });
  }
  renderNow();
  // a sheet slides in when it first opens, not every time it re-renders
  if(sheet && sheet.kind !== lastSheetKind){ const w = document.querySelector(".sheetwrap"); if(w) w.classList.add("enter"); }
  lastSheetKind = sheet ? sheet.kind : null;
  if(kind && sheet && sheet.kind === kind && saved.length){
    const boxes = [...document.querySelectorAll(".sheetwrap, .sheetwrap *")];
    saved.forEach(({ key, n, top }) => { const el = boxes.filter(b => scrollKey(b) === key)[n]; if(el) el.scrollTop = top; });
  }
}
let lastSheetKind = null;
const scrollKey = el => el.id ? "#" + el.id : el.tagName + "." + el.className;

function renderNow(){
  // Nothing behind a sheet should scroll. Without this the shelf drifts around
  // under your thumb while you are trying to use the sheet on top of it.
  document.body.classList.toggle("locked", !!sheet);
  if(!SDK_OK) return renderNoSDK();
  if(!CONFIGURED) return renderSetup();
  const m = location.hash.match(/^#\/g\/([A-Za-z0-9]+)/);
  if(/^#\/admin/.test(location.hash)){ code=""; setTabIdentity("🔑", "Game Night · owner"); applyCrewColour(null); return renderAdmin(); }
  if(!m){ code=""; setTabIdentity(DEFAULT_EMOJI, "Game Night"); applyCrewColour(null); syncMyCrews(); return renderLanding(); }
  const wasCode = code;
  code = m[1].toUpperCase();
  if(code !== wasCode) loadF();
  if(!S || S.group.code !== code) return renderLoading();
  setTabIdentity(S.group.emoji, S.group.name);
  syncTint();
  applyCrewColour(sheet && sheet.kind === "crew" ? sheet.emoji : S.group.emoji);
  renderGroup();
}

function renderGroup(){
  const d = derive();
  const g = S.group;
  const shelf = S.shelf || [];
  const counts = {
    inplay:  shelf.filter(s => stateOf(s,d) !== "benched" && (d.counts[s.appid]||0) > 0).length,
    benched: shelf.filter(s => stateOf(s,d) === "benched").length,
  };
  // The whole shelf, every time. Backlog and played used to be tabs, which
  // meant a game could be "missing" while sitting two taps away. Now the state
  // is a section heading and a card CTA, and the filters are what narrow it.
  // Benched games are the one thing not on the shelf by default. Everything
  // else is, always: no tabs, no gate, no second list.
  const pool = shelf.filter(s => (stateOf(s, d) === "benched") === F.benched);
  const pct = Math.min(100, Math.round((d.votedCount / Math.max(1, g.quorum)) * 100));
  const call = callable(d, g);

  const filtered = sortShelf(pool.filter(s => passes(s, d)), d);
  const active = activeFilters();

  // Rendering replaces the whole DOM, and a poll can land mid-keystroke. Hold
  // the caret wherever it was in whichever text field had it.
  const restoreFocus = keepFocus();
  app.innerHTML = `
    <header class="top"><div class="wrap inner">

                const shut = !!sec.label && folded().includes(sec.label);
                return `
                ${sec.label ? `<h3 class="grouphead"><button class="gh-btn" data-fold="${esc(sec.label)}" aria-expanded="${!shut}">
                  <svg class="gh-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>${esc(sec.label.replace(/^\u25B6\s*/, ""))}<span>${sec.items.length}</span></button></h3>` : ""}
                ${shut ? "" : view === "cards"
                  ? `<div class="grid">${sec.items.map(s => card(s,d)).join("")}</div>`
                  : listView(sec.items, d)}`; }).join("")
            : !pool.length && !active.length && !F.q
            ? F.benched
              ? `<div class="empty"><b>The bench is empty</b>Games you bench land here, and come back whenever.</div>`
              : `<div class="shelf0">
                  <span class="shelf0-e" aria-hidden="true">${esc(g.emoji || DEFAULT_EMOJI)}</span>
                  <h3>The shelf's empty</h3>
                  <p>Chuck in the games you're keen on. Search Steam by name or paste a store link, and each one is up for a vote straight away.</p>

            : `<div class="shelf0 shelf0--none">

    ${pool.length && !g.locked_appid ? `<div class="votebar">
      <div class="st">
        <div class="a">${g.locked_appid ? "Round's called" : d.myPicks.length === 3 ? "Your three are in" : d.myPicks.length ? "Your picks" : "Pick up to three"}</div>
        <div class="pips" aria-hidden="true">${[0,1,2].map(i => `<i class="${i < d.myPicks.length ? "f":""}"></i>`).join("")}</div>

    ${sheet ? renderSheet(d) : ""}`;

  wireGroup(d, filtered);
  wireSesh(d);
  wireLit(d);
  // marks the moment the last person picks, rather than firing for no reason
  if(d.lookedCount > 1 && d.votedCount >= d.lookedCount) critter(g.emoji || DEFAULT_EMOJI);
  settleImages();
  restoreFocus();
  if(tookover){
    const t = document.querySelector(".leadname.tookover");
    if(t) scrambleTo(t, t.textContent);
  }
  lastCounts = {...d.counts};
  if(tookover){ const t = tookover; setTimeout(() => { if(tookover === t) tookover = null; }, 1400); }
}

/* An image the browser already has does not need a fade. Without this, every
   re-render restarts the transition from transparent and the shelf blinks. */
function settleImages(){
  app.querySelectorAll(".art img").forEach(img => {
    if(img.complete && img.naturalWidth){
      img.style.transition = "none";
      img.classList.add("in");
      requestAnimationFrame(() => { img.style.transition = ""; });
    }
  });
}

// stays open once someone opens it, so a tap on a chip doesn't fold it away
function filterPanel(d, pool, counts){
  const n = (fn) => pool.filter(fn).length;
  counts = counts || {};

  /* A chip with nothing behind it is noise. Zero-count options are dropped
     rather than sat there greyed out, with one exception: an option you have
     already selected has to stay visible or you cannot turn it back off. */
  const grp = (label, key, map, getter, wide) => {
    const chips = Object.keys(map).map(k => {
      const val = isNaN(+k) ? k : +k;
      const on = FT()[key].has(val);
      const count = n(s => getter(s, d) === val);
      if(!count && !on) return "";
      return `<button class="chip" data-f="${key}" data-v="${k}" aria-pressed="${on}">
                ${esc(map[k])}<span class="n num">${count}</span></button>`;
    }).join("");
    if(!chips.trim()) return "";
    // wide groups take the whole row so their chips never orphan onto a line of one
    return `<div class="fgroup${wide ? " fgroup--wide" : ""}"><span class="flab">${label}</span>
              <div class="fset">${chips}</div></div>`;
  };

  const crew = FT().crew;
  // The crew filter is the only one that maps to the actual decision on the
  // night, so it gets a surface of its own rather than a fifth identical
  // grey label, and it says in words what it is doing to the shelf.
  const lead = `
    <div class="fcrew">
      <div class="fcrew-l"><span class="flab">How many of us</span>
        <p class="fhint">${crew ? `Hiding anything that cannot seat ${crew}.` : `Every game, whatever its player cap.`}</p></div>
      <div class="stepper">
        <button class="sbtn" data-crew="-" aria-label="Fewer players">\u2212</button>
        <span class="val${crew ? " num" : ""}">${crew ?? "Any"}</span>
        <button class="sbtn" data-crew="+" aria-label="More players">+</button>
        ${crew ? `<button class="clearall" data-crew="off">Any</button>`
               : `<span class="off">${d.lookedCount} in the group</span>`}
      </div>
    </div>`;

  const played = `
    <div class="fgroup"><span class="flab">Have we played it</span>
      <div class="fset fset--seg">
        ${[["","Either"],["fresh","Never"],["again","We have"]].map(([v,l]) =>
          `<button class="chip" data-played="${v}" aria-pressed="${(FT().played||"") === v}">${l}</button>`).join("")}
      </div>
    </div>`;

  // "Shortcuts" was a junk drawer. These are the two or three that narrow the
  // shelf to a specific pile, and they say so.
  const only = `
    <div class="fgroup fgroup--wide"><span class="flab">Only show</span>
      <div class="fset">
        <button class="chip" data-toggle="mine" aria-pressed="${FT().mine}" ${d.myPicks.length?"":"disabled"}>My picks<span class="n num">${d.myPicks.length}</span></button>
        <button class="chip" data-toggle="wellrated" aria-pressed="${FT().wellrated}">85%+ on Steam<span class="n num">${n(s => ((d.gamesById[s.appid]||{}).review_pct ?? 0) >= 85)}</span></button>
        ${n(s => (d.gamesById[s.appid]||{}).demo_appid) || FT().demo ? `<button class="chip" data-toggle="demo" aria-pressed="${FT().demo}">Has a demo<span class="n num">${n(s => (d.gamesById[s.appid]||{}).demo_appid)}</span></button>` : ""}
        ${counts.benched ? `<button class="chip" data-toggle="benched" aria-pressed="${FT().benched}">The bench<span class="n num">${counts.benched}</span></button>` : ""}
      </div>
    </div>`;

  /* Three sections, named for what they are about. The old single "More
     filters" fold was a junk drawer, and because <details> was one grid item
     everything inside it was squeezed into half the sheet while the other
     half sat empty. Sections own the grid now, so nothing is hidden and
     nothing is cramped. */
  const sec = (title, inner) => inner.trim()
    ? `<section class="fsec"><h4>${title}</h4>${inner}</section>` : "";

  return `<div class="fpanel">
    ${sec("Tonight", lead
      + grp("Energy", "energy", ENERGY, (s2,dd) => energyOf(s2, dd))
      + grp("How long", "shape", SHAPE, (s2,dd) => (dd.gamesById[s2.appid]||{}).shape))}
    ${sec("The game",
        grp("What we'll be doing", "doing", DOING, (s2,dd) => doingOf(s2, dd), true)
      + grp("Setup", "setup", SETUP, s2 => s2.setup)
      + grp("Release", "release", RELEASE, (s2,dd) => releaseOf(dd.gamesById[s2.appid])))}
    ${sec("Our record", played + only)}
  </div>`;
}

function listView(list, d){
  // headers set the arrangement, so the table and the toolbar never disagree
  const th = (key, label, align, extra) => `<th class="${align?"r ":""}${extra||""}"><button data-arrange="${key}">${label}${
    arrange===key ? `<span class="dir">\u25BE</span>` : ""}</button></th>`;
  return `<div class="tablewrap"><table>
    <thead><tr>
      ${th("az","Game")}<th class="opt2">Energy</th><th class="opt2">Crew</th>
      <th class="opt">Added by</th>${th("review","Reviews",1,"opt")}${th("votes","Votes",1)}<th class="r"></th>
    </tr></thead>
    <tbody>${list.map(s => {
      const g = d.gamesById[s.appid]||{}, n = d.counts[s.appid]||0, on = d.myPicks.includes(s.appid);
      return `<tr class="${on?"on":""}" data-row="${s.appid}">
        <td class="g"><div class="gcell">
          ${s.appid > 0
            // Steam games show their header art; hand-added ones keep the colour tile
            ? `<img class="lthumb" aria-hidden="true" src="${esc(g.header || `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${s.appid}/header.jpg`)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'lthumb lthumb--tile'}))" style="--tile:hsl(${hueOf(g.name||s.appid)} 40% 47%)">`
            : `<span class="lthumb lthumb--tile" style="--tile:hsl(${hueOf(g.name||s.appid)} 40% 47%)"></span>`}
          <div class="gtext"><button class="rowname" data-facets="${s.appid}" aria-label="Details for ${esc(g.name||"")}">
          <span class="rn">${esc(g.name||s.appid)}</span>${isCustom(g) ? `<span class="pill">${esc(PLATFORM[g.platform])}</span>` : ""}
          <svg class="chev" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          <div class="sub"><span class="narrow">${
            energyOf(s,d) ? esc(ENERGY[energyOf(s,d)])+" · " : ""}${s.crew_max ? "≤ "+s.crew_max+" · " : ""}</span>${
            esc(SHAPE[g.shape]||"")}${doingOf(s,d)?" · "+esc(DOING[doingOf(s,d)]):""}</div></div></div></td>
        <td class="opt2">${energyOf(s,d)?`<span class="pill pill--e${energyOf(s,d)}">${esc(ENERGY[energyOf(s,d)])}</span>`:`<span class="pill">—</span>`}</td>
        <td class="opt2"><button class="pill pill--set" data-facets="${s.appid}" title="${esc(s.crew_note||"")}">${
          s.crew_max ? "≤ "+s.crew_max : "Set"}${s.crew_mod ? " <span class=\"modhint\">+mod</span>" : ""}</button></td>
        <td class="opt">${esc(s.added_name || "\u2014")}</td>
        <td class="r opt num">${g.review_pct!=null?g.review_pct+"%":"—"}</td>
        <td class="r num"${n ? ` title="Picked by ${esc(listNames(pickersOf(d, s.appid)))}"` : ""}>${n}</td>
        <td class="r">${d.nowPlaying ? `<span class="rowpick" style="background:transparent;color:var(--muted)">${d.nowPlaying.appid === s.appid ? "on now" : ""}</span>` : `<button class="rowpick" data-pick="${s.appid}" aria-pressed="${on}">${on?"Picked":d.myPicks.length>=3?"Replace":"Pick"}</button>`}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

/** One strip that says where the round is. It used to be a round panel, a
 *  cover-art hero and a bottom bar all saying the same thing; now the leader
 *  is named once, here, and the beam on its card does the rest. */
/** Names of everyone who picked this game in the current round. */
function pickersOf(d, appid){
  return (S.ballots || []).filter(b => (b.picks || []).includes(appid))
    .map(b => (d.members.find(m => m.member_id === b.member_id) || {}).label).filter(Boolean);
}
/** Header art for the status strip; games added by hand have none. */
function artOf(d, appid){
  if(!appid || appid < 0) return null;
  const g = d.gamesById[appid] || {};
  return g.header || `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${appid}/header.jpg`;
}
/** The strip's thumbnail plus a blurred wash of the same art behind it. */
const stArt = url => url ? `<img class="st-art" src="${esc(url)}" alt="" aria-hidden="true" onerror="this.closest('.status').classList.remove('status--art');this.remove()">` : "";
const stArtAttr = url => url ? ` status--art" style="--art:url('${esc(url)}')` : "";
function renderStatus(d, g, call){
  const solo = d.lookedCount <= 1;
  const menu = `<button class="iconbtn" id="morebtn" aria-label="More" aria-haspopup="dialog"><svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>`;

  if(g.locked_appid){
    const game = d.gamesById[g.locked_appid] || {};
    const art = artOf(d, g.locked_appid);
    // three rounds in a row on the same game deserves a ribbing
    const streak = (() => { const by = {}; (S.plays || []).forEach(pl => { by[pl.round_no] = pl.appid; });
      let n = 0; for(let r = g.round_no; r > 0; r--){ if(by[r] === g.locked_appid) n++; else break; } return n; })();
    return `<section class="status status--playing${stArtAttr(art)}" aria-live="polite">
      ${stArt(art)}
      <div class="st-main">
        <span class="st-k">▶ Playing</span>
        <span class="st-lead"><b class="leadname">${esc(game.name||"")}</b></span>
        <span class="st-sub">round ${g.round_no} · ${(() => { const n = (S.sessions||[]).filter(x => x.appid === g.locked_appid).length;
          return n ? n + (n === 1 ? " night" : " nights") + " so far" : "started " + esc(ago((d.nowPlaying||{}).started_at)); })()}${
          streak >= 3 ? ` · <b>Again?!</b> ${streak} rounds running` : ""}</span>
      </div>
      <div class="st-acts">
        <button class="btn btn--ghost btn--sm" id="closebtn">Done for now</button>
        ${menu}
      </div>
      ${seshLine(seshFor(d, inPlay(d)[0]))}
    </section>`;
  }
  if(g.paused_at){
    return `<section class="status status--paused">
      <div class="st-main">
        <span class="st-k">⏸ On a break</span>
        <span class="st-sub">since ${esc(shortDate(g.paused_at))} · picks still count when you pick it back up</span>
      </div>
      <div class="st-acts">
        <button class="btn btn--sm" id="resumebtn">Pick it back up</button>
        ${menu}
      </div>
    </section>`;
  }
  const top = d.ranked.length ? d.ranked[0] : null;
  const game = top ? d.gamesById[top.appid] : null;
  const tied = top ? d.ranked.filter(r => r.n === top.n) : [];
  const lead = !game ? `<span class="st-lead st-lead--none">No votes yet</span>`
    : tied.length > 1 ? (() => {
        // name them rather than saying "and 2 more", and make the line open the
        // full list with who picked what when the tie is too wide to spell out
        const names = tied.map(r => `<b class="leadname">${esc((d.gamesById[r.appid] || {}).name || "something")}</b>`);
        return `<button class="st-lead st-lead--tie" id="tiebtn" title="Who's tied, and who picked them">Dead heat: ${
          andList(names)} on ${top.n}</button>`;
      })()
    : `<span class="st-lead"><b class="leadname${tookover === top.appid ? " tookover" : ""}">${esc(game.name)}</b> leads with ${top.n}</span>`;
  const sub = solo ? "just you so far, send the link round"
    : `${d.votedCount} of ${d.lookedCount} in${call.ready ? " · enough to call it" : call.short ? " · "+call.short+" more to call it" : ""}`;
  const hour = new Date().getHours();
  const owls = hour >= 1 && hour < 5 ? " · who's still up?" : "";
  const pct = Math.min(100, Math.round((d.votedCount / Math.max(1, Math.min(g.quorum, d.lookedCount))) * 100));
  // art only when one game is clearly ahead; a dead heat has no single face
  const art = game && tied.length === 1 ? artOf(d, top.appid) : null;
  return `<section class="status${call.ready ? " status--ready" : ""}${stArtAttr(art)}" aria-live="polite">
    ${stArt(art)}
    <div class="st-main">
      <span class="st-k">Round ${g.round_no}</span>
      ${lead}
      <span class="st-sub">${sub}${owls}</span>
    </div>
    <div class="st-acts">
      ${tied.length > 1 ? `<button class="btn btn--ghost btn--sm" id="spinbtn" title="Dead heat: let a wheel pick" aria-label="Spin for it">🎡<span class="spinlbl"> Spin for it</span></button>` : ""}
      ${d.ranked.length && !solo ? `<button class="btn btn--sm${call.ready ? "" : " btn--ghost"}${call.ready ? " btn--ready" : ""}" id="closebtn">Call it</button>` : ""}
      ${menu}
    </div>
    ${solo ? "" : `<div class="st-track" aria-hidden="true"><i style="width:${pct}%"></i></div>`}
  </section>`;
}

function card(s, d){
  const state = stateOf(s, d);
  const game = d.gamesById[s.appid] || {name:"Loading…", appid:s.appid};
  const n = d.counts[s.appid]||0, on = d.myPicks.includes(s.appid);
  const eff = energyOf(s, d);
  const cf = crewFit(s, F.crew);
  const takes = d.takesBy[s.appid]||[];
  const tagline = BLURBS[s.appid] || game.short_desc || "";
  const plays = d.playsBy[s.appid] || [];
  const lastPlay = plays[0];
  const isNow = d.nowPlaying && d.nowPlaying.appid === s.appid;
  const called = !!S.group.locked_appid;
  // one card is winning; the beam says which without spending a badge on it
  const isLead = !called && state === "open"
              && d.ranked.length && d.ranked[0].appid === s.appid && n > 0;
  // Everything a glance needs and nothing else: name, one line, three facts.
  // Reviews, setup, Steam, who added it and the long blurb live in details.
  return `<article class="card card--${state}${on?" on":""}${pulse===s.appid?" pulse":""}${isLead?" card--lead":""}">
    <span class="ring" aria-hidden="true"></span>
    <div class="art" style="--tile:hsl(${hueOf(game.name)} 24% 36%);--ang:${20+(s.appid%120)}deg">
      <div class="gen" aria-hidden="true"><span>${esc(monogram(game.name))}</span></div>
      ${game.header ? `<img src="${esc(game.header)}" alt="" loading="lazy" onload="this.classList.add('in')">` : ""}
      <div class="badges">
        ${isNow ? `<span class="bdg bdg--now">▶ playing now</span>`
          : (S.side||[]).some(x => x.appid === s.appid) ? `<span class="bdg bdg--side">on the side</span>`
          : cf === "mods" ? `<span class="bdg bdg--mods">needs a mod</span>`
          : cf === "unknown" && F.crew ? `<span class="bdg">cap unknown</span>`
          : isCustom(game) ? `<span class="bdg">${esc(PLATFORM[game.platform] || "Elsewhere")}${game.is_free ? " · free" : ""}</span>`
          : releaseOf(game) === "soon" ? `<span class="bdg bdg--soon">not out yet</span>`
          : releaseOf(game) === "early" ? `<span class="bdg">early access</span>`
          : ""}
        <span class="sp"></span>
        ${saleOf(d, s.appid) && state !== "benched" ? `<span class="bdg bdg--sale" title="On sale on Steam: ${esc(saleOf(d, s.appid).final_fmt || "")}">−${saleOf(d, s.appid).discount}%</span>` : ""}
        ${state === "benched" ? `<span class="bdg bdg--backlog">benched</span>`
          : plays.length && !isNow ? `<span class="bdg bdg--played" title="Last played ${esc(ago(lastPlay.started_at))}">${
              plays.length > 1 ? "played ×"+plays.length : "played"}</span>` : ""}
      </div>
    </div>
    <div class="body">
      <h3>${esc(game.name)}</h3>
      ${tagline ? `<p class="desc clamp">${esc(tagline)}</p>` : ""}
      <div class="meta">
        ${eff ? `<span class="e e${eff}${energyIsGuess(s,d)?" guess":""}" title="Energy: ${esc(ENERGY[eff])}${energyIsGuess(s,d)?", guessed from Steam tags":""}"><i class="lvl" aria-hidden="true">${
          "●".repeat(eff)}${"○".repeat(3-eff)}</i>${esc(ENERGY[eff])}</span>` : ""}
        <button class="cap" data-facets="${s.appid}" title="${esc(s.crew_note||"Tap to set the player cap")}">${
          s.crew_max ? "Up to "+s.crew_max : "Cap?"}${s.crew_mod ? `<span class="modhint"> · ${s.crew_mod} modded</span>` : ""}</button>
        ${game.shape ? `<span>${esc(SHAPE[game.shape]||game.shape)}</span>` : ""}
        ${(() => { const o = ownLine(d, s.appid); return o ? `<span class="own${o.all ? " own--all" : ""}"${o.who ? ` title="Still to buy: ${esc(o.who)}"` : ""}>${o.all ? "✓ " : ""}${esc(o.text)}</span>` : ""; })()}
        ${lastPlay && !isNow && lastPlay.verdict ? `<span class="v v-${lastPlay.verdict}">${VERDICT_ICON[lastPlay.verdict]} ${esc(VERDICT[lastPlay.verdict])}</span>` : ""}
      </div>
      ${takes.length ? `<p class="take"><b>${esc(takes[0].by)}</b>${esc(takes[0].body)}${takes.length > 1 ? ` <span class="takemore">+${takes.length-1}</span>` : ""}</p>` : ""}
      <div class="foot">
        ${state === "benched"
          ? `<button class="pick" data-unbench="${s.appid}">Put it back</button>`
          : state === "playing"
          ? `<span class="pick pick--static">On right now</span>`
          : called
          ? `<span class="pick pick--static pick--quiet"><span class="n num">${n}</span> ${n===1?"vote":"votes"}</span>`
          : `<button class="pick" data-pick="${s.appid}" aria-pressed="${on}"${n ? ` title="Picked by ${esc(listNames(pickersOf(d, s.appid)))}"` : ""}>${
              on ? "Picked" : d.myPicks.length >= 3 ? "Replace a pick" : "Pick this"
            }<span class="n num${lastCounts[s.appid] != null && lastCounts[s.appid] !== n ? " bump" : ""}">${n}</span></button>`}
        <button class="mini" data-facets="${s.appid}" aria-label="Details for ${esc(game.name)}">
          <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
      </div>
    </div></article>`;
}

// backlogCard removed: card() handles every state, so there is one component
/* ---------- sheets ---------- */
function renderSheet(d){
  const shell = inner => `<div class="sheetwrap" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${inner}</div></div>`;

  // one person's row in the "which one's you" list
  const candRow = c => {
    const voted = (S.ballots||[]).find(b => b.member_id===c.member_id && (b.picks||[]).length);
    const bits = [voted ? voted.picks.length + (voted.picks.length===1?" pick":" picks") : "no picks yet",
                  "last here " + ago(c.last_seen)];
    if(c.device_count>1) bits.push(c.device_count+" devices");
    // whoever started the crew can't be claimed by name, only linked from a device they already use
    if(c.member_id === crewAdminId()) return `<div class="cand cand--locked">
      <span class="dot" style="background:hsl(${hueOf(c.name)} 58% 30%)">${esc(monogram(c.name))}</span>
      <span class="txt"><b>${esc(c.name)}</b><span>Started this crew. If that's you, open the menu on your usual device and use Link another device.</span></span></div>`;
    return `<button class="cand" data-claim="${esc(c.member_id)}">
      <span class="dot" style="background:hsl(${hueOf(c.name)} 58% 30%)">${esc(monogram(c.name))}</span>
      <span class="txt"><b>${esc(c.name)}</b><span>${esc(bits.join(" · "))}</span></span>
      <span style="color:var(--muted)">→</span></button>`;
  };
  if(sheet.kind === "name"){
    if(sheet.step === "match"){
      // the "is that the same as this account" moment
      const many = sheet.candidates.length > 1;
      return shell(`
        <h3>Have we met?</h3>
        <p>There ${many?"are already people":"is already someone"} in this group with a name like
           <b>${esc(sheet.typed)}</b>. If one of them is you, tap it and your picks carry over to this device.</p>
        ${sheet.candidates.map(candRow).join("")}
        <div class="row">
          <button class="btn btn--ghost" id="notme">${nameTaken(sheet.typed, S.members) ? "Not me, pick another name" : "Nah, I'm new"}</button>
        </div>`);
    }
    const returning = !!myName;
    // if the crew already has people and this device isn't one of them, picking
    // yourself off the list beats typing a name that's already there
    const roster = (!myMemberId && sheet.then !== "create" && S && (S.members || []).length) ? S.members : [];
    return shell(`
      <h3>${roster.length ? "Which one's you?" : returning ? "Back again" : "Who's this?"}</h3>
      <p>${roster.length
        ? "Tap your name and your picks, nights and history come with you on this device."
        : returning
        ? "We know you on this device. Only change it if you are, in fact, someone else."
        : "Just a name for the list. No signup, nothing to remember."}</p>
      ${roster.length ? `<div class="candlist">${roster.map(candRow).join("")}</div>
        <span class="eyebrow">Not in the list</span>` : ""}
      <input class="input" id="nameinput" placeholder="Your name" maxlength="24" value="${esc(sheet.typed||"")}"${sheet.taken ? ` aria-invalid="true" aria-describedby="nameerr"` : ""}>
      ${sheet.taken ? `<p class="hint hint--bad" id="nameerr" role="alert">Someone here's already ${esc(sheet.taken)}. Add an initial or a nickname so the crew can tell you apart.</p>` : ""}
      <div class="row"><button class="btn" id="namego">${roster.length ? "I'm new, add me" : returning ? "Continue as "+esc(myName) : "That's me"}</button></div>`);
  }

  if(sheet.kind === "take"){
    const game = d.gamesById[sheet.appid] || {};
    const mine = (d.takesBy[sheet.appid]||[]).find(t => t.mine);
    return shell(`
      <h3>${sheet.fromAdd ? "In it goes. Sell it to us?" : "Your take on "+esc(game.name||"this")}</h3>
      <p>${sheet.fromAdd
        ? "One line on why "+esc(sheet.gameName||"it")+" is worth a night. Shows on the card. Skip if you cannot be bothered."
        : "One line, shows on the card. Be honest."}</p>
      <input class="input" id="takeinput" maxlength="140" placeholder="e.g. peaks at 4, grindy after that" value="${esc(mine?mine.body:"")}">
      <div class="row">
        <button class="btn btn--ghost" id="takeclear">${sheet.fromAdd ? "Skip" : "Clear"}</button>
        <button class="btn" id="takego">Save</button>
      </div>`);
  }

  if(sheet.kind === "facets"){
    const s = (S.shelf||[]).find(x => x.appid === sheet.appid) || {};
    const game = d.gamesById[sheet.appid] || {};
    const takes = d.takesBy[sheet.appid] || [];
    const mine = takes.find(t => t.mine);
    const desc = game.long_desc || game.short_desc || "";
    return `<div class="sheetwrap" data-scrim><div class="sheet sheet--tall" role="dialog" aria-modal="true">
      <div class="sheethead">
        <h3>${esc(game.name||"Game")}</h3>
        <button class="iconbtn" data-dismiss aria-label="Close">✕</button>
      </div>
      <div class="sheetbody">
        <div class="dl">
          ${releaseOf(game) !== "out" ? `<span class="pill pill--rel">${esc(RELEASE[releaseOf(game)])}${releaseOf(game) === "soon" && game.released ? " · " + esc(game.released) : ""}</span>` : ""}
          ${saleOf(d, sheet.appid) ? `<span class="pill pill--sale">−${saleOf(d, sheet.appid).discount}% · ${esc(saleOf(d, sheet.appid).final_fmt || "")}</span>` : d.prices[sheet.appid] && d.prices[sheet.appid].is_free ? `<span class="pill pill--sale">Free</span>` : ""}
          ${game.review_pct != null ? `<span class="pill pill--rev" title="${esc(game.review_desc||"")}">${game.review_pct}% on Steam · ${(game.review_count||0).toLocaleString()} reviews</span>` : ""}
          ${isCustom(game)
            ? `<span class="pill">${esc(PLATFORM[game.platform] || "Elsewhere")}${game.is_free ? " · free" : ""}</span>${game.play_url
              ? `<a class="pill pill--link" href="${esc(game.play_url)}" target="_blank" rel="noopener">${game.platform === "browser" ? "Play" : "Open"} ↗</a>` : ""}`
            : `<a class="pill pill--link" href="https://store.steampowered.com/app/${sheet.appid}/" target="_blank" rel="noopener">Steam ↗</a>`}
          ${game.demo_appid ? `<a class="pill pill--link" href="https://store.steampowered.com/app/${game.demo_appid}/" target="_blank" rel="noopener">Try the demo ↗</a>` : ""}
        </div>
        ${(() => { const bits = [];
          if(s.added_name) bits.push(`Added by ${esc(s.added_name)}`);
          if(!S.group.locked_appid){ const pk = pickersOf(d, sheet.appid);
            bits.push(pk.length ? `Picked this round by <b>${esc(listNames(pk))}</b>` : "No picks this round yet"); }
          return bits.length ? `<p class="addedby">${bits.join(" · ")}</p>` : ""; })()}
        <div class="ownbar">
          <button class="chip" data-ownone="${sheet.appid}" aria-pressed="${iOwn(d, sheet.appid)}">${iOwn(d, sheet.appid) ? "✓ I own it" : "I own it"}</button>
          <span class="pnote">${(() => { const o = [...ownersOf(d, sheet.appid)].map(id => (d.members.find(m => m.member_id === id) || {}).label).filter(Boolean);
            return o.length ? "Owned by " + esc(listNames(o)) : "Nobody's said they own it yet"; })()}</span>
        </div>
        ${desc ? `<div class="dlong${sheet.more ? " open" : ""}" id="dlong">${desc.split(/\n+/).map(pp => pp.trim()).filter(Boolean).map(pp => `<p>${esc(pp)}</p>`).join("")}</div>
          <button class="linkbtn dmore" id="dmore" aria-expanded="${!!sheet.more}" aria-controls="dlong" hidden>${sheet.more ? "Show less" : "Read more"}</button>` : ""}
        ${isCustom(game) && game.custom_group === S.group.code ? `
        <details class="cedit"${sheet.cedit ? " open" : ""}><summary>Not on Steam · edit name, link or platform</summary>
          <div class="cform">
            <label class="fld"><span>Name</span><input class="input" id="cename" maxlength="60" value="${esc(sheet.cename ?? game.name ?? "")}"></label>
            <label class="fld"><span>Link</span><input class="input" id="ceurl" maxlength="300" placeholder="e.g. skribbl.io" value="${esc(sheet.ceurl ?? game.play_url ?? "")}" inputmode="url" autocapitalize="off" spellcheck="false"></label>
            <div class="fset">${Object.keys(PLATFORM).map(k => `<button class="chip" data-ceplat="${k}" aria-pressed="${(sheet.ceplat ?? game.platform) === k}">${esc(PLATFORM[k])}</button>`).join("")}
              <button class="chip" data-cefree aria-pressed="${!!(sheet.cefree ?? game.is_free)}">Free to play</button></div>
          </div>
        </details>` : ""}

        <span class="eyebrow">What people reckon</span>
        ${takes.length ? `<div class="takes">${takes.map(t=>`<p class="take"><b>${esc(t.by)}</b>${esc(t.body)}</p>`).join("")}</div>` : ""}
        <input class="input" id="takeinput" maxlength="140" placeholder="Your one-liner, e.g. grindy after 4" value="${esc(mine?mine.body:"")}">

        <span class="eyebrow">How many can play</span>
        ${s.crew_note ? `<p class="notebox">${esc(s.crew_note)}</p>` : ""}
        <div class="row">
          <label class="fld"><span>Out of the box</span><input class="input" id="fcrew" type="number" min="1" max="500" placeholder="?" value="${s.crew_max ?? ""}"></label>
          <label class="fld"><span>With mods or a server</span><input class="input" id="fmod" type="number" min="1" max="9999" placeholder="?" value="${s.crew_mod ?? ""}"></label>
        </div>
        <span class="eyebrow">Energy</span>
        <div class="eopts">${[1,2,3].map(v => `<button class="eopt" data-fe="${v}" aria-pressed="${(sheet.e ?? energyOf(s,d))===v}"><b>${esc(ENERGY[v])}</b></button>`).join("")}</div>
        <span class="eyebrow">Setup</span>
        <div class="eopts">${Object.keys(SETUP).map(k => `<button class="eopt" data-fs="${k}" aria-pressed="${(sheet.s ?? s.setup)===k}"><b style="font-size:12px">${esc(SETUP[k])}</b></button>`).join("")}</div>
        <span class="eyebrow">What we'll be doing ${doingOf(s,d) && !s.doing ? "· guessed from Steam" : ""}</span>
        <div class="fset">${Object.keys(DOING).map(k => `<button class="chip" data-fv="${k}" aria-pressed="${(sheet.v ?? doingOf(s,d))===k}">${esc(DOING[k])}</button>`).join("")}</div>

        <span class="eyebrow">Have we played it</span>
        ${(d.playsBy[sheet.appid]||[]).length ? `
          <div class="playlog">${(d.playsBy[sheet.appid]||[]).map(pl => `
            <div class="playrow">
              <span>${pl.round_no ? "Round "+pl.round_no : "Before this"}</span>
              <span>${pl.round_no ? esc(ago(pl.started_at)) : "at some point"}</span>
              <span>${pl.verdict ? VERDICT_ICON[pl.verdict]+" "+esc(VERDICT[pl.verdict]) : pl.finished_at ? "no verdict" : "on now"}</span>
              ${pl.finished_at ? `<button class="rowx" data-forget="${pl.round_no}" aria-label="Remove this play">✕</button>` : "<span></span>"}
            </div>`).join("")}</div>` : `<p class="notebox">Nothing logged. Played it before all this? Say so.</p>`}
        <div class="fset">
          ${Object.keys(VERDICT).map(k => `<button class="chip" data-past="${k}">${
            VERDICT_ICON[k]} ${esc(VERDICT[k])}</button>`).join("")}
          <button class="chip" data-past="">Played, no verdict</button>
        </div>
        ${(() => { const ses = (S.sessions||[]).filter(x => x.appid === sheet.appid);
          return ses.length ? `<p class="notebox">${ses.length} ${ses.length === 1 ? "session" : "sessions"}: ${ses.map(x => esc(dayDate(x.day).toLocaleDateString("en-AU",{day:"numeric",month:"short"}))).join(", ")}</p>` : ""; })()}
        ${S.group.locked_appid && stateOf(s, d) === "open" && !(S.side||[]).some(x => x.appid === sheet.appid) ? `
          <span class="eyebrow">On the side</span>
          <p class="fhint">Fewer of you, alongside ${esc((d.gamesById[S.group.locked_appid]||{}).name || "the main game")}. It gets its own strip and picks its own nights.</p>
          <button class="btn btn--ghost" id="sidego">Play it on the side</button>` : ""}
        ${(() => {
          // bench is for everyone and undoable; removing for good is only for whoever started the crew
          const canBench = stateOf(s, d) === "open", canRemove = iRunCrew() && S.group.locked_appid !== sheet.appid;
          if(!canBench && !canRemove) return "";
          if(sheet.rmgame) return `<div class="rmgame"><p class="hint hint--bad">Takes it off the shelf for good: its votes, nights and who owns it. Games you've finished stay in your record.</p>
               <div class="row"><button class="btn btn--ghost btn--sm" id="rmgameno">Keep it</button><button class="btn btn--sm btn--danger" id="rmgameyes">Remove for good</button></div></div>`;
          return `<span class="eyebrow">Off the shelf</span>
            <p class="fhint">${canBench ? "Bench it to take it out of the vote. It sits on the bench and comes back any time." : ""}${canRemove ? (canBench ? " " : "") + "Added by mistake or a double-up? Remove it for good." : ""}</p>
            <div class="offrow">${canBench ? `<button class="btn btn--ghost btn--sm" id="retirego">Bench it</button>` : ""}${
              canRemove ? `<button class="btn btn--ghost btn--sm pdanger" id="rmgameask">Remove for good…</button>` : ""}</div>`;
        })()}
      </div>
      <div class="sheetfoot"><button class="btn" id="facetgo">Save</button></div>
    </div></div>`;
  }

  if(sheet.kind === "add"){
    return shell(`
      <h3>Add a game</h3>
      <p>Search Steam by name, or paste a store link.</p>
      <div class="addfield">
        <input class="input" id="addq" aria-label="Search Steam by name, or paste a store link"
               placeholder="e.g. Valheim, or a Steam link" value="${esc(addQ)}"
               enterkeyhint="search" autocomplete="off" ${busy?"disabled":""}>
        <button class="addgo" id="addgo" aria-label="Look it up" ${busy||addBusy?"disabled":""}>
          ${addBusy
            ? `<span class="spin"></span>`
            : `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`}
        </button>
      </div>
      ${addResults.length ? `<div class="results">${addResults.map(r => {
        const have = (S.shelf||[]).find(x => x.appid === r.appid);
        const st = have ? stateOf(have, d) : null;
        return `
        <div class="res${have ? " res--have" : ""}">
          ${r.header ? `<img src="${esc(r.header)}" alt="" loading="lazy">`
            : `<span style="width:62px;height:29px;border-radius:4px;flex:none;background:hsl(${hueOf(r.name)} 24% 36%)"></span>`}
          <span class="nm">${esc(r.name)}${have ? `<span class="sub">${
            st === "benched" ? "On the bench" : st === "playing" ? "On right now" : "Already on the shelf"}${
            have.added_name ? " \u00B7 added by "+esc(have.added_name) : ""}${
            st === "open" && (d.counts[r.appid]||0) ? " \u00B7 "+d.counts[r.appid]+(d.counts[r.appid]===1?" vote":" votes") : ""}</span>` : ""}</span>
          <span class="resbtns">
            ${!have ? `<button class="btn btn--sm" data-add="${r.appid}">Add it</button>`
              : st === "benched" ? `<button class="btn btn--sm" data-unbench="${r.appid}">Put it back</button>`
              : `<button class="btn btn--ghost btn--sm" data-showcard="${r.appid}">Show it</button>`}
          </span>
        </div>`; }).join("")}</div>` : ""}
      ${addMsg ? `<p class="msg msg--${addMsg.kind==="ok"?"ok":"bad"}">${esc(addMsg.text)}</p>` : ""}
      ${sheet.custom ? customForm() : `<button class="linkbtn" id="customopen">Not on Steam? Browser, Epic, console… add it yourself</button>`}`);
  }

  if(sheet.kind === "sesh"){
    const ip = inPlay(d).find(z => z.appid === sheet.appid);
    if(!ip){ return shell(`<h3>That one's wrapped up</h3><div class="row"><button class="btn btn--ghost" data-dismiss>Close</button></div>`); }
    const x = seshFor(d, ip), game = d.gamesById[ip.appid] || {};
    return shell(`<h3>${ip.side ? "Side game" : "Next sesh"}: ${esc(game.name || "")}</h3>
      <p>${x.lock ? "Locked in. Change it if plans move." : `Tap every night you could play. ${x.total <= 1 ? (x.total ? "Just one of you in so far." : "Nobody's in on it yet.") : x.need >= x.total ? "Needs all " + x.total + " of you." : "Needs " + x.need + " of " + x.total + "."}`}</p>
      <div id="seshbody">${seshBody(d, x)}</div>
      ${ip.side ? "" : `<button class="linkbtn" id="seshrulesjump">Night rules: ${esc(needWords(S.group.sesh_need, (S.members||[]).length).val)} free, starts ${esc(S.group.sesh_time || "8pm")} · change</button>`}
      <div class="row"><button class="btn btn--ghost" data-dismiss>Done</button></div>`);
  }

  if(sheet.kind === "seshrules"){
    const total = (S.members||[]).length, w = needWords(sheet.need, total);
    return shell(`<h3>Night rules</h3>
      <p>How the crew picks a night. Changes it for everyone.</p>
      <div class="rules">
        <div class="rulesrow">A night works when this many are free</div>
        <div class="rulesrow"><span class="stepper"><button class="sbtn" data-need="-" aria-label="Fewer">\u2212</button><span class="val num" id="needval">${esc(w.val)}</span><button class="sbtn" data-need="+" aria-label="More">+</button></span></div>
        <p class="fhint" id="needhint">${esc(w.hint)}</p>
        <label class="rulesrow">Usual start <input class="input" id="seshtime" maxlength="12" value="${esc(sheet.time)}" placeholder="8pm" autocomplete="off"></label>
      </div>
      <p class="hint hint--bad" id="rulesmsg" hidden></p>
      <div class="row"><button class="btn btn--ghost" data-${sheet.back ? "rulesback" : "dismiss"}>${sheet.back ? "Back" : "Cancel"}</button><button class="btn" id="rulessave">Save</button></div>`);
  }

  if(sheet.kind === "sidewrap"){
    const game = d.gamesById[sheet.appid] || {};
    return shell(`<h3>Wrap up ${esc(game.name || "")}?</h3>
      <p>It goes into play history like any other game. Nothing's deleted, and it can go on the side again later.</p>
      <div class="fset">${Object.keys(VERDICT).map(k => `<button class="chip" data-sv="${k}" aria-pressed="${sheet.verdict === k}">${VERDICT_ICON[k]} ${esc(VERDICT[k])}</button>`).join("")}</div>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Not yet</button><button class="btn" id="sidewrapgo">Wrap it up</button></div>`);
  }

  if(sheet.kind === "crew"){
    return shell(`<h3>Edit crew</h3>
      <p>Changes it for everyone in the crew. The emoji shows on the browser tab too.</p>
      <div class="crewedit">
        <span class="ebtn ebtn--lg" id="crewpreview" aria-hidden="true">${esc(sheet.emoji)}</span>
        <input class="input" id="crewname" maxlength="40" aria-label="Crew name" value="${esc(sheet.name)}" autocomplete="off">
      </div>
      ${emojiPicker(sheet.emoji)}

      <p class="hint hint--bad" id="crewmsg" hidden></p>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Cancel</button><button class="btn" id="crewsave">Save</button></div>`);
  }

  if(sheet.kind === "pair"){
    return shell(`<h3>Link this device</h3>
      <p>On the phone or computer you already use: tap your name up top, then <b>Link another device</b>. Type the six characters it shows.</p>
      <input class="input codebox" id="pairin" maxlength="7" placeholder="e.g. K7Q M2X" autocapitalize="characters" autocomplete="off" spellcheck="false" value="${esc(sheet.code || "")}">
      <p class="hint" id="pairmsg" aria-live="polite"></p>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Cancel</button><button class="btn" id="pairgo"${(sheet.code || "").length === 6 ? "" : " disabled"}>Link it</button></div>`);
  }

  if(sheet.kind === "emoji"){
    return shell(`<h3>Pick an emoji</h3>
      <p>It's the crew's icon, on the tab and in your list.</p>
      ${emojiPicker(newCrew.emoji)}`);
  }

  if(sheet.kind === "owns") return shell(ownsSheet(d));
  if(sheet.kind === "spin") return shell(spinSheet(d));

  if(sheet.kind === "discord"){
    const on = !!S.group.discord;
    return shell(`<h3>Discord scoreboard</h3>
      ${on ? `<p>It's on. One message in your channel keeps itself up to date: the top picks, who's still to vote, and the next night once you're playing. Big moments post a fresh one.</p>
        <p class="hint" id="dcmsg" aria-live="polite"></p>
        <div class="row"><button class="btn btn--ghost" id="dcoff">Turn it off</button><button class="btn" id="dcpost">Post a fresh one</button></div>
        ${sheet.back ? `<button class="linkbtn" data-shareback>← Back to send to the chat</button>` : ""}`
      : `<p>One message in your channel that updates itself as people vote and pick nights. Anyone taps the title to jump in.</p>
        <ol class="steps">
          <li>In Discord, hover the channel and tap the <b>cog</b></li>
          <li><b>Integrations</b> → <b>Webhooks</b> → <b>New Webhook</b></li>
          <li><b>Copy Webhook URL</b> and paste it here</li>
        </ol>
        <input class="input" id="dchook" placeholder="https://discord.com/api/webhooks/…" autocomplete="off" spellcheck="false" aria-label="Discord webhook link">
        <p class="hint" id="dcmsg" aria-live="polite">Only this crew's scoreboard uses it. Nobody else sees the link.</p>
        <div class="row"><button class="btn btn--ghost" ${sheet.back ? "data-shareback" : "data-dismiss"}>${sheet.back ? "Back" : "Cancel"}</button><button class="btn" id="dcgo" disabled>Connect</button></div>`}`);
  }

  if(sheet.kind === "people"){
    const ms = d.members, me = myMemberId;
    const meta = mm => [mm.member_id === crewAdminId() ? "started the crew" : "",
      mm.device_count > 1 ? mm.device_count + " devices" : "", "last here " + ago(mm.last_seen)].filter(Boolean).join(" · ");
    const dot = mm => `<span class="dot" style="background:hsl(${hueOf(mm.name)} 58% 30%)">${esc(monogram(mm.name))}</span>`;
    if(sheet.merge){
      const from = ms.find(x => x.member_id === sheet.merge);
      if(from) return shell(`<h3>Who's ${esc(from.label)} really?</h3>
        <p>Their picks, nights and devices move across. Where both answered, the one you tap keeps theirs.</p>
        ${ms.filter(x => x.member_id !== from.member_id).map(x => `<button class="cand" data-mergeinto="${esc(x.member_id)}">${dot(x)}
          <span class="txt"><b>${esc(x.label)}</b><span>${esc(meta(x))}</span></span><span style="color:var(--muted)">→</span></button>`).join("")}
        <div class="row"><button class="btn btn--ghost" data-peopleback>Back</button></div>`);
    }
    return shell(`<h3>Manage crew</h3>
      <p>You started the crew, so tidying up is on you. Removing someone clears their picks and nights; they can join again with the link.</p>
      <div class="plist">${ms.map(mm => {
        const twin = mm.member_id !== me && ms.find(x => x.member_id !== mm.member_id && nameMatches(mm.name, [x]).length);
        return `<div class="prow">${dot(mm)}
          <span class="txt"><b>${esc(mm.label)}${mm.member_id === me ? ` <em>you</em>` : ""}</b>
            <span>${esc(meta(mm))}${twin ? ` · <b class="twin">maybe ${esc(twin.label)}?</b>` : ""}</span></span>
          ${mm.member_id === me ? "" : sheet.rm === mm.member_id
            ? `<span class="pacts"><button class="btn btn--ghost btn--sm" data-rmno>Keep</button><button class="btn btn--sm btn--danger" data-rmyes="${esc(mm.member_id)}">Remove ${esc(mm.label)}</button></span>`
            : `<span class="pacts"><button class="btn btn--ghost btn--sm" data-merge="${esc(mm.member_id)}">Merge</button><button class="btn btn--ghost btn--sm pdanger" data-rm="${esc(mm.member_id)}">Remove</button></span>`}
        </div>`; }).join("")}</div>
      ${sheet.delcrew
        ? `<div class="rmgame"><p class="hint hint--bad">Deletes ${esc(S.group.name)} for everyone: every game, vote and night. There's no undo.</p>
             <div class="row"><button class="btn btn--ghost btn--sm" id="delcrewno">Keep it</button><button class="btn btn--sm btn--danger" id="delcrewyes">Delete the crew</button></div></div>`
        : `<button class="danger" id="delcrewask">Delete this crew…</button>`}
      <div class="row"><button class="btn btn--ghost" data-dismiss>Done</button></div>`);
  }

  if(sheet.kind === "menu"){
    return shell(`
      <h3>${esc(S.group.emoji || DEFAULT_EMOJI)} ${esc(S.group.name)}</h3>
      <span class="eyebrow">Who's in</span>
      <div class="crew">${d.members.length ? d.members.map(mm => {
        const voted = (S.ballots||[]).some(b => b.member_id===mm.member_id && (b.picks||[]).length);
        return `<span class="who${voted?"":" novote"}" title="${voted?"voted":"not voted yet"}">
          ${isLive(mm.last_seen) ? `<span class="livedot" title="here now"></span>` : ""}
          <span class="dot" style="background:hsl(${hueOf(mm.name)} 45% 42%)">${esc(mm.label[0].toUpperCase())}</span>${esc(mm.label)}</span>`;
      }).join("") : `<span class="empty">Just you so far.</span>`}</div>
      <div class="menu">
        <button class="menuitem" id="sharemenu"><b>Send to the chat</b><span>${S.group.discord ? "Discord scoreboard's on · or copy an update" : "Link, update, reminder, or a live Discord scoreboard"}</span></button>
      </div>
      <span class="eyebrow">Crew settings</span>
      <div class="menu">
        <button class="menuitem" id="editcrew"><b>Edit crew</b><span>Name and emoji</span></button>
        <button class="menuitem" id="seshrulesbtn"><b>Night rules</b><span>How many make a night, and the usual start</span></button>
        ${iRunCrew() ? `<button class="menuitem" id="peoplebtn"><b>Manage crew</b><span>Merge double-ups, remove people, delete the crew · only you, you started it</span></button>` : ""}
      </div>
      ${S.group.paused_at && !S.group.locked_appid ? "" : `<span class="eyebrow">This round</span>`}
      <div class="menu">
        ${S.group.locked_appid
          ? `<button class="menuitem" id="reopenbtn"><b>Changed our minds</b><span>Reopen the vote</span></button>`
          : S.group.paused_at ? ""
          : `<button class="menuitem" id="breakbtn"><b>Taking a break</b><span>Pause the round, picks stay</span></button>`}
      </div>`);

  if(sheet.kind === "shuffle"){
    const game = d.gamesById[sheet.appid] || {};

  if(sheet.kind === "close"){

        </div>

      <div class="row"><button class="btn btn--ghost" data-dismiss>Not yet</button>
      <button class="btn" id="closego">Lock it in</button></div>`);
  }

  if(sheet.kind === "resume"){
    const n = sheet.crew ?? d.lookedCount;
    const fits = (S.shelf||[]).filter(x => stateOf(x,d) !== "benched" && crewFit(x, n) !== "no").length;
    return shell(`<h3>Back on</h3>
      <p>How many of us this time? It sets your crew filter so nothing that can't seat you all gets in the way.</p>

        <button class="sbtn" data-rcrew="-" aria-label="Fewer">\u2212</button>
        <span class="val num">${n}</span>
        <button class="sbtn" data-rcrew="+" aria-label="More">+</button>
        <span class="off">${fits} of ${(S.shelf||[]).length} fit</span>
      </div>
      <div class="row">
        <button class="btn btn--ghost" id="resumeskip">Skip</button>
        <button class="btn" id="resumego">Back on</button>
      </div>`);
  }

  if(sheet.kind === "share"){
    // one place for everything that goes to a chat: the live Discord scoreboard up top,
    // then a one-off message for anywhere else (WhatsApp, Messenger, iMessage, Slack…)
    const mode = sheet.mode || "snap";
    const canSesh = inPlay(d).length > 0;
    const body = mode === "snap" ? "" : shareBody(d, mode);
    const canNative = !!navigator.share;
    return shell(`<h3>Send to the chat</h3>
      <button class="menuitem dcrow" id="discordrow"><b>${S.group.discord ? "✓ Discord scoreboard is on" : "Live Discord scoreboard"}</b>
        <span>${S.group.discord ? "One message in your channel that keeps itself up to date · manage" : "One message in your channel that updates itself · set up"}</span></button>
      <span class="eyebrow">Or send a one-off</span>
      ${(() => {
        // most of the time it's a picture or a link; the wordier ones wait behind More ways
        const more = sheet.moreways || ["state", "nudge", "sesh"].includes(mode);
        return `<div class="fset fset--seg">
        <button class="chip" data-sharemode="snap" aria-pressed="${mode === "snap"}">Snapshot</button>
        <button class="chip" data-sharemode="link" aria-pressed="${mode === "link"}">Link</button>
        ${more ? `<button class="chip" data-sharemode="state" aria-pressed="${mode === "state"}">Update</button>
        <button class="chip" data-sharemode="nudge" aria-pressed="${mode === "nudge"}">Reminder</button>
        ${canSesh ? `<button class="chip" data-sharemode="sesh" aria-pressed="${mode === "sesh"}">When's next</button>` : ""}`
        : `<button class="chip" id="moreways">More ways…</button>`}
      </div>`; })()}
      ${mode === "snap" ? `<p class="fhint">The scoreboard as a picture, for anywhere a live one can't go: Discord DMs, Messenger, WhatsApp. It's a snapshot, so it won't update itself.</p>
      <div class="snapwrap"><img id="snapimg" alt="Snapshot of ${esc(S.group.name)}'s scoreboard"><span class="snapwait">Drawing it…</span></div>
      <div class="row">
        ${navigator.share ? `<button class="btn" id="snapshare">Share…</button>` : ""}
        ${window.ClipboardItem && navigator.clipboard && navigator.clipboard.write ? `<button class="btn${navigator.share ? " btn--ghost" : ""}" id="snapcopy">Copy image</button>` : ""}
        <a class="btn btn--ghost" id="snapsave" href="#" download>Save</a>
      </div>` : `
      <p class="fhint">${mode === "link" ? "Just the link. Anyone with it can join the crew." : mode === "sesh" ? "Where the next night is at, and who still owes theirs." : mode === "nudge" ? "Names whoever hasn't voted yet." : "The leaderboard, plus the link."}</p>
      <pre class="sharepre">${esc(body)}</pre>
      <div class="row">${canNative ? `<button class="btn btn--ghost" id="nativeshare">Share…</button>` : ""}<button class="btn" id="copyshare">Copy it</button></div>`}`);
  }

  if(sheet.kind === "tie"){
    const top = d.ranked.length ? d.ranked[0] : null;
    const tied = top ? d.ranked.filter(r => r.n === top.n) : [];
    return shell(`<h3>Dead heat on ${top ? top.n : 0}</h3>
      <p class="fhint">${tied.length} games level. Call it and the dice decides, spin the wheel, or wait for the rest of the picks.</p>
      <div class="tielist">${tied.map(r => {
        const g2 = d.gamesById[r.appid] || {};
        const who = pickersOf(d, r.appid);
        const art = artOf(d, r.appid);
        return `<button class="tierow" data-tiego="${r.appid}">
          ${art ? `<img class="lthumb" src="${esc(art)}" alt="" loading="lazy">` : `<span class="lthumb lthumb--tile"></span>`}
          <span class="tiename"><b>${esc(g2.name || "something")}</b>
            <span>${who.length ? "picked by " + esc(andList(who, 4)) : "no names on it"}</span></span>
          <span class="chev" aria-hidden="true">\u203A</span></button>`;
      }).join("")}</div>`);
  }
  if(sheet.kind === "filters"){
    const draft = fDraft || F;
    const shelfAll = S.shelf || [];
    const counts = {
      benched: shelfAll.filter(x => stateOf(x,d) === "benched").length,
    };
    // counts are over the whole shelf, same as what the sheet will apply to
    const pool = (S.shelf || []).filter(x => (stateOf(x,d) === "benched") === draft.benched);
    const n = pool.filter(x => passes(x, d, draft)).length;
    const on = activeFilters(draft).length;
    return `<div class="sheetwrap" data-scrim><div class="sheet sheet--tall" role="dialog" aria-modal="true">
      <div class="sheethead">
        <h3>Filters</h3>
        ${on ? `<button class="clearall" id="fclear">Clear ${on}</button>` : ""}
        <button class="iconbtn" data-dismiss aria-label="Close">\u2715</button>
      </div>
      <div class="sheetbody">${filterPanel(d, pool, counts)}</div>
      <div class="sheetfoot">
        ${n
          ? `<button class="btn" id="fapply">Show ${n} game${n===1?"":"s"}</button>`
          : `<button class="btn" id="fclearall">Nothing matches. Start again</button>`}
      </div>
    </div></div>`;
  }

  if(sheet.kind === "arrange"){
    const set = (keys) => `<div class="fset">${keys.map(k =>
      `<button class="chip" data-arrange="${k}" aria-pressed="${arrange===k}">${esc(ARRANGE[k].label)}</button>`).join("")}</div>`;
    const flat = Object.keys(ARRANGE).filter(k => ARRANGE[k].group === "none");
    const grouped = Object.keys(ARRANGE).filter(k => ARRANGE[k].group !== "none");
    return shell(`<h3>Arrange</h3>
      <div class="fgroup"><div class="lab"><span class="eyebrow">One list</span></div>${set(flat)}</div>
      <div class="fgroup"><div class="lab"><span class="eyebrow">In sections</span></div>${set(grouped)}</div>`);
  }

  if(sheet.kind === "me"){
    const me = d.meMember || {};
    return shell(`<h3>That's you</h3>
      <p>Rename yourself here and your votes come with you.</p>
      <label class="rulesrow" for="renameinput">Your name</label>
      <input class="input" id="renameinput" maxlength="24" value="${esc(sheet.typed ?? me.name ?? "")}"${sheet.taken ? ` aria-invalid="true" aria-describedby="nameerr"` : ""}>
      ${sheet.taken ? `<p class="hint hint--bad" id="nameerr" role="alert">Someone here's already ${esc(sheet.taken)}. Try an initial or a nickname.</p>` : ""}
      <div class="row"><button class="btn" id="renamego">Save name</button></div>
      ${me.device_count > 1 ? `<div class="rules">
        <div class="rulesrow"><b>Linked on ${me.device_count} browsers</b></div>
        <p class="fhint">They all count as the same you. Swapped phones or used a borrowed laptop? Unlink the others and they'll ask who you are next time.</p>
        <button class="btn btn--ghost btn--sm btn--on2" id="unlinkothers" style="align-self:flex-start">Unlink the others</button>
      </div>` : ""}
      <div class="rules">
        <div class="rulesrow"><b>Your other phone or computer</b></div>
        ${sheet.pair ? `<p class="fhint">On the other device, open this link, or open Game Night and tap <b>Using it somewhere else already?</b> and type the code. Works for the next ten minutes, once.</p>
          <div class="paircode num" aria-label="Link code ${esc(sheet.pair.split("").join(" "))}">${esc(sheet.pair.slice(0, 3))} ${esc(sheet.pair.slice(3))}</div>
          <div class="row"><button class="btn btn--ghost btn--sm btn--on2" id="paircopy">Copy the link</button>${navigator.share ? `<button class="btn btn--ghost btn--sm btn--on2" id="pairshare">Share…</button>` : ""}</div>`
        : `<p class="fhint">Link it to you here and it picks up all your crews at once, as you. No need to open each crew's link again.</p>
          <button class="btn btn--ghost btn--sm btn--on2" id="pairstart" style="align-self:flex-start">Link another device</button>`}
      </div>`);
  }

  if(sheet.kind === "switch"){
    return shell(`<h3>Your crews</h3>
      <div class="mygroups">${myGroups.map(g => `<button class="mygroup${g.code === code ? " mygroup--here" : ""}" data-open="${esc(g.code)}"${g.code === code ? ' aria-current="true"' : ""}>
        ${crewTile(g)}
        <span class="nm">${esc(g.name)}</span><span class="cd">${g.code === code ? "You're here" : esc(g.code)}</span></button>`).join("")}</div>
      <div class="row"><button class="btn btn--ghost" id="tolanding">Start or join another</button></div>`);
  }
  return "";
}
