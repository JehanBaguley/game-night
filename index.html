<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Night</title>
<meta name="description" content="Pick what we play next.">
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://shared.cloudflare.steamstatic.com">

<style>
/* ==========================================================================
   TOKENS
   Built on the Core Tier 1 ramps (neutral / red / yellow / green / blue),
   used the Notion and Discord way: the 100s and 200s carry backgrounds, the
   700s and 800s carry the text on them, and nothing sits at full saturation.
   Light is Notion (warm-neutral ground, white surfaces, hairline separation);
   dark is Discord (neutral 900 ground, lifted surfaces, one vivid accent).

   Complete palette on bare :root, redefined by the two blocks after it, so no
   colour is ever declared only inside a media query.

   Core Tier 1 reference, sampled from Foundations:
     neutral 100 #F1F1F2 · 200 #D0D2D5 · 300 #B3B6BB · 400 #9699A0 · 500 #7A7E87
             600 #61646B · 700 #484A4F · 800 #313337 · 900 #1C1D1F
     green   100 #CFF1E3 · 300 #78D3B1 · 400 #2EB88F · 700 #00764D · 800 #00623F
   Accent is deliberately NOT from that ramp. Violet 700 #5B2AB8 in light,
   violet 300 #B79BF0 in dark, so the action colour never collides with the
   blue / amber / red the energy pills use.
     blue    100 #CBEFF9 · 300 #69CEE6 · 600 #0082A8 · 800 #005C79
     yellow  100 #FCE3C8 · 300 #F2B772 · 700 #9D5400 · 800 #7E4100
     red     100 #FFDDD9 · 300 #FF9E96 · 700 #A5292B · 800 #892122
   ========================================================================== */
:root{
  --ground:#F7F7F8; --surface:#FFFFFF; --surface-2:#F1F1F2; --surface-3:#E4E5E8;
  --ink:#1C1D1F; --ink-2:#484A4F; --muted:#61646B;
  --line:#E8E9EB; --line-strong:#D0D2D5;

  /* violet is the only action colour: picked, voted, live, primary buttons */
  --accent:#5B2AB8; --accent-ink:#FFFFFF; --accent-soft:#EDE4FF;

  /* energy ramp: blue / yellow / red from the same family, pastel background
     with the deep step on top so the small pill text stays readable */
  --e1:#005C79; --e1-bg:#CBEFF9; --e1-ink:#FFFFFF;
  --e2:#7E4100; --e2-bg:#FCE3C8; --e2-ink:#FFFFFF;
  --e3:#892122; --e3-bg:#FFDDD9; --e3-ink:#FFFFFF;
  --live:#5B2AB8;

  /* -apple-system first so Safari picks San Francisco, system-ui after it for
     everyone else. One family throughout, weight and size do the work. */
  --f-body:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto,
           "Helvetica Neue", Arial, sans-serif;
  --f-display:var(--f-body);
  --f-mono:var(--f-body);

  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --shadow:0 1px 2px rgba(28,29,31,.06), 0 2px 8px rgba(28,29,31,.04);
  --shadow-up:0 -1px 14px rgba(28,29,31,.10);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1C1D1F; --surface:#26272A; --surface-2:#313337; --surface-3:#3E4045;
    --ink:#F1F1F2; --ink-2:#C7C9CD; --muted:#B3B6BB;
    --line:#313337; --line-strong:#484A4F;
    --accent:#B79BF0; --accent-ink:#1B0B33; --accent-soft:#2A1A47;
    --e1:#69CEE6; --e1-bg:#0C2C36; --e1-ink:#0C2126;
    --e2:#F2B772; --e2-bg:#33260F; --e2-ink:#2B1F0C;
    --e3:#FF9E96; --e3-bg:#331C1A; --e3-ink:#2B1512;
    --live:#B79BF0;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-up:0 -1px 16px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#1C1D1F; --surface:#26272A; --surface-2:#313337; --surface-3:#3E4045;
  --ink:#F1F1F2; --ink-2:#C7C9CD; --muted:#B3B6BB;
  --line:#313337; --line-strong:#484A4F;
  --accent:#B79BF0; --accent-ink:#1B0B33; --accent-soft:#2A1A47;
  --e1:#69CEE6; --e1-bg:#0C2C36; --e1-ink:#0C2126;
  --e2:#F2B772; --e2-bg:#33260F; --e2-ink:#2B1F0C;
  --e3:#FF9E96; --e3-bg:#331C1A; --e3-ink:#2B1512;
  --live:#B79BF0;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-up:0 -1px 16px rgba(0,0,0,.5);
}

/* ========================================================================== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-synthesis-weight:none;
  padding-bottom:calc(74px + var(--safe-b));
}
@media (min-width:900px){ body{padding-bottom:40px} }

h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance;font-weight:650}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* the uppercase tracked micro-label does the job a mono face used to */
.eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.wrap{max-width:1220px;margin:0 auto;padding:0 14px}
@media (min-width:900px){ .wrap{padding:0 24px} }

/* ---------- controls ---------- */
.btn{
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 15px;border-radius:var(--r-md);font-size:13.5px;font-weight:600;
  background:var(--accent);color:var(--accent-ink);border:0;
  transition:filter .12s;
}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn--ghost{background:var(--surface-2);color:var(--ink-2);font-weight:600}
.btn--ghost:hover{background:var(--surface-3);color:var(--ink);filter:none}
.btn--sm{min-height:34px;padding:0 11px;font-size:12.5px}
.input{
  min-height:42px;width:100%;padding:0 12px;background:var(--surface-2);color:var(--ink);
  border:0;border-radius:var(--r-md);font-size:14.5px;
}
.input::placeholder{color:var(--muted)}
.input:focus{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);
}
.top .inner{display:flex;align-items:center;gap:8px;min-height:54px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1}
.brand .gn{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand .code{font-size:10px;color:var(--muted);letter-spacing:.09em;flex:none;font-weight:600}
.iconbtn{
  min-width:38px;min-height:38px;display:grid;place-items:center;flex:none;
  border-radius:var(--r-md);color:var(--ink-2);background:var(--surface-2);
  transition:background .12s,color .12s;
}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn svg{width:16px;height:16px;stroke-width:2;fill:none;stroke:currentColor}
.mepill{
  display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px 0 4px;
  border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;flex:none;max-width:150px;
}
.mepill:hover{background:var(--surface-3)}
.mepill span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){ .mepill span.nm{display:none} .mepill{padding:0 4px} }

/* ---------- round strip ---------- */
.round{
  margin-top:12px;background:var(--surface);border-radius:var(--r-lg);
  padding:13px 14px;display:flex;flex-direction:column;gap:9px;
}
.round.locked{box-shadow:inset 0 0 0 1px var(--accent)}
.round--paused{box-shadow:inset 0 0 0 1px var(--line-strong)}
.round--paused h2{color:var(--muted)}
.round .line1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.round h2{font-size:15.5px;font-weight:650}
.round .when{font-size:12.5px;color:var(--muted);margin-left:auto}
.progress{height:4px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.round .line2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
@media (max-width:480px){
  .round .line2 > span{flex:1 0 100%}
  .round .line2 .btn{flex:1 1 0;margin-left:0!important}
}
.flash{
  background:var(--accent-soft);color:var(--accent);border-radius:var(--r-md);
  padding:9px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;
}

/* ---------- leader ---------- */
.leader{margin-top:12px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
/* explicit height, not aspect-ratio: at full desktop width the ratio would make
   this a 500px hero, and capping with max-height narrows the box instead */
.leader .art{position:relative;width:100%;height:clamp(140px,36vw,220px);overflow:hidden}
.leader .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.leader .art img.in{opacity:1}
/* the banner carries white text over the placeholder as well as over real
   cover art, so darken the generated tile here specifically */
.leader .art .gen{filter:brightness(.72) saturate(.85)}
.leader .scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.62) 45%,rgba(0,0,0,.95) 100%)}
.leader .cap{
  position:absolute;left:14px;right:14px;bottom:11px;z-index:2;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}
.leader .cap .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:#fff;opacity:.92}
.leader .cap .t{font-size:22px;font-weight:650;line-height:1.12;letter-spacing:-.015em}
.leader .cap .m{font-size:12px;opacity:.85}

/* ---------- section heads ---------- */
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:28px 0 10px}
.sechead h2{font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sechead p{font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:0;text-transform:none}

/* ==========================================================================
   TOOLBAR + FILTERS
   ========================================================================== */
/* the toolbar sticks under the header, so filters stay reachable however far
   down a long shelf you have scrolled */
.toolbar{
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  background:var(--ground);padding:0 0 8px;
}
/* phone: search owns row one, the controls wrap onto row two. The tabs used to
   occupy that row, so this is height-neutral and nothing has to scroll sideways */
.toolbar .searchwrap{flex:1 0 100%;min-width:0}
.toolbar .tbtn,.toolbar .seg{flex:none}
/* Group and the Fits shortcut stay off the phone toolbar: with sections on by
   default they are rare, and they are both a tap away in the sheet.
   These sit next to .tbtn and .fgroup, which also set display, so they are
   scoped one level deeper to actually win rather than reaching for !important */
@media (min-width:900px){
  .toolbar .searchwrap{flex:1 1 auto}
}


/* thumbs need more room than a cursor does, without wrecking desktop density */
@media (pointer: coarse){
  .more{padding:6px 2px}
  .pill--set{padding:8px 9px}
  .take{padding:2px 0}
}

/* one shelf, no tabs. Everything is always on it and the sections carry the
   state, so there is no hidden slice and no "which tab was that in" moment. */
.shelfbar{
  position:sticky;top:54px;z-index:30;background:var(--ground);
  margin:0 -14px;padding:2px 14px 0;
  transition:box-shadow .18s ease;
}
.shelfbar.is-stuck{box-shadow:0 8px 18px -14px rgba(0,0,0,.55)}
@media (min-width:900px){ .shelfbar{margin:0 -24px;padding:2px 24px 0} }

.searchwrap{position:relative;flex:1 1 180px;min-width:0}
.searchwrap .input{padding-left:34px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.searchwrap .clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:var(--r-sm)}
.tbtn{
  min-height:42px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;flex:none;
  border-radius:var(--r-md);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2);
  transition:background .12s,color .12s;
}
.tbtn:hover{background:var(--surface-3);color:var(--ink)}
.tbtn[aria-expanded="true"],.tbtn.on{background:var(--accent);color:var(--accent-ink)}
.tbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.tbtn .badge{
  font-size:10px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;
}
.tbtn[aria-expanded="true"] .badge{background:var(--accent-ink);color:var(--accent)}
.seg{display:flex;border-radius:var(--r-md);overflow:hidden;flex:none;background:var(--surface-2)}
.seg button{min-width:42px;min-height:42px;display:grid;place-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* two columns once there is room, so the panel does not push the shelf
   off the screen when several filter groups are open */
.fpanel{
  margin-top:8px;background:var(--surface);border-radius:var(--r-lg);
  padding:15px;display:grid;gap:13px 26px;grid-template-columns:1fr;
}
@media (min-width:820px){
  .fpanel{grid-template-columns:1fr 1fr}
}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup > .lab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fset{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  min-height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;
  border-radius:var(--r-md);font-size:12.5px;font-weight:600;color:var(--ink-2);
  white-space:nowrap;background:var(--surface-2);
  transition:background .12s,color .12s;
}
.chip:hover{background:var(--surface-3)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .n{font-size:10.5px;opacity:.65;font-weight:500}
.chip:disabled{opacity:.35;cursor:not-allowed}
/* thumbs, not cursors: the controls you actually tap get the 44px floor on a
   phone, while desktop keeps its tighter density */
@media (max-width:640px){
  .chip{min-height:40px}
  .btn--sm{min-height:40px}
  .iconbtn,.mepill{min-height:44px}
  .mini,.pick{min-height:44px}
  .rowx{width:32px;height:32px}
  .abchip{min-height:32px}
  .abchip button{width:26px;height:26px}
  .more{padding:9px 2px;font-size:12.5px}
}

.stepper{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.stepper .sbtn{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;font-size:18px;color:var(--ink-2);background:var(--surface-2)}
.stepper .sbtn:hover{background:var(--surface-3);color:var(--ink)}
.stepper .val{font-size:20px;font-weight:700;min-width:52px;text-align:center}
.stepper .val:not(.num){font-size:14px;color:var(--muted);font-weight:600}
.stepper .off{font-size:12.5px;color:var(--muted)}

.activebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px}
.abchip{
  display:inline-flex;align-items:center;gap:5px;min-height:28px;padding:0 5px 0 10px;
  border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:600;
}
.abchip button{width:20px;height:20px;display:grid;place-items:center;border-radius:var(--r-sm);color:inherit;opacity:.65;font-size:11px}
.abchip button:hover{opacity:1;background:rgba(127,127,127,.18)}
.clearall{font-size:12px;color:var(--muted);min-height:28px;font-weight:600}
.clearall:hover{color:var(--ink);text-decoration:underline}
.resultline{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.02em}

/* ==========================================================================
   CARDS  - cover led, no border, denser than before
   ========================================================================== */
.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media (max-width:459px){ .card .art{aspect-ratio:auto;height:112px} }
@media (min-width:460px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:620px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (min-width:1000px){ .grid{grid-template-columns:repeat(4,1fr);gap:12px} }

.card{
  background:var(--surface);border-radius:var(--r-lg);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s;
}
.card:hover{box-shadow:0 0 0 1px var(--line-strong)}
.card.on{box-shadow:0 0 0 2px var(--accent)}
.card.pulse{animation:pulse .5s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 2px var(--accent),0 0 0 0 var(--accent-soft)}100%{box-shadow:0 0 0 2px var(--accent),0 0 0 12px transparent}}

/* the generated tile is the placeholder under the cover, so there is never a
   grey box and never a layout shift when the image lands */
.art{position:relative;aspect-ratio:460/215;overflow:hidden;background:var(--tile)}
.art .gen{
  position:absolute;inset:0;display:grid;place-items:center;
  background:
    repeating-linear-gradient(var(--ang), rgba(255,255,255,.10) 0 2px, transparent 2px 13px),
    linear-gradient(150deg, color-mix(in oklab, var(--tile) 82%, white), var(--tile) 55%, color-mix(in oklab, var(--tile) 68%, black));
}
.art .gen span{font-size:26px;font-weight:700;letter-spacing:-.02em;color:rgba(255,255,255,.34)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.art img.in{opacity:1}
.art .badges{position:absolute;z-index:2;top:6px;left:6px;right:6px;display:flex;gap:5px;align-items:flex-start}
.art .badges .sp{flex:1}
.bdg{font-size:9.5px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;padding:3px 6px;border-radius:var(--r-sm);background:rgba(10,12,15,.7);color:#fff;backdrop-filter:blur(4px)}

.body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-size:15.5px;font-weight:650;line-height:1.25;letter-spacing:-.01em}
.desc{font-size:13px;color:var(--ink-2);line-height:1.42}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:11.5px;color:var(--accent);font-weight:700;align-self:flex-start}
.more:hover{text-decoration:underline}

.facets{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pill{font-size:10px;font-weight:600;letter-spacing:.03em;padding:3px 6px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--muted)}
/* three dots make it self-evidently a 1-to-3 scale, so the word does not
   have to carry the whole meaning on its own */
.lvl{font-style:normal;letter-spacing:1px;margin-right:5px;font-size:8px;vertical-align:1px;opacity:.75}
.pill--e1{background:var(--e1-bg);color:var(--e1)}
.pill--e2{background:var(--e2-bg);color:var(--e2)}
.pill--e3{background:var(--e3-bg);color:var(--e3)}
.pill--rev{color:var(--accent);background:var(--accent-soft)}
.pill--guess{opacity:.75;font-style:italic}
.pill--link{color:var(--ink-2)}
.pill--link:hover{background:var(--surface-3);text-decoration:none}
.pill--set{cursor:pointer;box-shadow:inset 0 0 0 1px var(--line-strong);background:transparent}
.modhint{opacity:.6;font-weight:500}
.bdg--mods{background:var(--e2);color:var(--e2-ink)}
.pill--set:hover{background:var(--surface-2)}

.takes{display:flex;flex-direction:column;gap:4px;padding-left:8px;box-shadow:inset 2px 0 0 var(--surface-3)}
.take{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.take b{color:var(--muted);font-weight:700;margin-right:5px}

.foot{margin-top:auto;display:flex;gap:6px;padding-top:2px}
.pick{
  flex:1;min-height:38px;border-radius:var(--r-md);background:var(--surface-2);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:13px;font-weight:700;color:var(--ink-2);
  transition:background .12s,color .12s;
}
.pick:hover{background:var(--surface-3);color:var(--ink)}
.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pick .n{font-size:11px;opacity:.7;font-weight:600}

.pill--v-never_again{background:var(--e3-bg);color:var(--e3)}

/* one card, three states. Backlog reads as provisional through a dashed edge

.pick--static{

  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;

/* ==========================================================================
   LIST VIEW
   ========================================================================== */
.tablewrap{margin-top:10px;overflow-x:auto;border-radius:var(--r-lg);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:600px;font-size:13.5px}
/* A phone cannot hold seven columns. Dropping two was not enough: the rest
   still overflowed and the Pick button sat off the right edge behind a scroll
   nobody notices. Below 560px it is three columns, with energy and crew moved
   into the line under the game name so no information is actually lost. */
.narrow{display:none}
@media (max-width:700px){ table{min-width:0} .opt{display:none} }
@media (max-width:560px){
  .opt2{display:none}
  .narrow{display:inline}

  th,td{padding:9px 8px}
}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--surface-2);position:sticky;top:0;z-index:1}
th button{display:inline-flex;align-items:center;gap:5px;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit}

th .dir{color:var(--accent)}

tbody tr:hover{background:var(--surface-2)}

td.g{min-width:170px}

td.g .swatch{width:20px;height:20px;border-radius:var(--r-sm);flex:none;background:var(--tile)}

.rowpick{min-height:32px;padding:0 11px;border-radius:var(--r-md);background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.rowpick:hover{background:var(--surface-3);color:var(--ink)}
.rowpick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ==========================================================================
   ADD
   ========================================================================== */
.add{margin-top:10px;background:var(--surface);border-radius:var(--r-lg);padding:14px}
.add .row{display:flex;gap:8px;flex-wrap:wrap}

.add .row .input{flex:1 1 220px;background:var(--surface-2)}
.results{margin-top:9px;display:flex;flex-direction:column;gap:5px}
.res{display:flex;align-items:center;gap:11px;padding:8px;min-height:52px;border-radius:var(--r-md);width:100%;background:var(--surface-2);flex-wrap:wrap}
.res .nm{flex:1 1 130px}
.resbtns{display:flex;gap:6px;flex:none;margin-left:auto}
.res img{width:62px;height:29px;object-fit:cover;border-radius:var(--r-sm);flex:none;background:var(--surface-3)}
.res .nm{font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owns{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.owns input{width:17px;height:17px;accent-color:var(--accent)}
.msg{margin-top:9px;font-size:12.5px;padding:9px 11px;border-radius:var(--r-md);font-weight:600}
.msg--bad{background:var(--e3-bg);color:var(--e3)}

.cols{display:block}

.who .dot{width:19px;height:19px;border-radius:999px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;flex:none}

.who .devs{
  font-size:9px;font-weight:700;min-width:14px;height:14px;padding:0 3px;

}

.eopts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}

.eopt span{font-size:11px;color:var(--muted)}
.eopt[data-e="1"][aria-pressed="true"]{background:var(--e1);color:var(--e1-ink)}
.eopt[data-e="2"][aria-pressed="true"]{background:var(--e2);color:var(--e2-ink)}
.eopt[data-e="3"][aria-pressed="true"]{background:var(--e3);color:var(--e3-ink)}
/* two options side by side, each with room for a line saying what it does */
.eopts--2{grid-template-columns:1fr}
.eopts--2 .eopt{min-height:0;padding:11px 12px;text-align:left}
.eopts--2 .eopt span{display:block;margin-top:2px}
@media (min-width:480px){ .eopts--2{grid-template-columns:repeat(2,1fr)} }
.eopt:not([data-e])[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.eopt[aria-pressed="true"] span{color:inherit;opacity:.8}

/* A tap should feel like it landed. 90ms of scale is the whole trick, and the

.chip,.pick,.rowpick,.eopt,.btn,.tbtn{transition:background .12s,color .12s,filter .12s,transform .09s}
.chip:active,.pick:active,.rowpick:active,.eopt:active,.btn:active,.tbtn:active{transform:scale(.97)}

/* when a game takes the lead, one sheen across the banner and the count ticks
   up. It marks the only moment in the app where something actually changed. */
.leader .art::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0}
.leader.tookover .art::after{
  background:linear-gradient(105deg,transparent 34%,rgba(255,255,255,.42) 50%,transparent 66%);
  opacity:1;transform:translateX(-100%);
  animation:sheen 1.15s cubic-bezier(.32,.72,.3,1) 1;
}
@keyframes sheen{to{transform:translateX(100%)}}
@keyframes tick{from{transform:translateY(-.4em);opacity:0}to{transform:none;opacity:1}}
.n.bump{display:inline-block;animation:tick .3s cubic-bezier(.2,.8,.3,1)}

/* filter sheet: the lead block is the one filter that maps to the real
   decision, so it gets a surface of its own instead of a fifth grey label */
.fgroup--lead{background:var(--surface-2);border-radius:var(--r-md);padding:11px 12px;gap:6px}
.fpanel .fgroup--lead{grid-column:1/-1}
.fhint{font-size:12px;color:var(--ink-2);line-height:1.35}
.fset--seg{display:flex;gap:0;background:var(--surface-2);border-radius:var(--r-md);padding:3px;width:fit-content;max-width:100%}
.fset--seg .chip{background:transparent;flex:1;min-height:36px}
.fset--seg .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:640px){ .fset--seg .chip{min-height:40px} }
.acts .lbl{margin-left:5px}
/* "The shelf" over the shelf is a label nobody needed. On a phone the row is
   worth more as two labelled actions than as a heading restating the obvious,
   so the heading goes to screen readers only and the buttons keep their words. */
@media (max-width:560px){
  .sechead--shelf h2{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sechead--shelf{margin-top:20px;justify-content:flex-start}
  .sechead--shelf .acts{flex:1}
  .sechead--shelf .acts .btn{flex:1}
}
.sechead .acts{display:flex;gap:6px;align-items:center}

.share pre{
  margin:0 0 9px;white-space:pre-wrap;word-break:break-word;
  font-size:11.5px;line-height:1.6;background:var(--surface-2);border-radius:var(--r-md);
  padding:10px;color:var(--ink-2);max-height:160px;overflow-y:auto;
}
.share .row{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- sticky vote bar ---------- */
.votebar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:var(--shadow-up);
  padding:9px 14px calc(9px + var(--safe-b));display:flex;align-items:center;gap:10px;
}
@media (min-width:900px){ .votebar{display:none} }
.votebar .st{flex:1;min-width:0}
.votebar .st .a{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.votebar .st .b{font-size:11px;color:var(--muted)}
.pips{display:flex;gap:3px;margin:3px 0}
.pips i{width:15px;height:3px;border-radius:999px;background:var(--surface-3);display:block}
.pips i.f{background:var(--accent)}

/* ---------- sheets ---------- */
.sheetwrap{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.62);display:grid;place-items:end center;overscroll-behavior:contain}
@media (min-width:640px){ .sheetwrap{place-items:center;padding:20px} }
.sheet{
  background:var(--surface);width:100%;max-width:450px;
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 18px calc(20px + var(--safe-b));
  display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto;
}
@media (min-width:640px){
  .sheet{border-radius:var(--r-lg);padding-bottom:20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
}

/* The filter sheet is the one that needs real height, a scrolling middle and a
   footer that stays put, because the Apply button is the whole point of it. */
/* Full screen on a phone. A bottom sheet over a scrollable page means two
   scroll areas fighting each other and the shelf sliding about behind you. */
.sheet--tall{
  height:100dvh;max-height:100dvh;width:100%;max-width:none;
  padding:0;gap:0;border-radius:0;
}
/* From tablet up it is a centred dialog rather than a sheet stuck to the
   bottom edge, because there is no thumb reach to design around on a desktop
   and a panel hanging off the bottom of a 1400px window looks like a mistake. */
@media (min-width:640px){
  .sheet--tall{
    height:auto;max-height:min(660px, 84vh);max-width:560px;
    border-radius:var(--r-lg);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);
  }
}

.sheethead{
  display:flex;align-items:center;gap:10px;

}

.sheetfoot{

.sheet h3{font-size:18px;font-weight:650}
.sheet p{font-size:13px;color:var(--ink-2)}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1}
.sheet .input{background:var(--surface-2)}
.playlog{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden}
.playrow{
  display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
  background:var(--surface-2);padding:8px 11px;font-size:12px;color:var(--ink-2);
}
.playrow span:first-child{font-weight:700;color:var(--ink)}
.playrow span:nth-child(3){font-weight:600}
.rowx{width:22px;height:22px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);font-size:11px}
.rowx:hover{background:var(--surface-3);color:var(--ink)}
.notebox{background:var(--surface-2);border-radius:var(--r-md);padding:9px 11px;font-size:12.5px;color:var(--ink-2)}
.sheet .danger{font-size:12.5px;color:var(--e3);font-weight:600;align-self:flex-start}
.sheet .danger:hover{text-decoration:underline}

.cand{
  display:flex;align-items:center;gap:11px;min-height:58px;padding:9px 11px;width:100%;
  border-radius:var(--r-md);text-align:left;background:var(--surface-2);transition:background .12s;
}

.cand .dot{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.cand .txt{min-width:0;flex:1}
.cand .txt b{display:block;font-size:15px;font-weight:650}
.cand .txt span{font-size:12px;color:var(--muted)}

/* ---------- landing ---------- */
.hero{padding:38px 0 6px;max-width:50ch}
.hero h1{font-size:clamp(28px,6.5vw,42px);font-weight:650;line-height:1.05;letter-spacing:-.02em}
.hero p{margin-top:11px;font-size:15px;color:var(--ink-2)}
.mygroups{display:flex;flex-direction:column;gap:6px}
.mygroup{display:flex;align-items:center;gap:11px;min-height:54px;padding:0 13px;border-radius:var(--r-md);background:var(--surface);text-align:left;width:100%;transition:background .12s}

.mygroup .nm{flex:1;font-weight:650;font-size:15px}
.mygroup .cd{font-size:10.5px;color:var(--muted);letter-spacing:.09em;font-weight:600}

.empty{font-size:13px;color:var(--muted);padding:26px 4px;text-align:center;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:650;margin-bottom:4px}
.footer{margin-top:40px;padding:16px 0 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

<script>
/* ============================================================================
   CONFIG - paste your two values here, commit, done.

const CONFIG = {

/* ---------- name matching: Soli vs soli vs Soli L ---------- */
function normName(s){

    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // strip accents
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

/** Levenshtein, capped: we only care about distances of 1 or 2. */
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;

    else if (Math.max(mn.length, n.length) >= 4 && lev(mn, n) <= 2) score = 68; // Soli / Solli
    return { m, score };
  }).filter(x => x.score >= 60)
    .sort((a,b) => b.score - a.score)
    .slice(0,4)
    .map(x => x.m);
}

/* ---------- derived ---------- */
function derive(){
  if(!S) return null;
  const gamesById = {};
  (S.games||[]).forEach(g => { gamesById[g.appid] = g; });

  const counts = {}, voters = new Set(), lastVoteAt = {};
  (S.ballots||[]).forEach(b => {
    (b.picks||[]).forEach(a => {
      counts[a] = (counts[a]||0)+1;
      if(!lastVoteAt[a] || b.updated_at > lastVoteAt[a]) lastVoteAt[a] = b.updated_at;
    });
    if((b.picks||[]).length) voters.add(b.member_id);
  });

  const takesBy = {};
  (S.takes||[]).forEach(t => {
    const who = (S.members||[]).find(m => m.member_id === t.member_id);
    (takesBy[t.appid] = takesBy[t.appid]||[]).push({
      by: who ? who.name : "Someone", body: t.body, mine: t.member_id === myMemberId
    });
  });

  // play history: one row per game per round, so a game we come back to later
  // stacks up rather than overwriting the first time we played it
  const playsBy = {};
  (S.plays||[]).forEach(pl => { (playsBy[pl.appid] = playsBy[pl.appid]||[]).push(pl); });
  Object.values(playsBy).forEach(list => list.sort((a,b) => a.started_at < b.started_at ? 1 : -1));
  const nowPlaying = (S.plays||[]).find(pl => !pl.finished_at) || null;

  const myBallot = (S.ballots||[]).find(b => b.member_id === myMemberId);
  const myPicks  = myBallot ? (myBallot.picks||[]) : [];
  const meMember = (S.members||[]).find(m => m.member_id === myMemberId) || null;

  // duplicate display names still get a suffix, for the cases the match sheet
  // did not catch (someone genuinely is a second Sam)
  const seen = {};
  const members = (S.members||[]).map(m => {
    seen[m.name] = (seen[m.name]||0)+1;
    return {...m, label: seen[m.name] > 1 ? m.name+" ("+seen[m.name]+")" : m.name};
  });

  const ranked = Object.keys(counts).map(a => ({appid:+a, n:counts[a]}))
    .sort((x,y) => y.n-x.n || x.appid-y.appid);

  return { gamesById, counts, takesBy, myPicks, meMember, playsBy, nowPlaying,
           members, ranked, lastVoteAt,
           votedCount: voters.size, lookedCount: members.length,
           liveCount: members.filter(m => isLive(m.last_seen)).length };
}

function activeFilters(f = F){

  f.setup .forEach(v => out.push({k:"setup",  v, label:SETUP[v]}));

}
function clearFilter(k, v, f = F){
  if(k==="q"){ f.q=""; }
  else if(k==="crew"){ f.crew=null; }
  else if(k==="mine"){ f.mine=false; }
  else if(k==="played"){ f.played=null; }

function clearAll(f = F){

/** A game passes if it clears every active filter. Crew is the one that maps
 *  to the real decision: five people means a four-player game is out. */
/** How a game sits against tonight's headcount.
 *  "fits" clears it outright, "mods" only clears it if someone installs
 *  something, "no" cannot seat everyone, "unknown" has no published cap. */
function crewFit(s, want){
  if(!want) return "fits";
  if(s.crew_max == null) return "unknown";
  if(s.crew_max >= want) return "fits";
  if(s.crew_mod != null && s.crew_mod >= want) return "mods";
  return "no";
}

function matchesSearch(game, q){
  if(!q) return true;
  const hay = ((game.name||"")+" "+(game.short_desc||"")+" "+(game.tags||[]).join(" ")).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function passes(s, d, f = F){
  const game = d.gamesById[s.appid] || {};
  if(!matchesSearch(game, f.q)) return false;
  // a moddable game is kept and labelled rather than hidden, because "you can
  // play this if someone installs a mod" is useful and "it vanished" is not
  if(crewFit(s, f.crew) === "no") return false;
  if(f.mine && !d.myPicks.includes(s.appid)) return false;
  if(f.wellrated && !((game.review_pct ?? 0) >= 85)) return false;
  if(f.played){
    const played = (d.playsBy[s.appid]||[]).length > 0;
    if(f.played === "fresh" && played) return false;
    if(f.played === "again" && !played) return false;
  }
  if(f.energy.size && !f.energy.has(energyOf(s, d))) return false;
  if(f.setup.size && !f.setup.has(s.setup)) return false;
  if(f.shape.size && !f.shape.has(game.shape)) return false;
  if(f.vibe.size  && !f.vibe.has(vibeOf(s, d))) return false;
  return true;
}

function sortShelf(list, d){
  const sortBy = A().sort, asc = A().dir === "asc";
  const val = s => {
    const g = d.gamesById[s.appid] || {};
    switch(sortBy){
      case "votes":  return d.counts[s.appid] || 0;
      case "review": return g.review_pct ?? -1;
      case "added":  return new Date(s.added_at).getTime();
      case "length": return -(SHAPE_ORDER[g.shape] ?? 9);   // shortest first when desc
      case "crew":   return s.crew_max ?? 0;
      case "az":     return g.name || "";
      default:       return 0;
    }
  };
  return list.slice().sort((a,b) => {
    const va = val(a), vb = val(b);
    // strings and numbers need opposite-looking comparators for the same
    // direction, so they are handled separately rather than with one sign flip
    if(typeof va === "string"){
      return asc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    if(va !== vb) return asc ? va - vb : vb - va;
    // stable tiebreak on name, so equal values never jitter between renders
    const ga = d.gamesById[a.appid]||{}, gb = d.gamesById[b.appid]||{};
    return (ga.name||"").localeCompare(gb.name||"");
  });
}

/** Sections for a shelf that has outgrown one long scroll. */
function groupShelf(list, d){

    }

    if(groupBy === "shape")  return g.shape  ? SHAPE[g.shape]   : "Unsorted";
    if(groupBy === "setup")  return s.setup  ? SETUP[s.setup]   : "Unsorted";
    if(groupBy === "played") return (d.playsBy[s.appid]||[]).length ? "Played before" : "Never played";
    return "";
  };
  list.forEach(s => {
    const k = keyOf(s);
    if(!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(s);
  });
  // keep a sensible reading order rather than whatever the data happened to be in
  const order = {
    votes:  ["\u25B6 On right now","In the running","Nobody's picked it yet","Benched"],
    energy: ["Chill","Normal","Heavy","Not rated yet"],
    shape:  ["Drop in","One sitting","Campaign","Long haul","Unsorted"],
    setup:  ["Just launch","Someone hosts","Dedicated server","Unsorted"],
    played: ["Never played","Played before"],
  }[A().group] || [];
  return [...buckets.entries()]
    .sort((a,b) => {
      const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    })
    .map(([label, items]) => ({ label, items }));
}
/** Drop the heading when the grouping produced exactly one bucket: a lone
 *  "Up for a vote" header over the entire shelf says nothing. */
function sections(list, d){
  const out = groupShelf(list, d);
  return out.length === 1 ? [{ label:null, items:out[0].items }] : out;
}

/** Never gate the shelf behind a name. Park the action, ask, then run it. */
function needName(action){
  if(myMemberId) return false;
  focusReturn = document.activeElement;
  pending = action;
  sheet = { kind:"name", step:"enter", typed: myName };
  render();
  return true;
}

async function refresh(){
  if(!code) return;
  try{
    // whoami first: a returning visitor is recognised without being asked again
    if(myMemberId === null){
      myMemberId = await rpc("whoami", { p_code: code, p_device: deviceId });
    }
    const next = await rpc("get_state", { p_code: code });
    const before = S ? derive() : null;
    const unchanged = S !== null && JSON.stringify(next) === JSON.stringify(S);
    S = next;
    const after = derive();

    // Nothing came back different, so leave the DOM alone. This is what stops
    // the covers flashing every ten seconds, and it keeps your scroll position
    // and your place in a text field.
    if(unchanged && !sheet) return;

    if(before && after && after.ranked.length){
      const nl = after.ranked[0].appid;
      const ol = before.ranked.length ? before.ranked[0].appid : null;
      if(ol && nl !== ol){
        const g = after.gamesById[nl];
        flash = (g ? g.name : "Something") + " just took the lead";
        tookover = nl;
        setTimeout(() => { flash = ""; render(); }, 9000);
      }
    }
    render();
  }catch(err){
    if(/no group/i.test(err.message)){
      myGroups = myGroups.filter(g => g.code !== code);
      store.set("groups", myGroups);
      location.hash = "";
    }
  }
}

async function togglePick(appid){
  if(needName(() => togglePick(appid))) return;
  const d = derive();
  let picks = d.myPicks.slice();
  const at = picks.indexOf(appid);
  if(at > -1) picks.splice(at,1);
  else {
    if(picks.length >= 3){
      const dropped = d.gamesById[picks[0]];
      picks.shift();
      flash = (dropped ? dropped.name : "Your oldest pick") + " made way for it";
      setTimeout(() => { flash = ""; render(); }, 4500);
    }
    picks.push(appid); pulse = appid;
  }
  // optimistic: the tap registers instantly, the write reconciles behind it
  const mine = (S.ballots||[]).find(b => b.member_id === myMemberId);
  if(mine) mine.picks = picks;
  else (S.ballots = S.ballots||[]).push({member_id:myMemberId, picks, updated_at:new Date().toISOString()});
  render();
  setTimeout(()=>{ pulse = null; }, 600);
  try{ await rpc("set_picks", {p_code:code, p_device:deviceId, p_picks:picks}); }
  finally{ refresh(); }
}

/* ---------- add ---------- */
/** An app id out of anything someone might paste: a bare number, or any
 *  store, community or help URL. */
function parseAppid(input){
  const t = String(input || "").trim();
  if(/^\d{2,8}$/.test(t)) return Number(t);
  // /app/1478500/Big_Walk/?curator_clanid=... - everything after the id is
  // optional, so match the id and read the slug separately if it is there
  const m = t.match(/\/app\/(\d+)/);
  return m ? Number(m[1]) : null;
}
/** "Big_Walk" out of a store URL, for the preview's benefit only. */
function parseSlug(input){
  const m = String(input || "").match(/\/app\/\d+\/([^/?#]+)/);
  return m ? decodeURIComponent(m[1]).replace(/_/g, " ") : null;
}

let searchTimer = null;
function onAddInput(value){
  clearTimeout(searchTimer);
  addMsg = null;
  const q = value.trim();

  // A pasted link is unambiguous, so go straight for it rather than typing it
  // into a search box that cannot read URLs.
  if(parseAppid(q)){ addLookup(q); return; }

  if(q.length < 2){ addResults = []; render(); return; }
  searchTimer = setTimeout(() => runSearch(q), 400);
}

async function runSearch(q){
  addBusy = true; render();
  try{
    const { results } = await callEnrich({action:"search", q});
    addResults = results || [];
    if(!addResults.length) addMsg = {kind:"bad", text:"Steam found nothing called that. Try fewer words, or paste the store link."};
  }catch(err){ addResults = []; addMsg = {kind:"bad", text:err.message}; }
  finally{ addBusy = false; render(); }
}

/** Fetch one exact game from a link or id and show it ready to add. */
async function addLookup(raw){
  const appid = parseAppid(raw);
  if(!appid) return;
  clearTimeout(searchTimer);
  addBusy = true; addMsg = null; addResults = []; render();
  try{
    const { game } = await callEnrich({action:"get", appid, slug: parseSlug(raw)});
    addResults = [{appid, name: game.name, header: game.header}];
  }catch(err){ addMsg = {kind:"bad", text:err.message}; }
  finally{ addBusy = false; render(); }
}

/** Whatever is in the box: a link goes straight to lookup, words to search. */
function submitAdd(){
  const el = document.getElementById("addq");
  if(!el) return;
  const v = el.value.trim();
  if(!v) return;
  if(parseAppid(v)) addLookup(v); else runSearch(v);
}
async function addGame(appid){
  if(needName(() => addGame(appid))) return;
  busy = true; addMsg = null; render();
  try{
    const { game } = await callEnrich({action:"get", appid});
    // anything in the curated list arrives already knowing its cap and setup
    const f = curatedFor(appid);
    await rpc("add_game", {p_code:code, p_device:deviceId, p_appid:appid,
                           p_energy:f.energy, p_crew_max:f.crew_max,
                           p_setup:f.setup, p_crew_mod:f.crew_mod, p_crew_note:f.crew_note});
    addMsg = {kind:"ok", text: game.name + " is up for a vote"};
    addResults = [];
    const box = document.getElementById("addq"); if(box) box.value = "";
    await refresh();
    sheet = { kind:"take", appid, fromAdd:true, gameName: game.name };
  }catch(err){ addMsg = {kind:"bad", text:err.message}; }
  finally{ busy = false; render(); }
}

/* ---------- groups ---------- */
async function createGroup(name, person){
  const newCode = await rpc("create_group", {p_name:name, p_device:deviceId, p_person:person||myName||"Host"});
  if(person){ myName = person; store.set("name", person); }
  myGroups = [...myGroups.filter(g=>g.code!==newCode), {code:newCode, name}];
  store.set("groups", myGroups);
  for(const appid of SEED){
    // Two independent steps on purpose. Enrichment only supplies the name,
    // blurb and cover; the facets are local. If Steam is slow or down, the
    // shelf still gets built and the missing details fill in on a later view,
    // instead of a new group opening completely empty.
    try{ await callEnrich({action:"get", appid}); }catch{}
    try{
      const f = curatedFor(appid);
      await rpc("add_game", {p_code:newCode, p_device:deviceId, p_appid:appid,
                             p_energy:f.energy, p_crew_max:f.crew_max, p_setup:f.setup,
                             p_crew_mod:f.crew_mod, p_crew_note:f.crew_note});
    }catch(err){ console.warn("seed failed for", appid, err && err.message); }
  }
  myMemberId = null;
  location.hash = "#/g/" + newCode;
}
async function joinByCode(c){
  const clean = String(c||"").trim().toUpperCase();
  if(!clean) return;
  const st = await rpc("get_state", {p_code: clean});       // throws if the code is wrong
  myGroups = [...myGroups.filter(g=>g.code!==clean), {code:clean, name:st.group.name}];
  store.set("groups", myGroups);
  myMemberId = null; S = null;
  location.hash = "#/g/" + clean;
}

   SHARE TEXT
   ========================================================================== */
function summaryText(d){
  const g = S.group;
  const lines = ["🎮 " + g.name + " — what are we playing"];
  lines.push("");
  if(!d.ranked.length) lines.push("nothing yet, someone go first");
  else d.ranked.slice(0,5).forEach((r,i) => {
    const g2 = d.gamesById[r.appid];
    lines.push((i+1)+". "+(g2?g2.name:r.appid)+" — "+r.n+(r.n===1?" vote":" votes"));
  });
  lines.push("");
  lines.push(S.group.paused_at ? "on a break, votes still welcome"
                               : d.votedCount+" of "+d.lookedCount+" in");
  lines.push(location.origin+location.pathname+"#/g/"+g.code);
  return lines.join("\n");
}
function nudgeText(d){
  const voted = new Set((S.ballots||[]).filter(b=>(b.picks||[]).length).map(b=>b.member_id));
  const missing = d.members.filter(m => !voted.has(m.member_id)).map(m=>m.label);
  const link = location.origin+location.pathname+"#/g/"+S.group.code;
  if(!missing.length) return "that's everyone in 🎉 " + link;
  return missing.join(", ") + " — still waiting on your picks 👀\n" + link;
}
async function copy(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    const was = btn.textContent; btn.textContent = "Copied";
    setTimeout(()=>{ btn.textContent = was; }, 1600);
  }catch{ btn.textContent = "Select the text above"; }
}

function render(){
  // Nothing behind a sheet should scroll. Without this the shelf drifts around
  // under your thumb while you are trying to use the sheet on top of it.
  document.body.classList.toggle("locked", !!sheet);
  if(!SDK_OK) return renderNoSDK();
  if(!CONFIGURED) return renderSetup();
  const m = location.hash.match(/^#\/g\/([A-Za-z0-9]+)/);
  if(!m){ code=""; return renderLanding(); }
  const wasCode = code;
  code = m[1].toUpperCase();
  if(code !== wasCode) loadF();
  if(!S || S.group.code !== code) return renderLoading();
  renderGroup();
}

            ? sections(filtered, d).map(sec => `
                ${sec.label ? `<h3 class="grouphead">${esc(sec.label)}<span>${sec.items.length}</span></h3>` : ""}
                ${view === "cards"
                  ? `<div class="grid">${sec.items.map(s => card(s,d)).join("")}</div>`
                  : listView(sec.items, d)}`).join("")
            : `<div class="empty"><b>Nothing survived that</b>
                 ${F.crew ? "Nothing here seats "+F.crew+" of you." : "That is a lot of filters."}
                 <br><button class="clearall" id="clearall2">Clear the lot</button>
               </div>`}

          <div class="sechead" id="addsec"><div><h2>Add a game</h2><p>This one searches Steam, not the shelf above.</p></div></div>
          <div class="add">
            <div class="addfield">
              <input class="input" id="addq" aria-label="Search Steam by name, or paste a store link"
                     placeholder="Search Steam, or paste a link"
                     enterkeyhint="search" ${busy?"disabled":""}>
              <button class="addgo" id="addgo" aria-label="Look it up" ${busy||addBusy?"disabled":""}>
                ${addBusy
                  ? `<span class="spin"></span>`
                  : `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`}
              </button>
            </div>
            ${addResults.length ? `<div class="results">${addResults.map(r => `
              <div class="res">
                ${r.header ? `<img src="${esc(r.header)}" alt="" loading="lazy">`
                  : `<span style="width:62px;height:29px;border-radius:4px;flex:none;background:hsl(${hueOf(r.name)} 44% 32%)"></span>`}
                <span class="nm">${esc(r.name)}</span>
                <span class="resbtns">
                  <button class="btn btn--sm" data-add="${r.appid}">Add it</button>
                </span>
              </div>`).join("")}</div>` : ""}
            ${addMsg ? `<p class="msg msg--${addMsg.kind==="ok"?"ok":"bad"}">${esc(addMsg.text)}</p>` : ""}
          </div>

          <p class="footer">Steam never says how many can play, so the caps are ours. Tap one if it looks off.</p>
        </main>

        <aside class="rail">
          <section class="panel">
            <h3>The vote</h3>
            ${d.ranked.length ? d.ranked.map(r => {
              const gm = d.gamesById[r.appid], max = d.ranked[0].n;
              return `<div class="bar">
                <span class="t">${esc(gm?gm.name:r.appid)}</span><span class="c num">${r.n}</span>
                <span class="track"><span class="fill" style="width:${(r.n/max)*100}%"></span></span>
                <span class="ago">last vote ${esc(ago(d.lastVoteAt[r.appid]))}</span>
              </div>`;
            }).join("") : `<p class="empty" style="padding:8px 0;text-align:left">Nothing yet. First pick sets the tone.</p>`}
          </section>

          <section class="panel">
            <h3>Who's in</h3>
            <div class="crew">${d.members.length ? d.members.map(mm => {
              const voted = (S.ballots||[]).some(b => b.member_id===mm.member_id && (b.picks||[]).length);
              return `<span class="who${voted?"":" novote"}" title="${voted?"voted":"not voted yet"}${mm.device_count>1?" · "+mm.device_count+" devices":""}">
                ${isLive(mm.last_seen) ? `<span class="livedot" title="here now"></span>` : ""}
                <span class="dot" style="background:hsl(${hueOf(mm.name)} 44% 32%)">${esc(mm.label[0].toUpperCase())}</span>${esc(mm.label)}
                ${mm.device_count>1 ? `<span class="devs" title="${mm.device_count} devices linked">${mm.device_count}</span>` : ""}
              </span>`;
            }).join("") : `<span class="empty">Just you so far.</span>`}</div>
          </section>

          <section class="panel share">
            <h3>Send to the chat</h3>
            <pre>${esc(summaryText(d))}</pre>
            <div class="row">
              <button class="btn btn--ghost btn--sm" id="copysum">Copy where it's at</button>
              <button class="btn btn--ghost btn--sm" id="copynudge">Copy a nudge</button>
            </div>
          </section>
        </aside>
      </div>
    </div>

    <div class="votebar">
      <div class="st">
        <div class="a">${d.ranked.length ? esc((d.gamesById[d.ranked[0].appid]||{}).name||"")+" leading" : "No votes yet"}</div>
        <div class="pips">${[0,1,2].map(i => `<i class="${i < d.myPicks.length ? "f":""}"></i>`).join("")}</div>
        <div class="b num">${d.myPicks.length}/3 picks${g.paused_at ? " \u00B7 on a break" : " \u00B7 "+d.votedCount+" of "+d.lookedCount+" in"}</div>
      </div>
      <button class="btn btn--ghost btn--sm" id="sharemob">Share</button>
    </div>

    ${sheet ? renderSheet(d) : ""}`;

  wireGroup(d, filtered);
  settleImages();
  lastCounts = {...d.counts};
  if(tookover){ const t = tookover; setTimeout(() => { if(tookover === t) tookover = null; }, 1400); }
}

/* An image the browser already has does not need a fade. Without this, every
   re-render restarts the transition from transparent and the shelf blinks. */
function settleImages(){
  app.querySelectorAll(".art img").forEach(img => {
    if(img.complete && img.naturalWidth){
      img.style.transition = "none";
      img.classList.add("in");
      requestAnimationFrame(() => { img.style.transition = ""; });
    }
  });
}

function filterPanel(d, pool, counts){
  const n = (fn) => pool.filter(fn).length;
  counts = counts || {};

  /* A chip with nothing behind it is noise. Zero-count options are dropped
     rather than sat there greyed out, with one exception: an option you have
     already selected has to stay visible or you cannot turn it back off. */
  const grp = (label, key, map, getter) => {
    const chips = Object.keys(map).map(k => {
      const val = isNaN(+k) ? k : +k;
      const on = FT()[key].has(val);
      const count = n(s => getter(s, d) === val);
      if(!count && !on) return "";
      return `<button class="chip" data-f="${key}" data-v="${k}" aria-pressed="${on}">
                ${esc(map[k])}<span class="n num">${count}</span></button>`;
    }).join("");
    if(!chips.trim()) return "";
    return `<div class="fgroup"><span class="eyebrow">${label}</span>
              <div class="fset">${chips}</div></div>`;
  };

  const crew = FT().crew;
  // The crew filter is the only one that maps to the actual decision on the
  // night, so it gets a surface of its own rather than a fifth identical
  // grey label, and it says in words what it is doing to the shelf.
  const lead = `
    <div class="fgroup fgroup--lead">
      <span class="eyebrow">How many of us tonight</span>
      <div class="stepper">
        <button class="sbtn" data-crew="-" aria-label="Fewer players">\u2212</button>
        <span class="val${crew ? " num" : ""}">${crew ?? "Any"}</span>
        <button class="sbtn" data-crew="+" aria-label="More players">+</button>
        ${crew ? `<button class="clearall" data-crew="off">Any</button>`
               : `<span class="off">${d.lookedCount} in the group</span>`}
      </div>
      <p class="fhint">${crew
        ? `Hiding anything that cannot seat ${crew}.`
        : `Every game, whatever its player cap.`}</p>
    </div>`;

  const played = `
    <div class="fgroup"><span class="eyebrow">Have we played it</span>
      <div class="fset fset--seg">
        ${[["","Either"],["fresh","Never"],["again","We have"]].map(([v,l]) =>
          `<button class="chip" data-played="${v}" aria-pressed="${(FT().played||"") === v}">${l}</button>`).join("")}
      </div>
    </div>`;

  // "Shortcuts" was a junk drawer. These are the two or three that narrow the
  // shelf to a specific pile, and they say so.
  const only = `
    <div class="fgroup"><span class="eyebrow">Only show</span>
      <div class="fset">
        <button class="chip" data-toggle="mine" aria-pressed="${FT().mine}" ${d.myPicks.length?"":"disabled"}>My picks<span class="n num">${d.myPicks.length}</span></button>
        <button class="chip" data-toggle="wellrated" aria-pressed="${FT().wellrated}">85%+ on Steam<span class="n num">${n(s => ((d.gamesById[s.appid]||{}).review_pct ?? 0) >= 85)}</span></button>
        ${counts.benched ? `<button class="chip" data-toggle="benched" aria-pressed="${FT().benched}">The bench<span class="n num">${counts.benched}</span></button>` : ""}
      </div>
    </div>`;

  return `<div class="fpanel">
    ${lead}
    ${grp("Energy", "energy", ENERGY, (s,dd) => energyOf(s, dd))}
    ${grp("How long", "shape", SHAPE, (s,dd) => (dd.gamesById[s.appid]||{}).shape)}
    ${grp("Vibe", "vibe", VIBE, (s,dd) => vibeOf(s, dd))}
    ${grp("Faff to get going", "setup", SETUP, s => s.setup)}
    ${played}
    ${only}
  </div>`;
}

function listView(list, d){
  // headers set the arrangement, so the table and the toolbar never disagree
  const th = (key, label, align, extra) => `<th class="${align?"r ":""}${extra||""}"><button data-arrange="${key}">${label}${
    arrange===key ? `<span class="dir">\u25BE</span>` : ""}</button></th>`;
  return `<div class="tablewrap"><table>
    <thead><tr>
      ${th("az","Game")}<th class="opt2">Energy</th><th class="opt2">Crew</th>
      <th class="opt">Added by</th>${th("review","Reviews",1,"opt")}${th("votes","Votes",1)}<th class="r"></th>
    </tr></thead>
    <tbody>${list.map(s => {
      const g = d.gamesById[s.appid]||{}, n = d.counts[s.appid]||0, on = d.myPicks.includes(s.appid);
      return `<tr class="${on?"on":""}">
        <td class="g"><div class="nm">
          <span class="swatch" style="--tile:hsl(${hueOf(g.name||s.appid)} 40% 47%)"></span>
          <span>${esc(g.name||s.appid)}</span></div>
          <div class="sub"><span class="narrow">${
            energyOf(s,d) ? esc(ENERGY[energyOf(s,d)])+" · " : ""}${s.crew_max ? "≤ "+s.crew_max+" · " : ""}</span>${
            esc(SHAPE[g.shape]||"")}${vibeOf(s,d)?" · "+esc(VIBE[vibeOf(s,d)]):""}</div></td>
        <td class="opt2">${energyOf(s,d)?`<span class="pill pill--e${energyOf(s,d)}">${esc(ENERGY[energyOf(s,d)])}</span>`:`<span class="pill">—</span>`}</td>
        <td class="opt2"><button class="pill pill--set" data-facets="${s.appid}" title="${esc(s.crew_note||"")}">${
          s.crew_max ? "≤ "+s.crew_max : "Set"}${s.crew_mod ? " <span class=\"modhint\">+mod</span>" : ""}</button></td>
        <td class="opt">${esc(s.added_name || "\u2014")}</td>
        <td class="r opt num">${g.review_pct!=null?g.review_pct+"%":"—"}</td>
        <td class="r num">${n}</td>
        <td class="r"><button class="rowpick" data-pick="${s.appid}" aria-pressed="${on}">${on?"Picked":d.myPicks.length>=3?"Swap":"Pick"}</button></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

function renderLeader(d, g){
  const appid = g.locked_appid || (d.ranked.length ? d.ranked[0].appid : null);
  if(!appid) return "";
  const game = d.gamesById[appid];
  if(!game) return "";
  const n = d.counts[appid] || 0;
  const tied = d.ranked.filter(r => r.n === n && !g.locked_appid);
  return `<div class="leader${tookover === appid ? " tookover" : ""}">
    <div class="art" style="--tile:hsl(${hueOf(game.name)} 40% 47%);--ang:${20+(appid%120)}deg">
      <div class="gen" aria-hidden="true"><span>${esc(monogram(game.name))}</span></div>
      ${game.header ? `<img src="${esc(game.header)}" alt="" onload="this.classList.add('in')">` : ""}
      <div class="scrim"></div>
      <div class="cap">
        <div class="k">${g.locked_appid ? "We're playing" : tied.length>1 ? "Dead heat" : "Out in front"}</div>
        <div class="t">${esc(game.name)}</div>
        <div class="m num">${n} ${n===1?"vote":"votes"}${game.review_desc?" · "+esc(game.review_desc):""}</div>
      </div>
    </div></div>`;
}

function card(s, d){
  const state = stateOf(s, d);
  const game = d.gamesById[s.appid] || {name:"Loading…", appid:s.appid};
  const n = d.counts[s.appid]||0, on = d.myPicks.includes(s.appid);
  const eff = energyOf(s, d);
  const cf = crewFit(s, F.crew);
  const takes = d.takesBy[s.appid]||[];
  const open = expanded.has(s.appid);
  const tagline = BLURBS[s.appid] || game.short_desc || "";
  const desc = open ? (game.long_desc || game.short_desc || "") : tagline;
  const hasMore = !!(game.long_desc && game.long_desc !== tagline);
  const plays = d.playsBy[s.appid] || [];
  const lastPlay = plays[0];
  const isNow = d.nowPlaying && d.nowPlaying.appid === s.appid;
  return `<article class="card card--${state}${on?" on":""}${pulse===s.appid?" pulse":""}">
    <div class="art" style="--tile:hsl(${hueOf(game.name)} 40% 47%);--ang:${20+(s.appid%120)}deg">
      <div class="gen" aria-hidden="true"><span>${esc(monogram(game.name))}</span></div>
      ${game.header ? `<img src="${esc(game.header)}" alt="" loading="lazy" onload="this.classList.add('in')">` : ""}
      <div class="badges">
        ${isNow ? `<span class="bdg bdg--now">\u25B6 playing now</span>`
          : cf === "mods" ? `<span class="bdg bdg--mods">needs a mod</span>`
          : cf === "unknown" && F.crew ? `<span class="bdg">cap unknown</span>`
          : ""}
        <span class="sp"></span>
        ${state === "benched" ? `<span class="bdg bdg--backlog">benched</span>`
          : plays.length && !isNow ? `<span class="bdg bdg--played" title="Last played ${esc(ago(lastPlay.started_at))}">${
              plays.length > 1 ? "played \u00D7"+plays.length : "played"}</span>` : ""}
      </div>
    </div>
    <div class="body">
      <h3>${esc(game.name)}</h3>
      ${desc ? `<p class="desc${open?"":" clamp"}">${esc(desc)}</p>` : ""}
      ${hasMore ? `<button class="more" data-more="${s.appid}">${open?"Less":"More"}</button>` : ""}
      <div class="facets">
        ${eff ? `<span class="pill pill--e${eff}${energyIsGuess(s,d)?" pill--guess":""}" title="Energy: ${esc(ENERGY[eff])}${energyIsGuess(s,d)?", guessed from Steam tags. Tap the cap to set it properly":""}"><i class="lvl">${
          "\u25CF".repeat(eff)}${"\u25CB".repeat(3-eff)}</i>${esc(ENERGY[eff])}</span>` : ""}
        <button class="pill pill--set" data-facets="${s.appid}" title="${esc(s.crew_note||"")}">
          ${s.crew_max ? "Up to "+s.crew_max : "Cap unknown"}${s.crew_mod ? ` <span class="modhint">${s.crew_mod} modded</span>` : ""}
        </button>
        ${s.setup ? `<span class="pill">${esc(SETUP[s.setup])}</span>` : ""}
        ${game.shape ? `<span class="pill">${esc(SHAPE[game.shape]||game.shape)}</span>` : ""}
        ${game.review_pct!=null ? `<span class="pill pill--rev" title="${esc(game.review_desc||"")} · ${game.review_count||0} reviews">${game.review_pct}%</span>` : ""}
        <a class="pill pill--link" href="https://store.steampowered.com/app/${s.appid}/" target="_blank" rel="noopener">Steam ↗</a>
      </div>
      ${plays.length && !isNow ? `<p class="playline">
        <span>Played ${esc(ago(lastPlay.started_at))}${
          plays.length > 1 ? " \u00B7 "+plays.length+" times now" : ""} \u00B7</span>
        <span class="pill pill--v-${lastPlay.verdict||"none"}">${
          lastPlay.verdict ? VERDICT_ICON[lastPlay.verdict]+" "+esc(VERDICT[lastPlay.verdict]) : "no verdict"}</span>
      </p>` : ""}
      ${s.added_name ? `<p class="addedby">Added by ${esc(s.added_name)}</p>` : ""}
      ${takes.length ? `<div class="takes">${takes.slice(0,3).map(t=>`<p class="take"><b>${esc(t.by)}</b>${esc(t.body)}</p>`).join("")}</div>` : ""}
      <div class="foot">
        ${state === "benched"
          ? `<button class="pick" data-unbench="${s.appid}">Put it back</button>`
          : state === "playing"
          ? `<span class="pick pick--static">On right now</span>`
          : `<button class="pick" data-pick="${s.appid}" aria-pressed="${on}">${
              on ? "Picked" : d.myPicks.length >= 3 ? "Swap in" : "Pick this"
            }<span class="n num${lastCounts[s.appid] != null && lastCounts[s.appid] !== n ? " bump" : ""}">${n}</span></button>`}
        <button class="mini" data-take="${s.appid}" aria-label="Add your take on ${esc(game.name)}">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
      </div>
    </div></article>`;
}

// backlogCard removed: card() handles every state, so there is one component
/* ---------- sheets ---------- */
function renderSheet(d){
  const shell = inner => `<div class="sheetwrap" data-scrim><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;

  if(sheet.kind === "name"){
    if(sheet.step === "match"){
      // the "is that the same as this account" moment
      const many = sheet.candidates.length > 1;
      return shell(`
        <h3>Have we met?</h3>
        <p>There ${many?"are already people":"is already someone"} in this group with a name like
           <b>${esc(sheet.typed)}</b>. If one of them is you, tap it and your picks carry over to this device.</p>
        ${sheet.candidates.map(c => {
          const voted = (S.ballots||[]).find(b => b.member_id===c.member_id && (b.picks||[]).length);
          const bits = [];
          if(voted) bits.push(voted.picks.length + (voted.picks.length===1?" pick":" picks"));
          else bits.push("no picks yet");
          bits.push("last here " + ago(c.last_seen));
          if(c.device_count>1) bits.push(c.device_count+" devices");
          return `<button class="cand" data-claim="${esc(c.member_id)}">
            <span class="dot" style="background:hsl(${hueOf(c.name)} 44% 32%)">${esc(monogram(c.name))}</span>
            <span class="txt"><b>${esc(c.name)}</b><span>${esc(bits.join(" · "))}</span></span>
            <span style="color:var(--muted)">→</span></button>`;
        }).join("")}
        <div class="row">
          <button class="btn btn--ghost" id="notme">Nah, I'm new</button>
        </div>`);
    }
    const returning = !!myName;
    return shell(`
      <h3>${returning ? "Back again" : "Who's this?"}</h3>
      <p>${returning
        ? "We know you on this device. Only change it if you are, in fact, someone else."
        : "Just a name for the list. No signup, nothing to remember."}</p>
      <input class="input" id="nameinput" placeholder="Your name" maxlength="24" value="${esc(sheet.typed||"")}">
      <div class="row"><button class="btn" id="namego">${returning ? "Continue as "+esc(myName) : "That's me"}</button></div>`);
  }

  if(sheet.kind === "take"){
    const game = d.gamesById[sheet.appid] || {};
    const mine = (d.takesBy[sheet.appid]||[]).find(t => t.mine);
    return shell(`
      <h3>${sheet.fromAdd ? "In it goes. Sell it to us?" : "Your take on "+esc(game.name||"this")}</h3>
      <p>${sheet.fromAdd
        ? "One line on why "+esc(sheet.gameName||"it")+" is worth a night. Shows on the card. Skip if you cannot be bothered."
        : "One line, shows on the card. Be honest."}</p>
      <input class="input" id="takeinput" maxlength="140" placeholder="e.g. peaks at 4, grindy after that" value="${esc(mine?mine.body:"")}">
      <div class="row">
        <button class="btn btn--ghost" id="takeclear">${sheet.fromAdd ? "Skip" : "Clear"}</button>
        <button class="btn" id="takego">Save</button>
      </div>`);
  }

  if(sheet.kind === "facets"){
    const s = (S.shelf||[]).find(x => x.appid === sheet.appid) || {};
    const game = d.gamesById[sheet.appid] || {};
    return shell(`
      <h3>${esc(game.name||"Game")} details</h3>
      <p>Steam never says how many can play, so this bit is on us.</p>
      ${s.crew_note ? `<p class="notebox">${esc(s.crew_note)}</p>` : ""}
      <span class="eyebrow">How many, out of the box</span>
      <input class="input" id="fcrew" type="number" min="1" max="500" placeholder="Not sure? Leave it" value="${s.crew_max ?? ""}">
      <span class="eyebrow">With mods or a server, if it stretches</span>
      <input class="input" id="fmod" type="number" min="1" max="9999" placeholder="Optional" value="${s.crew_mod ?? ""}">
      <span class="eyebrow">How much of a night it costs</span>
      <div class="eopts">${[1,2,3].map(v => `<button class="eopt" data-fe="${v}" aria-pressed="${(sheet.e ?? energyOf(s,d))===v}"><b>${esc(ENERGY[v])}</b></button>`).join("")}</div>
      <span class="eyebrow">Faff to get started</span>
      <div class="eopts">${Object.keys(SETUP).map(k => `<button class="eopt" data-fs="${k}" aria-pressed="${(sheet.s ?? s.setup)===k}"><b style="font-size:11.5px">${esc(SETUP[k])}</b></button>`).join("")}</div>
      <span class="eyebrow">Vibe ${vibeOf(s,d) && !s.vibe ? "· guessed from Steam tags" : ""}</span>
      <div class="fset">${Object.keys(VIBE).map(k => `<button class="chip" data-fv="${k}" aria-pressed="${(sheet.v ?? vibeOf(s,d))===k}">${esc(VIBE[k])}</button>`).join("")}</div>
      <span class="eyebrow">Have we played it</span>
      ${(d.playsBy[sheet.appid]||[]).length ? `
        <div class="playlog">${(d.playsBy[sheet.appid]||[]).map(pl => `
          <div class="playrow">
            <span>${pl.round_no ? "Round "+pl.round_no : "Before this"}</span>
            <span>${pl.round_no ? esc(ago(pl.started_at)) : "at some point"}</span>
            <span>${pl.verdict ? VERDICT_ICON[pl.verdict]+" "+esc(VERDICT[pl.verdict]) : pl.finished_at ? "no verdict" : "on now"}</span>
            ${pl.finished_at ? `<button class="rowx" data-forget="${pl.round_no}" aria-label="Remove this play">\u2715</button>` : "<span></span>"}
          </div>`).join("")}</div>` : `<p class="notebox">Nothing logged yet. Played it before all this? Say so.</p>`}
      <div class="fset">
        ${Object.keys(VERDICT).map(k => `<button class="chip" data-past="${k}">${
          VERDICT_ICON[k]} ${esc(VERDICT[k])}</button>`).join("")}
        <button class="chip" data-past="">Played, no verdict</button>
      </div>
      <div class="row"><button class="btn" id="facetgo">Save</button></div>
      ${stateOf(s, d) === "open" ? `<button class="danger" id="retirego">Bench it</button>` : ""}`);
  }

  if(sheet.kind === "shuffle"){
    const game = d.gamesById[sheet.appid] || {};
    const s = (S.shelf||[]).find(x => x.appid === sheet.appid) || {};
    return shell(`
      <h3>🎲 ${esc(game.name || "That one")}</h3>
      <p>One of the ${sheet.pool} that survived your filters.
         ${s.setup ? esc(SETUP[s.setup])+"." : ""} ${s.crew_max ? "Up to "+s.crew_max+" players." : ""}</p>
      <div class="row">
        <button class="btn btn--ghost" id="reroll">Roll again</button>
        <button class="btn" id="shufflepick">Pick it</button>
      </div>`);
  }

  if(sheet.kind === "close"){
    if(S.group.locked_appid){
      const g2 = d.gamesById[S.group.locked_appid] || {};
      return shell(`<h3>How was ${esc(g2.name || "it")}?</h3>
        <p>For future reference. Skip it if you cannot be bothered.</p>
        <div class="eopts">
          ${Object.keys(VERDICT).map(k => `<button class="eopt" data-verdict="${k}" aria-pressed="${sheet.verdict===k}">
            <b>${VERDICT_ICON[k]}</b><span>${esc(VERDICT[k])}</span></button>`).join("")}
        </div>
        <span class="eyebrow">Where does ${esc(g2.name || "it")} go?</span>
        <div class="eopts eopts--2">
          <button class="eopt" data-bench="0" aria-pressed="${!sheet.bench}">
            <b>Leave it up</b><span>Still up for a vote, carrying its verdict</span></button>
          <button class="eopt" data-bench="1" aria-pressed="${!!sheet.bench}">
            <b>Bench it</b><span>Off the shelf until someone puts it back</span></button>
        </div>
        <p style="font-size:12.5px;color:var(--muted)">Everyone's picks reset either way. Nothing gets deleted.</p>
        <div class="row">
          <button class="btn btn--ghost" data-dismiss>Not yet</button>
          <button class="btn btn--ghost" id="newroundbreak">Take a break</button>
          <button class="btn" id="newroundgo">Next round</button>
        </div>`);
    }
    const top = d.ranked[0], game = d.gamesById[top.appid] || {};
    return shell(`<h3>Lock in ${esc(game.name||"the leader")}?</h3>
      <p>${d.votedCount} of ${d.lookedCount} have voted. Pins it up top so nobody can claim they missed it.</p>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Not yet</button>
      <button class="btn" id="closego">Lock it in</button></div>`);
  }

  if(sheet.kind === "resume"){
    const n = sheet.crew ?? d.lookedCount;
    const fits = (S.shelf||[]).filter(x => stateOf(x,d) !== "benched" && crewFit(x, n) !== "no").length;
    return shell(`<h3>Back on</h3>
      <p>How many of us this time? It sets your crew filter so nothing that can't seat you all gets in the way.</p>
      <div class="stepper">
        <button class="sbtn" data-rcrew="-" aria-label="Fewer">\u2212</button>
        <span class="val num">${n}</span>
        <button class="sbtn" data-rcrew="+" aria-label="More">+</button>
        <span class="off">${fits} of ${(S.shelf||[]).length} fit</span>
      </div>
      <div class="row">
        <button class="btn btn--ghost" id="resumeskip">Skip</button>
        <button class="btn" id="resumego">Back on</button>
      </div>`);
  }

  if(sheet.kind === "share"){
    const nudging = sheet.mode === "nudge";
    const body = nudging ? nudgeText(d) : summaryText(d);
    return shell(`<h3>Send to the chat</h3>
      <div class="fset">
        <button class="chip" data-sharemode="state" aria-pressed="${!nudging}">Where it's at</button>
        <button class="chip" data-sharemode="nudge" aria-pressed="${nudging}">Nudge the slackers</button>
      </div>
      <p>${nudging ? "Names whoever has not picked yet." : "The leaderboard, plus the link."}</p>
      <pre style="margin:0;white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px;max-height:200px;overflow:auto">${esc(body)}</pre>
      <div class="row"><button class="btn" id="copyshare">Copy it</button></div>`);
  }

  if(sheet.kind === "filters"){
    const draft = fDraft || F;
    const shelfAll = S.shelf || [];
    const counts = {
      benched: shelfAll.filter(x => stateOf(x,d) === "benched").length,
    };
    // counts are over the whole shelf, same as what the sheet will apply to
    const pool = (S.shelf || []).filter(x => (stateOf(x,d) === "benched") === draft.benched);
    const n = pool.filter(x => passes(x, d, draft)).length;
    const on = activeFilters(draft).length;
    return `<div class="sheetwrap" data-scrim><div class="sheet sheet--tall" role="dialog" aria-modal="true">
      <div class="sheethead">
        <h3>Filters</h3>
        ${on ? `<button class="clearall" id="fclear">Clear ${on}</button>` : ""}
        <button class="iconbtn" data-dismiss aria-label="Close">\u2715</button>
      </div>
      <div class="sheetbody">${filterPanel(d, pool, counts)}</div>
      <div class="sheetfoot">
        ${n
          ? `<button class="btn" id="fapply">Show ${n} game${n===1?"":"s"}</button>`
          : `<button class="btn" id="fclearall">Nothing matches. Start again</button>`}
      </div>
    </div></div>`;
  }

  if(sheet.kind === "arrange"){
    const set = (keys) => `<div class="fset">${keys.map(k =>
      `<button class="chip" data-arrange="${k}" aria-pressed="${arrange===k}">${esc(ARRANGE[k].label)}</button>`).join("")}</div>`;
    const flat = Object.keys(ARRANGE).filter(k => ARRANGE[k].group === "none");
    const grouped = Object.keys(ARRANGE).filter(k => ARRANGE[k].group !== "none");
    return shell(`<h3>Arrange</h3>
      <div class="fgroup"><div class="lab"><span class="eyebrow">One list</span></div>${set(flat)}</div>
      <div class="fgroup"><div class="lab"><span class="eyebrow">In sections</span></div>${set(grouped)}</div>`);
  }

  if(sheet.kind === "me"){
    const me = d.meMember || {};
    return shell(`<h3>That's you</h3>
      <p>You're <b>${esc(me.name||"")}</b>${me.device_count>1?" on "+me.device_count+" devices":""}.
         Rename yourself here and your votes come with you.</p>
      <input class="input" id="renameinput" maxlength="24" aria-label="Your name" value="${esc(me.name||"")}">
      <div class="row"><button class="btn" id="renamego">Save name</button></div>`);
  }

  if(sheet.kind === "switch"){
    return shell(`<h3>Your crews</h3>
      <div class="mygroups">${myGroups.map(g => `<button class="mygroup" data-open="${esc(g.code)}">
        <span class="dot" style="width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;font-family:var(--f-display);background:hsl(${hueOf(g.code)} 44% 32%)">${esc(monogram(g.name))}</span>
        <span class="nm">${esc(g.name)}</span><span class="cd">${esc(g.code)}</span></button>`).join("")}</div>
      <div class="row"><button class="btn btn--ghost" id="tolanding">Start or join another</button></div>`);
  }
  return "";
}
