}

/* ============================================================================
   WIRING
   ========================================================================== */
/* A dialog you cannot reach with a keyboard is a dialog half the people using
   it cannot close. Move focus in, keep Tab inside it, put focus back where it
   came from on the way out. */
let focusReturn = null;
/* Phone bottom sheets: drag the grabber (or the sheet, when it's scrolled to
   the top) down to close. It follows your finger; let go past ~100px or with
   a flick and it slides away, otherwise it springs back. */
function wireSheetDrag(scrim){
  const sh = scrim.querySelector(".sheet:not(.sheet--tall)");
  if(!sh || !matchMedia("(max-width:639px)").matches) return;
  let y0 = null, dy = 0, dragging = false, trail = [];   // trail: recent [time, dy] for flick speed
  const fromTop = y => y - sh.getBoundingClientRect().top;
  sh.addEventListener("touchstart", e => {
    const y = e.touches[0].clientY;
    const nearGrabber = !!e.target.closest(".grab") || fromTop(y) < 30;
    const insideScroller = e.target.closest("input, textarea, select, .ownlist, .ep-grid, .sharepre, .dgrid");
    y0 = nearGrabber || (sh.scrollTop <= 0 && !insideScroller) ? y : null;
    dy = 0; dragging = false; trail = [];
  }, { passive: true });
  sh.addEventListener("touchmove", e => {
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    const now = performance.now(); trail.push([now, dy]); while(trail.length > 2 && now - trail[0][0] > 120) trail.shift();
    if(!dragging){ if(dy > 6) dragging = true; else if(dy < -6){ y0 = null; return; } else return; }
    e.preventDefault();                                   // we own this gesture now, the page mustn't scroll
    sh.classList.add("dragging");
    sh.style.transition = "none";
    sh.style.transform = `translateY(${Math.max(0, dy)}px)`;
    scrim.style.backgroundColor = `rgba(10,12,15,${(0.62 * Math.max(0, 1 - dy / sh.offsetHeight)).toFixed(3)})`;
  }, { passive: false });
  const end = () => {
    sh.classList.remove("dragging");
    if(!dragging){ y0 = null; return; }
    // speed over the last ~120ms, so a slow drag that ends in a flick still counts
    const [ta, da] = trail[0] || [0, 0], [tb, db] = trail[trail.length - 1] || [1, 0];
    const flick = dy > 24 && (db - da) / Math.max(1, tb - ta) > 0.5;
    if(dy > 100 || flick){
      sh.style.transition = "transform .18s ease-in";
      sh.style.transform = "translateY(105%)";
      scrim.style.transition = "background-color .18s"; scrim.style.backgroundColor = "rgba(10,12,15,0)";
      setTimeout(closeSheet, 170);
    } else {
      sh.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)";
      sh.style.transform = "";
      scrim.style.backgroundColor = "";
    }
    y0 = null; dragging = false;
  };
  sh.addEventListener("touchend", end);
  sh.addEventListener("touchcancel", end);
}

/* ---------- your crews, from the server ----------
   The list on the landing page lives in this browser, but membership lives in
   the database. Once per visit, ask which crews this device is in, so a crew
   that got a new code (or one joined on this device some other way) shows up. */
let crewsSynced = false, crewMoved = false;
async function syncMyCrews(){
  if(crewsSynced || !CONFIGURED || !SDK_OK) return;
  crewsSynced = true;
  try{
    const list = await rpc("my_crews", { p_device: deviceId }) || [];
    let changed = false;
    list.forEach(c => { const had = myGroups.find(g => g.code === c.code);
      if(!had || had.name !== c.name || had.emoji !== c.emoji){ changed = true;
        myGroups = [...myGroups.filter(g => g.code !== c.code), { code: c.code, name: c.name, emoji: c.emoji }]; } });
    // crews deleted or given a new code drop off this browser's list
    const unknown = myGroups.map(g => g.code).filter(c => !list.some(x => x.code === c));
    if(unknown.length){
      const live = await rpc("live_codes", { p_codes: unknown }).catch(() => null);
      if(Array.isArray(live)){ const gone = unknown.filter(c => !live.includes(c));
        if(gone.length){ changed = true; crewMoved = crewMoved || !code; myGroups = myGroups.filter(g => !gone.includes(g.code)); } }
    }
    if(!myName && list[0]){ myName = list[0].me; store.set("name", myName); }
    if(changed){ store.set("groups", myGroups); if(!code && !/^#\/admin/.test(location.hash)) render(); }
    if(crewMoved){ crewMoved = false; const h = document.getElementById("joinhint");
      if(h) h.textContent = "That crew link doesn't work any more. If it got a new code and you were in it, it's in your list above."; }
  }catch(err){ console.warn("my_crews", err && err.message); }
}

/* ---------- linking another device ---------- */
async function finishPairing(raw){
  const code6 = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const crews = await rpc("finish_pairing", { p_pair: code6, p_device: deviceId });
  (crews || []).forEach(c => { myGroups = [...myGroups.filter(g => g.code !== c.code), { code: c.code, name: c.name, emoji: c.emoji }]; });
  store.set("groups", myGroups);
  if(!myName && crews && crews[0]){ myName = crews[0].me; store.set("name", myName); }
  return crews || [];
}
function wirePairing(){
  const st = document.getElementById("pairstart");
  if(st) st.onclick = async () => {
    st.disabled = true; st.textContent = "Getting a code…";

    catch(err){ st.disabled = false; st.textContent = "Link another device"; console.warn(err.message); }
  };
  const link = () => location.origin + location.pathname + "#/pair/" + sheet.pair;
  const pc = document.getElementById("paircopy"); if(pc) pc.onclick = () => copy(link(), pc);
  const ps = document.getElementById("pairshare"); if(ps) ps.onclick = () => navigator.share({ title: "Link Game Night", url: link() }).catch(() => {});
  const po = document.getElementById("pairopen"); if(po) po.onclick = () => { sheet = { kind: "pair" }; render(); };
  const pin = document.getElementById("pairin"), go = document.getElementById("pairgo"), msg = document.getElementById("pairmsg");
  if(pin){

      sheet.code = v; go.disabled = v.length !== 6; msg.textContent = ""; msg.classList.remove("hint--bad"); });
    pin.addEventListener("keydown", e => { if(e.key === "Enter" && !go.disabled) go.click(); });

/* opening a #/pair/CODE link does it straight away, then lands on your crews */
async function pairFromHash(){
  const m = location.hash.match(/^#\/pair\/([A-Za-z0-9]{6})/);
  if(!m) return false;
  history.replaceState(null, "", location.pathname);
  try{ await finishPairing(m[1]); render(); const h = document.getElementById("joinhint"); if(h) h.textContent = "Linked. Your crews are above."; }
  catch(err){ sheet = { kind: "pair", code: m[1].toUpperCase() }; render();
    const g = document.getElementById("pairmsg"); if(g){ g.textContent = err.message; g.classList.add("hint--bad"); } }
  return true;
}

function closeSheet(){
  sheet = null; pending = null; fDraft = null;
  render();
  if(focusReturn && document.contains(focusReturn)) focusReturn.focus();
  focusReturn = null;
}
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function trapFocus(scrim){
  const box = scrim.querySelector(".sheet");
  if(!box) return;
  // name the dialog after its own heading, so a screen reader announces what opened
  const h = box.querySelector("h3");
  if(h && !box.getAttribute("aria-labelledby")){
    h.id = h.id || "sheet-title";
    box.setAttribute("aria-labelledby", h.id);
  }
  const items = () => [...box.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
  const first = items()[0];
  // a text field wants the caret; anything else just wants the ring
  // focusing a row inside a scrolling list would scroll the top of it out of sight
  if(first && !box.contains(document.activeElement)) first.focus({ preventScroll: true });
  box.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    const list = items();
    if(!list.length) return;
    const a = list[0], z = list[list.length-1];
    if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
  });
}

  const spb = document.getElementById("spinbtn"); if(spb) spb.onclick = () => { sheet = { kind:"spin" }; render(); };

    const a = +(b.dataset.own || b.dataset.ownone), own = b.getAttribute("aria-pressed") !== "true";

    try{ await rpc("set_owns", { p_code: code, p_device: deviceId, p_appids: [a], p_own: own }); }
    catch(err){ console.warn("set_owns", err.message); await refresh(); render(); }
  });
  refreshPrices();
  if(sheet && sheet.kind === "discord") wireDiscord();
  app.querySelectorAll("[data-claimwho]").forEach(b => b.onclick = () => {
    const m = (S.members || []).find(x => String(x.member_id) === b.dataset.claimwho);

  });

  // --- name entry, step one
  const ni = document.getElementById("nameinput");
  if(ni){
    // with the crew listed above, focusing the field would pop the keyboard over it
    if(!document.querySelector(".candlist")) ni.focus();
    const go = async () => {
      const v = ni.value.trim(); if(!v) return;
      const then = sheet.then, groupName = sheet.groupName;

        catch(e){ btn.disabled=false; btn.textContent="That's me"; alert(e.message); }

      // step two: does this name look like someone already here?
      const candidates = nameMatches(v, (S && S.members) || []);

      }
      try{ await finishAsNew(v); }
      catch(e){ btn.disabled=false; btn.textContent="That's me"; alert(e.message); }
    };
    document.getElementById("namego").onclick = go;
    ni.onkeydown = e => { if(e.key==="Enter") go(); };
  }

  // --- name entry, step two
  document.querySelectorAll("[data-claim]").forEach(b => {
    b.onclick = async () => {
      const m = (S.members||[]).find(x => String(x.member_id) === b.dataset.claim);

      b.disabled = true;

  const notme = document.getElementById("notme");
  if(notme) notme.onclick = async () => {
    // same exact name as someone already here: no silent "Jehan (2)", ask for another
    const taken = nameTaken(sheet.typed, S.members); if(taken){ sheet = { ...sheet, step:null, taken }; render(); return; }
    notme.disabled = true;
    try{ await finishAsNew(sheet.typed); }catch(e){ notme.disabled=false; alert(e.message); }
  };
}

    app.querySelectorAll("[data-need]").forEach(b => b.onclick = () => {
      const total = Math.max(1, (S.members||[]).length), cur = sheet.need ?? total;
      let next = b.dataset.need === "-" ? Math.max(1, cur - 1) : Math.min(Math.max(12, total), cur + 1);
      sheet.need = next === total ? null : next;
      const w = needWords(sheet.need, total);
      document.getElementById("needval").textContent = w.val;
      document.getElementById("needhint").textContent = w.hint;
    });
    const st = document.getElementById("seshtime");
    if(st) st.addEventListener("input", () => { sheet.time = st.value; });
    const sv = document.getElementById("rulessave");
    if(sv) sv.onclick = async () => {
      if(needName(() => {})) return;
      const need = sheet.need ?? null, time = (sheet.time || "").trim() || "8pm";
      sv.disabled = true; sv.textContent = "Saving…";
      try{
        await rpc("set_sesh_rules", { p_code: code, p_device: deviceId, p_need: need, p_time: time });
        sheet = back ? { kind:"sesh", appid: back } : null;
        await refresh(); render();
      }catch(err){
        sv.disabled = false; sv.textContent = "Save";
        const m = document.getElementById("rulesmsg"); m.textContent = err.message; m.hidden = false;
      }
    };
  }
}

function wireDiscord(){
  const msg = document.getElementById("dcmsg");
  const say = (t, bad) => { if(msg){ msg.textContent = t; msg.classList.toggle("hint--bad", !!bad); } };
  const hookIn = document.getElementById("dchook"), go = document.getElementById("dcgo");
  const looksRight = v => /^https:\/\/(ptb\.|canary\.)?discord(app)?\.com\/api\/webhooks\/\d+\/[\w-]+$/.test(v.trim());
  if(hookIn) hookIn.addEventListener("input", () => { go.disabled = !looksRight(hookIn.value);
    if(hookIn.value.trim() && !looksRight(hookIn.value)) say("That doesn't look like a webhook link yet. It starts with https://discord.com/api/webhooks/", true);
    else say("Only this crew's scoreboard uses it. Nobody else sees the link."); });
  if(go) go.onclick = async () => {
    go.disabled = true; go.textContent = "Connecting…";
    try{
      await rpc("set_discord", { p_code: code, p_device: deviceId, p_hook: hookIn.value.trim() });
      await pingDiscord(true);
      await refresh(); render(); say("Posted. Have a look in the channel.");
    }catch(err){ go.disabled = false; go.textContent = "Connect"; say(err.message, true); }
  };
  const post = document.getElementById("dcpost");
  if(post) post.onclick = async () => {
    post.disabled = true;
    try{ await pingDiscord(true); say("Posted a fresh one."); }
    catch(err){ say(err.message, true); if(/gone/.test(err.message)){ await refresh(); render(); } }
    post.disabled = false;
  };
  const off = document.getElementById("dcoff");
  if(off) off.onclick = async () => {
    off.disabled = true;
    try{ await rpc("set_discord", { p_code: code, p_device: deviceId, p_hook: null }); await refresh(); render(); }
    catch(err){ off.disabled = false; say(err.message, true); }
  };
}

function wireSeshBody(d){
  const ip = inPlay(d).find(z => z.appid === sheet.appid);
  const body = document.getElementById("seshbody");
  if(!ip || !body) return;
  const appid = ip.appid;
  // tapping a night: update the page now, save shortly after
  body.querySelectorAll("[data-dday]").forEach(c => c.onclick = () => {
    if(needName(() => {})) return;
    const day = c.dataset.dday;
    S.sesh_free = S.sesh_free || [];
    const i = S.sesh_free.findIndex(f => f.appid === appid && f.day === day && f.member_id === myMemberId);
    if(i >= 0) S.sesh_free.splice(i, 1); else S.sesh_free.push({ appid, day, member_id: myMemberId });
    S.sesh_none = (S.sesh_none || []).filter(n => !(n.appid === appid && n.member_id === myMemberId));
    body.innerHTML = seshBody(d, seshFor(d, ip));
    wireSeshBody(d);
    const again = body.querySelector(`[data-dday="${day}"]`); if(again) again.focus({ preventScroll: true });
    queueFree(appid);
  });
  const game = d.gamesById[appid] || { appid };
  const run = async (fn, args, btn) => {
    if(needName(() => {})) return;
    btn.disabled = true;
    try{ await rpc(fn, { p_code: code, p_device: deviceId, p_appid: appid, ...args }); }
    catch(err){ btn.disabled = false; console.warn(fn, err && err.message); }
    refresh();
  };
  const lk = document.getElementById("lockgo");   if(lk) lk.onclick = () => run("lock_sesh", { p_day: lk.dataset.lday }, lk);
  const ul = document.getElementById("unlockgo"); if(ul) ul.onclick = () => run("unlock_sesh", {}, ul);
  const no = document.getElementById("nonego");   if(no) no.onclick = () => run("set_none", {}, no);
  const ic = document.getElementById("icsgo");
  if(ic) ic.onclick = () => { const x = seshFor(d, ip); if(x.lock) downloadIcs({ ...game, appid }, x.lock.day); };
}

/* A result that simply appears reads as "the computer picked". A reel that
   runs down and lands reads as a roll, which is the whole point of the button.
   It only ever changes text in a span, so nothing else on the page re-renders,
   and it is skipped outright for anyone who has asked for less motion. */
function spinReel(d, pool){
  const el = document.getElementById("reel");
  if(!el || !sheet || sheet.kind !== "shuffle" || sheet.spun) return;
  sheet.spun = true;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const names = (pool||[]).map(s => (d.gamesById[s.appid]||{}).name).filter(Boolean);
  if(names.length < 3) return;
  const landed = el.textContent;
  const die = document.getElementById("die");
  el.classList.add("spinning");
  if(die) die.classList.add("rolling");
  let wait = 55, elapsed = 0;
  const step = () => {
    if(!document.getElementById("reel")) return;      // sheet closed mid-roll
    el.textContent = names[Math.floor(Math.random()*names.length)];
    elapsed += wait;
    wait *= 1.28;                                      // ease out into the answer
    if(elapsed < 900) setTimeout(step, wait);
    else {
      el.textContent = landed;
      el.classList.remove("spinning");
      if(die) die.classList.remove("rolling");
    }
  };
  setTimeout(step, wait);
}

/* Feeds the pointer position into whichever card is under it, so the border
   glow can follow the cursor. One delegated listener on the app root rather
   than fifteen, throttled to a frame, and never attached on a touch device. */
(() => {
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  let queued = null, raf = 0;
  app.addEventListener("pointermove", e => {
    const card = e.target.closest && e.target.closest(".card");
    if(!card) return;
    queued = [card, e.clientX, e.clientY];
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const [c, x, y] = queued;
      const r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (((x - r.left) / r.width) * 100).toFixed(1) + "%");
      c.style.setProperty("--my", (((y - r.top) / r.height) * 100).toFixed(1) + "%");
    });
  }, { passive: true });
})();

/* ---------- keyboard ---------- */
// one listener instead of setting focusReturn in twenty separate handlers
document.addEventListener("mousedown", e => {
  const b = e.target.closest && e.target.closest("button");
  if(b) focusReturn = b;
}, true);
document.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.tagName === "BUTTON")
    focusReturn = document.activeElement;
}, true);

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && sheet){ closeSheet(); return; }
  if(e.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){
    const q = document.getElementById("q");
    if(q){ e.preventDefault(); q.focus(); }
  }
});

/* ---------- theme ---------- */
// Light or dark, nothing else. Defaults to whatever the device is set to the
// first time, then remembers the choice.
let theme = store.get("theme", null) ||
  (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const isDark = () => theme === "dark";
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.style.colorScheme = theme;   // native scrollbars match the app, not the OS
  store.set("theme", theme);
}
applyTheme();

/* ---------- night sky ----------
   A starfield behind everything, with shooting stars. Quiet but present: a
   field of faint points with a slow twinkle, and a streak every
   couple of seconds. It is one canvas painted at 30fps, it stops when the tab is hidden,
   and under reduced motion it paints the stars once and never moves them. The
   colours come from the theme tokens: pale points on the night, and the same
   field inverted to ink-lavender specks on paper in light. */
(() => {
  const c = document.createElement("canvas");
  c.id = "sky"; c.setAttribute("aria-hidden", "true");
  document.body.prepend(c);
  const ctx = c.getContext("2d");
  if(!ctx) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  let W = 0, H = 0, stars = [], shots = [], nextShot = 0, raf = 0, last = 0, tick = 0;
  let starCol = "rgba(220,214,255,.9)", headCol = "#B8B4FF", tailCol = "#93C5FD", darkNow = true;

  // the theme can flip at any moment, so re-read the tokens now and then
  function palette(){
    const cs = getComputedStyle(document.documentElement);
    starCol = cs.getPropertyValue("--star").trim() || starCol;
    headCol = cs.getPropertyValue("--grad-a").trim() || headCol;
    tailCol = cs.getPropertyValue("--grad-b").trim() || tailCol;
    darkNow = document.documentElement.getAttribute("data-theme") !== "light";
  }
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Area alone starves a phone (a fifth of a desktop's pixels on a screen
    // you hold at arm's length), so there is a floor and the curve is flatter
    // than linear: ~70 on a phone, ~140 on a big monitor.
    const n = Math.min(300, Math.max(70, Math.round(Math.pow(W * H, 0.62) * 0.042)));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.5 + Math.random() * 1.0,            // radius in css px
      o: 0.3 + Math.random() * 0.55,           // base opacity
      t: Math.random() * Math.PI * 2,          // twinkle phase
      s: 0.25 + Math.random() * 0.45,          // twinkle speed
    }));
    palette();
    if(reduce.matches) paint(0, 0);            // one still frame, then nothing
  }
  function spawn(now){
    // start just off a side, heading down at a shallow angle, like the real
    // thing rather than a laser
    const fromLeft = Math.random() < 0.5;
    const ang = 0.45 + Math.random() * 0.35;          // radians from straight down
    const speed = 460 + Math.random() * 180;
    shots.push({
      x: fromLeft ? -20 : W + 20, y: Math.random() * H * 0.55,
      vx: (fromLeft ? 1 : -1) * Math.sin(ang) * speed, vy: Math.cos(ang) * speed * 0.55,
      len: 130 + Math.random() * 120, born: now, life: 1.7,
    });
    nextShot = now + 2000 + Math.random() * 3000;
  }
  function paint(now, dt){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = starCol;
    for(const st of stars){
      if(!reduce.matches) st.t += dt * st.s;
      ctx.globalAlpha = st.o * (0.6 + 0.4 * Math.sin(st.t));
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for(const sh of shots){
      const age = (now - sh.born) / 1000;
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      const fade = age < 0.25 ? age / 0.25 : Math.max(0, 1 - (age - 0.25) / (sh.life - 0.25));
      const sp = Math.hypot(sh.vx, sh.vy);
      const tx = sh.x - (sh.vx / sp) * sh.len, ty = sh.y - (sh.vy / sp) * sh.len;
      const g = ctx.createLinearGradient(tx, ty, sh.x, sh.y);
      g.addColorStop(0, "transparent"); g.addColorStop(0.7, tailCol); g.addColorStop(1, headCol);
      ctx.globalAlpha = (darkNow ? 0.85 : 0.7) * fade;
      ctx.strokeStyle = g; ctx.lineWidth = 1.8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(sh.x, sh.y); ctx.stroke();
      // a small bright head
      ctx.fillStyle = headCol;
      ctx.beginPath(); ctx.arc(sh.x, sh.y, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      sh.dead = age > sh.life || sh.x < -260 || sh.x > W + 260 || sh.y > H + 260;
    }
    if(shots.some(sh => sh.dead)) shots = shots.filter(sh => !sh.dead);
  }
  function frame(now){
    raf = requestAnimationFrame(frame);
    if(now - last < 33) return;                // 30fps is plenty for this
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if(++tick % 60 === 0) palette();
    if(shots.length < 2 && now > nextShot) spawn(now);
    paint(now, dt);
  }
  function start(){ if(reduce.matches || raf) return; last = performance.now(); nextShot = last + 900; raf = requestAnimationFrame(frame); }
  function stop(){ cancelAnimationFrame(raf); raf = 0; }
  addEventListener("resize", resize, { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  reduce.addEventListener("change", () => { reduce.matches ? (stop(), resize()) : start(); });
  resize();
  start();
})();

/* ============================================================================
   BOOT + POLLING
   Ten seconds while the tab is visible, immediate on focus. No realtime
   replication to enable, which is one less setup step to get wrong.
   ========================================================================== */
window.addEventListener("hashchange", () => { S=null; myMemberId=null; expanded.clear(); clearAll(); render(); pairFromHash(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh({ quiet: true }); });
window.addEventListener("focus", () => refresh({ quiet: true }));
/* The toolbar stays put. It used to slide away on scroll-down, which read as
   the page jumping around; a shadow when it is pinned is enough. */
(() => {
  let ticking = false;
  const apply = () => {
    ticking = false;
    // header: glass as soon as anything has scrolled under it
    const top = document.querySelector(".top");
    if(top) top.classList.toggle("is-stuck", window.scrollY > 0);
    // toolbar: glass only once it has genuinely pinned under the header, so it
    // never shows a backing box while it is still sitting in the page flow
    const bar = document.querySelector(".shelfbar");
    if(bar){
      const pin = parseFloat(getComputedStyle(bar).top) || 54;
      bar.classList.toggle("is-stuck", window.scrollY > 0 && bar.getBoundingClientRect().top <= pin + 1);
    }
  };
  window.addEventListener("scroll", () => {
    if(!ticking){ ticking = true; requestAnimationFrame(apply); }
  }, {passive:true});
})();

setInterval(() => { if(!document.hidden && code) refresh({ quiet: true }); }, 10000);
setInterval(() => { if(!document.hidden && code) rpc("touch_group",{p_code:code,p_device:deviceId}).catch(()=>{}); }, 60000);

render();
pairFromHash();
</script>
