    </div>
    <div class="st-acts">
      ${d.ranked.length && !solo ? `<button class="btn btn--sm${call.ready ? "" : " btn--ghost"}${call.ready ? " btn--ready" : ""}" id="closebtn">Call it</button>` : ""}
      ${menu}
    </div>
    ${solo ? "" : `<div class="st-track" aria-hidden="true"><i style="width:${pct}%"></i></div>`}
  </section>`;
}

function card(s, d){
  const state = stateOf(s, d);
  const game = d.gamesById[s.appid] || {name:"Loading…", appid:s.appid};
  const n = d.counts[s.appid]||0, on = d.myPicks.includes(s.appid);
  const eff = energyOf(s, d);
  const cf = crewFit(s, F.crew);
  const takes = d.takesBy[s.appid]||[];
  const tagline = BLURBS[s.appid] || game.short_desc || "";
  const plays = d.playsBy[s.appid] || [];
  const lastPlay = plays[0];
  const isNow = d.nowPlaying && d.nowPlaying.appid === s.appid;
  const called = !!S.group.locked_appid;
  // one card is winning; the beam says which without spending a badge on it
  const isLead = !called && state === "open"
              && d.ranked.length && d.ranked[0].appid === s.appid && n > 0;
  // Everything a glance needs and nothing else: name, one line, three facts.
  // Reviews, setup, Steam, who added it and the long blurb live in details.
  return `<article class="card card--${state}${on?" on":""}${pulse===s.appid?" pulse":""}${isLead?" card--lead":""}">
    <span class="ring" aria-hidden="true"></span>
    <div class="art" style="--tile:hsl(${hueOf(game.name)} 24% 36%);--ang:${20+(s.appid%120)}deg">
      <div class="gen" aria-hidden="true"><span>${esc(monogram(game.name))}</span></div>
      ${game.header ? `<img src="${esc(game.header)}" alt="" loading="lazy" onload="this.classList.add('in')">` : ""}
      <div class="badges">
        ${isNow ? `<span class="bdg bdg--now">▶ playing now</span>`
          : cf === "mods" ? `<span class="bdg bdg--mods">needs a mod</span>`
          : cf === "unknown" && F.crew ? `<span class="bdg">cap unknown</span>`
          : ""}
        <span class="sp"></span>
        ${state === "benched" ? `<span class="bdg bdg--backlog">benched</span>`
          : plays.length && !isNow ? `<span class="bdg bdg--played" title="Last played ${esc(ago(lastPlay.started_at))}">${
              plays.length > 1 ? "played ×"+plays.length : "played"}</span>` : ""}
      </div>
    </div>
    <div class="body">
      <h3>${esc(game.name)}</h3>
      ${tagline ? `<p class="desc clamp">${esc(tagline)}</p>` : ""}
      <div class="meta">
        ${eff ? `<span class="e e${eff}${energyIsGuess(s,d)?" guess":""}" title="Energy: ${esc(ENERGY[eff])}${energyIsGuess(s,d)?", guessed from Steam tags":""}"><i class="lvl" aria-hidden="true">${
          "●".repeat(eff)}${"○".repeat(3-eff)}</i>${esc(ENERGY[eff])}</span>` : ""}
        <button class="cap" data-facets="${s.appid}" title="${esc(s.crew_note||"Tap to set the player cap")}">${
          s.crew_max ? "Up to "+s.crew_max : "Cap?"}${s.crew_mod ? ` <span class="modhint">${s.crew_mod} modded</span>` : ""}</button>
        ${game.shape ? `<span>${esc(SHAPE[game.shape]||game.shape)}</span>` : ""}
        ${lastPlay && !isNow && lastPlay.verdict ? `<span class="v v-${lastPlay.verdict}">${VERDICT_ICON[lastPlay.verdict]} ${esc(VERDICT[lastPlay.verdict])}</span>` : ""}
      </div>
      ${takes.length ? `<p class="take"><b>${esc(takes[0].by)}</b>${esc(takes[0].body)}${takes.length > 1 ? ` <span class="takemore">+${takes.length-1}</span>` : ""}</p>` : ""}
      <div class="foot">
        ${state === "benched"
          ? `<button class="pick" data-unbench="${s.appid}">Put it back</button>`
          : state === "playing"
          ? `<span class="pick pick--static">On right now</span>`
          : called
          ? `<span class="pick pick--static pick--quiet"><span class="n num">${n}</span> ${n===1?"vote":"votes"}</span>`
          : `<button class="pick" data-pick="${s.appid}" aria-pressed="${on}">${
              on ? "Picked" : d.myPicks.length >= 3 ? "Replace a pick" : "Pick this"
            }<span class="n num${lastCounts[s.appid] != null && lastCounts[s.appid] !== n ? " bump" : ""}">${n}</span></button>`}
        <button class="mini" data-facets="${s.appid}" aria-label="Details for ${esc(game.name)}">
          <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
      </div>
    </div></article>`;
}

// backlogCard removed: card() handles every state, so there is one component
/* ---------- sheets ---------- */
function renderSheet(d){
  const shell = inner => `<div class="sheetwrap" data-scrim><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;

  if(sheet.kind === "name"){
    if(sheet.step === "match"){
      // the "is that the same as this account" moment
      const many = sheet.candidates.length > 1;
      return shell(`
        <h3>Have we met?</h3>
        <p>There ${many?"are already people":"is already someone"} in this group with a name like
           <b>${esc(sheet.typed)}</b>. If one of them is you, tap it and your picks carry over to this device.</p>
        ${sheet.candidates.map(c => {
          const voted = (S.ballots||[]).find(b => b.member_id===c.member_id && (b.picks||[]).length);
          const bits = [];
          if(voted) bits.push(voted.picks.length + (voted.picks.length===1?" pick":" picks"));
          else bits.push("no picks yet");
          bits.push("last here " + ago(c.last_seen));
          if(c.device_count>1) bits.push(c.device_count+" devices");
          return `<button class="cand" data-claim="${esc(c.member_id)}">
            <span class="dot" style="background:hsl(${hueOf(c.name)} 58% 30%)">${esc(monogram(c.name))}</span>
            <span class="txt"><b>${esc(c.name)}</b><span>${esc(bits.join(" · "))}</span></span>
            <span style="color:var(--muted)">→</span></button>`;
        }).join("")}
        <div class="row">
          <button class="btn btn--ghost" id="notme">Nah, I'm new</button>
        </div>`);
    }
    const returning = !!myName;
    return shell(`
      <h3>${returning ? "Back again" : "Who's this?"}</h3>
      <p>${returning
        ? "We know you on this device. Only change it if you are, in fact, someone else."
        : "Just a name for the list. No signup, nothing to remember."}</p>
      <input class="input" id="nameinput" placeholder="Your name" maxlength="24" value="${esc(sheet.typed||"")}">
      <div class="row"><button class="btn" id="namego">${returning ? "Continue as "+esc(myName) : "That's me"}</button></div>`);
  }

  if(sheet.kind === "take"){
    const game = d.gamesById[sheet.appid] || {};
    const mine = (d.takesBy[sheet.appid]||[]).find(t => t.mine);
    return shell(`
      <h3>${sheet.fromAdd ? "In it goes. Sell it to us?" : "Your take on "+esc(game.name||"this")}</h3>
      <p>${sheet.fromAdd
        ? "One line on why "+esc(sheet.gameName||"it")+" is worth a night. Shows on the card. Skip if you cannot be bothered."
        : "One line, shows on the card. Be honest."}</p>
      <input class="input" id="takeinput" maxlength="140" placeholder="e.g. peaks at 4, grindy after that" value="${esc(mine?mine.body:"")}">
      <div class="row">
        <button class="btn btn--ghost" id="takeclear">${sheet.fromAdd ? "Skip" : "Clear"}</button>
        <button class="btn" id="takego">Save</button>
      </div>`);
  }

  if(sheet.kind === "facets"){
    const s = (S.shelf||[]).find(x => x.appid === sheet.appid) || {};
    const game = d.gamesById[sheet.appid] || {};
    const takes = d.takesBy[sheet.appid] || [];
    const mine = takes.find(t => t.mine);
    const desc = game.long_desc || game.short_desc || "";
    return `<div class="sheetwrap" data-scrim><div class="sheet sheet--tall" role="dialog" aria-modal="true">
      <div class="sheethead">
        <h3>${esc(game.name||"Game")}</h3>
        <button class="iconbtn" data-close aria-label="Close">✕</button>
      </div>
      <div class="sheetbody">
        <div class="dl">
          ${game.review_pct != null ? `<span class="pill pill--rev" title="${esc(game.review_desc||"")}">${game.review_pct}% on Steam · ${(game.review_count||0).toLocaleString()} reviews</span>` : ""}
          <a class="pill pill--link" href="https://store.steampowered.com/app/${sheet.appid}/" target="_blank" rel="noopener">Steam ↗</a>
          ${s.added_name ? `<span class="pill">Added by ${esc(s.added_name)}</span>` : ""}
        </div>
        ${desc ? `<p class="dlong">${esc(desc)}</p>` : ""}

        <span class="eyebrow">What people reckon</span>
        ${takes.length ? `<div class="takes">${takes.map(t=>`<p class="take"><b>${esc(t.by)}</b>${esc(t.body)}</p>`).join("")}</div>` : `<p class="notebox">No takes yet. Yours goes here.</p>`}
        <input class="input" id="takeinput" maxlength="140" placeholder="Your one-liner, e.g. peaks at 4, grindy after that" value="${esc(mine?mine.body:"")}">

        <span class="eyebrow">How many can play</span>
        ${s.crew_note ? `<p class="notebox">${esc(s.crew_note)}</p>` : ""}
        <div class="row">
          <input class="input" id="fcrew" type="number" min="1" max="500" placeholder="Out of the box" value="${s.crew_max ?? ""}" aria-label="Player cap out of the box">
          <input class="input" id="fmod" type="number" min="1" max="9999" placeholder="With mods" value="${s.crew_mod ?? ""}" aria-label="Player cap with mods or a server">
        </div>
        <span class="eyebrow">Energy</span>
        <div class="eopts">${[1,2,3].map(v => `<button class="eopt" data-fe="${v}" aria-pressed="${(sheet.e ?? energyOf(s,d))===v}"><b>${esc(ENERGY[v])}</b></button>`).join("")}</div>
        <span class="eyebrow">Setup</span>
        <div class="eopts">${Object.keys(SETUP).map(k => `<button class="eopt" data-fs="${k}" aria-pressed="${(sheet.s ?? s.setup)===k}"><b style="font-size:12px">${esc(SETUP[k])}</b></button>`).join("")}</div>
        <span class="eyebrow">What we'll be doing ${doingOf(s,d) && !s.doing ? "· guessed from Steam" : ""}</span>
        <div class="fset">${Object.keys(DOING).map(k => `<button class="chip" data-fv="${k}" aria-pressed="${(sheet.v ?? doingOf(s,d))===k}">${esc(DOING[k])}</button>`).join("")}</div>

        <span class="eyebrow">Have we played it</span>
        ${(d.playsBy[sheet.appid]||[]).length ? `
          <div class="playlog">${(d.playsBy[sheet.appid]||[]).map(pl => `
            <div class="playrow">
              <span>${pl.round_no ? "Round "+pl.round_no : "Before this"}</span>
              <span>${pl.round_no ? esc(ago(pl.started_at)) : "at some point"}</span>
              <span>${pl.verdict ? VERDICT_ICON[pl.verdict]+" "+esc(VERDICT[pl.verdict]) : pl.finished_at ? "no verdict" : "on now"}</span>
              ${pl.finished_at ? `<button class="rowx" data-forget="${pl.round_no}" aria-label="Remove this play">✕</button>` : "<span></span>"}
            </div>`).join("")}</div>` : `<p class="notebox">Nothing logged. Played it before all this? Say so.</p>`}
        <div class="fset">
          ${Object.keys(VERDICT).map(k => `<button class="chip" data-past="${k}">${
            VERDICT_ICON[k]} ${esc(VERDICT[k])}</button>`).join("")}
          <button class="chip" data-past="">Played, no verdict</button>
        </div>
        ${stateOf(s, d) === "open" ? `<button class="danger" id="retirego">Bench it</button>` : ""}
      </div>
      <div class="sheetfoot"><button class="btn" id="facetgo">Save</button></div>
    </div></div>`;
  }

  if(sheet.kind === "add"){
    return shell(`
      <h3>Add a game</h3>
      <p>Search Steam by name, or paste a store link.</p>
      <div class="addfield">
        <input class="input" id="addq" aria-label="Search Steam by name, or paste a store link"
               placeholder="e.g. Valheim, or a Steam link" value="${esc(addQ)}"
               enterkeyhint="search" autocomplete="off" ${busy?"disabled":""}>
        <button class="addgo" id="addgo" aria-label="Look it up" ${busy||addBusy?"disabled":""}>
          ${addBusy
            ? `<span class="spin"></span>`
            : `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`}
        </button>
      </div>
      ${addResults.length ? `<div class="results">${addResults.map(r => `
        <div class="res">
          ${r.header ? `<img src="${esc(r.header)}" alt="" loading="lazy">`
            : `<span style="width:62px;height:29px;border-radius:4px;flex:none;background:hsl(${hueOf(r.name)} 30% 40%)"></span>`}
          <span class="nm">${esc(r.name)}</span>
          <span class="resbtns">
            <button class="btn btn--sm" data-add="${r.appid}">Add it</button>
          </span>
        </div>`).join("")}</div>` : ""}
      ${addMsg ? `<p class="msg msg--${addMsg.kind==="ok"?"ok":"bad"}">${esc(addMsg.text)}</p>` : ""}`);
  }

  if(sheet.kind === "menu"){
    return shell(`
      <h3>${esc(S.group.name)}</h3>
      <span class="eyebrow">Who's in</span>
      <div class="crew">${d.members.length ? d.members.map(mm => {
        const voted = (S.ballots||[]).some(b => b.member_id===mm.member_id && (b.picks||[]).length);
        return `<span class="who${voted?"":" novote"}" title="${voted?"voted":"not voted yet"}">
          ${isLive(mm.last_seen) ? `<span class="livedot" title="here now"></span>` : ""}
          <span class="dot" style="background:hsl(${hueOf(mm.name)} 45% 42%)">${esc(mm.label[0].toUpperCase())}</span>${esc(mm.label)}</span>`;
      }).join("") : `<span class="empty">Just you so far.</span>`}</div>
      <div class="menu">
        <button class="menuitem" id="sharemenu"><b>Send to the chat</b><span>Copy the link, an update, or a reminder</span></button>
        ${S.group.locked_appid
          ? `<button class="menuitem" id="reopenbtn"><b>Changed our minds</b><span>Reopen the vote</span></button>`
          : S.group.paused_at ? ""
          : `<button class="menuitem" id="breakbtn"><b>Taking a break</b><span>Pause the round, picks stay</span></button>`}
      </div>`);
  }

  if(sheet.kind === "shuffle"){
    const game = d.gamesById[sheet.appid] || {};
    const s = (S.shelf||[]).find(x => x.appid === sheet.appid) || {};
    return shell(`
      <h3><span class="die" id="die">🎲</span> <span class="reel" id="reel">${esc(game.name || "That one")}</span></h3>
      <p>One of the ${sheet.pool} that survived your filters.
         ${s.setup ? esc(SETUP[s.setup])+"." : ""} ${s.crew_max ? "Up to "+s.crew_max+" players." : ""}</p>
      <div class="row">
        <button class="btn btn--ghost" id="reroll">Roll again</button>
        <button class="btn" id="shufflepick">Pick it</button>
      </div>`);
  }

  if(sheet.kind === "close"){
    if(S.group.locked_appid){
      const g2 = d.gamesById[S.group.locked_appid] || {};
      return shell(`<h3>How was ${esc(g2.name || "it")}?</h3>
        <p>For future reference. Skip it if you cannot be bothered.</p>
        <div class="eopts">
          ${Object.keys(VERDICT).map(k => `<button class="eopt" data-verdict="${k}" aria-pressed="${sheet.verdict===k}">
            <b>${VERDICT_ICON[k]}</b><span>${esc(VERDICT[k])}</span></button>`).join("")}
        </div>
        <span class="eyebrow">Where does ${esc(g2.name || "it")} go?</span>
        <div class="eopts eopts--2">
          <button class="eopt" data-bench="0" aria-pressed="${!sheet.bench}">
            <b>Leave it up</b><span>Still up for a vote, carrying its verdict</span></button>
          <button class="eopt" data-bench="1" aria-pressed="${!!sheet.bench}">
            <b>Bench it</b><span>Off the shelf until someone puts it back</span></button>
        </div>
        <p style="font-size:12.5px;color:var(--muted)">Everyone's picks reset either way. Nothing gets deleted.</p>
        <div class="row">
          <button class="btn btn--ghost" data-dismiss>Not yet</button>
          <button class="btn btn--ghost" id="newroundbreak">Take a break</button>
          <button class="btn" id="newroundgo">Next round</button>
        </div>`);
    }
    const top = d.ranked[0], game = d.gamesById[top.appid] || {};
    return shell(`<h3>Lock in ${esc(game.name||"the leader")}?</h3>
      <p>${d.votedCount} of ${d.lookedCount} have voted. Pins it up top so nobody can claim they missed it.</p>
      <div class="row"><button class="btn btn--ghost" data-dismiss>Not yet</button>
      <button class="btn" id="closego">Lock it in</button></div>`);
  }

  if(sheet.kind === "resume"){
    const n = sheet.crew ?? d.lookedCount;
    const fits = (S.shelf||[]).filter(x => stateOf(x,d) !== "benched" && crewFit(x, n) !== "no").length;
    return shell(`<h3>Back on</h3>
      <p>How many of us this time? It sets your crew filter so nothing that can't seat you all gets in the way.</p>
      <div class="stepper">
        <button class="sbtn" data-rcrew="-" aria-label="Fewer">\u2212</button>
        <span class="val num">${n}</span>
        <button class="sbtn" data-rcrew="+" aria-label="More">+</button>
        <span class="off">${fits} of ${(S.shelf||[]).length} fit</span>
      </div>
      <div class="row">
        <button class="btn btn--ghost" id="resumeskip">Skip</button>
        <button class="btn" id="resumego">Back on</button>
      </div>`);
  }

  if(sheet.kind === "share"){
    const nudging = sheet.mode === "nudge";
    const body = nudging ? nudgeText(d) : summaryText(d);
    return shell(`<h3>Send to the chat</h3>
      <div class="row"><button class="btn btn--ghost" id="copylink">Copy the link</button></div>
      <div class="fset">
        <button class="chip" data-sharemode="state" aria-pressed="${!nudging}">Update</button>
        <button class="chip" data-sharemode="nudge" aria-pressed="${nudging}">Reminder</button>
      </div>
      <p>${nudging ? "Names whoever has not picked yet." : "The leaderboard, plus the link."}</p>
      <pre style="margin:0;white-space:pre-wrap;font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:11px;max-height:200px;overflow:auto">${esc(body)}</pre>
      <div class="row"><button class="btn" id="copyshare">Copy it</button></div>`);
  }

  if(sheet.kind === "filters"){
    const draft = fDraft || F;
    const shelfAll = S.shelf || [];
    const counts = {
      benched: shelfAll.filter(x => stateOf(x,d) === "benched").length,
    };
    // counts are over the whole shelf, same as what the sheet will apply to
    const pool = (S.shelf || []).filter(x => (stateOf(x,d) === "benched") === draft.benched);
    const n = pool.filter(x => passes(x, d, draft)).length;
    const on = activeFilters(draft).length;
    return `<div class="sheetwrap" data-scrim><div class="sheet sheet--tall" role="dialog" aria-modal="true">
      <div class="sheethead">
        <h3>Filters</h3>
        ${on ? `<button class="clearall" id="fclear">Clear ${on}</button>` : ""}
        <button class="iconbtn" data-dismiss aria-label="Close">\u2715</button>
      </div>
      <div class="sheetbody">${filterPanel(d, pool, counts)}</div>
      <div class="sheetfoot">
        ${n
          ? `<button class="btn" id="fapply">Show ${n} game${n===1?"":"s"}</button>`
          : `<button class="btn" id="fclearall">Nothing matches. Start again</button>`}
      </div>
    </div></div>`;
  }

  if(sheet.kind === "arrange"){
    const set = (keys) => `<div class="fset">${keys.map(k =>
      `<button class="chip" data-arrange="${k}" aria-pressed="${arrange===k}">${esc(ARRANGE[k].label)}</button>`).join("")}</div>`;
    const flat = Object.keys(ARRANGE).filter(k => ARRANGE[k].group === "none");
    const grouped = Object.keys(ARRANGE).filter(k => ARRANGE[k].group !== "none");
    return shell(`<h3>Arrange</h3>
      <div class="fgroup"><div class="lab"><span class="eyebrow">One list</span></div>${set(flat)}</div>
      <div class="fgroup"><div class="lab"><span class="eyebrow">In sections</span></div>${set(grouped)}</div>`);
  }

  if(sheet.kind === "me"){
    const me = d.meMember || {};
    return shell(`<h3>That's you</h3>
      <p>You're <b>${esc(me.name||"")}</b>${me.device_count>1?" on "+me.device_count+" devices":""}.
         Rename yourself here and your votes come with you.</p>
      <input class="input" id="renameinput" maxlength="24" aria-label="Your name" value="${esc(me.name||"")}">
      <div class="row"><button class="btn" id="renamego">Save name</button></div>`);
  }

  if(sheet.kind === "switch"){
    return shell(`<h3>Your crews</h3>
      <div class="mygroups">${myGroups.map(g => `<button class="mygroup" data-open="${esc(g.code)}">
        <span class="dot" style="width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;font-family:var(--f-display);background:hsl(${hueOf(g.code)} 58% 30%)">${esc(monogram(g.name))}</span>
        <span class="nm">${esc(g.name)}</span><span class="cd">${esc(g.code)}</span></button>`).join("")}</div>
      <div class="row"><button class="btn btn--ghost" id="tolanding">Start or join another</button></div>`);
  }
  return "";
}

function themeBtn(){
  const dark = isDark();
  return `<button class="iconbtn" id="themebtn" aria-label="Switch to ${dark?"light":"dark"} mode"
    title="Switch to ${dark?"light":"dark"} mode"><span style="font-size:15px">${dark?"☀":"☾"}</span></button>`;
}

/* ============================================================================
   WIRING
   ========================================================================== */
/* A dialog you cannot reach with a keyboard is a dialog half the people using
   it cannot close. Move focus in, keep Tab inside it, put focus back where it
   came from on the way out. */
let focusReturn = null;
function closeSheet(){
  sheet = null; pending = null; fDraft = null;
  render();
  if(focusReturn && document.contains(focusReturn)) focusReturn.focus();
  focusReturn = null;
}
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])';
function trapFocus(scrim){
  const box = scrim.querySelector(".sheet");
  if(!box) return;
  // name the dialog after its own heading, so a screen reader announces what opened
  const h = box.querySelector("h3");
  if(h && !box.getAttribute("aria-labelledby")){
    h.id = h.id || "sheet-title";
    box.setAttribute("aria-labelledby", h.id);
  }
  const items = () => [...box.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null);
  const first = items()[0];
  // a text field wants the caret; anything else just wants the ring
  if(first && !box.contains(document.activeElement)) first.focus();
  box.addEventListener("keydown", e => {
    if(e.key !== "Tab") return;
    const list = items();
    if(!list.length) return;
    const a = list[0], z = list[list.length-1];
    if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
  });
}

function wireCommon(d){
  const tb = document.getElementById("themebtn");
  if(tb) tb.onclick = () => { theme = isDark() ? "light" : "dark"; applyTheme(); render(); };

  const sc = document.querySelector("[data-scrim]");
  if(sc){
    sc.onclick = e => { if(e.target===sc){ closeSheet(); } };
    const dis = document.querySelector("[data-dismiss]");
    if(dis) dis.onclick = () => { closeSheet(); };
    trapFocus(sc);
  }

  // --- name entry, step one
  const ni = document.getElementById("nameinput");
  if(ni){
    ni.focus();
    const go = async () => {
      const v = ni.value.trim(); if(!v) return;
      const then = sheet.then, groupName = sheet.groupName;
      const btn = document.getElementById("namego");
      btn.disabled = true;

      if(then === "create"){
        myName = v; store.set("name", v);
        btn.textContent = "Setting up…";
        try{ await createGroup(groupName, v); }
        catch(e){ btn.disabled=false; btn.textContent="That's me"; alert(e.message); }
        return;
      }

      // step two: does this name look like someone already here?
      const candidates = nameMatches(v, (S && S.members) || []);
      if(candidates.length){
        sheet = { kind:"name", step:"match", typed:v, candidates };
        render();
        return;
      }
      try{ await finishAsNew(v); }
      catch(e){ btn.disabled=false; btn.textContent="That's me"; alert(e.message); }
    };
    document.getElementById("namego").onclick = go;
    ni.onkeydown = e => { if(e.key==="Enter") go(); };
  }

  // --- name entry, step two
  document.querySelectorAll("[data-claim]").forEach(b => {
    b.onclick = async () => {
      const m = (S.members||[]).find(x => String(x.member_id) === b.dataset.claim);
      if(!m) return;
      b.disabled = true;
      try{ await finishAsClaim(m); }catch(e){ b.disabled=false; alert(e.message); }
    };
  });
  const notme = document.getElementById("notme");
  if(notme) notme.onclick = async () => {
    notme.disabled = true;
    try{ await finishAsNew(sheet.typed); }catch(e){ notme.disabled=false; alert(e.message); }
  };
}

/* A result that simply appears reads as "the computer picked". A reel that
   runs down and lands reads as a roll, which is the whole point of the button.
   It only ever changes text in a span, so nothing else on the page re-renders,
   and it is skipped outright for anyone who has asked for less motion. */
function spinReel(d, pool){
  const el = document.getElementById("reel");
  if(!el || !sheet || sheet.kind !== "shuffle" || sheet.spun) return;
  sheet.spun = true;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const names = (pool||[]).map(s => (d.gamesById[s.appid]||{}).name).filter(Boolean);
  if(names.length < 3) return;
  const landed = el.textContent;
  const die = document.getElementById("die");
  el.classList.add("spinning");
  if(die) die.classList.add("rolling");
  let wait = 55, elapsed = 0;
  const step = () => {
    if(!document.getElementById("reel")) return;      // sheet closed mid-roll
    el.textContent = names[Math.floor(Math.random()*names.length)];
    elapsed += wait;
    wait *= 1.28;                                      // ease out into the answer
    if(elapsed < 900) setTimeout(step, wait);
    else {
      el.textContent = landed;
      el.classList.remove("spinning");
      if(die) die.classList.remove("rolling");
    }
  };
  setTimeout(step, wait);
}

/* Feeds the pointer position into whichever card is under it, so the border
   glow can follow the cursor. One delegated listener on the app root rather
   than fifteen, throttled to a frame, and never attached on a touch device. */
(() => {
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  let queued = null, raf = 0;
  app.addEventListener("pointermove", e => {
    const card = e.target.closest && e.target.closest(".card");
    if(!card) return;
    queued = [card, e.clientX, e.clientY];
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const [c, x, y] = queued;
      const r = c.getBoundingClientRect();
      c.style.setProperty("--mx", (((x - r.left) / r.width) * 100).toFixed(1) + "%");
      c.style.setProperty("--my", (((y - r.top) / r.height) * 100).toFixed(1) + "%");
    });
  }, { passive: true });
})();

/* ---------- night sky ----------
   A starfield behind everything, with the occasional shooting star. Quiet on
   purpose: a few dozen faint points, a slow twinkle, one streak every several
   seconds. It is one canvas painted at 30fps, it stops when the tab is hidden,
   and under reduced motion it paints the stars once and never moves them. The
   colours come from the theme tokens, so light mode gets no stars at all (they
   would be dust on paper) and only the odd lavender streak. */
(() => {
  const c = document.createElement("canvas");
  c.id = "sky"; c.setAttribute("aria-hidden", "true");
  document.body.prepend(c);
  const ctx = c.getContext("2d");
  if(!ctx) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  let W = 0, H = 0, stars = [], shot = null, nextShot = 0, raf = 0, last = 0, tick = 0;
  let starCol = "rgba(220,214,255,.9)", headCol = "#B8B4FF", tailCol = "#93C5FD", darkNow = true;

  // the theme can flip at any moment, so re-read the tokens now and then
  function palette(){
    const cs = getComputedStyle(document.documentElement);
    starCol = cs.getPropertyValue("--star").trim() || starCol;
    headCol = cs.getPropertyValue("--grad-a").trim() || headCol;
    tailCol = cs.getPropertyValue("--grad-b").trim() || tailCol;
    darkNow = document.documentElement.getAttribute("data-theme") !== "light";
  }
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // ~1 star per 12,000px²: 27 on a phone, 108 on a big monitor
    const n = Math.round(W * H * 0.00008);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.5 + Math.random() * 1.0,            // radius in css px
      o: 0.3 + Math.random() * 0.55,           // base opacity
      t: Math.random() * Math.PI * 2,          // twinkle phase
      s: 0.25 + Math.random() * 0.45,          // twinkle speed
    }));
    palette();
    if(reduce.matches) paint(0, 0);            // one still frame, then nothing
  }
  function spawn(now){
    // start just off the top or a side, heading down at a shallow angle, like
    // the real thing rather than a laser
    const fromLeft = Math.random() < 0.5;
    const ang = (fromLeft ? 1 : -1) * (0.45 + Math.random() * 0.35);   // radians from straight down, mirrored
    shot = {
      x: fromLeft ? -20 : W + 20, y: Math.random() * H * 0.5,
      vx: Math.sin(ang) * 520 * (fromLeft ? 1 : 1), vy: Math.cos(ang) * 520 * 0.55,
      len: 120 + Math.random() * 110, born: now, life: 1.7,
    };
    if(!fromLeft) shot.vx = -Math.abs(shot.vx); else shot.vx = Math.abs(shot.vx);
    nextShot = now + 5000 + Math.random() * 9000;
  }
  function paint(now, dt){
    ctx.clearRect(0, 0, W, H);
    if(darkNow){
      ctx.fillStyle = starCol;
      for(const st of stars){
        if(!reduce.matches) st.t += dt * st.s;
        ctx.globalAlpha = st.o * (0.6 + 0.4 * Math.sin(st.t));
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if(shot){
      const age = (now - shot.born) / 1000;
      shot.x += shot.vx * dt; shot.y += shot.vy * dt;
      const fade = age < 0.25 ? age / 0.25 : Math.max(0, 1 - (age - 0.25) / (shot.life - 0.25));
      const sp = Math.hypot(shot.vx, shot.vy);
      const tx = shot.x - (shot.vx / sp) * shot.len, ty = shot.y - (shot.vy / sp) * shot.len;
      const g = ctx.createLinearGradient(tx, ty, shot.x, shot.y);
      g.addColorStop(0, "transparent"); g.addColorStop(0.7, tailCol); g.addColorStop(1, headCol);
      ctx.globalAlpha = (darkNow ? 0.75 : 0.35) * fade;
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(shot.x, shot.y); ctx.stroke();
      // a small bright head
      ctx.fillStyle = headCol;
      ctx.beginPath(); ctx.arc(shot.x, shot.y, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      if(age > shot.life || shot.x < -200 || shot.x > W + 200 || shot.y > H + 200) shot = null;
    }
  }
  function frame(now){
    raf = requestAnimationFrame(frame);
    if(now - last < 33) return;                // 30fps is plenty for this
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if(++tick % 60 === 0) palette();
    if(!shot && now > nextShot) spawn(now);
    paint(now, dt);
  }
  function start(){ if(reduce.matches || raf) return; last = performance.now(); nextShot = last + 2500; raf = requestAnimationFrame(frame); }
  function stop(){ cancelAnimationFrame(raf); raf = 0; }
  addEventListener("resize", resize, { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
  reduce.addEventListener("change", () => { reduce.matches ? (stop(), resize()) : start(); });
  resize();
  start();
})();

   the page jumping around; a shadow when it is pinned is enough. */
(() => {

  }, {passive:true});
})();

setInterval(() => { if(!document.hidden && code) refresh(); }, 10000);
setInterval(() => { if(!document.hidden && code) rpc("touch_group",{p_code:code,p_device:deviceId}).catch(()=>{}); }, 60000);

render();
</script>
