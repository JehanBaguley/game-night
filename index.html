/* a small pencil so the tile reads as 'tap to change', not decoration */
#newemoji{position:relative}
#newemoji::after{content:"✎";position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:999px;display:grid;place-items:center;font-size:9px;background:var(--surface);color:var(--ink-2);box-shadow:0 0 0 1px var(--line-strong)}
.ebtn--lg{width:56px;min-height:56px;font-size:30px;border-radius:14px}
.crewedit{display:flex;gap:10px;align-items:center}
/* a new crew's card wearing its emoji's colour before it exists */
.add--tinted{box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent), var(--lift)}
.add--tinted .ebtn{background:var(--accent-soft)}
.crewedit .input{flex:1;min-height:56px;font-size:16px}

.ep{display:flex;flex-direction:column;gap:8px}
.ep-search{flex:none}
.ep-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(30px,1fr);gap:2px;overflow-x:auto;scrollbar-width:none;flex:none}
.ep-tabs::-webkit-scrollbar{display:none}
.ep-tab{width:100%;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;line-height:1;opacity:.55;transition:opacity .12s,background .12s}
.ep-tab:hover{opacity:1;background:var(--surface-2)}
.ep-tab[aria-selected="true"]{opacity:1;background:var(--accent-soft)}
.ep--search .ep-tabs{display:none}
.ep-grid{height:min(40vh,290px);overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px;position:relative;
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;scrollbar-gutter:stable}
.ep-grid::-webkit-scrollbar{width:8px}
.ep-grid::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
.ep-grid::-webkit-scrollbar-track{background:transparent}
.ep-sec + .ep-sec{margin-top:6px}
.ep-sec h4{position:sticky;top:0;z-index:1;background:var(--surface);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 2px 5px;margin:0}
.ep--search .ep-sec h4{display:none}
.ep-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:2px}
.ep-cell{height:40px;border-radius:9px;display:grid;place-items:center;font-size:23px;line-height:1;transition:background .1s,transform .1s}
.ep-cell:hover{background:var(--surface-2)}
.ep-cell:active{transform:scale(.9)}
.ep-cell[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ep-cell:focus-visible,.ep-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ep-use{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-2);font-size:13px;font-weight:600;margin-bottom:6px}
.ep-use span{font-size:24px;line-height:1}
.ep-empty{font-size:12.5px;color:var(--muted);padding:14px 4px;line-height:1.55}

/* ---------- landing: cleaner create + join ---------- */
.add--tap{cursor:text}
.codebox{
  flex:1 1 220px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  text-transform:uppercase;letter-spacing:.32em;font-size:16px;font-weight:600;
}
.codebox::placeholder{letter-spacing:.06em;font-family:var(--f-body);text-transform:none;font-weight:400}
.hint{margin-top:9px;font-size:12px;color:var(--muted)}
.hint:empty{display:none}
/* emoji + name + Create always share one row: the name field gives way first */
.add .row--one{flex-wrap:nowrap}
.add .row--one .input{flex:1 1 0;min-width:0}
.hint--bad,.sheet .hint--bad{color:var(--e3)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-md);background:var(--surface-2);flex-wrap:wrap}
.prow .dot{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.prow .txt{min-width:0;flex:1 1 100px;display:flex;flex-direction:column}
.prow .txt b{font-size:14px;font-weight:700}
.prow .txt em{font-style:normal;font-weight:600;font-size:11px;color:var(--muted)}
.prow .txt span{font-size:12px;color:var(--muted)}
.prow .txt .twin{font-size:12px;font-weight:600;color:var(--ink-2)}
.pacts{display:flex;gap:4px;margin-left:auto}
.pacts .btn--sm{padding-inline:10px}
.pdanger{color:var(--e3)}
.rmgame{display:flex;flex-direction:column;gap:6px}
.offrow{display:flex;gap:8px;flex-wrap:wrap}
.cand--locked,.cand--locked:hover{opacity:.8;cursor:default;background:var(--surface-2)}
.input[aria-invalid="true"],.input[aria-invalid="true"]:focus{border-color:var(--e3);box-shadow:0 0 0 3px color-mix(in srgb, var(--e3) 22%, transparent)}

/* ---------- next sesh ---------- */
.status{flex-wrap:wrap}
/* the line under a game in play: one tap into the day picker */
.sesh{
  display:flex;align-items:center;gap:9px;flex:1 1 100%;width:100%;
  padding:9px 11px;border-radius:var(--r-md);background:var(--surface-2);
  font-size:12.5px;line-height:1.4;color:var(--ink-2);text-align:left;transition:background .12s;
}
button.sesh:hover{background:var(--surface-3)}
.sesh-i{font-size:15px;line-height:1;flex:none}
.sesh-t{flex:1;min-width:0}
.sesh-t b{color:var(--ink);font-weight:650}
.sesh-go{color:var(--muted);font-size:17px;line-height:1;flex:none}
.sesh-you{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);background:var(--accent-soft);padding:3px 7px;border-radius:999px}
.sesh--pencil{background:var(--accent-soft);color:var(--accent-text)}
.sesh--pencil .sesh-t b,.sesh--pencil .sesh-go{color:var(--accent-text)}
button.sesh--pencil:hover{background:color-mix(in oklab, var(--accent-soft) 80%, var(--accent))}
.sesh--locked{background:var(--grad);color:var(--accent-ink)}
.sesh--locked .sesh-t b,.sesh--locked .sesh-go{color:var(--accent-ink)}
button.sesh--locked:hover{background:var(--grad);filter:brightness(1.05)}
.sesh--ask{flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-text)}
.sesh--ask .sesh-t b{color:var(--accent-text)}
.sesh-acts{display:flex;gap:6px;flex:none}
/* phone: the question gets its own line and the answers split the row */
@media (max-width:520px){
  .sesh--ask .sesh-t{flex:1 1 calc(100% - 40px)}
  .sesh--ask .sesh-acts{flex:1 1 100%}
  .sesh--ask .sesh-acts .btn{flex:1}
}

/* side games: slim strips under the status card */
.sides{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.side{background:var(--surface);background-image:var(--sheen);border-radius:var(--r-lg);padding:11px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:inset 0 1px 0 var(--edge), 0 0 0 1px var(--ring), var(--lift)}
.side-top{display:flex;align-items:center;gap:10px;min-height:34px}
.side-id{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.side-acts{display:flex;gap:6px;flex:none}
.side .st-k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.side-name{font-weight:650;color:var(--ink);font-size:14px}
.side-who{font-size:12px;color:var(--muted)}
.side .sp{flex:1}
/* the ••• beside a button is always a square the button's height */
.iconbtn--sm{min-width:34px;min-height:34px}
.st-acts .iconbtn{min-width:34px;min-height:34px}
@media (pointer: coarse), (max-width:520px){ .iconbtn--sm,.st-acts .iconbtn{min-width:40px;min-height:40px} }


/* ---------- rail extras: ready to play, on sale, our record ---------- */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.plist li:last-child{border-bottom:none}
.plink{font-size:13px;font-weight:600;color:var(--ink);text-align:left;min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.plink:hover{color:var(--accent-text)}
.pmeta{font-size:12px;color:var(--muted);flex:none}
.pmeta b{color:var(--ink);font-weight:650}
.pmeta s{opacity:.7}
.pnote{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 0 0}
.pnote b{color:var(--ink-2);font-weight:650}
.panel .btn--sm{margin-top:10px}
.salechip{flex:none;font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--sale-bg);color:var(--sale)}
.bdg--sale{background:var(--sale-bg);color:var(--sale);text-transform:none;letter-spacing:0}
.pill--sale{background:var(--sale-bg);color:var(--sale);font-weight:650}
.own{color:var(--muted)}
.own--all{color:var(--sale);font-weight:600}
.ownbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ownbar .pnote{margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats span{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-2);font-size:11.5px;color:var(--muted)}
.stats b{font-size:18px;font-weight:700;color:var(--ink);line-height:1.1}
.feed{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.feed li{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--ink-2)}
.feed li span{flex:1;min-width:0}
.feed time{flex:none;font-size:11px;color:var(--muted)}
/* the "what do you own" checklist */
.ownlist{display:flex;flex-direction:column;gap:5px;max-height:min(52vh,460px);overflow-y:auto;margin:0 -4px;padding:0 4px}
.ownrow{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:var(--r-md);background:var(--surface-2);text-align:left;min-height:46px;transition:background .12s}
.ownrow:hover{background:var(--surface-3)}
.ownrow img,.ownrow .ownimg{width:62px;height:29px;object-fit:cover;border-radius:var(--r-sm);flex:none;background:var(--surface-3)}
.ownrow .nm{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ownrow .pr{flex:none;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.ownrow .tick{flex:none;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:inset 0 0 0 1.5px var(--line-strong);color:var(--accent-ink)}
.ownrow[aria-pressed="true"]{background:var(--accent-soft)}
.ownrow[aria-pressed="true"] .tick{background:var(--grad);box-shadow:none}
/* the tie-breaker wheel */
.wheelwrap{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:6px auto 0}
.wheel{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 4px var(--surface), 0 0 0 5px var(--line-strong), var(--lift);overflow:hidden}
.wlabel{position:absolute;font-size:12px;font-weight:750;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.wheelptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid var(--ink);z-index:2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
@media (max-width:520px){ .spinlbl{display:none} }
/* a sheet's scroll stays in the sheet: no rubber-banding the page behind it */
.sheet,.sheetbody,.ownlist,.sharepre{overscroll-behavior:contain}
/* custom games: the add-your-own form and the editor in details */
.cform{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.fldlbl{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:-4px}
.row--cf{align-items:flex-end;gap:10px}
.row--cf .chip{flex:none;min-height:42px}
.fld--cap{flex:1}
.cedit{border-radius:var(--r-md);background:var(--surface-2);padding:10px 12px}
.cedit summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:600}
.cedit[open] summary{margin-bottom:10px}
.cedit .input{background:var(--surface)}
.ownrow--free{opacity:.8}
.ownrow--free .tick{background:var(--surface-3);color:var(--ink-2);box-shadow:none}
/* long descriptions in details fold to four lines */
.dlong{flex:none;max-height:96px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
.dlong.open{max-height:none;-webkit-mask-image:none;mask-image:none}
.dmore{margin-top:-6px}
/* list view: the whole row opens details */
tbody tr[data-row]{cursor:pointer}
.rowname{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-align:left;color:var(--ink);min-width:0;max-width:100%}
.rowname .rn{min-width:0;overflow-wrap:anywhere}
.rowname .chev{flex:none;width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2.4;margin-left:-2px;transition:transform .15s,stroke .15s}
.rowname:hover .chev,.rowname:focus-visible .chev{transform:translateX(2px);stroke:var(--ink)}
.rowname:hover .rn{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.gcell{display:flex;align-items:center;gap:12px}
.gtext{min-width:0;flex:1}
.lthumb{width:64px;height:30px;border-radius:6px;flex:none;object-fit:cover;background:var(--tile, var(--surface-3));display:block}
.lthumb--tile{background:var(--tile, var(--surface-3))}
/* the dead heat list: one row per level game, and who put it there */
.tielist{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.tierow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 8px;
  border-radius:var(--r-md);background:transparent;transition:background .12s}
.tierow:hover{background:var(--surface-2)}
.tierow .tiename{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tierow .tiename b{font-size:14px;color:var(--ink);font-weight:600}
.tierow .tiename span{font-size:12px;color:var(--muted)}
.tierow .chev{color:var(--muted);font-size:17px;flex:none}
td.g .sub{padding-left:0}
@media (max-width:480px){ .lthumb{width:40px;height:19px} .gcell{gap:9px} td.g{min-width:0} }
.paircode{font-size:30px;font-weight:800;letter-spacing:.14em;text-align:center;padding:12px;border-radius:var(--r-md);background:var(--surface);color:var(--ink)}
.pairlink{margin-top:10px}
.mygroup--here{background:var(--accent-soft)}
.mygroup--here .cd{color:var(--accent-text);letter-spacing:0;font-weight:600}
/* owner page */
.admin{padding-bottom:40px}
.admlist{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.admcrew{display:flex;flex-direction:column;gap:10px}
.admhead{display:flex;align-items:center;gap:12px}
.admemoji{font-size:28px;line-height:1}
.admid{display:flex;flex-direction:column;gap:2px;min-width:0}
.admid b{font-size:16px}
.admid span{font-size:12px;color:var(--muted)}
.admlink{flex-wrap:wrap;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admlink code{flex:1 1 220px;min-width:0;font-size:12px;background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admpeople{min-width:0;width:100%;font-size:12.5px}
.admpeople th,.admpeople td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.admpeople th{position:static}
.admacts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admacts .admdelask{margin-left:auto;color:var(--e3)}
.btn--danger{background:var(--e3);color:var(--e3-ink);border-color:transparent}
.admacts .hint{margin:0;flex:1 1 200px}
.snapwrap{position:relative;border-radius:var(--r-md);overflow:hidden;background:#2B2D31;min-height:120px;display:grid;place-items:center}
.snapwrap img{display:block;width:100%;height:auto;opacity:0;transition:opacity .2s}
.snapwrap.ready img{opacity:1}
.snapwrap.ready .snapwait{display:none}
.snapwait{position:absolute;font-size:12px;color:#949BA4}
.sharepre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border-radius:var(--r-md);padding:11px;max-height:200px;overflow:auto}
.dcrow b{color:var(--ink)}
.spinres{text-align:center;font-size:15px;min-height:22px;margin-top:4px}
.spinres b{color:var(--accent-text)}

/* the day picker */
.dgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dchip{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;
  border-radius:var(--r-md);background:var(--surface-2);border:1.5px solid transparent;
  transition:background .12s,border-color .12s,transform .1s;
}
.dchip:not(:disabled):hover{background:var(--surface-3)}
.dchip:not(:disabled):active{transform:scale(.95)}
.dchip:disabled{cursor:default}
.dchip .dw{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dchip .dn{font-size:19px;font-weight:700;color:var(--ink);line-height:1.15}
.dchip .dbar{width:64%;height:3px;border-radius:2px;background:var(--line-strong);overflow:hidden;margin-top:2px}
.dchip .dbar i{display:block;height:100%;background:var(--grad);transition:width .2s ease}
.dchip .dc{font-size:10.5px;color:var(--muted)}
.dchip{position:relative}
.dchip.on{background:var(--accent-soft);border-color:var(--accent)}
/* your own ticks carry a tick, so they can't be mistaken for 'best night' */
.dchip.on::after{content:"✓";position:absolute;top:4px;right:6px;font-size:10px;font-weight:800;color:var(--accent-text)}
.dchip.locked::after{color:var(--accent-ink)}
.dchip.on .dw,.dchip.hit .dc{color:var(--accent-text)}
.dchip.hit .dc{font-weight:700}
.dchip.locked{background:var(--grad);border-color:transparent}
.dchip.locked .dw,.dchip.locked .dn,.dchip.locked .dc{color:var(--accent-ink)}
.dchip.locked .dbar{background:rgba(255,255,255,.35)}
.dchip.locked .dbar i{background:var(--accent-ink)}
.dchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seshwho{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.seshwho b{color:var(--ink);font-weight:650}
.linkbtn{align-self:flex-start;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.calrow .btn{white-space:nowrap;text-decoration:none;justify-content:center;text-align:center}
.linkbtn:hover{color:var(--ink-2)}
.linkbtn:disabled{text-decoration:none;cursor:default}
#seshbody{display:flex;flex-direction:column;gap:12px}

/* desktop rail: ten little bars per game in play */
.seshmini{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:10px 11px;border-radius:var(--r-md);background:var(--surface-2);transition:background .12s}
.seshmini + .seshmini{margin-top:6px}
.seshmini:hover{background:var(--surface-3)}
.sm-top{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.sm-top b{font-weight:650}
.sm-tag{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.sm-days{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;align-items:end;height:24px}
.sm-days i{display:block;height:calc(4px + var(--h) * 20px);border-radius:3px;background:var(--line-strong)}
.sm-days i.hit{background:var(--accent)}
.sm-days i.lk{background:var(--grad)}
.sm-days i.me{box-shadow:inset 0 -3px 0 var(--accent-text)}
.sm-state{font-size:12px;line-height:1.4;color:var(--ink-2)}
.sm-state b{color:var(--ink);font-weight:650}
/* phones: the strip up top already says "tap your nights", so the panel keeps
   its place down the bottom with the rest of the rail instead of repeating it */
@media (max-width:899px){ .uptop .seshpanel{display:none} }
.railshare{margin-top:12px}

/* crew rules in Edit crew */
.rules{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r-md);background:var(--surface-2)}
.fld{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.rulesrow{display:flex;align-items:center;gap:8px 10px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.rules .stepper .sbtn{background:var(--surface)}
.rules .input{background:var(--surface);width:110px;min-height:38px}
.rules .fhint{margin:0}

/* a card that's on the side, or not out yet */
.bdg--side{background:var(--accent-soft);color:var(--accent-text)}
.bdg--soon{background:rgba(10,12,15,.7);color:#fff}

function wireEmojiPicker(onPick){
  const root = document.getElementById("ep"); if(!root) return;
  const q = document.getElementById("epq"), grid = document.getElementById("epgrid");
  const custom = document.getElementById("epcustom"), empty = document.getElementById("epempty");
  const tabs = [...root.querySelectorAll(".ep-tab")];

  const pick = e => { rememberEmoji(e); onPick(e); };
  grid.addEventListener("click", ev => {
    const b = ev.target.closest("[data-emoji]"); if(!b) return;
    root.querySelectorAll('.ep-cell[aria-pressed="true"]').forEach(x => x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    pick(b.dataset.emoji);
  });

  // tabs jump to their section; scrolling marks the section you are in
  const select = id => tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.jump === id)));
  let jumping = 0;
  tabs.forEach(t => t.onclick = () => {
    const sec = grid.querySelector(`[data-sec="${t.dataset.jump}"]`);
    if(!sec) return;
    // the tapped tab lights straight away and holds while the smooth scroll passes other sections
    select(t.dataset.jump); clearTimeout(jumping);
    jumping = setTimeout(() => { jumping = 0; }, 700);
    grid.scrollTo({ top: sec.offsetTop, behavior: "smooth" });
  });
  const mark = () => {
    if(jumping) return;
    const secs = [...grid.querySelectorAll(".ep-sec")].filter(s => !s.hidden);
    // scrolled to the bottom: the last section is the one on screen, even though it can't reach the top
    if(grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 2 && secs.length) return select(secs[secs.length - 1].dataset.sec);
    let cur = tabs[0] && tabs[0].dataset.jump;
    secs.forEach(s => { if(s.offsetTop <= grid.scrollTop + 8) cur = s.dataset.sec; });
    select(cur);
  };
  grid.addEventListener("scroll", mark, { passive:true });

  // search: every word must start a keyword, so "blue h" finds the blue heart
  const filter = () => {
    const v = q.value.trim(), words = v.toLowerCase().split(/\s+/).filter(Boolean);
    const searching = words.length > 0;
    root.classList.toggle("ep--search", searching);
    let shown = 0; const seen = new Set();
    grid.querySelectorAll(".ep-cell").forEach(c => {
      const keys = c.dataset.k.split(" ");
      let ok = !searching || (c.dataset.k && words.every(w => keys.some(k => k.startsWith(w))));
      if(searching && ok){ if(seen.has(c.dataset.emoji)) ok = false; else seen.add(c.dataset.emoji); }
      c.hidden = !ok; if(ok) shown++;
    });
    grid.querySelectorAll(".ep-sec").forEach(s => {
      s.hidden = searching && (s.hasAttribute("data-recent") || !s.querySelector(".ep-cell:not([hidden])"));
    });
    // a pasted emoji outside the set is offered as-is
    const pasted = EMOJI_RX.test(v) && v.length <= 16 ? v : "";
    custom.hidden = !pasted;
    custom.innerHTML = pasted ? `<button type="button" class="ep-use" data-emoji="${esc(pasted)}"><span>${esc(pasted)}</span>Use this one</button>` : "";
    empty.hidden = !searching || shown > 0 || !!pasted;
  };
  q.addEventListener("input", filter);
  q.addEventListener("keydown", e => {
    if(e.key !== "Enter") return;
    e.preventDefault();
    // first thing actually on screen: skips cells inside hidden sections
    const first = [...grid.querySelectorAll("[data-emoji]")].find(b => !b.closest("[hidden]"));
    if(first) first.click();
  });
}

function parseCode(raw){

/* ============================================================================
   NEXT SESH
   Picking the game and picking the nights are separate decisions. Anything in
   play (the called game, or a side game) collects "I'm free" nights over the
   next ten days. A night that reaches the crew's number is pencilled in,
   anyone locks it, and once it has passed one question logs whether it
   happened. Days are local calendar dates, never UTC, so "Friday" means the
   crew's Friday.
   ========================================================================== */
const SESH_DAYS = 10;
const pad2 = n => String(n).padStart(2, "0");
/** yyyy-mm-dd in local time (toISOString would shift it to UTC) */
const isoDay = dt => dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate());
const todayIso = () => isoDay(new Date());
function seshWindow(){
  const t = new Date(); t.setHours(12, 0, 0, 0);          // midday: immune to DST edges
  return Array.from({ length: SESH_DAYS }, (_, i) => { const d = new Date(t); d.setDate(t.getDate() + i); return isoDay(d); });
}
function dayDate(iso){ const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d, 12); }
const daysFromToday = iso => Math.round((dayDate(iso) - dayDate(todayIso())) / 864e5);
/** "Tonight", "Tomorrow", "Fri 26" */
function dayLabel(iso){
  const n = daysFromToday(iso);
  if(n === 0) return "Tonight";
  if(n === 1) return "Tomorrow";
  const d = dayDate(iso);
  return d.toLocaleDateString("en-AU", { weekday: "short" }) + " " + d.getDate();
}
/** "Friday 26 Sep" */
const dayLong = iso => dayDate(iso).toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "short" });
/** the chip's top line: "Tue", or "Today" for today */
const dayShort = iso => daysFromToday(iso) === 0 ? "Today" : dayDate(iso).toLocaleDateString("en-AU", { weekday: "short" });

const nameOf = (d, id) => (d.members.find(m => m.member_id === id) || {}).label || "Someone";
/** "Alex", "Alex and Kat", "Alex, Kat and Tim" */
function listNames(names){
  if(names.length <= 1) return names.join("");
  return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
}

/** Everything in play: the called game first, then side games. */
function inPlay(d){
  const out = [];
  if(S.group.locked_appid) out.push({ appid: S.group.locked_appid, side: false, players: d.members.map(m => m.member_id) });
  (S.side || []).forEach(sg => out.push({ appid: sg.appid, side: true, players: sg.players || [], started_at: sg.started_at }));
  return out;
}

/** The whole picture for one game's next night. */
function seshFor(d, ip){
  const appid = ip.appid, pset = new Set(ip.players), days = seshWindow(), today = todayIso();
  const free = (S.sesh_free || []).filter(f => f.appid === appid && pset.has(f.member_id));
  const byDay = {}; days.forEach(x => { byDay[x] = []; });
  free.forEach(f => { if(byDay[f.day]) byDay[f.day].push(f.member_id); });
  const none = new Set((S.sesh_none || []).filter(n => n.appid === appid && pset.has(n.member_id)).map(n => n.member_id));
  const answered = new Set([...free.filter(f => f.day >= today).map(f => f.member_id), ...none]);
  const total = ip.players.length;
  // the called game uses the crew's number; a side game needs everyone who's in on it
  const need = ip.side ? total : Math.max(1, Math.min(total, S.group.sesh_need || total));
  const lock = (S.sesh_lock || []).find(l => l.appid === appid) || null;
  const pencil = total ? days.find(x => byDay[x].length >= need) || null : null;
  const best = days.reduce((b, x) => byDay[x].length > (b ? byDay[b].length : 0) ? x : b, null);
  return {
    appid, side: ip.side, players: ip.players, total, need, days, byDay, none, answered, lock, pencil, best,
    mineDays: new Set(free.filter(f => f.member_id === myMemberId).map(f => f.day)),
    mineNone: none.has(myMemberId),
    past: !!(lock && lock.day < today),
    sessions: (S.sessions || []).filter(s => s.appid === appid),
    iAmIn: pset.has(myMemberId),
  };
}

/** One sentence for where a game's next night is at. */
function seshSummary(x){
  const t = S.group.sesh_time || "8pm";
  if(x.lock) return `<b>${esc(dayLong(x.lock.day))}, ${esc(t)}</b> · locked in`;
  if(x.pencil) return `<b>${esc(dayLabel(x.pencil))}</b> pencilled in · ${x.byDay[x.pencil].length} of ${x.total} free · tap to lock it`;
  if(!x.answered.size) return x.sessions.length ? "When's the next sesh? Tap your nights" : "When are we playing? Tap your nights";
  const b = x.best && x.byDay[x.best].length;
  const gap = b ? x.need - b : 0;
  return `${x.answered.size} of ${x.total} answered · ${b ? `<b>${esc(dayLabel(x.best))}</b> ${gap > 0 ? `is ${gap} short` : "works"}` : "no night works yet"}`;
}

/** The line under a game in play: tappable, or the did-you-play question once the night has passed. */
function seshLine(x){
  if(x.lock && x.past){
    return `<div class="sesh sesh--ask">
      <span class="sesh-i" aria-hidden="true">🎮</span>
      <span class="sesh-t">Did you play <b>${esc(dayLong(x.lock.day))}</b>?</span>
      <span class="sesh-acts">
        <button class="btn btn--sm" data-resolve="${x.appid}" data-played="1">We did</button>
        <button class="btn btn--ghost btn--sm" data-resolve="${x.appid}" data-played="0">Didn't happen</button>
      </span></div>`;
  }
  const cls = x.lock ? " sesh--locked" : x.pencil ? " sesh--pencil" : "";
  const you = x.iAmIn && !x.lock && !x.answered.has(myMemberId) ? `<span class="sesh-you">your nights?</span>` : "";
  return `<button class="sesh${cls}" data-sesh="${x.appid}">
    <span class="sesh-i" aria-hidden="true">${x.lock ? "✅" : "📅"}</span>
    <span class="sesh-t">${seshSummary(x)}</span>${you}
    <span class="sesh-go" aria-hidden="true">›</span></button>`;
}

/* ============================================================================
   RAIL EXTRAS: who owns it, on sale, our record, and the tie-breaker wheel
   ========================================================================== */

/** Who owns each shelf game, and what it costs on Steam right now. */
function ownersOf(d, appid){
  // a free game (skribbl.io, Fortnite) is one nobody needs to buy
  if((d.gamesById[appid] || {}).is_free) return new Set(d.members.map(m => m.member_id));
  return d.ownsBy[appid] || new Set();
}
function iOwn(d, appid){ return ownersOf(d, appid).has(myMemberId); }
/** "everyone" / "2 to buy" for a game, or "" when nobody has said anything about it yet. */
function ownLine(d, appid){
  const o = ownersOf(d, appid), total = d.members.length;
  if(!o.size || total < 2) return null;
  if(o.size >= total) return { all: true, text: "everyone owns it" };
  const need = d.members.filter(m => !o.has(m.member_id)).map(m => m.label);
  return { all: false, text: `${need.length} to buy`, who: listNames(need) };
}
function saleOf(d, appid){
  const p = d.prices[appid];
  return p && !p.is_free && p.discount > 0 ? p : null;
}

/** Who's in: the crew, who's here now, who's voted. First in the rail. */
function whoPanel(d, h){
  h = h || "h3";
  // before you've said who you are, the list is how you claim yourself
  const claim = !myMemberId && d.members.length;
  return `<section class="panel whopanel">
            <${h}>Who's in${d.lookedCount > 1 ? ` <span class="pcount">${d.votedCount} of ${d.lookedCount} picked</span>` : ""}</${h}>
            ${claim ? `<p class="pnote">Already in this list? Tap your name so your picks and nights stay yours.</p>` : ""}
            <div class="crew">${d.members.length ? d.members.map(mm => {
              const voted = mm.member_id === myMemberId || (S.ballots||[]).some(b => b.member_id===mm.member_id && (b.picks||[]).length);
              const inner = `${isLive(mm.last_seen) ? `<span class="livedot" title="here now"></span>` : ""}
                <span class="dot" style="background:hsl(${hueOf(mm.name)} 58% 30%)">${esc(mm.label[0].toUpperCase())}</span>${esc(mm.label)}${
                  voted && !claim ? `<span class="wtick" aria-hidden="true">✓</span>` : ""}`;
              const cls = `who${voted?"":" novote"}${claim ? " who--claim" : ""}`;
              const tip = claim ? `That's me: ${esc(mm.name)}` : `${voted?"voted":"not voted yet"}${mm.device_count>1?" · "+mm.device_count+" devices":""}`;
              return claim
                ? `<button class="${cls}" data-claimwho="${esc(mm.member_id)}" title="${tip}">${inner}</button>`
                : `<span class="${cls}" title="${tip}">${inner}</span>`;
            }).join("") : `<span class="empty">Just you so far.</span>`}</div>
            <button class="btn btn--ghost btn--sm railshare">Send to the chat</button>
          </section>`;
}

/** Ready to play: every game the whole crew owns, best supported first. */
function ownsPanel(d){
  if(!(S.shelf||[]).length) return "";
  const total = d.members.length;
  const open = (S.shelf||[]).filter(s => !s.benched);
  const mine = open.filter(s => iOwn(d, s.appid)).length;
  const ready = total > 1 ? open.filter(s => ownersOf(d, s.appid).size >= total)
    .sort((a, b) => (d.counts[b.appid]||0) - (d.counts[a.appid]||0)) : [];
  return `<section class="panel ownpanel"><h3>Ready to play</h3>
    ${ready.length
      ? `<ul class="plist">${ready.slice(0, 5).map(s => `<li><button class="plink" data-facets="${s.appid}">${esc((d.gamesById[s.appid]||{}).name || "")}</button>
          <span class="pmeta">${d.counts[s.appid] ? d.counts[s.appid] + (d.counts[s.appid] === 1 ? " vote" : " votes") : "everyone owns it"}</span></li>`).join("")}</ul>
        ${ready.length > 5 ? `<p class="pnote">and ${ready.length - 5} more everyone owns</p>` : ""}`
      : `<p class="pnote">${total < 2 ? "Once the crew's in, this lists what everyone already owns." : "Nothing the whole crew owns yet. Tick yours and it fills in."}</p>`}
    <button class="btn btn--ghost btn--sm" id="ownsopen">${mine ? `You own ${mine} of ${open.length} · update` : "Tick what you own"}</button>

}

/** On sale: shelf games discounted on Steam right now, biggest cut first. */
function salePanel(d){
  const on = (S.shelf||[]).filter(s => !s.benched && saleOf(d, s.appid))
    .sort((a, b) => saleOf(d, b.appid).discount - saleOf(d, a.appid).discount);
  if(!on.length) return "";
  return `<section class="panel salepanel"><h3>On sale now</h3>
    <ul class="plist">${on.slice(0, 5).map(s => { const p = saleOf(d, s.appid), g = d.gamesById[s.appid] || {};
      return `<li><a class="plink" href="https://store.steampowered.com/app/${s.appid}/" target="_blank" rel="noopener">${esc(g.name || "")}</a>
        <span class="salechip">−${p.discount}%</span>
        <span class="pmeta"><b>${esc(p.final_fmt || "")}</b>${p.initial_fmt ? ` <s>${esc(p.initial_fmt)}</s>` : ""}${
          ownLine(d, s.appid) && !ownLine(d, s.appid).all ? ` · ${esc(ownLine(d, s.appid).text)}` : ""}</span></li>`; }).join("")}</ul>
    <p class="pnote">Steam prices in AUD, checked every few hours.</p>
  </section>`;
}

/** What's happened lately, pieced together from timestamps the crew already has. */
function feedOf(d){
  const nm = a => (d.gamesById[a] || {}).name || "a game";
  const who = id => { const m = d.members.find(x => x.member_id === id); return m ? m.label : "Someone"; };
  const ev = [];
  // a burst of adds by one person on one day reads as one line, not ten
  const adds = {};
  (S.shelf||[]).forEach(s => { if(!s.added_at) return; const k = (s.added_name || "Someone") + "|" + s.added_at.slice(0, 10);
    (adds[k] = adds[k] || []).push(s); });
  Object.entries(adds).forEach(([k, list]) => { const by = k.split("|")[0], last = list.map(s => s.added_at).sort().pop();
    ev.push({ at: last, text: list.length > 1 ? `${by} added ${list.length} games` : `${by} added ${nm(list[0].appid)}` }); });
  // votes the same way: "Kat, Sam and Alex voted" per day
  const votes = {};
  (S.ballots||[]).forEach(b => { if(!(b.picks||[]).length || !b.updated_at) return; (votes[b.updated_at.slice(0, 10)] = votes[b.updated_at.slice(0, 10)] || []).push(b); });
  Object.values(votes).forEach(list => { list.sort((x, y) => x.updated_at < y.updated_at ? 1 : -1);
    ev.push({ at: list[0].updated_at, text: `${listNames(list.map(b => who(b.member_id)))} voted` }); });
  // the big moments with who did them; a call someone took back stays in the story
  const log = S.log || [];
  const LOG_TEXT = {
    called:         l => `${who(l.member_id)} called round ${l.round_no}: ${nm(l.appid)}`,
    reopened:       l => `${who(l.member_id)} undid the call on ${nm(l.appid)}`,
    removed_game:   l => `${who(l.member_id)} removed ${l.note || "a game"}`,
    removed_member: l => `${who(l.member_id)} removed ${l.note || "someone"} from the crew`,
    merged:         l => `${who(l.member_id)} merged ${l.note || "a double-up"}`,
  };
  log.forEach(l => { if(LOG_TEXT[l.kind]) ev.push({ at: l.at, text: LOG_TEXT[l.kind](l) }); });
  (S.plays||[]).forEach(p => {
    // older calls from before the log keep their plain line
    if(!log.some(l => l.kind === "called" && l.appid === p.appid && l.round_no === p.round_no))
      ev.push({ at: p.started_at, text: `Round ${p.round_no} called: ${nm(p.appid)}` });
    if(p.finished_at) ev.push({ at: p.finished_at, text: `Wrapped up ${nm(p.appid)}${p.verdict ? ` · ${VERDICT_ICON[p.verdict]} ${VERDICT[p.verdict]}` : ""}` });
  });
  // sessions are a day, not a moment: count them as that evening
  (S.sessions||[]).forEach(se => ev.push({ at: se.day + "T20:00:00", text: `Played ${nm(se.appid)} ${dayLabel(se.day)}` }));
  const cutoff = Date.now() - 21 * 864e5;
  return ev.filter(e => e.at && new Date(e.at).getTime() > cutoff && new Date(e.at).getTime() <= Date.now() + 6e4)
    .sort((a, b) => a.at < b.at ? 1 : -1);
}
function recordPanel(d){
  const done = (S.plays||[]).filter(p => p.finished_at);
  const bangers = [...new Set(done.filter(p => p.verdict === "banger").map(p => p.appid))];
  const sessions = (S.sessions||[]).length;
  const feed = feedOf(d).slice(0, 5);
  if(!done.length && !sessions && !feed.length) return "";
  return `<section class="panel recpanel"><h3>Our record</h3>
    <div class="stats">
      <span><b class="num">${done.length}</b>played</span>
      <span><b class="num">${sessions}</b>${sessions === 1 ? "night" : "nights"}</span>
      <span><b class="num">${bangers.length}</b>${bangers.length === 1 ? "banger" : "bangers"}</span>
    </div>
    ${bangers.length ? `<p class="pnote"><b>${VERDICT_ICON.banger} Hall of fame:</b> ${esc(listNames(bangers.map(a => (d.gamesById[a]||{}).name || "?")))}</p>` : ""}
    ${feed.length ? `<ul class="feed">${feed.map(e => `<li><span>${esc(e.text)}</span><time>${esc(ago(e.at))}</time></li>`).join("")}</ul>` : ""}
  </section>`;
}

/** Everyone's price tag and ownership, one tap each. */
function ownsSheet(d){
  const open = (S.shelf||[]).filter(s => !s.benched)

      if(g.is_free) return `<div class="ownrow ownrow--free"><span class="ownimg" style="background:hsl(${hueOf(g.name || "")} 24% 36%)"></span>
        <span class="nm">${esc(g.name || "")}</span><span class="pr">Free · everyone has it</span><span class="tick" aria-hidden="true">✓</span></div>`;
      return `<button class="ownrow" data-own="${s.appid}" aria-pressed="${mine}">
        ${g.header ? `<img src="${esc(g.header)}" alt="" loading="lazy">` : `<span class="ownimg"></span>`}
        <span class="nm">${esc(g.name || "")}</span>

        <span class="tick" aria-hidden="true">${mine ? "✓" : ""}</span></button>`; }).join("")}</div>
    <div class="row"><button class="btn" data-dismiss>Done</button></div>`;
}

/** The tie-breaker: a wheel of the tied games, spun locally. */
const WHEEL_COLS = ["--grad-a", "--e1", "--grad-b", "--e2", "--e3", "--accent-text"];
function spinSheet(d){
  const top = d.ranked.length ? d.ranked[0].n : 0;
  const ids = sheet.ids || d.ranked.filter(r => r.n === top).map(r => r.appid);
  sheet.ids = ids;
  const seg = 360 / ids.length;
  const stops = ids.map((_, i) => `var(${WHEEL_COLS[i % WHEEL_COLS.length]}) ${i * seg}deg ${(i + 1) * seg}deg`).join(",");
  const won = sheet.won != null ? d.gamesById[sheet.won] || {} : null;
  return `<h3>Spin for it</h3>
    <p>${ids.length} games on ${top} ${top === 1 ? "vote" : "votes"} each. Let the wheel pick.</p>
    <div class="wheelwrap">
      <span class="wheelptr" aria-hidden="true"></span>
      <div class="wheel" id="wheel" style="background:conic-gradient(${stops});transform:rotate(${sheet.rot || 0}deg)">
        ${ids.map((a, i) => { // each name sits on its slice's centre line, 30% in from the rim, reading outwards
          const ang = i * seg + seg / 2, rad = (ang - 90) * Math.PI / 180;
          const x = 50 + 30 * Math.cos(rad), y = 50 + 30 * Math.sin(rad);
          const turn = ang > 180 ? ang + 90 : ang - 90;          // keep text the right way up-ish
          return `<span class="wlabel" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;transform:translate(-50%,-50%) rotate(${turn.toFixed(0)}deg)">${esc(((d.gamesById[a]||{}).name || "?").slice(0, 18))}</span>`; }).join("")}
      </div>
    </div>
    <p class="spinres" id="spinres" aria-live="polite">${won ? `It's <b>${esc(won.name || "")}</b>.` : "&nbsp;"}</p>
    <div class="row">
      <button class="btn btn--ghost" id="spingo">${won ? "Spin again" : "Spin"}</button>
      ${won ? `<button class="btn" id="spinlock">Lock in ${esc(won.name || "")}</button>` : ""}
    </div>`;
}
function wireSpin(d){
  const go = document.getElementById("spingo"), wheel = document.getElementById("wheel");
  if(go && wheel) go.onclick = () => {
    const ids = sheet.ids, pick = Math.floor(Math.random() * ids.length), seg = 360 / ids.length;
    // land the chosen segment under the pointer at the top, somewhere inside it, after a few full turns
    const inside = seg * (0.2 + Math.random() * 0.6);
    const base = Math.ceil((sheet.rot || 0) / 360) * 360;
    const rot = base + 360 * 5 + (360 - (pick * seg + inside));
    go.disabled = true;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    wheel.style.transition = still ? "none" : "transform 3.2s cubic-bezier(.12,.7,.15,1)";
    wheel.style.transform = `rotate(${rot}deg)`;
    setTimeout(() => { sheet.rot = rot; sheet.won = ids[pick]; render(); }, still ? 50 : 3300);
  };
  const lk = document.getElementById("spinlock");
  if(lk) lk.onclick = () => { const a = sheet.won; sheet = { kind: "close", appid: a }; render(); };
}

/* ---------- prices: ask the edge function to refresh this shelf once per visit ---------- */
const PRICES_URL = CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/prices";
const pricesAsked = new Set();
async function refreshPrices(){
  if(!code || pricesAsked.has(code) || !(S && (S.shelf||[]).length)) return;
  pricesAsked.add(code);
  try{
    const res = await fetch(PRICES_URL, { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + CONFIG.SUPABASE_ANON_KEY, "apikey": CONFIG.SUPABASE_ANON_KEY },
      body: JSON.stringify({ code }) });
    const body = await res.json().catch(() => ({}));
    if(body.refreshed) await refresh({ quiet: true });
  }catch(err){ console.warn("prices", err && err.message); }
}

/* ============================================================================
   SNAPSHOT: the Discord scoreboard, drawn as a picture
   Group DMs, Messenger and WhatsApp can't host a live scoreboard, but they all
   take an image. This draws the same card the discord function posts, onto a
   canvas, so it can be copied, shared or saved and pasted anywhere.
   ========================================================================== */

/** The scoreboard's content, the same rules as supabase/functions/discord. Bold is **marked**. */
function snapshotData(d){
  const g = S.group, gname = a => (d.gamesById[a] || {}).name || "something";
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const fields = []; let desc = "", cover = null;
  if(g.paused_at){
    desc = "⏸ **On a break.** Picks still count, chuck them in whenever.";
  } else if(g.locked_appid){
    const n = (S.sessions || []).filter(x => x.appid === g.locked_appid).length;
    desc = `▶ Playing **${gname(g.locked_appid)}**` + (n ? ` · ${plural(n, "session")} so far` : "");
    cover = g.locked_appid;
    const main = inPlay(d).find(ip => !ip.side);
    if(main){
      const x = seshFor(d, main), t = g.sesh_time || "8pm";
      let v;
      if(x.lock && !x.past) v = `✅ **${dayLong(x.lock.day)}, ${t}** · locked in`;
      else if(x.pencil) v = `✏️ **${dayLong(x.pencil)}** pencilled in · ${x.byDay[x.pencil].length} of ${x.total} free`;
      else {
        const b = x.best && x.byDay[x.best].length;
        const waiting = x.players.filter(id => !x.answered.has(id)).map(id => nameOf(d, id));
        v = `📅 ${x.answered.size} of ${x.total} have picked their nights` + (b ? ` · best so far **${dayLabel(x.best)}** (${x.need - b} short)` : "")
          + (waiting.length ? `\nWaiting on ${listNames(waiting)}` : "");
      }
      fields.push({ name: "Next sesh", value: v });
    }
    inPlay(d).filter(ip => ip.side).forEach(ip => fields.push({ name: `On the side: ${gname(ip.appid)}`,
      value: ip.players.length ? listNames(ip.players.map(id => nameOf(d, id))) : "nobody in yet" }));
  } else {
    const total = d.members.length, need = Math.min(g.quorum || total, total);
    desc = `**Round ${g.round_no}** · ${d.votedCount} of ${total} voted` + (d.votedCount >= need && d.ranked.length ? " · enough to call it" : "");
    // medals for a rank one game actually holds, a handshake for a genuine tie
    const medals = ["🥇", "🥈", "🥉"];
    const tiers = voteTiers(d.ranked);
    const rows = []; let shown = 0;
    for(const t of tiers){
      if(shown >= 3) break;
      const names = t.appids.map(a => `**${gname(a)}**`);
      rows.push(t.appids.length > 1
        ? `🤝 ${andList(names)} · ${plural(t.n, "vote")} each`
        : `${medals[t.rank - 1] || "·"} ${names[0]} · ${plural(t.n, "vote")}`);
      shown += t.appids.length;
    }
    const heat = tiers.length && tiers[0].appids.length > 1;
    fields.push({ name: heat ? "Dead heat" : "Top picks",
      value: rows.length ? rows.join("\n") : "Nobody's picked yet. Get in first." });
    const voted = new Set((S.ballots || []).filter(b => (b.picks || []).length).map(b => b.member_id));
    const waiting = d.members.filter(m => !voted.has(m.member_id)).map(m => m.label);
    if(waiting.length && total > 1) fields.push({ name: "Still to vote", value: listNames(waiting) });
    // a dead heat has no single face, so it gets no hero image either
    if(tiers.length && tiers[0].appids.length === 1) cover = tiers[0].appids[0];
  }
  return { title: `${g.emoji || DEFAULT_EMOJI} ${g.name}`, desc, fields, cover,
           colour: getComputedStyle(document.documentElement).getPropertyValue("--grad-a").trim() || "#6D5AE6" };
}

/** Draw text with **bold** runs, wrapped to a width. Returns the y under the last line. */
function drawRich(ctx, text, x, y, maxW, size, lineH, ink, boldInk){
  const face = w => `${w} ${size}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  text.split("\n").forEach(par => {
    // words tagged bold or not, keeping the spaces with the word before them
    const words = [];
    par.split("**").forEach((seg, i) => seg.split(/(?<= )/).forEach(w => w && words.push({ w, b: i % 2 === 1 })));
    let cx = x;
    words.forEach(({ w, b }) => {
      ctx.font = face(b ? 700 : 400);
      const wd = ctx.measureText(w).width;
      if(cx + wd > x + maxW && cx > x){ cx = x; y += lineH; }
      ctx.fillStyle = b ? boldInk : ink;
      ctx.fillText(cx === x ? w.trimStart() : w, cx, y);
      cx += wd;
    });
    y += lineH;
  });
  return y;
}

function loadImage(src){
  return new Promise(res => {
    const img = new Image(); img.crossOrigin = "anonymous";   // Steam's CDN allows it, so the canvas stays exportable
    const t = setTimeout(() => res(null), 5000);
    img.onload = () => { clearTimeout(t); res(img); };
    img.onerror = () => { clearTimeout(t); res(null); };
    img.src = src;
  });
}

let snapCache = { key: "", blob: null, url: "" };
/** Render the card to a PNG blob. Cached until what it says changes. */
async function makeSnapshot(d){
  const data = snapshotData(d);
  const key = JSON.stringify(data);
  if(snapCache.key === key && snapCache.blob) return snapCache;
  const W = 720, PAD = 22, BAR = 6, inner = W - PAD * 2 - BAR, SCALE = 2;
  const g = data.cover ? d.gamesById[data.cover] || {} : null;
  const img = g && (g.header || data.cover > 0) ? await loadImage(g.header || `https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/${data.cover}/header.jpg`) : null;
  // measure pass on a scratch canvas, then draw for real at that height
  const draw = (ctx, measureOnly) => {
    let y = PAD + 26;
    const x = PAD + BAR;
    ctx.textBaseline = "alphabetic";
    y = drawRich(ctx, `**${data.title}**`, x, y, inner, 22, 30, "#F2F3F5", "#F2F3F5") + 2;
    y = drawRich(ctx, data.desc, x, y, inner, 16, 23, "#DBDEE1", "#FFFFFF") + 6;
    data.fields.forEach(f => {
      y = drawRich(ctx, `**${f.name}**`, x, y, inner, 15, 21, "#FFFFFF", "#FFFFFF");
      y = drawRich(ctx, f.value, x, y, inner, 15, 22, "#DBDEE1", "#FFFFFF") + 8;
    });
    if(img){
      // Steam headers are 460x215; anything odd is cropped to that shape rather than stretched
      const h = Math.round(inner * 215 / 460);
      if(!measureOnly){
        const iw = img.naturalWidth, ih = img.naturalHeight, want = inner / h;
        const sw = iw / ih > want ? ih * want : iw, sh = iw / ih > want ? ih : iw / want;
        ctx.save(); roundRect(ctx, x, y - 8, inner, h, 8); ctx.clip();
        ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y - 8, inner, h); ctx.restore();
      }
      y += h + 10;
    }
    const when = new Date().toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    y = drawRich(ctx, `Game Night · ${location.host}${location.pathname.replace(/\/(index\.html)?$/, "")} · ${when}`, x, y + 4, inner, 12.5, 18, "#949BA4", "#949BA4");
    return y - 8 + PAD;
  };
  const scratch = document.createElement("canvas").getContext("2d");
  const H = Math.ceil(draw(scratch, true));
  const cv = document.createElement("canvas");
  cv.width = W * SCALE; cv.height = H * SCALE;
  const ctx = cv.getContext("2d"); ctx.scale(SCALE, SCALE);
  ctx.fillStyle = "#2B2D31"; roundRect(ctx, 0, 0, W, H, 12); ctx.fill();          // Discord's embed surface
  ctx.fillStyle = data.colour; ctx.save(); roundRect(ctx, 0, 0, W, H, 12); ctx.clip(); ctx.fillRect(0, 0, BAR, H); ctx.restore();
  draw(ctx, false);
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  if(snapCache.url) URL.revokeObjectURL(snapCache.url);
  snapCache = { key, blob, url: blob ? URL.createObjectURL(blob) : "" };
  return snapCache;
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/** Fill the preview and wire copy / share / save for the snapshot mode. */
function wireSnapshot(d){
  const img = document.getElementById("snapimg");
  if(!img) return;
  const file = () => new File([snapCache.blob], `${(S.group.name || "game-night").replace(/[^\w-]+/g, "-").toLowerCase()}.png`, { type: "image/png" });
  makeSnapshot(d).then(s => {
    if(!s.url || !document.getElementById("snapimg")) return;
    img.src = s.url; img.closest(".snapwrap").classList.add("ready");
    const sv = document.getElementById("snapsave"); if(sv){ sv.href = s.url; sv.download = file().name; }
  }).catch(err => console.warn("snapshot", err && err.message));
  const cp = document.getElementById("snapcopy");
  if(cp) cp.onclick = async () => {
    try{
      // Safari wants the promise handed over inside the click, so pass the blob as a promise
      await navigator.clipboard.write([new ClipboardItem({ "image/png": makeSnapshot(d).then(s => s.blob) })]);
      cp.textContent = "Copied, now paste it";
      setTimeout(() => { if(cp.isConnected) cp.textContent = "Copy image"; }, 2200);
    }catch{ cp.textContent = "Can't copy here, use Save"; }
  };
  const sh = document.getElementById("snapshare");
  if(sh) sh.onclick = async () => {
    await makeSnapshot(d);
    const link = shareBody(d, "link"), f = file();
    try{
      if(navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], text: link });
      else await navigator.share({ title: S.group.name, url: link });
    }catch{}
  };
}

/** Desktop rail: every game in play, ten little bars each. Hidden on a phone,
 *  where the status card already carries the same line. */
function seshPanel(d, h){

/** The day picker's body. Re-rendered on its own when you tap, so the sheet never jumps. */
function seshBody(d, x){
  const t = S.group.sesh_time || "8pm";
  const chips = x.days.map(day => {
    const n = x.byDay[day].length, mine = x.mineDays.has(day), locked = x.lock && x.lock.day === day;
    const names = x.byDay[day].map(id => nameOf(d, id));
    return `<button class="dchip${mine ? " on" : ""}${x.total && n >= x.need ? " hit" : ""}${locked ? " locked" : ""}" data-dday="${day}"
        aria-pressed="${mine}" aria-label="${esc(dayLong(day))}: ${n} free, needs ${x.need}${mine ? ", including you" : ""}"
        title="${esc(names.length ? listNames(names) : "Nobody yet")}"${x.iAmIn ? "" : " disabled"}>
      <span class="dw">${esc(dayShort(day))}</span>
      <span class="dn num">${dayDate(day).getDate()}</span>
      <span class="dbar" aria-hidden="true"><i style="width:${Math.min(100, Math.round(n / Math.max(1, x.need) * 100))}%"></i></span>
      <span class="dc num">${n ? n + " free" : "–"}</span>
    </button>`;
  }).join("");
  // names for the sheet: you first, as "You"
  const people = ids => { const l = [...ids].sort((a, b) => (b === myMemberId) - (a === myMemberId))
    .map(id => id === myMemberId ? "you" : nameOf(d, id)); const t = listNames(l); return t.charAt(0).toUpperCase() + t.slice(1); };
  // who's in on the night that matters most right now
  const focus = (x.lock && x.lock.day) || x.pencil || (x.best && x.byDay[x.best].length ? x.best : null);
  let who = "";
  if(focus){
    const inn = x.byDay[focus] || [];
    const waiting = x.players.filter(id => !inn.includes(id) && !x.none.has(id) && !x.answered.has(id));
    const out = x.players.filter(id => !inn.includes(id) && (x.none.has(id) || x.answered.has(id)));
    who = `<p class="seshwho"><b>${esc(dayLong(focus))}</b>: ${inn.length ? esc(people(inn)) : "nobody yet"}${
      out.length ? ` · can't: ${esc(people(out))}` : ""}${
      waiting.length ? ` · waiting on ${esc(people(waiting))}` : ""}</p>`;
  } else if(x.total){
    const waiting = x.players.filter(id => !x.answered.has(id));
    if(waiting.length) who = `<p class="seshwho">Waiting on ${esc(people(waiting))}</p>`;
  }
  const acts = x.lock
    ? `<div class="row calrow"><a class="btn" id="gcalgo" href="${esc(gcalUrl({ ...(d.gamesById[x.appid] || {}), appid: x.appid }, x.lock.day))}" target="_blank" rel="noopener">Add to Google Cal</a>
         <button class="btn btn--ghost" id="unlockgo">Change night</button></div>
       <button class="linkbtn" id="icsgo">Apple or Outlook? Get a calendar file</button>`
    : x.pencil
    ? `<div class="row"><button class="btn" id="lockgo" data-lday="${x.pencil}">Lock in ${esc(dayLabel(x.pencil))}, ${esc(t)}</button></div>`
    : "";
  const none = x.iAmIn && !x.lock
    ? `<button class="linkbtn" id="nonego"${x.mineNone ? " disabled" : ""}>${x.mineNone ? "You've said none of these work" : "Can't do any of these"}</button>`
    : !x.iAmIn ? `<p class="fhint">You're not in on this one. Tap I'm in on its strip to pick nights.</p>` : "";
  return `<div class="dgrid">${chips}</div>${who}${acts}${none}`;
}

/* ---------- saving free nights: optimistic, debounced ----------
   Taps update the page straight away and save 600ms after the last one, so
   tapping four nights is one request. While a save is pending the background
   refresh stands down, so the server can't briefly undo a tap you just made. */
let freeTimer = null, seshDirty = false;
function queueFree(appid){
  seshDirty = true;
  clearTimeout(freeTimer);
  const id = freeTimer = setTimeout(async () => {
    const days = seshWindow().filter(day => (S.sesh_free || []).some(f => f.appid === appid && f.day === day && f.member_id === myMemberId));
    try{ await rpc("set_free", { p_code: code, p_device: deviceId, p_appid: appid, p_days: days }); }
    catch(err){
      console.warn("set_free", err && err.message);
      toast(saveProblem(err, "your nights"), "bad");
      sheet = null;                                  // the sheet was showing a game that has moved on
    }
    if(freeTimer === id){ freeTimer = null; seshDirty = false; refresh(); }
  }, 600);
}

/* ---------- calendar file ---------- */
/** "8pm", "7:30pm", "20:00", "8.30 pm" -> {h, m}; anything else is 8pm */
function parseTime(t){
  const m = String(t || "").trim().toLowerCase().match(/^(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?$/);
  if(!m) return { h: 20, m: 0 };
  let h = +m[1]; const mm = +(m[2] || 0);
  if(m[3] === "pm" && h < 12) h += 12;
  if(m[3] === "am" && h === 12) h = 0;
  return h < 24 && mm < 60 ? { h, m: mm } : { h: 20, m: 0 };
}
/** The night's start and end in local time, plus the crew link: shared by both calendar options. */
function seshEvent(game, day){
  const t = parseTime(S.group.sesh_time);
  const start = dayDate(day); start.setHours(t.h, t.m, 0, 0);
  const end = new Date(start.getTime() + 3 * 36e5);                 // three hours, a normal night
  const stamp = dt => isoDay(dt).replace(/-/g, "") + "T" + pad2(dt.getHours()) + pad2(dt.getMinutes()) + "00";
  const link = location.origin + location.pathname + "#/g/" + S.group.code;
  const title = (S.group.emoji || DEFAULT_EMOJI) + " " + (game.name || "Game night") + " · " + S.group.name;
  return { start: stamp(start), end: stamp(end), link, title };
}
/** Opens Google Calendar's "new event" page already filled in: no file, one tap to save. */
function gcalUrl(game, day){
  const e = seshEvent(game, day);
  const q = new URLSearchParams({ action: "TEMPLATE", text: e.title, dates: e.start + "/" + e.end, details: "Locked in on Game Night. " + e.link });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}
const icsEsc = s => String(s).replace(/[\;,]/g, c => "\\" + c).replace(/\n/g, "\\n");
function downloadIcs(game, day){
  // floating local time: the calendar puts it at 8pm wherever the phone is
  const e = seshEvent(game, day), link = e.link;
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Game Night//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    "UID:" + S.group.code + "-" + game.appid + "-" + day + "@gamenight",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z",
    "DTSTART:" + e.start, "DTEND:" + e.end,
    "SUMMARY:" + icsEsc(e.title),
    "DESCRIPTION:" + icsEsc("Locked in on Game Night. " + link),
    "URL:" + link, "END:VEVENT", "END:VCALENDAR",
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = (game.name || "game-night").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + day + ".ics";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/** Copy-for-the-chat text: where every game in play is at, and who still owes nights. */
function seshShareText(d){
  const t = S.group.sesh_time || "8pm";
  const lines = [(S.group.emoji || DEFAULT_EMOJI) + " " + S.group.name + ": next sesh", ""];
  inPlay(d).forEach(ip => {
    const x = seshFor(d, ip), g = d.gamesById[ip.appid] || {};
    const name = (g.name || "") + (ip.side ? " (side game)" : "");
    if(x.lock){ lines.push(name + ": locked in for " + dayLong(x.lock.day) + ", " + t); return; }
    const focus = x.pencil || (x.best && x.byDay[x.best].length ? x.best : null);
    lines.push(name + ": " + (focus ? dayLong(focus) + ": " + x.byDay[focus].length + " free, need " + x.need + (x.pencil ? ", pencilled in" : "") : "no night picked yet"));
    const waiting = x.players.filter(id => !x.answered.has(id)).map(id => nameOf(d, id));
    if(waiting.length) lines.push("still need nights from " + listNames(waiting));
  });
  lines.push("", "tap your nights: " + location.origin + location.pathname + "#/g/" + S.group.code);
  return lines.join("\n");
}

/** The crew's "lock a night when" rule, in words. */
function needWords(need, total){
  if(need != null && need > total) return { val: String(need),
    hint: `Needs ${need} free once there are that many of you. You're ${total === 1 ? "just one" : "only " + total} so far, so for now it's everyone.` };
  if(need != null && need === total) return { val: need + " of " + total, hint: `Everyone for now, and it stays at ${need} as more join.` };
  if(need == null || need >= total) return { val: "all " + total, hint: "Everyone has to be free, and it stays everyone as people join. Right for a small crew that only plays together." };
  return { val: need + " of " + total, hint: need + " free is enough, so a night still works if " + (total - need) + " can't make it." };
}

/* ============================================================================
   RELEASE STATE
   Steam flags "coming soon" itself and lists Early Access as a genre, so the
   shelf can tell released, early access and not-out-yet apart. Older rows
   fetched before the flag existed fall back to reading the date text.
   ========================================================================== */
const RELEASE = { out: "Released", early: "Early access", soon: "Not out yet" };
/* games that aren't on Steam: a negative appid, a platform, and a link */
const PLATFORM = { browser: "Browser", epic: "Epic", xbox: "Xbox", playstation: "PlayStation", switch: "Switch", other: "Elsewhere" };
const isCustom = g => !!(g && g.platform);
/** "skribbl.io" -> "https://skribbl.io"; anything already a link is left alone */
const asUrl = u => { u = String(u || "").trim(); return !u ? "" : /^https?:\/\//i.test(u) ? u : "https://" + u; };
function soonText(t){
  if(!t) return false;
  if(/coming soon|to be announced|\btba\b|\btbd\b/i.test(t)) return true;
  const p = Date.parse(t);
  if(!isNaN(p)) return p > Date.now();
  const y = (t.match(/\b(20\d\d)\b/) || [])[1];
  return !!y && +y >= new Date().getFullYear();
}
function releaseOf(game){
  if(!game || isCustom(game)) return "out";
  if(game.coming_soon || soonText(game.released)) return "soon";
  // Steam's own genre list drops "Early Access" the day a game hits 1.0; the
  // player-voted tags keep it for years (Abiotic Factor), so only genres count
  if((game.genres || []).includes("Early Access")) return "early";
  return "out";
}

/* ============================================================================
   CREW COLOUR
   Each crew takes its accent from its emoji: 🦀 goes orange-red, 👾 purple,
   🌿 green. The emoji is drawn on a small off-screen canvas and the strongest
   colour in it wins. Only the hue and a clamped saturation carry across;
   lightness is set per theme so buttons and text stay legible. Emoji with no
   real colour (🎮, 💀) keep the default lavender.
   ========================================================================== */
const tintCache = {};
function emojiColour(e){
  if(e in tintCache) return tintCache[e];
  let out = null;
  try{
    const N = 48, c = document.createElement("canvas"); c.width = c.height = N;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.textAlign = "center"; x.textBaseline = "middle";
    x.font = `${N * 0.8}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    x.fillText(e, N / 2, N / 2 + 2);
    const px = x.getImageData(0, 0, N, N).data;
    // 24 hue buckets, each weighted by how saturated and mid-toned its pixels are,
    // so a black outline or a white highlight never decides the colour
    const bins = Array.from({ length: 24 }, () => ({ w: 0, cx: 0, cy: 0, s: 0 }));
    let opaque = 0, coloured = 0;
    for(let i = 0; i < px.length; i += 4){
      if(px[i + 3] < 160) continue;
      opaque++;
      const r = px[i] / 255, g = px[i + 1] / 255, b = px[i + 2] / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dlt = mx - mn;
      if(dlt < 0.001) continue;
      const sat = dlt / (1 - Math.abs(2 * l - 1));
      if(sat < 0.25 || l < 0.12 || l > 0.9) continue;
      let h = mx === r ? ((g - b) / dlt) % 6 : mx === g ? (b - r) / dlt + 2 : (r - g) / dlt + 4;
      h = (h * 60 + 360) % 360;
      const w = sat * (1 - Math.abs(l - 0.5) * 1.3);
      const bin = bins[Math.floor(h / 15)];
      bin.w += w; bin.cx += Math.cos(h * Math.PI / 180) * w; bin.cy += Math.sin(h * Math.PI / 180) * w; bin.s += sat * w;
      coloured += w;
    }
    if(opaque && coloured / opaque > 0.12){
      // the winning bucket, helped by its neighbours so a gradient isn't split in two
      let best = 0, score = -1;
      bins.forEach((b, i) => { const sc = b.w + 0.5 * (bins[(i + 23) % 24].w + bins[(i + 1) % 24].w); if(sc > score){ score = sc; best = i; } });
      const pick = [bins[(best + 23) % 24], bins[best], bins[(best + 1) % 24]];
      const cx = pick.reduce((a, b) => a + b.cx, 0), cy = pick.reduce((a, b) => a + b.cy, 0);
      const w = pick.reduce((a, b) => a + b.w, 0), s = pick.reduce((a, b) => a + b.s, 0) / w;
      out = { h: (Math.atan2(cy, cx) * 180 / Math.PI + 360) % 360, s };
    }
  }catch(_){ out = null; }
  return tintCache[e] = out;
}

/** Relative luminance of an hsl colour (h deg, s and l in %), for contrast checks. */
function hslLum(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  return 0.2126 * lin(f(0)) + 0.7152 * lin(f(8)) + 0.0722 * lin(f(4));
}
/** The accent tokens for an emoji's colour in the current theme, or null for the default. */
function crewVars(emoji){
  const col = emoji ? emojiColour(emoji) : null;
  if(!col) return null;
  const dark = isDark();
  const h = Math.round(col.h), s = Math.round(Math.min(88, Math.max(48, col.s * 100)));
  const yellowish = h >= 38 && h <= 85;           // yellows go dark ink, white on yellow is unreadable
  // the gradient's second stop leans 24deg along the wheel, but never into yellow when the label is white
  let h2 = (h + 24) % 360;
  if(!yellowish && h2 >= 38 && h2 <= 85) h2 = (h + 336) % 360;
  // in light mode white labels sit on the fill, so walk each stop darker until white clears 4.5:1
  const whiteOk = (hh, l) => { while(l > 22 && 1.05 / (hslLum(hh, s, l) + 0.05) < 4.5) l -= 2; return l; };
  const v = dark
    ? { accent: `hsl(${h} ${s}% 70%)`, soft: `hsl(${h} 32% 20%)`, text: `hsl(${h} ${s}% 76%)`,
        ink: `hsl(${h} 45% 11%)`, a: `hsl(${h} ${s}% 70%)`, b: `hsl(${h2} ${s}% 74%)` }
    : yellowish
    ? { accent: `hsl(${h} ${s}% 42%)`, soft: `hsl(${h} 75% 94%)`, text: `hsl(${h} ${s}% 28%)`,
        ink: "#1d1a10", a: `hsl(${h} ${s}% 50%)`, b: `hsl(${h2} ${s}% 46%)` }
    : { accent: `hsl(${h} ${s}% ${whiteOk(h, 50)}%)`, soft: `hsl(${h} 75% 94%)`, text: `hsl(${h} ${s}% ${Math.min(38, whiteOk(h, 38))}%)`,
        ink: "#ffffff", a: `hsl(${h} ${s}% ${whiteOk(h, 48)}%)`, b: `hsl(${h2} ${s}% ${whiteOk(h2, 44)}%)` };
  return {
    "--accent": v.accent, "--accent-soft": v.soft, "--accent-text": v.text, "--accent-ink": v.ink,
    "--grad-a": v.a, "--grad-b": v.b,
    // --grad and --glow are built from these on :root, and a custom property resolves where
    // it's declared, so an element that wants the tint has to be handed the finished values too
    "--grad": `linear-gradient(135deg, ${v.a}, ${v.b})`,
    "--glow": `0 10px 30px -12px color-mix(in oklab, ${v.accent} 60%, transparent)`,
  };
}
const TINT_PROPS = ["--accent", "--accent-soft", "--accent-text", "--accent-ink", "--grad-a", "--grad-b", "--grad", "--glow"];
/** Put an emoji's colours on one element (or clear them); returns whether anything was set. */
function tintEl(el, emoji){
  const v = crewVars(emoji);
  TINT_PROPS.forEach(p => v ? el.style.setProperty(p, v[p]) : el.style.removeProperty(p));
  return !!v;
}

/* The saved colour wins, so every device shows the same shade. If there isn't
   one for the current emoji (a new crew, a changed emoji, or a crew from before
   this existed), work it out here and save it for everyone. Members only, and
   once per emoji per visit. */
let tintSaving = "";
function syncTint(){
  const g = S.group, e = g.emoji || DEFAULT_EMOJI;
  if(g.tint_emoji === e && g.tint_h != null){
    tintCache[e] = g.tint_h < 0 ? null : { h: g.tint_h, s: (g.tint_s || 0) / 100 };
    return;
  }
  if(!myMemberId || tintSaving === code + e) return;
  tintSaving = code + e;
  const c = emojiColour(e);
  rpc("set_tint", { p_code: code, p_device: deviceId, p_emoji: e,
    p_h: c ? Math.round(c.h) % 360 : -1, p_s: c ? Math.round(c.s * 100) : 0 }).catch(() => {});
}

let tintKey = "";
/** Point the page's accent at a crew's emoji colour, or back at the default. */
function applyCrewColour(emoji){
  const col = emoji ? emojiColour(emoji) : null;
  const key = col ? Math.round(col.h) + ":" + Math.round(col.s * 100) + (isDark() ? "d" : "l") : "none";
  if(key === tintKey) return;

function normName(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")   // strip accents
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
/** Levenshtein, capped: we only care about distances of 1 or 2. */
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const m = a.length, n = b.length;
  let prev = Array.from({length:n+1}, (_,i)=>i);
  for (let i=1;i<=m;i++){
    const cur = [i];
    for (let j=1;j<=n;j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    }
    prev = cur;
  }
  return prev[n];
}

  const n = normName(input);
  const hit = n && (members || []).find(m => m.member_id !== exceptId && normName(m.name) === n);
  return hit ? hit.name : "";     // their spelling, for the error message
}
function nameMatches(input, members){
  const n = normName(input);
  if (!n) return [];
  const first = n.split(" ")[0];
  return members.map(m => {
    const mn = normName(m.name);
    const mfirst = mn.split(" ")[0];
    let score = 0;
    if (mn === n) score = 100;                                     // Sam / sam / SAM
    else if (mn.startsWith(n + " ") || n.startsWith(mn + " ")) score = 88;  // Sam / Sam L
    else if (mfirst === first && first.length >= 3) score = 74;     // Sam L / Sam B
    else if (Math.max(mn.length, n.length) >= 4 && lev(mn, n) <= 2) score = 68; // Sam / Samm
    return { m, score };

function wireLit(d){
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return;

  let next = null;
  st.addEventListener("pointermove", e => {
    const r = st.getBoundingClientRect();
    next = [e.clientX - r.left, e.clientY - r.top];
    if(litRaf) return;
    litRaf = requestAnimationFrame(() => {
      litRaf = 0;
      if(!next) return;
      st.style.setProperty("--mx", next[0].toFixed(0) + "px");
      st.style.setProperty("--my", next[1].toFixed(0) + "px");

  // stacks up rather than overwriting the first time we played it
  const playsBy = {};
  (S.plays||[]).forEach(pl => { (playsBy[pl.appid] = playsBy[pl.appid]||[]).push(pl); });
  Object.values(playsBy).forEach(list => list.sort((a,b) => a.started_at < b.started_at ? 1 : -1));
  const nowPlaying = (S.plays||[]).find(pl => !pl.finished_at) || null;

  const myBallot = (S.ballots||[]).find(b => b.member_id === myMemberId);
  const myPicks  = myBallot ? (myBallot.picks||[]) : [];
  const meMember = (S.members||[]).find(m => m.member_id === myMemberId) || null;

  // duplicate display names still get a suffix, for the cases the match sheet
  // did not catch (someone genuinely is a second Sam)
  const seen = {};
  const members = (S.members||[]).map(m => {
    seen[m.name] = (seen[m.name]||0)+1;
    return {...m, label: seen[m.name] > 1 ? m.name+" ("+seen[m.name]+")" : m.name};
  });

  const ranked = Object.keys(counts).map(a => ({appid:+a, n:counts[a]}))
    .sort((x,y) => y.n-x.n || x.appid-y.appid);

  const ownsBy = {}, prices = {};
  (S.owns||[]).forEach(o => { (ownsBy[o.appid] = ownsBy[o.appid] || new Set()).add(o.member_id); });
  (S.prices||[]).forEach(p => { prices[p.appid] = p; });

  return { gamesById, counts, takesBy, myPicks, meMember, playsBy, nowPlaying,
           members, ranked, lastVoteAt, ownsBy, prices,
           votedCount: voters.size, lookedCount: members.length,
           liveCount: members.filter(m => isLive(m.last_seen)).length };
}

/* ============================================================================
   FILTERING + SORTING
   ========================================================================== */
function activeFilters(f = F){
  const out = [];
  if(f.q) out.push({k:"q", label:'"'+f.q+'"'});
  if(f.crew) out.push({k:"crew", label:"for "+f.crew+" players"});
  if(f.mine) out.push({k:"mine", label:"my picks"});
  if(f.played) out.push({k:"played", label: f.played === "fresh" ? "never played" : "played before"});
  if(f.benched) out.push({k:"benched", label:"the bench"});
  if(f.wellrated) out.push({k:"wellrated", label:"85%+ on Steam"});
  f.energy.forEach(v => out.push({k:"energy", v, label:ENERGY[v]}));
  f.shape .forEach(v => out.push({k:"shape",  v, label:SHAPE[v]}));
  f.doing .forEach(v => out.push({k:"doing",  v, label:DOING[v]}));
  f.setup .forEach(v => out.push({k:"setup",  v, label:SETUP[v]}));
  f.release.forEach(v => out.push({k:"release", v, label:RELEASE[v]}));
  if(f.demo) out.push({k:"demo", label:"has a demo"});
  return out;
}
function clearFilter(k, v, f = F){
  if(k==="q"){ f.q=""; }
  else if(k==="crew"){ f.crew=null; }
  else if(k==="mine"){ f.mine=false; }
  else if(k==="played"){ f.played=null; }
  else if(k==="benched"){ f.benched=false; }
  else if(k==="wellrated"){ f.wellrated=false; }
  else if(k==="demo"){ f.demo=false; }
  else f[k].delete(v);
}
function clearAll(f = F){
  f.q=""; f.crew=null; f.mine=false; f.played=null;
  f.benched=false; f.wellrated=false;
  f.energy.clear(); f.shape.clear(); f.doing.clear(); f.setup.clear();
  f.release.clear(); f.demo=false;
}

/** A game passes if it clears every active filter. Crew is the one that maps
 *  to the real decision: five people means a four-player game is out. */
/** How a game sits against tonight's headcount.
 *  "fits" clears it outright, "mods" only clears it if someone installs
 *  something, "no" cannot seat everyone, "unknown" has no published cap. */
function crewFit(s, want){
  if(!want) return "fits";
  if(s.crew_max == null) return "unknown";
  if(s.crew_max >= want) return "fits";
  if(s.crew_mod != null && s.crew_mod >= want) return "mods";
  return "no";
}

function matchesSearch(game, q){
  if(!q) return true;
  const hay = ((game.name||"")+" "+(game.short_desc||"")+" "+(game.tags||[]).join(" ")).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function passes(s, d, f = F){
  const game = d.gamesById[s.appid] || {};
  if(!matchesSearch(game, f.q)) return false;
  // a moddable game is kept and labelled rather than hidden, because "you can
  // play this if someone installs a mod" is useful and "it vanished" is not
  if(crewFit(s, f.crew) === "no") return false;
  if(f.mine && !d.myPicks.includes(s.appid)) return false;
  if(f.wellrated && !((game.review_pct ?? 0) >= 85)) return false;
  if(f.played){
    const played = (d.playsBy[s.appid]||[]).length > 0;
    if(f.played === "fresh" && played) return false;
    if(f.played === "again" && !played) return false;
  }
  if(f.energy.size && !f.energy.has(energyOf(s, d))) return false;
  if(f.setup.size && !f.setup.has(s.setup)) return false;
  if(f.shape.size && !f.shape.has(game.shape)) return false;
  if(f.doing.size && !f.doing.has(doingOf(s, d))) return false;
  if(f.release.size && !f.release.has(releaseOf(game))) return false;
  if(f.demo && !game.demo_appid) return false;
  return true;
}

function sortShelf(list, d){
  const sortBy = A().sort, asc = A().dir === "asc";
  const val = s => {
    const g = d.gamesById[s.appid] || {};
    switch(sortBy){
      case "votes":  return d.counts[s.appid] || 0;
      case "review": return g.review_pct ?? -1;
      case "added":  return new Date(s.added_at).getTime();
      case "length": return -(SHAPE_ORDER[g.shape] ?? 9);   // shortest first when desc
      case "crew":   return s.crew_max ?? 0;
      case "az":     return g.name || "";
      default:       return 0;
    }
  };
  return list.slice().sort((a,b) => {
    const va = val(a), vb = val(b);
    // strings and numbers need opposite-looking comparators for the same
    // direction, so they are handled separately rather than with one sign flip
    if(typeof va === "string"){
      return asc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    if(va !== vb) return asc ? va - vb : vb - va;
    // stable tiebreak on name, so equal values never jitter between renders
    const ga = d.gamesById[a.appid]||{}, gb = d.gamesById[b.appid]||{};
    return (ga.name||"").localeCompare(gb.name||"");
  });
}

/** Sections for a shelf that has outgrown one long scroll. */
function groupShelf(list, d){
  const groupBy = A().group;
  if(groupBy === "none") return [{ label:null, items:list }];
  const buckets = new Map();
  const keyOf = s => {
    const g = d.gamesById[s.appid] || {};
    if(groupBy === "votes"){
      if(stateOf(s, d) === "playing") return "\u25B6 On right now";
      if(stateOf(s, d) === "benched") return "Benched";
      return (d.counts[s.appid]||0) > 0 ? "In the running" : "Nobody's picked it yet";
    }
    if(groupBy === "energy"){ const e = energyOf(s, d); return e ? ENERGY[e] : "Not rated yet"; }
    if(groupBy === "shape")  return g.shape  ? SHAPE[g.shape]   : "Unsorted";
    if(groupBy === "setup")  return s.setup  ? SETUP[s.setup]   : "Unsorted";
    if(groupBy === "release") return RELEASE[releaseOf(d.gamesById[s.appid])];
    if(groupBy === "played") return (d.playsBy[s.appid]||[]).length ? "Played before" : "Never played";
    return "";
  };
  list.forEach(s => {
    const k = keyOf(s);
    if(!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(s);
  });
  // keep a sensible reading order rather than whatever the data happened to be in
  const order = {
    votes:  ["\u25B6 On right now","In the running","Nobody's picked it yet","Benched"],
    energy: ["Chill","Normal","Heavy","Not rated yet"],
    shape:  ["Drop in","One sitting","Campaign","Long haul","Unsorted"],
    setup:  ["Just launch","Someone hosts","Dedicated server","Unsorted"],
    release:["Released","Early access","Not out yet"],
    played: ["Never played","Played before"],
  }[A().group] || [];
  return [...buckets.entries()]
    .sort((a,b) => {
      const ia = order.indexOf(a[0]), ib = order.indexOf(b[0]);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    })
    .map(([label, items]) => ({ label, items }));
}
/** Drop the heading when the grouping produced exactly one bucket: a lone
 *  "Up for a vote" header over the entire shelf says nothing. */
function sections(list, d){
  const out = groupShelf(list, d);
  return out.length === 1 ? [{ label:null, items:out[0].items }] : out;
}
